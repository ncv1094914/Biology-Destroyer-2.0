s, lo que disminuye la superficie por la que se pierde agua por transpiración. Sus tallos son suculentos y almacenan agua, y sus estomas suelen estar hundidos y abrirse solo de noche (metabolismo CAM), cuando la temperatura es menor. Además tienen raíces muy extensas y superficiales o muy profundas para absorber el máximo de agua."},{"l":"c","m":2,"q":"Explique por qué biomas de distintos continentes tienen comunidades parecidas.","pts":["los biomas se definen por condiciones *abióticas* similares, sobre todo temperatura y precipitación","condiciones similares ejercen *presiones de selección* similares","especies no emparentadas desarrollan adaptaciones parecidas por *evolución convergente* (p. ej., cactus americanos y euforbias africanas)","por eso las comunidades se parecen en estructura / formas de vida aunque las especies sean distintas"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":235,"p":"2","t":"B4.2","also":["C4.1"],"title":"Nichos","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinga entre nicho fundamental y nicho realizado.","pts":["nicho *fundamental*: el rango completo de condiciones / recursos que una especie podría ocupar según su tolerancia, en ausencia de competidores","nicho *realizado*: el rango que la especie ocupa realmente","el nicho realizado es más pequeño / forma parte del fundamental porque la *competencia* (interacciones bióticas) excluye a la especie de parte de él"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Resuma el principio de exclusión competitiva.","pts":["dos especies no pueden ocupar el *mismo nicho* en el mismo hábitat de forma indefinida","compiten por los mismos recursos limitados y una es mejor competidora","la especie menos competitiva es eliminada localmente / se *extingue localmente*","o bien las especies coexisten porque sus nichos realizados se separan (usan recursos / zonas / horarios distintos)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Compare y contraste la nutrición holozoica y la saprótrofa.","pts":["semejanza: ambas son *heterótrofas* / obtienen compuestos de carbono orgánicos producidos por otros organismos","semejanza: en ambas se digieren moléculas grandes con enzimas y se absorben los productos","holozoica: *ingestión* del alimento seguida de digestión *interna* (en el tubo digestivo) / p. ej., animales","saprótrofa: secreción de enzimas y digestión *externa* de materia orgánica muerta, seguida de absorción / p. ej., hongos y bacterias descomponedoras"],"hl":false,"mod":""}],"hl":false,"mk":6,"mkSL":6},{"qid":236,"p":"2","t":"C1.1","also":[],"title":"Actividad enzimática","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique el efecto de aumentar la temperatura sobre la actividad enzimática.","pts":["al aumentar la temperatura la velocidad de reacción aumenta hasta un máximo a la temperatura *óptima*","las moléculas de enzima y de sustrato tienen más energía cinética / se mueven más rápido","hay *colisiones* más frecuentes entre el sustrato y el sitio activo, por lo que se forman más complejos enzima–sustrato por unidad de tiempo","por encima del óptimo las vibraciones rompen los enlaces (de hidrógeno) que mantienen la estructura tridimensional de la enzima","cambia la forma del sitio activo y el sustrato ya no puede unirse: la enzima se *desnaturaliza*","la velocidad cae bruscamente (hasta cero) y la desnaturalización suele ser irreversible"],"hl":false,"mod":"Al aumentar la temperatura, las moléculas de enzima y de sustrato ganan energía cinética y se mueven más rápido, por lo que las colisiones entre el sustrato y el sitio activo son más frecuentes, se forman más complejos enzima–sustrato y la velocidad de reacción aumenta hasta un máximo a la temperatura óptima. Por encima del óptimo, las vibraciones rompen los enlaces de hidrógeno que mantienen la estructura tridimensional de la enzima. El sitio activo cambia de forma, el sustrato ya no puede unirse y la enzima se desnaturaliza, de modo que la velocidad cae bruscamente, por lo general de forma irreversible."},{"l":"b","m":3,"q":"Distinga entre la inhibición competitiva y la inhibición no competitiva de las enzimas.","pts":["el inhibidor competitivo se une al *sitio activo*, mientras que el no competitivo se une a un sitio *alostérico* / distinto del sitio activo","el inhibidor competitivo tiene una estructura similar a la del sustrato; el no competitivo no se parece al sustrato","el competitivo impide físicamente la unión del sustrato; el no competitivo cambia la conformación del sitio activo, de modo que el sustrato no se une o no se cataliza la reacción","al aumentar la concentración de sustrato el efecto del inhibidor competitivo disminuye, pero el del no competitivo se mantiene","con el competitivo se puede alcanzar la misma velocidad máxima; con el no competitivo la velocidad máxima es menor"],"hl":true,"mod":"Un inhibidor competitivo tiene una estructura parecida a la del sustrato y se une al sitio activo, por lo que compite con el sustrato e impide su unión; en cambio, un inhibidor no competitivo no se parece al sustrato y se une a un sitio alostérico, lo que cambia la conformación del sitio activo. Al aumentar la concentración de sustrato, el efecto del inhibidor competitivo disminuye y puede alcanzarse la misma velocidad máxima, mientras que el efecto del no competitivo no se reduce y la velocidad máxima sigue siendo menor."},{"l":"c","m":1,"q":"Defina energía de activación.","pts":["la energía (mínima) necesaria para que se inicie una reacción / para romper o debilitar los enlaces del sustrato y alcanzar el estado de transición"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":4},{"qid":237,"p":"2","t":"C1.2","also":[],"title":"Respiración celular","blocks":[],"parts":[{"l":"a","m":3,"q":"Compare y contraste la respiración celular aeróbica y la anaeróbica en los seres humanos.","pts":["semejanza: ambas producen *ATP* / ambas usan glucosa como sustrato","semejanza: ambas comienzan con la glicólisis en el citoplasma","la aeróbica requiere *oxígeno*, mientras que la anaeróbica no","la aeróbica tiene un rendimiento de ATP por glucosa mucho mayor que la anaeróbica (2 ATP netos)","la aeróbica produce dióxido de carbono y agua, mientras que la anaeróbica produce *lactato* (y no CO₂)","la aeróbica se completa en las *mitocondrias*, mientras que la anaeróbica ocurre solo en el citoplasma","la aeróbica puede usar glúcidos, lípidos y aminoácidos; la anaeróbica solo glúcidos"],"hl":false,"mod":"Ambos tipos de respiración celular producen ATP a partir de glucosa y comienzan con la glicólisis en el citoplasma. Sin embargo, la respiración aeróbica requiere oxígeno y se completa en las mitocondrias, mientras que la anaeróbica no usa oxígeno y ocurre únicamente en el citoplasma. La aeróbica oxida la glucosa por completo a dióxido de carbono y agua y tiene un rendimiento de ATP mucho mayor; la anaeróbica produce lactato y solo 2 ATP netos por glucosa."},{"l":"b","m":3,"q":"Explique cómo se produce ATP por quimiosmosis en las mitocondrias.","pts":["el NAD reducido cede electrones a la *cadena de transporte de electrones* de la membrana mitocondrial interna","al pasar los electrones de un transportador a otro se libera energía","esta energía se usa para bombear *protones* de la matriz al espacio intermembrana","se genera un gradiente de protones / una concentración alta de H⁺ en el espacio intermembrana","los protones vuelven a la matriz por difusión a favor del gradiente a través de la *ATP sintasa*","la ATP sintasa usa la energía liberada para fosforilar ADP y formar ATP (fosforilación oxidativa)"],"hl":true,"mod":"El NAD reducido cede electrones a la cadena de transporte de electrones de la membrana mitocondrial interna. A medida que los electrones pasan de un transportador a otro se libera energía, que se utiliza para bombear protones desde la matriz hasta el espacio intermembrana. Así se acumula una alta concentración de H⁺ y se genera un gradiente de protones. Los protones regresan a la matriz por difusión a favor de ese gradiente a través de la ATP sintasa, y la enzima usa la energía liberada para fosforilar ADP y producir ATP."},{"l":"c","m":1,"q":"Indique el papel del oxígeno en la respiración celular aeróbica.","pts":["es el *aceptor final de electrones* de la cadena de transporte de electrones","acepta electrones y protones para formar agua, lo que permite que continúe el flujo de electrones"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":3},{"qid":238,"p":"2","t":"C1.3","also":[],"title":"Reacciones dependientes de la luz","blocks":[],"parts":[{"l":"a","m":3,"q":"Resuma lo que ocurre en el fotosistema II durante las reacciones dependientes de la luz.","pts":["los pigmentos / las moléculas de clorofila del fotosistema absorben luz (fotones)","la energía de excitación se transfiere de un pigmento a otro hasta el *centro de reacción*","una clorofila del centro de reacción emite un electrón excitado, que pasa a un aceptor / a la cadena de transportadores de electrones","los electrones perdidos se reponen mediante la *fotólisis* del agua","la fotólisis produce protones en el espacio tilacoidal y oxígeno como producto de desecho"],"hl":false,"mod":"Los pigmentos del fotosistema II, situado en la membrana tilacoidal, absorben fotones y transfieren la energía de excitación de una molécula a otra hasta el centro de reacción. Allí una clorofila emite un electrón excitado, que pasa a la cadena de transportadores de electrones. Los electrones perdidos se reponen mediante la fotólisis del agua, que además libera protones en el espacio tilacoidal y oxígeno como producto de desecho."},{"l":"b","m":2,"q":"Explique cómo se produce ATP en las reacciones dependientes de la luz.","pts":["los electrones excitados pasan por una cadena de transportadores de electrones en la membrana tilacoidal y liberan energía","la energía se usa para bombear *protones* del estroma al espacio tilacoidal, lo que genera un gradiente de protones","los protones difunden de vuelta al estroma a través de la *ATP sintasa* (quimiosmosis)","la ATP sintasa fosforila ADP para formar ATP (fotofosforilación)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Resuma la interdependencia de las reacciones dependientes de la luz y las independientes de la luz.","pts":["las reacciones dependientes de la luz proporcionan *ATP* y *NADP reducido* a las reacciones independientes de la luz / al ciclo de Calvin","el ciclo de Calvin los usa para reducir el glicerato-3-fosfato a triosa fosfato / para regenerar la RuBP","las reacciones independientes de la luz devuelven ADP, fosfato y NADP a las reacciones dependientes de la luz","sin luz se agotan el ATP y el NADP reducido y el ciclo de Calvin se detiene / sin CO₂ no se regenera NADP y se frena el flujo de electrones"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":239,"p":"2","t":"C2.1","also":[],"title":"Señalización celular","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinga entre las hormonas y los neurotransmisores.","pts":["las hormonas son secretadas por glándulas endocrinas a la *sangre*, mientras que los neurotransmisores son liberados por neuronas presinápticas a la *hendidura sináptica*","las hormonas actúan sobre células diana distantes / en todo el cuerpo; los neurotransmisores actúan solo sobre la célula postsináptica adyacente","el efecto de las hormonas es más lento y duradero; el de los neurotransmisores es muy rápido y breve","los neurotransmisores se eliminan enseguida de la sinapsis por degradación enzimática / recaptación; las hormonas persisten más tiempo en la sangre"],"hl":false,"mod":""},{"l":"b","m":4,"q":"Explique cómo provoca la epinefrina una respuesta en una célula hepática.","pts":["la epinefrina (adrenalina) es hidrófila y no atraviesa la membrana, por lo que se une a un receptor *transmembrana* de la membrana plasmática","el receptor es un receptor acoplado a *proteína G*, que al unirse la hormona activa la proteína G","la proteína G activa la enzima adenilato ciclasa de la membrana","la adenilato ciclasa convierte ATP en *AMP cíclico* (AMPc), que actúa como *segundo mensajero*","el AMPc activa proteínas quinasas, que fosforilan / activan otras enzimas en cascada","la señal se amplifica: una sola molécula de hormona genera muchas moléculas de AMPc","respuesta: el glucógeno se degrada a glucosa, que se libera a la sangre"],"hl":false,"mod":"La epinefrina es hidrófila y no puede atravesar la membrana plasmática, así que se une a un receptor transmembrana acoplado a proteína G en la superficie de la célula hepática. La unión cambia la conformación del receptor y activa la proteína G, que a su vez activa la enzima adenilato ciclasa. Esta convierte ATP en AMP cíclico, que actúa como segundo mensajero dentro de la célula. El AMPc activa proteínas quinasas que fosforilan otras enzimas en una cascada que amplifica la señal. Como respuesta, se activan las enzimas que degradan el glucógeno a glucosa, que pasa a la sangre."},{"l":"c","m":2,"q":"Explique por qué las hormonas esteroideas pueden unirse a receptores intracelulares.","pts":["los esteroides son lípidos / moléculas *hidrófobas* (no polares)","pueden atravesar por difusión simple la bicapa de fosfolípidos de la membrana plasmática","una vez dentro se unen a receptores del citoplasma / del núcleo","el complejo hormona–receptor se une al ADN y regula la transcripción de genes específicos"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":240,"p":"2","t":"C2.2","also":[],"title":"Transmisión sináptica","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa cómo se transmite un impulso nervioso a través de una sinapsis colinérgica.","pts":["el potencial de acción / impulso nervioso llega a la membrana *presináptica* y la despolariza","se abren canales de calcio regulados por voltaje y los iones *Ca²⁺* difunden hacia el interior de la neurona presináptica","el Ca²⁺ hace que las vesículas con *acetilcolina* se desplacen y se fusionen con la membrana presináptica","la acetilcolina se libera por *exocitosis* a la hendidura sináptica","la acetilcolina difunde a través de la hendidura y se une a *receptores* de la membrana postsináptica","se abren canales iónicos y entra Na⁺ en la neurona postsináptica, que se despolariza","si se alcanza el umbral se inicia un potencial de acción en la neurona postsináptica","la acetilcolinesterasa degrada la acetilcolina en la hendidura (y la colina se reabsorbe), lo que pone fin a la señal"],"hl":false,"mod":"Cuando el potencial de acción llega a la membrana presináptica la despolariza, se abren canales de calcio regulados por voltaje y los iones Ca²⁺ difunden hacia el interior de la neurona. El calcio hace que las vesículas se fusionen con la membrana presináptica y liberen acetilcolina por exocitosis a la hendidura sináptica. La acetilcolina difunde por la hendidura y se une a receptores de la membrana postsináptica, lo que abre canales iónicos por los que entra Na⁺. La membrana postsináptica se despolariza y, si se alcanza el umbral, se inicia un nuevo potencial de acción. Por último, la acetilcolinesterasa degrada la acetilcolina, de modo que la señal termina."},{"l":"b","m":2,"q":"Explique el papel de la sumación en una neurona postsináptica.","pts":["una neurona postsináptica recibe señales de muchas neuronas presinápticas; un solo potencial postsináptico excitador no suele bastar para alcanzar el umbral","los neurotransmisores excitadores despolarizan la membrana y los inhibidores la hiperpolarizan; sus efectos se suman","solo se inicia un potencial de acción si el efecto combinado alcanza el potencial *umbral*","permite integrar información de varias fuentes / tomar decisiones (respuesta de todo o nada)"],"hl":true,"mod":""},{"l":"c","m":1,"q":"Indique un efecto de una sustancia química exógena sobre la transmisión sináptica.","pts":["la cocaína bloquea la recaptación de dopamina en la neurona presináptica, por lo que la dopamina permanece en la hendidura y la estimulación se prolonga","los neonicotinoides se unen a los receptores de acetilcolina (de insectos) y no son degradados por la acetilcolinesterasa, por lo que bloquean la transmisión"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":4},{"qid":241,"p":"2","t":"C3.1","also":[],"title":"Control de la frecuencia cardíaca","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique cómo aumenta la frecuencia cardíaca durante el ejercicio.","pts":["durante el ejercicio aumenta la respiración celular de los músculos, por lo que sube la concentración de CO₂ en la sangre / baja el pH de la sangre","los *quimiorreceptores* (de la aorta / las arterias carótidas / el bulbo raquídeo) detectan el aumento de CO₂ / la disminución del pH","los *barorreceptores* detectan cambios en la presión arterial","se envían impulsos al centro cardiovascular del *bulbo raquídeo*","el bulbo raquídeo envía impulsos por un nervio simpático / nervio acelerador al *nodo sinoauricular* (nodo SA / marcapasos)","el nodo SA inicia impulsos con más frecuencia, así que el corazón late más rápido","la *epinefrina* (adrenalina) liberada por las glándulas suprarrenales también aumenta la frecuencia de descarga del nodo SA","así llega más O₂ / glucosa a los músculos y se elimina el CO₂ más rápido"],"hl":false,"mod":"Durante el ejercicio los músculos respiran más, por lo que aumenta la concentración de CO₂ en la sangre y baja su pH. Los quimiorreceptores de la aorta, las arterias carótidas y el bulbo raquídeo detectan este cambio, y los barorreceptores detectan cambios en la presión arterial. Envían impulsos al centro cardiovascular del bulbo raquídeo, que a su vez envía impulsos por un nervio simpático al nodo sinoauricular. El nodo SA, que es el marcapasos, inicia impulsos con más frecuencia y el corazón late más rápido. Además, la epinefrina secretada por las glándulas suprarrenales aumenta la frecuencia de descarga del nodo SA. Así llegan más oxígeno y glucosa a los músculos y el CO₂ se elimina con más rapidez."},{"l":"b","m":2,"q":"Resuma las funciones del hipotálamo y la hipófisis.","pts":["el *hipotálamo* conecta / integra el sistema nervioso y el sistema endocrino","el hipotálamo detecta cambios en la sangre / el medio interno (por ejemplo, temperatura corporal, concentración de solutos)","el hipotálamo controla la hipófisis: secreta hormonas liberadoras hacia la hipófisis anterior / sus células neurosecretoras producen hormonas (ADH, oxitocina) que se liberan desde la hipófisis posterior","la *hipófisis* secreta hormonas (por ejemplo, TSH, FSH, LH, ADH, hormona del crecimiento) que regulan otras glándulas endocrinas / órganos diana","juntos regulan la homeostasis (termorregulación, osmorregulación) / el crecimiento / la reproducción"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique cómo hace la auxina que las células se alarguen.","pts":["la auxina se une a un receptor y estimula la síntesis / activación de *bombas de protones* en la membrana plasmática","se bombean H⁺ desde el citoplasma hacia la pared celular, que se acidifica / baja su pH","el pH bajo activa proteínas (expansinas) que aflojan las conexiones / enlaces entre las *microfibrillas de celulosa*","la pared se vuelve más extensible y la entrada de agua / la presión de turgencia estira la célula, que se alarga"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":5},{"qid":242,"p":"2","t":"C3.2","also":[],"title":"Producción de anticuerpos","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa la producción de anticuerpos tras una infección.","pts":["un *macrófago* fagocita el patógeno y presenta sus antígenos en su membrana","un linfocito T colaborador con un receptor complementario se une al antígeno y se activa","un linfocito B específico se une al mismo antígeno mediante los anticuerpos / receptores de su membrana","el linfocito T colaborador activado se une al linfocito B y lo *activa* (también mediante señales químicas / citocinas)","el linfocito B activado se divide por mitosis y forma un *clon* de células idénticas (selección clonal)","la mayoría de las células del clon se diferencian en *células plasmáticas*","las células plasmáticas (con mucho retículo endoplasmático rugoso) secretan grandes cantidades del anticuerpo específico","algunas células del clon se convierten en *células de memoria* de larga vida"],"hl":false,"mod":"Tras la infección, un macrófago fagocita el patógeno y presenta sus antígenos en su membrana. Un linfocito T colaborador cuyo receptor es complementario a ese antígeno se une a él y se activa. Por otro lado, un linfocito B específico se une al mismo antígeno mediante los anticuerpos de su membrana, y el linfocito T colaborador activado se une a este linfocito B y lo activa. El linfocito B activado se divide repetidamente por mitosis y forma un clon. La mayoría de estas células se diferencian en células plasmáticas, que tienen mucho retículo endoplasmático rugoso y secretan grandes cantidades del anticuerpo específico, mientras que otras se convierten en células de memoria de larga vida."},{"l":"b","m":2,"q":"Explique por qué la respuesta inmunitaria secundaria es más rápida.","pts":["durante la respuesta primaria se forman *células de memoria* que persisten en el cuerpo durante mucho tiempo","hay muchas más células específicas del antígeno que antes de la primera exposición / no hay que seleccionar y clonar desde cero un linfocito poco frecuente","en una segunda exposición las células de memoria se activan enseguida y se dividen rápidamente formando células plasmáticas","se producen anticuerpos antes y en mayor cantidad, de modo que el patógeno se destruye antes de que aparezcan síntomas"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique cómo se propaga la resistencia a antibióticos en una población de bacterias.","pts":["una *mutación* al azar da resistencia a algunas bacterias / hay variación en la resistencia dentro de la población","el antibiótico actúa como *presión de selección*: mata a las bacterias sensibles","las bacterias resistentes sobreviven y se reproducen (fisión binaria), transmitiendo el gen de resistencia a su descendencia","los genes de resistencia pueden transferirse entre bacterias en *plásmidos* (transferencia horizontal), incluso entre especies","el uso excesivo / incorrecto de antibióticos aumenta la selección, así que la frecuencia de bacterias resistentes aumenta en la población"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":243,"p":"2","t":"C4.1","also":[],"title":"Poblaciones","blocks":[],"parts":[{"l":"a","m":3,"q":"Describa el método de captura–marcado–liberación–recaptura.","pts":["capturar una muestra grande de la población con un método adecuado (por ejemplo, trampas) y contar los individuos (M)","marcar cada individuo de forma inofensiva, que no afecte a su supervivencia y que no se pierda","liberarlos donde se capturaron y dejar tiempo suficiente para que se *mezclen* al azar con la población","capturar una segunda muestra con el mismo método / esfuerzo y contar el total (N) y los individuos marcados (R)","estimar el tamaño de la población con el *índice de Lincoln*: población = (M × N) ÷ R","el método es adecuado para animales móviles, que no pueden contarse con cuadrantes"],"hl":false,"mod":"Primero se captura una muestra grande de la población, por ejemplo con trampas, y se cuentan los individuos (M). Cada uno se marca de forma inofensiva, de modo que la marca no afecte a su supervivencia ni se pierda. Después se liberan en el mismo lugar y se deja pasar tiempo suficiente para que se mezclen al azar con el resto de la población. Luego se captura una segunda muestra con el mismo método y esfuerzo y se cuentan el total de individuos (N) y cuántos están marcados (R). El tamaño de la población se estima con el índice de Lincoln: población = (M × N) ÷ R."},{"l":"b","m":2,"q":"Indique dos supuestos de este método.","pts":["las marcas no afectan a la supervivencia / al comportamiento / a la probabilidad de ser depredado","las marcas no se pierden entre los dos muestreos","no hay nacimientos, muertes, inmigración ni emigración entre los muestreos (población cerrada)","los individuos marcados se mezclan al azar con el resto de la población","todos los individuos tienen la misma probabilidad de ser capturados (no evitan ni buscan las trampas)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique cómo se afectan entre sí las poblaciones de depredadores y presas.","pts":["si aumenta la población de presas, los depredadores tienen más alimento, sobreviven y se reproducen más, y su población aumenta (con un retraso)","más depredadores comen más presas, así que la población de presas disminuye","con menos presas hay escasez de alimento / competencia entre depredadores, y la población de depredadores disminuye","con menos depredadores las presas se recuperan, y se producen *oscilaciones* / ciclos en los que los picos de depredadores van detrás de los de presas","es un control *dependiente de la densidad* / retroalimentación negativa que mantiene ambas poblaciones cerca de un equilibrio"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":244,"p":"2","t":"C4.2","also":[],"title":"Energía y carbono","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique por qué se pierde energía entre niveles tróficos.","pts":["la mayor parte de la energía liberada en la *respiración celular* se pierde como *calor*","el calor se pierde hacia el entorno y los organismos no pueden convertirlo en energía química / no se recicla","no se comen todas las partes de los organismos (por ejemplo, huesos, pelo, raíces, madera)","no todo el alimento ingerido se digiere / absorbe: parte se pierde en las heces (egestión)","algunos organismos mueren sin ser comidos y su energía pasa a los descomponedores / detritívoros","parte de la energía se pierde en los productos de excreción (por ejemplo, la urea)","por ello solo alrededor del *10 %* de la energía pasa al nivel trófico siguiente"],"hl":false,"mod":"La mayor parte de la energía química que obtiene un organismo se usa en la respiración celular, y gran parte de ella se pierde como calor hacia el entorno; este calor no puede convertirse de nuevo en energía química, así que no pasa al nivel siguiente. Además, no se comen todas las partes de los organismos, como los huesos o las raíces, y del alimento ingerido no todo se digiere y absorbe, sino que una parte se pierde en las heces. Algunos organismos mueren sin ser comidos y su energía pasa a los descomponedores, y otra parte se pierde en productos de excreción como la urea. Por todo ello, solo alrededor del 10 % de la energía pasa al siguiente nivel trófico."},{"l":"b","m":2,"q":"Distinga entre producción primaria y producción secundaria.","pts":["producción primaria: acumulación de compuestos de carbono en la biomasa de los *autótrofos* / productores; secundaria: en la biomasa de los *heterótrofos* / consumidores","la primaria fija carbono inorgánico (CO₂) usando energía luminosa (fotosíntesis) / química (quimiosíntesis); la secundaria usa compuestos de carbono ya fabricados, obtenidos al alimentarse","en un mismo ecosistema la producción primaria es mayor que la secundaria, porque se pierde energía entre niveles tróficos"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Resuma cómo afecta al ciclo del carbono la combustión de combustibles fósiles.","pts":["los combustibles fósiles (carbón, petróleo, gas natural) contienen carbono de organismos que estuvo almacenado durante millones de años","la combustión oxida estos compuestos y libera el carbono como *CO₂* a la atmósfera","el carbono se libera más rápido de lo que lo absorben la fotosíntesis / los océanos / los sumideros, así que aumenta la concentración de CO₂ atmosférico","el ciclo deja de estar equilibrado: hay un flujo neto de carbono de la litosfera a la atmósfera","el aumento de CO₂ intensifica el efecto invernadero / acidifica los océanos"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":245,"p":"2","t":"D1.1","also":[],"title":"Replicación del ADN","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa el papel de las enzimas en la replicación del ADN en procariotas.","pts":["la *helicasa* desenrolla la doble hélice y separa las hebras rompiendo los enlaces de hidrógeno entre las bases","la ADN girasa alivia la tensión por delante de la helicasa / las proteínas de unión a cadena simple mantienen separadas las hebras","la ADN *primasa* sintetiza un cebador corto de ARN en cada hebra molde","la *ADN polimerasa III* añade nucleótidos de ADN complementarios al extremo 3' del cebador / en sentido 5'→3'","la síntesis es continua en la hebra conductora y discontinua, en fragmentos de Okazaki, en la hebra discontinua","la *ADN polimerasa I* elimina los cebadores de ARN y los sustituye por ADN","la ADN *ligasa* une los fragmentos de Okazaki formando enlaces azúcar-fosfato","la ADN polimerasa III corrige errores eliminando los nucleótidos mal apareados (corrección de pruebas)"],"hl":true,"mod":"La helicasa desenrolla la doble hélice y separa las dos hebras rompiendo los enlaces de hidrógeno entre las bases, mientras la girasa alivia la tensión por delante. La primasa sintetiza un cebador corto de ARN en cada hebra molde y la ADN polimerasa III añade nucleótidos complementarios al extremo 3', en sentido 5'→3': de forma continua en la hebra conductora y en fragmentos de Okazaki en la discontinua. La ADN polimerasa I sustituye los cebadores de ARN por ADN y la ligasa une los fragmentos de Okazaki."},{"l":"b","m":2,"q":"Explique por qué la replicación del ADN se describe como semiconservativa.","pts":["las dos hebras de la molécula original se separan y cada una sirve de *molde*","cada molécula nueva contiene una hebra original (conservada) y una hebra recién sintetizada","la hebra nueva se forma por apareamiento de bases *complementarias* (A con T, C con G)","las dos moléculas resultantes son idénticas entre sí y a la original"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Resuma una aplicación de la reacción en cadena de la polimerasa (PCR).","pts":["la PCR *amplifica* / hace muchas copias de una secuencia concreta de ADN a partir de una muestra muy pequeña","perfiles de ADN: se amplifica ADN de sangre / semen / pelo de la escena de un delito para compararlo con el de sospechosos (análisis forense)","pruebas de paternidad: se amplifica ADN del hijo y de los posibles progenitores para comparar sus perfiles","diagnóstico de infecciones, p. ej., COVID-19: el ARN vírico se copia a ADN y se amplifica para detectar el virus"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":4},{"qid":246,"p":"2","t":"D1.2","also":[],"title":"Síntesis de proteínas","blocks":[],"parts":[{"l":"a","m":3,"q":"Describa cómo se produce el ARNm por transcripción.","pts":["la *ARN polimerasa* se une al ADN al inicio del gen","la ARN polimerasa desenrolla el ADN y separa las dos hebras / rompe los enlaces de hidrógeno","solo una de las hebras del ADN se usa como *molde*","los nucleótidos de ARN libres se aparean con las bases *complementarias* de la hebra molde","el uracilo se aparea con la adenina / el ARN tiene uracilo en lugar de timina","la ARN polimerasa une los nucleótidos de ARN con enlaces covalentes (azúcar-fosfato)","el ARNm se separa del ADN y la doble hélice se vuelve a formar"],"hl":false,"mod":"La ARN polimerasa se une al ADN al inicio del gen, desenrolla la doble hélice y separa las dos hebras. Solo una hebra actúa como molde: los nucleótidos de ARN libres se aparean con sus bases complementarias (el uracilo con la adenina, en lugar de la timina) y la ARN polimerasa los une mediante enlaces covalentes azúcar-fosfato. Al terminar el gen, el ARNm se separa y el ADN vuelve a formar la doble hélice."},{"l":"b","m":3,"q":"Explique las funciones del ARNt en la traducción.","pts":["cada ARNt transporta un aminoácido *específico* hasta el ribosoma","el ARNt tiene un *anticodón* de tres bases","el anticodón se aparea con el *codón* complementario del ARNm (mediante enlaces de hidrógeno)","así los aminoácidos se colocan en el orden determinado por la secuencia de codones del ARNm / se traduce el código genético","el aminoácido se une a la cadena polipeptídica en crecimiento mediante un *enlace peptídico*","el ARNt se libera del ribosoma y puede volver a cargarse con su aminoácido"],"hl":false,"mod":"Cada ARNt transporta un aminoácido específico hasta el ribosoma y tiene un anticodón de tres bases. El anticodón se aparea con el codón complementario del ARNm, de modo que los aminoácidos se colocan en el orden que dicta la secuencia de codones. El aminoácido se une al polipéptido en crecimiento mediante un enlace peptídico y el ARNt, ya vacío, se libera para volver a cargarse."},{"l":"c","m":2,"q":"Resuma cómo se modifica el ARNm eucariota después de la transcripción.","pts":["se eliminan los *intrones* (secuencias no codificantes)","los *exones* se empalman para formar el ARNm maduro","se añade una caperuza al extremo 5' y una cola de poli-A al extremo 3'","la caperuza y la cola estabilizan el ARNm / lo protegen de la degradación","el empalme alternativo de los exones permite obtener distintos polipéptidos a partir de un gen"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":6},{"qid":247,"p":"2","t":"D1.3","also":[],"title":"Mutación","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinga entre las mutaciones por sustitución de bases y las mutaciones por cambio del marco de lectura.","pts":["sustitución: una base se reemplaza por otra distinta, mientras que el cambio de marco se debe a la *inserción* o *deleción* de bases","la sustitución no cambia el número de bases; la inserción / deleción sí lo cambia (en un número no múltiplo de tres)","la sustitución altera un solo codón; el cambio de marco altera todos los codones posteriores a la mutación","la sustitución cambia como máximo un aminoácido / puede no cambiar ninguno (código degenerado); el cambio de marco cambia muchos aminoácidos / suele dar un polipéptido no funcional"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Resuma dos causas de las mutaciones génicas.","pts":["errores en la *replicación* del ADN / en la reparación del ADN (mutaciones espontáneas)","radiación de alta energía / ionizante, p. ej., rayos X, rayos gamma o radiación ultravioleta, que daña el ADN","mutágenos químicos, p. ej., sustancias del humo del tabaco (benzopireno), que alteran químicamente las bases","los *mutágenos* aumentan la tasa de mutación por encima de la espontánea"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique cómo se puede usar CRISPR-Cas9 para editar un gen.","pts":["se diseña un *ARN guía* con una secuencia de bases complementaria a la secuencia diana del gen","el ARN guía se une a la enzima / endonucleasa *Cas9* y la dirige hasta la secuencia diana","el ARN guía se aparea con el ADN diana por complementariedad de bases","Cas9 corta las dos hebras del ADN en ese punto","al reparar el corte, la célula puede añadir o perder bases, lo que inactiva el gen","si se aporta un molde de ADN, la célula lo usa en la reparación y se inserta una secuencia nueva / se corrige el alelo"],"hl":true,"mod":"Se diseña un ARN guía con una secuencia complementaria a la secuencia diana del gen. El ARN guía se une a la endonucleasa Cas9 y, por apareamiento de bases complementarias, la dirige hasta ese punto exacto del genoma, donde Cas9 corta las dos hebras del ADN. Cuando la célula repara el corte puede perder o añadir bases, lo que inactiva el gen; si además se aporta un molde de ADN, la reparación lo copia y se inserta la secuencia deseada."}],"hl":false,"mk":7,"mkSL":4},{"qid":248,"p":"2","t":"D2.1","also":[],"title":"Meiosis y variación","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique cómo la meiosis produce variación genética.","pts":["los cromosomas homólogos se emparejan (forman bivalentes) en la profase I","*entrecruzamiento*: las cromátidas no hermanas intercambian segmentos de ADN","el entrecruzamiento produce cromátidas con nuevas combinaciones de alelos (recombinantes)","*orientación aleatoria* de los pares de homólogos (bivalentes) en el ecuador en la metafase I","la orientación de cada par es independiente de la de los demás, así que los cromosomas maternos y paternos se distribuyen de forma independiente","hay 2ⁿ combinaciones posibles de cromosomas en los gametos (2²³ en humanos)"],"hl":false,"mod":"En la profase I los cromosomas homólogos se emparejan y sus cromátidas no hermanas intercambian segmentos de ADN por entrecruzamiento, lo que produce cromátidas con nuevas combinaciones de alelos. En la metafase I, la orientación de cada par de homólogos en el ecuador es aleatoria e independiente de la de los otros pares, así que los cromosomas maternos y paternos se distribuyen de forma independiente. Esto permite 2ⁿ combinaciones de cromosomas en los gametos (2²³ en humanos), por lo que cada gameto es genéticamente distinto."},{"l":"b","m":2,"q":"Explique cómo la no disyunción puede causar el síndrome de Down.","pts":["*no disyunción*: los cromosomas homólogos no se separan en la anafase I / las cromátidas hermanas no se separan en la anafase II","se forma un gameto con dos copias del cromosoma 21 / con 24 cromosomas","en la fecundación se une a un gameto normal con una copia","el cigoto tiene tres copias del cromosoma 21 (*trisomía* 21) / 47 cromosomas"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Compare y contraste la mitosis y la meiosis.","pts":["semejanza: en ambas el ADN se replica antes de la división / los cromosomas se condensan / se forma un huso de microtúbulos","la mitosis consta de una división y produce dos células; la meiosis consta de dos divisiones y produce cuatro","la mitosis mantiene el número de cromosomas (diploide → diploide); la meiosis lo reduce a la mitad (diploide → *haploide*)","la mitosis produce células genéticamente idénticas; la meiosis, células genéticamente distintas","el emparejamiento de homólogos y el entrecruzamiento solo ocurren en la meiosis"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":249,"p":"2","t":"D2.2","also":[],"title":"Expresión génica","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique cómo puede regularse la transcripción de un gen.","pts":["los *factores de transcripción* son proteínas que se unen a secuencias específicas del ADN","la ARN polimerasa solo inicia la transcripción si puede unirse al *promotor* del gen","los factores de transcripción unidos al promotor / a potenciadores favorecen (activadores) o impiden (represores) la unión de la ARN polimerasa","la *metilación* del ADN (de la citosina) en el promotor reprime la transcripción","la modificación química de las histonas (p. ej., acetilación o metilación) hace que el ADN esté más o menos condensado en los nucleosomas","el ADN menos condensado es accesible para la ARN polimerasa y se transcribe; el más condensado no","señales externas como hormonas o sustancias químicas (p. ej., la lactosa en bacterias) activan o desactivan genes"],"hl":false,"mod":"La transcripción solo comienza si la ARN polimerasa puede unirse al promotor del gen. Los factores de transcripción son proteínas que se unen a secuencias específicas del ADN, como el promotor o los potenciadores, y favorecen o impiden esa unión, de modo que activan o reprimen el gen. También hay control epigenético: la metilación de la citosina en el promotor reprime la transcripción, y la modificación de las histonas hace que el ADN quede más o menos condensado en los nucleosomas y, por tanto, menos o más accesible para la ARN polimerasa."},{"l":"b","m":2,"q":"Distinga entre genoma y proteoma.","pts":["genoma: toda la información genética / toda la secuencia de bases del ADN de una célula u organismo; proteoma: todas las proteínas producidas por una célula, un tejido o un organismo","el genoma es el mismo en (casi) todas las células de un organismo; el proteoma difiere entre tipos de células porque expresan genes distintos","el genoma es fijo a lo largo de la vida; el proteoma cambia con el tiempo / con las condiciones","el proteoma depende del patrón de *expresión génica* / solo se expresa una parte del genoma en cada célula"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Resuma cómo ayudan los estudios con gemelos monocigóticos a investigar la expresión génica.","pts":["los gemelos monocigóticos proceden de un mismo cigoto, así que tienen genomas idénticos","las diferencias fenotípicas entre ellos no pueden deberse a la secuencia de bases, sino al *ambiente*","el ambiente modifica las marcas *epigenéticas* (p. ej., el patrón de metilación) y con ello la expresión génica","las diferencias epigenéticas entre los gemelos aumentan con la edad / cuando viven en ambientes distintos"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":250,"p":"2","t":"D2.3","also":[],"title":"Potencial hídrico","blocks":[{"k":"p","v":"Se colocaron cilindros de papa en soluciones de sacarosa durante 24 horas."},{"k":"table","cap":"Cambio porcentual de masa","rows":[["Concentración de sacarosa / mol dm⁻³","0,0","0,2","0,4","0,6","0,8"],["Cambio de masa / %","+12","+5","–2","–9","–15"]]}],"parts":[{"l":"a","m":2,"q":"Estime la concentración de sacarosa que es isotónica con el tejido de papa.","pts":["la solución isotónica es aquella en la que el cambio de masa es cero / no hay movimiento neto de agua","está entre 0,2 mol dm⁻³ (+5 %) y 0,4 mol dm⁻³ (–2 %), donde el cambio pasa de positivo a negativo","0,34 mol dm⁻³ (aceptar de 0,32 a 0,36 mol dm⁻³; se requiere la unidad)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique el cambio de masa observado en la solución de 0,8 mol dm⁻³.","pts":["la masa disminuyó un 15 %","la solución es *hipertónica* respecto al tejido / tiene mayor concentración de solutos que las células (aceptar: menor potencial hídrico)","hay un movimiento neto de agua hacia fuera de las células por *ósmosis*","a través de la membrana plasmática, que es semipermeable / por las acuaporinas","el agua pasa de la zona de menor concentración de solutos a la de mayor concentración de solutos","las células pierden turgencia / se vuelven flácidas / se *plasmolizan* (la membrana se separa de la pared celular)"],"hl":false,"mod":"La masa disminuyó un 15 % porque la solución de 0,8 mol dm⁻³ es hipertónica respecto al tejido: tiene una concentración de solutos mayor que la del interior de las células. Por eso hay un movimiento neto de agua por ósmosis desde las células hacia la solución, a través de la membrana plasmática semipermeable. Al perder agua, las células pierden turgencia y se plasmolizan, y el cilindro pierde masa."},{"l":"c","m":2,"q":"Explique por qué se usa el cambio porcentual de masa en lugar del cambio de masa.","pts":["los cilindros tienen masas iniciales distintas","un cilindro de mayor masa ganaría o perdería más agua / más masa en términos absolutos","el porcentaje expresa el cambio en relación con la masa inicial, lo que permite una comparación válida entre cilindros"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":251,"p":"2","t":"D3.1","also":[],"title":"Reproducción","blocks":[],"parts":[{"l":"a","m":4,"q":"Explique el papel de las hormonas en el ciclo menstrual.","pts":["la *FSH*, secretada por la hipófisis, estimula el desarrollo de los folículos en el ovario","los folículos en desarrollo secretan *estradiol* (estrógeno)","el estradiol estimula la reparación y el engrosamiento del endometrio","el estradiol estimula la secreción de más FSH y de LH (retroalimentación positiva), hasta alcanzar un máximo","el aumento brusco de *LH* provoca la *ovulación* (hacia el día 14)","la LH hace que el folículo vacío se transforme en el cuerpo lúteo, que secreta *progesterona* (y estradiol)","la progesterona mantiene el endometrio grueso y vascularizado para la implantación","la progesterona y el estradiol altos inhiben la secreción de FSH y LH (retroalimentación negativa)","si no hay fecundación, el cuerpo lúteo degenera, la progesterona desciende y el endometrio se desprende (menstruación)"],"hl":false,"mod":"La hipófisis secreta FSH, que estimula el desarrollo de los folículos en el ovario. Los folículos secretan estradiol, que engrosa el endometrio y, por retroalimentación positiva, estimula la secreción de más FSH y de LH. El aumento brusco de LH provoca la ovulación hacia el día 14 y transforma el folículo vacío en el cuerpo lúteo, que secreta progesterona. La progesterona mantiene el endometrio preparado para la implantación y, junto con el estradiol, inhibe la FSH y la LH por retroalimentación negativa. Si no hay fecundación, el cuerpo lúteo degenera, la progesterona desciende y se produce la menstruación."},{"l":"b","m":3,"q":"Resuma las características de una flor polinizada por insectos.","pts":["pétalos grandes y de colores vistosos que atraen a los insectos","aroma que atrae a los insectos","*nectarios* en la base de la flor que producen néctar, la recompensa para el insecto","granos de polen grandes, pegajosos o con púas, que se adhieren al cuerpo del insecto","*anteras* situadas dentro de la flor, donde rozan al insecto y le dejan polen","*estigma* pegajoso situado dentro de la flor, donde recoge el polen del cuerpo del insecto"],"hl":false,"mod":"Una flor polinizada por insectos tiene pétalos grandes y vistosos y, a menudo, aroma para atraer a los insectos, y nectarios en la base que producen néctar como recompensa. Las anteras quedan dentro de la flor, de modo que rozan al insecto cuando busca el néctar y le dejan un polen grande, pegajoso o con púas que se adhiere a su cuerpo. El estigma, también interior y pegajoso, recoge el polen que el insecto trae de otra flor."}],"hl":false,"mk":7,"mkSL":7},{"qid":252,"p":"2","t":"D3.2","also":[],"title":"Herencia","blocks":[],"parts":[{"l":"a","m":3,"q":"Un hombre con hemofilia tiene hijos con una mujer homocigota para la coagulación normal. Deduzca los genotipos y fenotipos posibles de sus hijos.","pts":["genotipos de los progenitores: padre XʰY, madre XᴴXᴴ","gametos: el padre produce Xʰ e Y; la madre solo Xᴴ / cuadro de Punnett correcto","todas las hijas son XᴴXʰ: *portadoras* con coagulación normal","todos los hijos varones son XᴴY: coagulación normal / no afectados y no portadores","los hijos varones reciben el cromosoma Y del padre y el X de la madre, así que no pueden heredar Xʰ","ningún descendiente tiene hemofilia / probabilidad de un hijo afectado = 0"],"hl":false,"mod":"El padre es XʰY y la madre XᴴXᴴ. El padre produce gametos Xʰ e Y, y la madre solo gametos Xᴴ. Todas las hijas reciben el Xʰ del padre y un Xᴴ de la madre, así que son XᴴXʰ: portadoras, pero con coagulación normal porque el alelo Xᴴ es dominante. Todos los hijos varones reciben el Y del padre y un Xᴴ de la madre, así que son XᴴY, con coagulación normal y no portadores. Por tanto, ningún descendiente tiene hemofilia."},{"l":"b","m":2,"q":"Distinga entre codominancia y dominancia incompleta.","pts":["codominancia: en el heterocigoto *ambos alelos* se expresan por completo / a la vez","dominancia incompleta: el heterocigoto tiene un fenotipo *intermedio* entre los dos homocigotos","ejemplo de codominancia: grupo sanguíneo AB (IᴬIᴮ), con antígenos A y B en los eritrocitos","ejemplo de dominancia incompleta: flores rosadas del heterocigoto de un cruce rojo × blanco (p. ej., dondiego de noche)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique por qué la estatura humana muestra variación continua.","pts":["la estatura es *poligénica* / está controlada por muchos genes","cada gen tiene alelos que suman un pequeño efecto (aditivo) a la estatura","las muchas combinaciones de alelos producen muchos fenotipos intermedios / una distribución normal, sin categorías definidas","el *ambiente* (p. ej., nutrición, salud) también influye y difumina aún más las diferencias"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":253,"p":"2","t":"D3.3","also":[],"title":"Homeostasis","blocks":[],"parts":[{"l":"a","m":4,"q":"Explique el control de la concentración de glucosa en sangre.","pts":["la concentración de glucosa la detectan las células de los islotes del *páncreas*","si la glucosa es alta (p. ej., tras comer), las *células β* secretan *insulina*","la insulina aumenta la captación de glucosa por las células del hígado, del músculo y del tejido adiposo","la insulina estimula la conversión de glucosa en *glucógeno* en el hígado y el músculo","si la glucosa es baja (p. ej., en ayunas o con ejercicio), las *células α* secretan *glucagón*","el glucagón estimula la hidrólisis del glucógeno a glucosa en el hígado, que se libera a la sangre","las hormonas viajan por la sangre y actúan sobre células diana con receptores específicos","*retroalimentación negativa*: cada respuesta devuelve la concentración hacia el punto de ajuste"],"hl":false,"mod":"La concentración de glucosa en sangre se mantiene por retroalimentación negativa y la detectan las células de los islotes del páncreas. Cuando sube, por ejemplo tras una comida, las células β secretan insulina, que viaja por la sangre hasta las células diana: aumenta la captación de glucosa por las células del hígado y del músculo y estimula su conversión en glucógeno, de modo que la glucemia baja. Cuando la glucosa baja, por ejemplo en ayunas, las células α secretan glucagón, que estimula la hidrólisis del glucógeno hepático a glucosa, que se libera a la sangre y la glucemia sube. Así, cada desviación provoca una respuesta que la devuelve al punto de ajuste."},{"l":"b","m":3,"q":"Explique cómo ayuda el asa de Henle a conservar agua.","pts":["la rama ascendente bombea *iones de sodio* (Na⁺, seguidos de Cl⁻) por transporte activo hacia el líquido intersticial de la médula","la rama ascendente es impermeable al agua, así que el agua no sigue a los iones","se crea un medio *hipertónico* / un gradiente de concentración de solutos que aumenta hacia el interior de la médula","el agua sale de la rama descendente (permeable al agua) por *ósmosis* y se reabsorbe a la sangre","el conducto colector atraviesa la médula hipertónica, así que el agua sale por ósmosis a través de *acuaporinas* (si hay ADH)","el flujo en sentidos opuestos (multiplicador de contracorriente) mantiene el gradiente / asas más largas permiten una orina más concentrada"],"hl":true,"mod":"La rama ascendente del asa de Henle bombea iones de sodio por transporte activo hacia el líquido intersticial de la médula, y como es impermeable al agua, el agua no los sigue. Así se crea una médula hipertónica, con una concentración de solutos que aumenta hacia el interior. Por ello el agua sale por ósmosis de la rama descendente, que es permeable, y también del conducto colector cuando atraviesa la médula, a través de acuaporinas si hay ADH. Esta agua se reabsorbe a la sangre, de modo que se produce una orina concentrada y se conserva agua; cuanto más larga es el asa, mayor es el gradiente."}],"hl":false,"mk":7,"mkSL":4},{"qid":254,"p":"2","t":"D4.1","also":[],"title":"Selección natural","blocks":[],"parts":[{"l":"a","m":4,"q":"Explique cómo la selección natural puede llevar a la evolución.","pts":["existe *variación* entre los individuos de una población","la variación se debe a la mutación / a la meiosis y la reproducción sexual","se producen más descendientes de los que el ambiente puede sostener / *sobreproducción*","hay *competencia* por recursos limitados / lucha por la supervivencia","los individuos con características mejor adaptadas sobreviven y se reproducen más / los menos adaptados mueren o dejan menos descendientes","las características deben ser *heredables*, así que los alelos favorables pasan a la descendencia","la *frecuencia alélica* de la población cambia a lo largo de muchas generaciones","este cambio en las características heredables de la población es la evolución / las características adquiridas no se heredan"],"hl":false,"mod":"En una población hay variación entre individuos, causada por la mutación y por la meiosis y la reproducción sexual. Se producen más descendientes de los que el ambiente puede sostener, así que hay competencia por recursos limitados. Los individuos con características mejor adaptadas sobreviven y se reproducen más, mientras que los menos adaptados mueren o dejan menos descendientes. Como esas características son heredables, los alelos favorables pasan a la siguiente generación con más frecuencia. Al repetirse durante muchas generaciones, la frecuencia alélica de la población cambia, y ese cambio en las características heredables es la evolución."},{"l":"b","m":3,"q":"En una población, el 9 % de los individuos muestra el fenotipo recesivo. Calcule la frecuencia de heterocigotos.","pts":["frecuencia del fenotipo recesivo = q² = 0,09, así que q = √0,09 = 0,3","p = 1 – q = 0,7","frecuencia de heterocigotos = 2pq = 2 × 0,7 × 0,3","= 0,42 / 42 %"],"hl":true,"mod":"Según la ecuación de Hardy-Weinberg, la frecuencia del fenotipo recesivo es q² = 0,09, así que q = √0,09 = 0,3. Como p + q = 1, p = 1 – 0,3 = 0,7. La frecuencia de heterocigotos es 2pq = 2 × 0,7 × 0,3 = 0,42, es decir, el 42 % de la población."}],"hl":false,"mk":7,"mkSL":4},{"qid":255,"p":"2","t":"D4.2","also":[],"title":"Estabilidad de los ecosistemas","blocks":[],"parts":[{"l":"a","m":3,"q":"Resuma los factores necesarios para que un ecosistema se mantenga estable.","pts":["un aporte continuo de *energía* (luz solar) para los productores","el *reciclaje de nutrientes* por los descomponedores / saprótrofos","alta *biodiversidad* / diversidad genética, que da resiliencia frente a los cambios","variables climáticas (temperatura, precipitaciones) dentro de los límites de tolerancia de las especies","no superar un punto de inflexión / ausencia de alteraciones humanas graves (p. ej., deforestación a gran escala)"],"hl":false,"mod":"Un ecosistema estable necesita un aporte continuo de energía, normalmente la luz solar que usan los productores, y el reciclaje de nutrientes por los descomponedores, ya que los nutrientes son limitados. También necesita una alta biodiversidad y diversidad genética, que le dan resiliencia porque otras especies pueden ocupar el papel de las que se pierdan. Por último, las variables climáticas como la temperatura y las precipitaciones deben mantenerse dentro de los límites de tolerancia de las especies; si las alteraciones son demasiado grandes, puede superarse un punto de inflexión y el ecosistema colapsa."},{"l":"b","m":2,"q":"Explique, con un ejemplo, el papel de una especie clave.","pts":["una *especie clave* tiene un efecto desproporcionado en la estructura / estabilidad de la comunidad en relación con su abundancia","si se elimina, el ecosistema cambia mucho / puede colapsar","ejemplo: las nutrias marinas depredan a los erizos de mar","sin nutrias, los erizos aumentan y destruyen los bosques de kelp, que dan hábitat a muchas especies"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Resuma cómo restaura los procesos naturales la renaturalización.","pts":["*reintroducción* de especies desaparecidas, sobre todo superdepredadores / especies clave (p. ej., lobos)","los depredadores controlan a los herbívoros y se recupera la vegetación (cascada trófica)","se reduce la gestión humana (cultivo, control de inundaciones, pastoreo intensivo), así que vuelven procesos como las inundaciones y la sucesión","se restablece la conectividad entre hábitats / se crean corredores"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":256,"p":"2","t":"D4.3","also":[],"title":"Cambio climático","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique por qué el cambio climático amenaza a los arrecifes de coral.","pts":["las temperaturas más altas del agua causan estrés térmico en los corales","los corales expulsan a sus *zooxantelas* simbióticas (*blanqueamiento*)","pierden los glúcidos de la fotosíntesis de las zooxantelas / su principal alimento, y mueren si el estrés se prolonga","más CO₂ atmosférico se disuelve en el océano, lo que provoca *acidificación* (baja el pH)","hay menos iones carbonato, así que se reduce el depósito de *carbonato de calcio* / la construcción del arrecife","la muerte de los corales elimina el hábitat de muchas especies / puede llevar al colapso del ecosistema"],"hl":false,"mod":"El cambio climático eleva la temperatura del agua, lo que causa estrés térmico en los corales: expulsan a sus zooxantelas simbióticas y se blanquean. Como pierden los glúcidos que estas les aportaban por fotosíntesis, mueren si el calentamiento se prolonga. Además, el aumento de CO₂ atmosférico hace que se disuelva más CO₂ en el océano, que se acidifica; con menos iones carbonato, los corales depositan menos carbonato de calcio y el arrecife crece más despacio o se disuelve. La muerte de los corales elimina el hábitat de muchas especies y puede llevar al colapso del ecosistema."},{"l":"b","m":2,"q":"Resuma por qué un desajuste en la fenología puede reducir las poblaciones de aves.","pts":["la *fenología* es el momento de los acontecimientos biológicos anuales, controlado por señales como la temperatura o el fotoperiodo","el calentamiento adelanta el pico de alimento (p. ej., orugas / insectos), que depende de la temperatura","el momento de la cría de las aves depende sobre todo del fotoperiodo, que no cambia, así que no se adelanta igual","los polluelos nacen después del pico de alimento, así que sobreviven menos / baja el éxito reproductor"],"hl":true,"mod":""},{"l":"c","m":2,"q":"Sugiera dos formas de aumentar el secuestro de carbono.","pts":["forestación / reforestación: los árboles fijan CO₂ por fotosíntesis y lo almacenan en su biomasa","restauración de humedales / turberas, donde la materia orgánica no se descompone del todo y se acumula como turba","protección / restauración de manglares y praderas marinas","prácticas agrícolas que aumentan el carbono del suelo (p. ej., sin labranza, cultivos de cobertura)"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":5},{"qid":257,"p":"2X","t":"A1.2","also":["D1.2","D1.3"],"title":"Respuesta extensa: ADN y proteínas","blocks":[],"parts":[{"l":"a","m":4,"q":"Dibuje un diagrama rotulado de un tramo corto de ADN con dos pares de nucleótidos.","pts":["nucleótidos dibujados con los símbolos correctos: fosfato (círculo), *desoxirribosa* (pentágono) y base (rectángulo), con al menos un rótulo de cada componente","esqueleto de azúcar-fosfato: el fosfato de un nucleótido unido al azúcar del siguiente por un enlace *covalente* en cada hebra","bases unidas al C1 de la desoxirribosa y fosfato al C5 (posiciones correctas en el pentágono)","*apareamiento complementario* de bases rotulado: A con T y C con G","*enlaces de hidrógeno* entre las bases complementarias rotulados (aceptar 2 entre A–T y 3 entre C–G)","hebras *antiparalelas*: una hebra invertida respecto a la otra / extremos 5' y 3' rotulados en ambas hebras"],"hl":false,"mod":"El dibujo muestra dos hebras con dos nucleótidos cada una. Cada nucleótido se representa con un círculo (fosfato) unido al C5 de un pentágono (desoxirribosa) y un rectángulo (base) unido al C1. En cada hebra el fosfato de un nucleótido se une por un enlace covalente a la desoxirribosa del siguiente, formando el esqueleto de azúcar-fosfato. Las bases de las dos hebras se aparean de forma complementaria, A con T y C con G, unidas por enlaces de hidrógeno (rotulados). Una hebra está invertida respecto a la otra, con los extremos 5' y 3' rotulados, para mostrar que son antiparalelas."},{"l":"b","m":4,"q":"Describa cómo se usa la secuencia de bases de un gen para producir un polipéptido.","pts":["*transcripción*: la ARN polimerasa separa las hebras del ADN y usa una (la hebra molde) para sintetizar ARNm","los nucleótidos de ARN se aparean de forma complementaria con la hebra molde (con *uracilo* en lugar de timina)","el ARNm sale del núcleo por los poros nucleares y se une a un *ribosoma* (subunidad pequeña)","*traducción*: el ribosoma lee el ARNm en tripletes de bases llamados *codones*","cada ARNt lleva un aminoácido específico y tiene un *anticodón* que se aparea con el codón complementario","el ribosoma une los aminoácidos adyacentes mediante *enlaces peptídicos*, formando el polipéptido","la traducción empieza en un codón de inicio (AUG) y termina en un codón de parada / el ribosoma avanza un codón cada vez","la secuencia de bases determina la secuencia de aminoácidos porque el código genético es universal / cada codón codifica un aminoácido"],"hl":false,"mod":"Primero, en la transcripción, la ARN polimerasa separa las hebras del ADN y usa la hebra molde para sintetizar una molécula de ARNm por apareamiento complementario de bases (con uracilo en lugar de timina). El ARNm sale del núcleo por los poros nucleares y se une a un ribosoma. En la traducción, el ribosoma lee el ARNm en codones, empezando por el codón de inicio AUG. Cada ARNt lleva un aminoácido específico y su anticodón se aparea con el codón complementario. El ribosoma une los aminoácidos adyacentes mediante enlaces peptídicos y avanza codón a codón hasta llegar a un codón de parada, cuando se libera el polipéptido. Así, la secuencia de bases determina la secuencia de aminoácidos."},{"l":"c","m":8,"q":"Explique cómo pueden afectar las mutaciones a la estructura y la función de las proteínas.","pts":["una mutación génica es un cambio en la *secuencia de bases* del ADN de un gen","una *sustitución* de una base cambia un solo codón del ARNm","puede ser silenciosa / no tener efecto porque el código genético es *degenerado* (el nuevo codón codifica el mismo aminoácido)","puede cambiar un aminoácido por otro en la estructura primaria (mutación de sentido erróneo)","puede crear un *codón de parada* prematuro, dando un polipéptido más corto, normalmente no funcional","una *inserción* o *deleción* de bases (no múltiplo de tres) desplaza el marco de lectura","cambian todos los codones posteriores, así que la secuencia de aminoácidos cambia mucho y la proteína suele ser no funcional","un cambio en la estructura primaria cambia los enlaces entre grupos R y por tanto el plegamiento / la *estructura terciaria*","puede cambiar la forma del *sitio activo* de una enzima / del sitio de unión, reduciendo o anulando su función","ejemplo: en la *anemia falciforme* el codón GAG pasa a GTG, y el ácido glutámico se sustituye por valina en la hemoglobina","la hemoglobina S forma fibras / cristaliza a baja concentración de oxígeno, los glóbulos rojos adoptan forma de hoz, transportan menos O₂ y bloquean capilares","algunas mutaciones son neutras o beneficiosas y son la fuente original de *variación* genética para la evolución"],"hl":false,"mod":"Una mutación génica es un cambio en la secuencia de bases de un gen, y como el ARNm se transcribe a partir de él, puede cambiar la secuencia de aminoácidos. Una sustitución altera un solo codón: puede ser silenciosa porque el código es degenerado, puede cambiar un aminoácido por otro o puede crear un codón de parada prematuro que acorta el polipéptido. Las inserciones o deleciones desplazan el marco de lectura y cambian todos los codones posteriores, por lo que suelen producir proteínas no funcionales. Un cambio en la estructura primaria modifica las interacciones entre los grupos R y, por tanto, el plegamiento y la estructura terciaria; si cambia la forma del sitio activo o de un sitio de unión, la proteína pierde función. Por ejemplo, en la anemia falciforme la sustitución GAG→GTG cambia el ácido glutámico por valina; la hemoglobina forma fibras a baja concentración de oxígeno, los glóbulos rojos adoptan forma de hoz y transportan menos oxígeno. Sin embargo, algunas mutaciones son neutras o beneficiosas y aportan la variación sobre la que actúa la selección natural."}],"hl":false,"mk":16,"mkSL":16},{"qid":258,"p":"2X","t":"A4.1","also":["D4.1"],"title":"Respuesta extensa: evolución","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma las pruebas de la evolución que aportan las secuencias de ADN y de proteínas.","pts":["se comparan las *secuencias de bases* de un mismo gen / las secuencias de aminoácidos de una misma proteína (p. ej., citocromo c, hemoglobina) entre especies","cuanto más parecidas son las secuencias, más estrecho es el parentesco / más reciente es el *ancestro común*","las diferencias se acumulan a un ritmo aproximadamente constante, así que el número de diferencias permite estimar cuándo divergieron las especies (*reloj molecular*)","el *código genético universal* / el uso de ADN, ARN y los mismos 20 aminoácidos en todos los organismos indica un origen común","los patrones de parentesco obtenidos de las secuencias coinciden en gran medida con los de la anatomía comparada / el registro fósil","las secuencias son datos objetivos y cuantitativos que permiten comparar organismos de aspecto muy diferente"],"hl":false,"mod":"Se pueden comparar las secuencias de bases de un mismo gen, o las secuencias de aminoácidos de una misma proteína como el citocromo c, entre distintas especies. Cuanto más parecidas son, más reciente es su ancestro común, porque las diferencias se acumulan por mutación a un ritmo aproximadamente constante (reloj molecular), lo que además permite estimar cuándo divergieron. Que todos los organismos usen el mismo código genético universal y los mismos 20 aminoácidos indica un origen común. Además, las relaciones de parentesco obtenidas de las secuencias coinciden en gran parte con las de la anatomía comparada y los fósiles."},{"l":"b","m":4,"q":"Explique la especiación alopátrica, con un ejemplo.","pts":["una población queda dividida por una *barrera geográfica* (p. ej., un río, una montaña, el mar)","no hay *flujo génico* / cruzamiento entre las dos poblaciones","cada población está sometida a *presiones de selección* diferentes (además de mutaciones distintas / deriva genética)","las frecuencias alélicas de las dos poblaciones divergen a lo largo de muchas generaciones","se produce *aislamiento reproductivo*: aunque vuelvan a encontrarse, ya no pueden cruzarse / producir descendencia fértil","se han formado dos especies distintas a partir de una","ejemplo concreto: ardillas de Kaibab y de Abert a ambos lados del Gran Cañón / pinzones de distintas islas Galápagos / bonobos y chimpancés separados por el río Congo"],"hl":false,"mod":"La especiación alopátrica empieza cuando una barrera geográfica divide una población en dos, de modo que deja de haber flujo génico entre ellas. Cada población está expuesta a presiones de selección diferentes y acumula mutaciones distintas, por lo que sus frecuencias alélicas divergen durante muchas generaciones. Finalmente aparece aislamiento reproductivo: aunque se volvieran a encontrar, ya no podrían producir descendencia fértil, así que son especies distintas. Por ejemplo, los bonobos y los chimpancés evolucionaron a partir de un ancestro común tras quedar separados por el río Congo."},{"l":"c","m":8,"q":"Discuta el papel de la selección natural y de otros factores en el cambio de las frecuencias alélicas de una población.","pts":["hay *variación* heredable entre los individuos de una población, cuya fuente original es la mutación (y la recombinación en la meiosis / reproducción sexual)","se producen más descendientes de los que el ambiente puede mantener, así que hay *competencia* / lucha por la supervivencia","los individuos con rasgos mejor adaptados a las presiones de selección sobreviven y se reproducen más (*supervivencia diferencial*)","transmiten sus alelos a la descendencia, así que la frecuencia de los alelos favorables *aumenta* en la siguiente generación","ejemplo: resistencia a antibióticos en bacterias / resistencia a pesticidas, con aumento del alelo de resistencia","la *selección sexual* (elección de pareja / competencia entre machos) favorece rasgos que aumentan el éxito reproductivo aunque no la supervivencia","la selección direccional desplaza la media de un rasgo / la estabilizadora favorece los intermedios / la disruptiva favorece los extremos (NS)","la *mutación* introduce alelos nuevos, pero cambia las frecuencias muy lentamente","la migración / el *flujo génico* entre poblaciones añade o elimina alelos","la *deriva genética*: cambios aleatorios de las frecuencias, importantes en poblaciones pequeñas (p. ej., efecto fundador / cuello de botella), que no producen adaptación","el principio de *Hardy-Weinberg* predice frecuencias constantes solo si la población es grande, con apareamiento al azar y sin selección, mutación ni migración, así que una desviación indica que actúan estos factores (NS)","conclusión equilibrada: la selección natural es el único factor que produce *adaptación* de forma sistemática, aunque los demás factores también cambian las frecuencias alélicas"],"hl":false,"mod":"Dentro de una población existe variación heredable, cuya fuente original es la mutación, y se producen más descendientes de los que el ambiente puede mantener, de modo que hay competencia. Los individuos cuyos rasgos están mejor adaptados a las presiones de selección sobreviven y se reproducen más, y transmiten sus alelos, así que la frecuencia de los alelos favorables aumenta de generación en generación. Por ejemplo, cuando se usan antibióticos, las bacterias con el alelo de resistencia sobreviven y la frecuencia de ese alelo aumenta rápidamente. La selección sexual también cambia las frecuencias al favorecer rasgos que aumentan el éxito reproductivo, aunque reduzcan la supervivencia. Sin embargo, la selección no es el único factor: la mutación aporta alelos nuevos, aunque cambia las frecuencias muy lentamente; la migración introduce o elimina alelos mediante flujo génico; y en poblaciones pequeñas la deriva genética cambia las frecuencias al azar, por ejemplo tras un efecto fundador. En conclusión, todos estos factores alteran las frecuencias alélicas, pero solo la selección natural lo hace de forma no aleatoria y produce adaptación, por lo que es el principal motor de la evolución adaptativa."}],"hl":true,"mk":16,"mkSL":16},{"qid":259,"p":"2X","t":"B2.1","also":["B2.2"],"title":"Respuesta extensa: membranas","blocks":[],"parts":[{"l":"a","m":4,"q":"Dibuje el modelo de mosaico fluido de una membrana.","pts":["*bicapa* de fosfolípidos con las cabezas hacia fuera y las colas hacia dentro","cabezas hidrofílicas y colas hidrofóbicas rotuladas","*proteína integral* que atraviesa la bicapa (transmembrana) / proteína canal con poro","*proteína periférica* en la superficie de una de las caras","*glicoproteína* con cadena de glúcidos solo en la cara externa (y/o glicolípido)","*colesterol* entre los fosfolípidos, en la zona hidrofóbica"],"hl":false,"mod":"El dibujo muestra una bicapa de fosfolípidos con las cabezas hidrofílicas hacia el exterior y las colas hidrofóbicas hacia el interior, ambas rotuladas. Una proteína integral atraviesa toda la bicapa y una proteína periférica está en la superficie de una cara. Una glicoproteína con una cadena de glúcidos ramificada aparece solo en la cara externa, y entre las colas de los fosfolípidos hay moléculas de colesterol rotuladas."},{"l":"b","m":4,"q":"Describa cómo se usan las vesículas para mover materiales dentro de la célula y hacia fuera.","pts":["las proteínas sintetizadas por los ribosomas del *RE rugoso* se transportan en vesículas que se desprenden del RE","las vesículas se mueven hacia el aparato de *Golgi* y se fusionan con él, que modifica las proteínas","del Golgi se desprenden vesículas de secreción / vesículas que llevan enzimas a los lisosomas","en la *exocitosis*, las vesículas se fusionan con la membrana plasmática y liberan su contenido fuera de la célula","en la *endocitosis*, la membrana plasmática se invagina y se cierra formando una vesícula que introduce materiales","la *fluidez* de la membrana permite que se formen vesículas y que se fusionen con otras membranas","el movimiento de las vesículas requiere *ATP* / proteínas motoras que se desplazan por el citoesqueleto"],"hl":false,"mod":"Las proteínas fabricadas por los ribosomas del RE rugoso se empaquetan en vesículas que se desprenden del RE y se fusionan con el aparato de Golgi, donde se modifican. Del Golgi se desprenden vesículas de secreción, que se mueven hacia la membrana plasmática con gasto de ATP y se fusionan con ella, liberando su contenido al exterior por exocitosis. A la inversa, en la endocitosis la membrana plasmática se invagina y se cierra formando una vesícula que introduce materiales en la célula. Todo ello es posible porque la membrana es fluida, lo que permite que las vesículas se formen y se fusionen con otras membranas."},{"l":"c","m":8,"q":"Explique cómo los distintos métodos de transporte de membrana permiten a las células controlar qué entra y qué sale.","pts":["la bicapa de fosfolípidos tiene un interior hidrofóbico que es una barrera para los iones y las moléculas polares grandes","*difusión simple*: solo las moléculas pequeñas y apolares (O₂, CO₂) atraviesan la bicapa, a favor del gradiente; no es selectiva","*ósmosis*: el agua atraviesa la membrana sobre todo por *acuaporinas*, hacia la solución de mayor concentración de solutos","*difusión facilitada*: proteínas canal específicas dejan pasar solo un ion / molécula concreto, a favor del gradiente","los *canales regulados* (por voltaje o por ligando) solo se abren en respuesta a una señal, así que la célula controla cuándo pasan los iones","*transporte activo*: proteínas bomba específicas usan *ATP* para mover sustancias contra su gradiente de concentración","así la célula puede acumular sustancias que necesita / expulsar sustancias aunque estén más concentradas fuera","ejemplo: la bomba Na⁺/K⁺ expulsa 3 Na⁺ e introduce 2 K⁺ por cada ATP (NS)","transporte activo indirecto: el *cotransportador* Na⁺-glucosa usa el gradiente de Na⁺ para introducir glucosa (NS)","*endocitosis* / *exocitosis* mueven moléculas grandes o partículas en vesículas","la especificidad de forma de las proteínas de transporte produce *permeabilidad selectiva*","la célula puede cambiar el número / tipo de proteínas de transporte de su membrana (p. ej., insertar acuaporinas) para ajustar la permeabilidad"],"hl":false,"mod":"El interior hidrofóbico de la bicapa de fosfolípidos impide el paso de iones y moléculas polares grandes, de modo que la célula controla su paso con proteínas de transporte. Solo las moléculas pequeñas y apolares, como el O₂ y el CO₂, atraviesan la bicapa por difusión simple, que no es selectiva. El agua se mueve por ósmosis, sobre todo a través de acuaporinas. En la difusión facilitada, proteínas canal específicas dejan pasar un solo tipo de ion o molécula a favor de su gradiente, y los canales regulados por voltaje o por ligando solo se abren ante una señal, lo que permite a la célula controlar cuándo entran o salen los iones. Mediante transporte activo, proteínas bomba específicas usan ATP para mover sustancias contra su gradiente, de modo que la célula puede acumular lo que necesita o expulsar lo que no necesita. Las moléculas grandes entran por endocitosis y salen por exocitosis en vesículas. Como cada proteína de transporte es específica por su forma, la membrana es selectivamente permeable, y la célula puede ajustar qué pasa cambiando el número y el tipo de proteínas de transporte de su membrana, por ejemplo insertando más acuaporinas."}],"hl":true,"mk":16,"mkSL":16},{"qid":260,"p":"2X","t":"B3.1","also":["B3.2"],"title":"Respuesta extensa: transporte e intercambio","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa cómo están adaptadas las superficies de intercambio de gases para la difusión.","pts":["*gran superficie* (p. ej., millones de alvéolos / laminillas branquiales) en relación con el volumen","epitelio *delgado* (una sola capa de células aplanadas) que da una distancia de difusión corta","superficie *húmeda*, para que los gases se disuelvan antes de difundir","permeable a los gases respiratorios (O₂ y CO₂)","*gradiente de concentración* pronunciado mantenido por la ventilación, que renueva el aire / agua","y por una densa red de capilares cuyo flujo sanguíneo retira el O₂ y aporta CO₂ continuamente"],"hl":false,"mod":"Las superficies de intercambio de gases tienen una gran superficie en relación con el volumen, como los millones de alvéolos de los pulmones, lo que permite que difunda mucho gas a la vez. Están formadas por un epitelio muy delgado, de una sola capa de células aplanadas, así que la distancia de difusión es corta, y son húmedas, para que los gases se disuelvan antes de difundir. Además, se mantiene un gradiente de concentración pronunciado gracias a la ventilación, que renueva el aire, y a una densa red de capilares cuyo flujo sanguíneo retira continuamente el oxígeno y aporta dióxido de carbono."},{"l":"b","m":4,"q":"Compare y contraste el transporte de agua en el xilema con el de sacarosa en el floema.","pts":["semejanza: ambos son tejidos vasculares formados por tubos continuos que transportan sustancias disueltas en agua por flujo masivo","contenido: el xilema lleva *agua e iones minerales*; el floema lleva *sacarosa* (y aminoácidos)","dirección: el xilema solo hacia arriba, de las raíces a las hojas; el floema en ambos sentidos, de la *fuente al sumidero*","mecanismo: el xilema es pasivo, por la *tensión* que genera la transpiración (presión negativa); el floema requiere la carga activa de sacarosa, que genera presión positiva","células: el xilema son vasos de células muertas sin paredes transversales, reforzados con *lignina*; el floema son tubos cribosos vivos con placas cribosas y células acompañantes","energía: el transporte por el xilema no consume ATP de la planta; el del floema sí (en la carga activa)"],"hl":false,"mod":"Tanto el xilema como el floema son tejidos vasculares que transportan sustancias disueltas en agua por flujo masivo. Sin embargo, el xilema transporta agua e iones minerales solo hacia arriba, de las raíces a las hojas, mientras que el floema transporta sacarosa en ambos sentidos, desde las fuentes hasta los sumideros. El flujo del xilema es pasivo, impulsado por la tensión que genera la transpiración, mientras que el del floema depende de la carga activa de sacarosa con gasto de ATP, que genera una presión positiva. Además, los vasos del xilema están formados por células muertas reforzadas con lignina, mientras que el floema está formado por tubos cribosos vivos con células acompañantes."},{"l":"c","m":8,"q":"Explique cómo la estructura del sistema circulatorio de los mamíferos permite llevar oxígeno a los tejidos con eficacia.","pts":["*circulación doble*: la sangre pasa dos veces por el corazón en cada vuelta completa (pulmonar y sistémica)","tras oxigenarse en los pulmones, la sangre vuelve al corazón y se bombea de nuevo, así que llega a los tejidos a *presión alta*","el *ventrículo izquierdo* tiene una pared muscular gruesa que genera presión suficiente para toda la circulación sistémica","las *válvulas* del corazón (y de las venas) impiden el reflujo y mantienen un flujo en un solo sentido","las *arterias* tienen paredes gruesas con fibras elásticas que se estiran y se retraen, manteniendo la presión entre latidos","las paredes musculares de las arterias / arteriolas pueden contraerse o relajarse para dirigir más sangre a los tejidos activos","los *capilares* tienen paredes de una sola capa de células, con poros, que dan una distancia de difusión corta","forman redes muy ramificadas con gran superficie que llegan cerca de todas las células / el flujo lento da tiempo para el intercambio","la *hemoglobina* de los glóbulos rojos transporta mucho más O₂ del que podría disolverse en el plasma","los glóbulos rojos no tienen núcleo (más espacio para hemoglobina) y son *bicóncavos* (más superficie, difusión rápida)","en los tejidos activos, la mayor concentración de CO₂ desplaza la curva de disociación (*efecto Bohr*) y se libera más O₂ (NS)","las *venas* tienen luz amplia y válvulas que devuelven la sangre al corazón a baja presión","durante el ejercicio aumentan la frecuencia cardíaca y el volumen sistólico, así que llega más O₂ a los músculos"],"hl":false,"mod":"Los mamíferos tienen circulación doble: tras oxigenarse en los pulmones, la sangre vuelve al corazón y se bombea de nuevo, de modo que llega a los tejidos a presión alta. El ventrículo izquierdo tiene una pared muscular gruesa que genera esa presión, y las válvulas impiden el reflujo, por lo que la sangre circula en
