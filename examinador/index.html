ue qué representan los valores entre paréntesis.","pts":["el *intervalo de confianza del 95 %*: el rango en el que hay un 95 % de probabilidad de que esté la media real de la población"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Calcule el porcentaje de disminución de la flexión media de la rodilla en los hombres desde el grupo más joven al de más edad.","pts":["(146,2 − 130,0) ÷ 146,2 × 100 = *11,1 %* (aceptar 11 %)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Indique dos conclusiones que se pueden extraer de los datos.","pts":["la flexión máxima de la rodilla *disminuye con la edad* en ambos sexos (p. ej., hombres: de 146,2° a 130,0°)","las mujeres tienen mayor flexión que los hombres en todos los grupos de edad","la diferencia entre sexos es *significativa* en los grupos 5–12, 26–50 y 51–75, porque los intervalos de confianza no se solapan; en el de 13–25 se solapan, así que no es significativa"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Describa cómo se puede medir la amplitud de movimiento de una articulación.","pts":["se usa un *goniómetro* (o se analizan fotografías / vídeos con un programa informático)","el eje / centro del goniómetro se coloca sobre el punto de giro de la articulación","cada brazo se alinea con el eje longitudinal del hueso a cada lado (p. ej., fémur y tibia)","se mide el ángulo en flexión máxima y en extensión máxima; la amplitud es la *diferencia* entre ambos","se repite la medición varias veces / en varias personas y se calcula la media, con la misma postura y sin calentamiento previo distinto"],"hl":false,"mod":"La amplitud de movimiento se mide con un goniómetro. Su eje se coloca sobre el punto de giro de la articulación y cada brazo se alinea con el eje longitudinal del hueso de cada lado, por ejemplo el fémur y la tibia en la rodilla. Se lee el ángulo en flexión máxima y en extensión máxima, y la amplitud de movimiento es la diferencia entre ambos. Para que la medida sea fiable, se repite varias veces y se calcula la media, manteniendo la misma postura."},{"l":"e","m":2,"q":"Distinga entre los esqueletos de los artrópodos y los de los vertebrados.","pts":["artrópodos: *exoesqueleto* externo; vertebrados: *endoesqueleto* interno","artrópodos: formado de *quitina*; vertebrados: formado de hueso (y cartílago)","en los artrópodos los músculos se insertan en la cara interna del esqueleto; en los vertebrados, en la cara externa de los huesos (mediante tendones)","el exoesqueleto no crece y debe mudarse; el endoesqueleto crece con el organismo"],"hl":false,"mod":""}],"hl":true,"mk":9,"mkSL":9},{"qid":2009,"p":"2","t":"D4.2","also":["C4.1"],"title":"Los mejillones como limpiadores del agua","blocks":[{"k":"p","v":"Los mejillones de agua dulce filtran algas y cianobacterias del agua. Unos investigadores colocaron mejillones en tanques con agua de lago rica en cianobacterias, con dos niveles de oxígeno disuelto (OD). El tanque control no tenía mejillones. La concentración de clorofila es proporcional a la densidad de cianobacterias."},{"k":"chart","type":"line","title":"Concentración de clorofila en los tanques","x":"Tiempo / h","y":"Clorofila / µg L⁻¹","s":[{"n":"Mejillones, OD 8 mg L⁻¹","pts":[["0",320.0],["4",210.0],["8",140.0],["12",95.0],["16",70.0],["20",55.0],["24",45.0]]},{"n":"Mejillones, OD 1 mg L⁻¹","pts":[["0",320.0],["4",300.0],["8",285.0],["12",270.0],["16",262.0],["20",255.0],["24",250.0]]},{"n":"Control (sin mejillones)","pts":[["0",320.0],["4",325.0],["8",332.0],["12",338.0],["16",345.0],["20",350.0],["24",356.0]]}]}],"parts":[{"l":"a","m":1,"q":"Indique la concentración de clorofila en el control después de 16 horas.","pts":["345 µg L⁻¹"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Sugiera una razón para el cambio en el control.","pts":["las cianobacterias hicieron fotosíntesis y se reprodujeron, así que su densidad aumentó (de 320 a 356 µg L⁻¹)","no había mejillones / filtradores que las eliminaran"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Compare y contraste la filtración de los mejillones con los dos niveles de oxígeno.","pts":["con ambos niveles, la clorofila disminuyó, mientras que en el control aumentó (de 320 a 356 µg L⁻¹)","la disminución fue mucho mayor con OD 8 mg L⁻¹ (de 320 a 45 µg L⁻¹) que con OD 1 mg L⁻¹ (de 320 a 250 µg L⁻¹)","con OD 8 mg L⁻¹ la disminución fue rápida al principio (de 320 a 210 µg L⁻¹ en 4 h) y luego se frenó; con OD 1 mg L⁻¹ fue lenta durante todo el tiempo"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Calcule el porcentaje de disminución de clorofila con mejillones a OD 8 mg L⁻¹ en 24 horas.","pts":["disminución = 320 – 45 = 275 µg L⁻¹","275 ÷ 320 × 100 = 86 % (85,9 %)"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Explique por qué los mejillones filtraron menos con poco oxígeno disuelto.","pts":["con poco oxígeno hay menos *respiración celular aeróbica*, así que se produce menos ATP","la respiración celular anaeróbica produce muy poco ATP por glucosa","hay menos energía para mover los cilios de las branquias que bombean agua, así que se filtra menos volumen","los mejillones pueden cerrar las valvas / reducir su actividad para ahorrar energía"],"hl":false,"mod":""},{"l":"f","m":2,"q":"Explique cómo los mejillones podrían ayudar a reducir los efectos de la eutrofización en un lago.","pts":["los mejillones filtran y eliminan algas / cianobacterias, así que se reduce la proliferación algal y el agua se aclara","llega más luz a las plantas sumergidas, que siguen haciendo fotosíntesis y liberando oxígeno","mueren menos algas, así que hay menos materia orgánica para los descomponedores","las bacterias descomponedoras consumen menos oxígeno (menor demanda bioquímica de oxígeno), así que no se agota el oxígeno y no mueren los peces"],"hl":false,"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":2010,"p":"2","t":"C2.1","also":["C3.1"],"title":"La epinefrina y su receptor","blocks":[{"k":"p","v":"La epinefrina (adrenalina) es liberada por las glándulas suprarrenales. Se une a un receptor acoplado a proteína G (GPCR) de la membrana plasmática de las células del hígado y de los músculos."}],"parts":[{"l":"a","m":1,"q":"Indique qué molécula es el ligando en este sistema.","pts":["la *epinefrina* (adrenalina)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique cómo la epinefrina hace que las células del hígado liberen glucosa sin entrar en la célula.","pts":["la epinefrina se une al sitio de unión del *GPCR* en la cara externa de la membrana (no necesita entrar en la célula)","la unión cambia la conformación del receptor, que activa la *proteína G* en la cara interna (el GDP se sustituye por GTP)","la proteína G activada activa la adenilato ciclasa, que convierte ATP en *AMPc*","el AMPc actúa como *segundo mensajero* y activa una proteína quinasa","una cascada de quinasas activa enzimas (glucógeno fosforilasa) que hidrolizan el *glucógeno* a glucosa","cada paso de la cascada amplifica la señal: una molécula de epinefrina da lugar a muchas moléculas de glucosa","la glucosa sale de la célula a la sangre por difusión facilitada"],"hl":false,"mod":"La epinefrina es hidrofílica, así que no entra en la célula: se une al sitio de unión del GPCR en la cara externa de la membrana. Esta unión cambia la conformación del receptor, lo que activa la proteína G en la cara interna, sustituyendo su GDP por GTP. La proteína G activada activa la adenilato ciclasa, que convierte ATP en AMPc. El AMPc actúa como segundo mensajero y activa una cascada de proteínas quinasas que activa la enzima que hidroliza el glucógeno a glucosa, amplificando la señal en cada paso. La glucosa sale luego a la sangre por difusión facilitada."},{"l":"c","m":2,"q":"Describa dos formas en que la epinefrina ayuda a los músculos a contraerse con intensidad.","pts":["aumenta la frecuencia cardíaca / el volumen sistólico, así que llega más sangre (O₂ y glucosa) a los músculos","dilata las arteriolas que irrigan los músculos esqueléticos (y contrae las del tubo digestivo), desviando la sangre hacia los músculos","dilata los bronquiolos / aumenta la frecuencia de ventilación, así que se absorbe más O₂","estimula la hidrólisis del glucógeno en el hígado y los músculos, así que hay más glucosa disponible para la respiración celular"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Distinga entre la acción de la epinefrina y la de una hormona esteroidea.","pts":["la epinefrina es hidrofílica y no atraviesa la membrana; las hormonas esteroideas son hidrofóbicas / liposolubles y atraviesan la membrana","la epinefrina se une a un receptor de la *membrana plasmática*; los esteroides se unen a receptores del *citoplasma / núcleo*","la epinefrina actúa mediante un segundo mensajero (AMPc); el complejo esteroide–receptor actúa directamente como factor de transcripción y regula la *expresión génica*","la respuesta a la epinefrina es rápida y breve (activa enzimas ya existentes); la de los esteroides es más lenta y duradera (se sintetizan proteínas nuevas)"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":2011,"p":"2","t":"C1.2","also":["C1.1"],"title":"La glicólisis","blocks":[{"k":"p","v":"En la glicólisis, la glucosa se convierte en fructosa bifosfato, que se divide en dos moléculas de triosa fosfato. Luego cada triosa fosfato se convierte en piruvato."}],"parts":[{"l":"a","m":2,"q":"Indique en qué punto de esta ruta ocurren la fosforilación y la oxidación.","pts":["fosforilación: al principio, en la conversión de glucosa en *fructosa bifosfato* (se añaden 2 fosfatos procedentes de 2 ATP)","la fosforilación hace la molécula menos estable / más reactiva, lo que permite su división en dos triosas fosfato","oxidación: en la conversión de *triosa fosfato* en piruvato (se elimina hidrógeno y se reduce NAD)","acepte también: fosforilación de ADP a ATP en la conversión de triosa fosfato en piruvato"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Indique en qué parte de la célula ocurre la glicólisis.","pts":["en el *citoplasma* (citosol)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Resuma cómo se repone el NAD para la glicólisis durante la respiración celular anaeróbica en el músculo humano.","pts":["sin oxígeno, el NAD reducido no puede oxidarse en la cadena de transporte de electrones","el NAD reducido cede hidrógeno al *piruvato* (el piruvato se reduce)","el piruvato se convierte en *lactato* y se regenera NAD (oxidado)","el NAD puede volver a aceptar hidrógeno en la glicólisis, así que esta continúa y produce 2 ATP netos por glucosa"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Indique el rendimiento neto de ATP y de NAD reducido de la glicólisis de una glucosa.","pts":["se producen 4 ATP por fosforilación a nivel de sustrato","menos 2 ATP consumidos en la fosforilación inicial = *2 ATP netos*","*2 NAD reducidos*"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Distinga entre una ruta metabólica lineal y una cíclica, usando la glicólisis como ejemplo.","pts":["en una ruta *lineal* el producto final es distinto del sustrato inicial y no lo regenera: la glicólisis es lineal (glucosa → piruvato)","en una ruta *cíclica* el último paso regenera el compuesto inicial (por ejemplo, el ciclo de Krebs regenera el compuesto de 4C / el ciclo de Calvin regenera la RuBP)"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":2012,"p":"2","t":"A4.1","also":["A4.2"],"title":"Ardillas a ambos lados de un cañón","blocks":[{"k":"p","v":"Dos especies de ardilla muy emparentadas viven en bordes opuestos de un cañón profundo que las ardillas no pueden cruzar. Ambas descienden de una población ancestral que vivía allí antes de que se formara el cañón."}],"parts":[{"l":"a","m":1,"q":"Indique el tipo de especiación que se muestra.","pts":["especiación *alopátrica* (por aislamiento geográfico)"],"hl":true,"mod":""},{"l":"b","m":3,"q":"Describa cómo evolucionaron las dos especies a partir del ancestro común.","pts":["la formación del cañón dividió la población ancestral en dos / causó *aislamiento geográfico*","dejó de haber *flujo génico* / cruzamiento entre las ardillas de los dos bordes","en cada borde actuaron *presiones de selección* diferentes (p. ej., clima, alimento, depredadores)","surgieron mutaciones distintas / hubo deriva genética en cada población","las frecuencias alélicas divergieron a lo largo de muchas generaciones","se produjo *aislamiento reproductivo*: ya no pueden producir descendencia fértil juntas, así que son especies distintas"],"hl":false,"mod":"La formación del cañón dividió la población ancestral en dos y, como las ardillas no pueden cruzarlo, dejó de haber flujo génico entre ellas. En cada borde actuaron presiones de selección diferentes y surgieron mutaciones distintas, por lo que las frecuencias alélicas de las dos poblaciones divergieron durante muchas generaciones. Finalmente se produjo aislamiento reproductivo: ya no pueden producir descendencia fértil juntas y son dos especies distintas."},{"l":"c","m":2,"q":"Explique cómo la deforestación podría causar un declive en la población de una de estas especies.","pts":["*pérdida de hábitat*: menos árboles donde anidar / refugiarse","pérdida de *fuentes de alimento* (semillas, piñas, frutos secos de los árboles), así que aumenta la competencia","mayor exposición a los *depredadores* al haber menos cobertura","la fragmentación aísla subpoblaciones pequeñas / la población no puede escapar porque el cañón limita su área de distribución","en consecuencia sobreviven y se reproducen menos individuos / la tasa de mortalidad supera a la de natalidad"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Indique otra causa de la actual crisis de biodiversidad.","pts":["sobreexplotación (caza / pesca excesiva) / contaminación / *especies invasoras*","cambio climático / enfermedades / urbanización / agricultura intensiva (monocultivos)"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":6},{"qid":2013,"p":"2","t":"D3.2","also":["D1.3","B2.3"],"title":"Hemofilia y edición génica","blocks":[{"k":"p","v":"La hemofilia A es un trastorno ligado al sexo causado por un alelo recesivo (Xʰ) de un gen del cromosoma X. Las personas con hemofilia carecen de un factor de coagulación funcional."}],"parts":[{"l":"a","m":3,"q":"Usando un cuadro de Punnett, deduzca la probabilidad de que un hijo varón de una mujer portadora y un hombre no afectado tenga hemofilia.","pts":["genotipos de los progenitores: madre XᴴXʰ, padre XᴴY","gametos: madre Xᴴ y Xʰ; padre Xᴴ e Y","cuadro de Punnett correcto con descendencia XᴴXᴴ, XᴴXʰ, XᴴY y XʰY","de los hijos varones posibles (XᴴY y XʰY), uno de cada dos es XʰY: probabilidad = *0,5* / 50 %","ninguna hija está afectada; la mitad de las hijas son portadoras / para cualquier descendiente, la probabilidad es 0,25"],"hl":false,"mod":"La madre portadora es XᴴXʰ y el padre no afectado es XᴴY. La madre produce gametos Xᴴ y Xʰ, y el padre gametos Xᴴ e Y. El cuadro de Punnett da cuatro combinaciones igualmente probables: XᴴXᴴ, XᴴXʰ, XᴴY y XʰY. Los hijos varones reciben el Y del padre, así que pueden ser XᴴY o XʰY; uno de cada dos es XʰY, de modo que la probabilidad de que un hijo varón tenga hemofilia es 0,5 (50 %)."},{"l":"b","m":1,"q":"Explique por qué la hemofilia es mucho más frecuente en los hombres que en las mujeres.","pts":["los hombres solo tienen un cromosoma X (el Y no tiene este gen), así que una sola copia del alelo recesivo causa la enfermedad","las mujeres necesitan dos copias del alelo recesivo, lo que es poco probable porque el alelo es raro"],"hl":false,"mod":""},{"l":"c","m":1,"q":"Distinga entre una mutación por deleción y una por inserción.","pts":["la deleción elimina uno o más nucleótidos / bases de la secuencia; la inserción añade uno o más"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Explique cómo podría usarse CRISPR-Cas9 para corregir el alelo defectuoso.","pts":["se diseña un *ARN guía* con una secuencia complementaria a la secuencia diana del gen defectuoso","el ARN guía se une a Cas9 y la dirige a la secuencia diana por complementariedad de bases","*Cas9* es una endonucleasa que corta las dos cadenas del ADN en ese punto","se aporta un molde de ADN con la secuencia correcta del gen","la célula repara el corte copiando el molde, así que el alelo defectuoso se sustituye por el correcto","las células editadas expresan el gen corregido y producen un factor de coagulación funcional"],"hl":true,"mod":"Se diseña un ARN guía con una secuencia complementaria a la secuencia diana del gen defectuoso. Este ARN se une a la enzima Cas9 y la dirige hasta la secuencia diana por complementariedad de bases, donde Cas9, una endonucleasa, corta las dos cadenas del ADN. Si se aporta un molde de ADN con la secuencia correcta, la célula lo copia al reparar el corte, de modo que el alelo defectuoso se sustituye por el correcto. Las células editadas expresan entonces el gen corregido y producen un factor de coagulación funcional."},{"l":"e","m":1,"q":"Sugiera por qué en estos tratamientos podrían usarse células madre pluripotentes en lugar de multipotentes.","pts":["las células *pluripotentes* pueden diferenciarse en casi cualquier tipo de célula del cuerpo, mientras que las multipotentes solo en unos pocos tipos relacionados","así pueden originar el tipo de célula que fabrica el factor de coagulación (p. ej., células del hígado)"],"hl":false,"mod":""}],"hl":false,"mk":9,"mkSL":6},{"qid":2014,"p":"2","t":"D3.3","also":["D4.3"],"title":"La temperatura a dos escalas","blocks":[{"k":"p","v":"La temperatura corporal central normal de los humanos es de unos 37 °C. La temperatura superficial media del planeta ha subido unos 1,2 °C desde finales del siglo XIX."}],"parts":[{"l":"a","m":2,"q":"Resuma dos respuestas del cuerpo cuando la temperatura central sube por encima de lo normal.","pts":["*vasodilatación* de las arteriolas de la piel: llega más sangre cerca de la superficie y se pierde más calor por radiación","*sudoración*: las glándulas sudoríparas secretan sudor, cuya evaporación elimina calor","el hipotálamo detecta la subida y envía impulsos nerviosos a estos efectores"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Identifique, con una razón, si estas respuestas son retroalimentación positiva o negativa.","pts":["retroalimentación *negativa*","porque contrarrestan el cambio y devuelven la temperatura hacia el punto de ajuste (unos 37 °C)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique cómo la quema de combustibles fósiles ha contribuido al aumento de la temperatura global.","pts":["la combustión libera a la atmósfera *CO₂* procedente de carbono almacenado durante millones de años, así que aumenta su concentración","el CO₂ es un *gas de efecto invernadero*","la superficie terrestre emite radiación de onda larga (infrarroja), que el CO₂ absorbe y reemite, en parte hacia la Tierra","se retiene más calor (efecto invernadero intensificado), así que sube la temperatura media global"],"hl":false,"mod":""},{"l":"d","m":1,"q":"El deshielo del hielo marino deja al descubierto agua oscura. Identifique, con una razón, si esto causa retroalimentación positiva o negativa.","pts":["retroalimentación *positiva*","el agua oscura refleja menos luz solar (menor albedo), así que absorbe más calor y se derrite más hielo: el cambio se amplifica"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Explique un efecto de unos océanos más cálidos sobre los arrecifes de coral.","pts":["el estrés térmico hace que los corales expulsen a sus *zooxantelas* (*blanqueamiento*)","los corales pierden los glúcidos de la fotosíntesis de las zooxantelas, su principal alimento","si el calentamiento se prolonga, los corales mueren","se pierde el hábitat de muchas especies, así que baja la biodiversidad del arrecife"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":2015,"p":"2","t":"B3.1","also":["B3.2"],"title":"Dentro de una hoja","blocks":[{"k":"p","v":"Un estudiante examinó un corte vertical de una hoja de aligustre. De arriba abajo, los tejidos eran: cutícula cerosa, epidermis superior, mesófilo en empalizada, mesófilo esponjoso con espacios de aire y un haz vascular, y epidermis inferior con estomas."}],"parts":[{"l":"a","m":2,"q":"Sugiera funciones de la epidermis superior y del mesófilo en empalizada.","pts":["epidermis superior: secreta la *cutícula* cerosa, que reduce la pérdida de agua / protege frente a patógenos","epidermis superior: es transparente / sin cloroplastos, así que deja pasar la luz al mesófilo","mesófilo en empalizada: principal lugar de la *fotosíntesis*, con células alargadas llenas de cloroplastos","mesófilo en empalizada: situado en la parte superior para absorber la máxima luz"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Explique la función de dos estructuras de la hoja en el intercambio de gases.","pts":["los *estomas* permiten que el CO₂ entre por difusión y que salgan el O₂ y el vapor de agua","las *células oclusivas* abren o cierran los estomas, equilibrando la entrada de CO₂ con la pérdida de agua","los *espacios de aire* del mesófilo esponjoso permiten que los gases difundan rápidamente hacia y desde todas las células","las paredes húmedas de las células del mesófilo dan una gran superficie donde el CO₂ se disuelve antes de entrar en las células"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Indique las funciones del xilema y del floema en la hoja.","pts":["xilema: lleva *agua* e iones minerales a la hoja (para la fotosíntesis / sustituir el agua transpirada)","floema: transporta los productos de la fotosíntesis, sobre todo *sacarosa*, fuera de la hoja hacia los sumideros","el xilema también da soporte a la hoja (nervios lignificados)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Explique por qué aumenta la transpiración en un día ventoso.","pts":["el viento retira el aire húmedo / la capa de vapor de agua que se acumula alrededor de los estomas","se mantiene un *gradiente de concentración* de vapor de agua pronunciado entre el interior de la hoja y el aire exterior","por eso el vapor de agua difunde más rápido a través de los estomas"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":2016,"p":"2","t":"A3.2","also":["A1.2"],"title":"Construir cladogramas","blocks":[{"k":"p","v":"Se construyó un cladograma a partir de las diferencias en la secuencia de aminoácidos de la proteína citocromo c en seis vertebrados."}],"parts":[{"l":"a","m":2,"q":"Resuma qué es la raíz y qué es un nodo de un cladograma.","pts":["raíz: la base del cladograma, que representa el *ancestro común* de todos los organismos incluidos","nodo: un punto de ramificación donde un linaje se divide en dos (o más)","cada nodo representa el *ancestro común hipotético* más reciente de los clados que salen de él / un suceso de especiación"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Discuta el uso de secuencias de aminoácidos como base para construir cladogramas.","pts":["las diferencias en la secuencia se acumulan gradualmente por mutación, así que más diferencias indican un parentesco más lejano","si la tasa de cambio es más o menos constante, sirven de *reloj molecular* para estimar cuándo divergieron los grupos","son datos objetivos y cuantitativos / evitan los errores de la *evolución convergente* en rasgos morfológicos / permiten comparar organismos muy distintos","pero la velocidad de cambio puede variar entre proteínas / linajes / con el tiempo, así que las estimaciones del reloj molecular son aproximadas","el código genético es *degenerado*: algunas mutaciones del ADN no cambian el aminoácido, así que las secuencias de bases dan más información","una sola proteína puede no reflejar la historia evolutiva de todo el organismo / es mejor usar varias secuencias"],"hl":false,"mod":"Las secuencias de aminoácidos son útiles porque las diferencias se acumulan gradualmente por mutación: cuantas más diferencias hay entre dos especies, más lejano es su parentesco, y si la tasa es aproximadamente constante pueden usarse como reloj molecular para estimar cuándo divergieron. Además, son datos objetivos y cuantitativos que no se ven afectados por la evolución convergente, a diferencia de los rasgos morfológicos. Sin embargo, la velocidad de cambio puede variar entre proteínas y linajes, por lo que las fechas son aproximadas, y como el código genético es degenerado, algunas mutaciones del ADN no cambian el aminoácido; por eso las secuencias de bases aportan más detalle que las de aminoácidos."},{"l":"c","m":1,"q":"Identifique otro tipo de datos, además de la secuencia de aminoácidos, que puede usarse para construir un cladograma.","pts":["*secuencias de bases* del ADN / del ARN (p. ej., ARN ribosómico)","rasgos morfológicos / anatómicos (caracteres derivados compartidos)"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Resuma el principio de parsimonia.","pts":["de todos los cladogramas posibles, se elige como el más probable el que requiere el *menor número de cambios* evolutivos / mutaciones para explicar las diferencias observadas"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":2017,"p":"2","t":"C3.2","also":["A2.3"],"title":"Inmunidad y vacunas","blocks":[{"k":"p","v":"El gráfico muestra la concentración de anticuerpos específicos en la sangre de una persona tras una primera exposición a un antígeno (día 0) y una segunda exposición al mismo antígeno (día 40)."},{"k":"chart","type":"line","title":"Concentración de anticuerpos tras dos exposiciones","x":"Tiempo / días","y":"Concentración de anticuerpos / unidades arbitrarias","s":[{"n":"Anticuerpos","pts":[["0",0.0],["5",2.0],["10",10.0],["15",14.0],["20",9.0],["30",4.0],["40",3.0],["45",60.0],["50",120.0],["60",95.0],["70",70.0]]}]}],"parts":[{"l":"a","m":1,"q":"Distinga entre inmunidad innata e inmunidad adaptativa.","pts":["la innata es *inespecífica* (responde igual a todos los patógenos); la adaptativa es *específica* de cada antígeno","la adaptativa desarrolla memoria tras la exposición; la innata no tiene memoria / no cambia con las exposiciones"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique las diferencias entre las respuestas primaria y secundaria que se muestran.","pts":["la respuesta secundaria es más rápida: 5 días después de la exposición hay 60 unidades (día 45), frente a solo 2 unidades en la primaria (día 5)","el pico se alcanza antes: unos *10 días* tras la segunda exposición (día 50) frente a unos *15 días* en la primaria","la respuesta secundaria es mucho mayor: pico de *120* unidades frente a *14* (unas 8–9 veces más)","dura más: 30 días después de la exposición aún quedan 70 unidades, frente a 4 unidades 30 días después de la primaria","la respuesta primaria es lenta porque hay pocos linfocitos B específicos, que deben activarse y formar clones (selección clonal)","en la primaria se forman *células de memoria* que persisten; en la segunda exposición se activan enseguida y se dividen rápidamente en células plasmáticas, que producen más anticuerpos"],"hl":false,"mod":"La respuesta secundaria es más rápida y mayor que la primaria: el pico llega unos 10 días después de la exposición (día 50) en lugar de unos 15 días, y alcanza 120 unidades frente a solo 14. Además dura más, ya que 30 días después aún quedan 70 unidades frente a 4 en la primaria. Esto se debe a que en la primera exposición hay muy pocos linfocitos B específicos del antígeno, que deben activarse y formar clones, lo que lleva tiempo. Durante esa respuesta se forman células de memoria que persisten en el cuerpo; en la segunda exposición se activan enseguida y se dividen rápidamente en células plasmáticas, que secretan más anticuerpos y antes."},{"l":"c","m":2,"q":"Explique por qué una vacuna puede proteger contra una enfermedad.","pts":["la vacuna contiene *antígenos* / patógeno atenuado o inactivado / ARNm que codifica un antígeno, sin causar la enfermedad","desencadena una respuesta inmunitaria primaria: se activan linfocitos B específicos que producen anticuerpos","se forman *células de memoria* que persisten en el cuerpo","si hay infección, una respuesta secundaria rápida y mayor destruye el patógeno antes de que cause síntomas"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Indique el término para una enfermedad infecciosa que puede transmitirse de los animales a los humanos.","pts":["*zoonosis*"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":2018,"p":"2","t":"A2.3","also":["A2.1"],"title":"El fago lambda","blocks":[{"k":"p","v":"El bacteriófago lambda es un virus que infecta a la bacteria Escherichia coli. Tiene una cabeza de proteína que contiene ADN de doble cadena, unida a una cola."}],"parts":[{"l":"a","m":1,"q":"Identifique la parte del virus que rodea su ADN.","pts":["la *cápside* (cubierta de proteína)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Indique una razón por la que normalmente no se considera que los virus estén vivos.","pts":["no están formados por *células* / no tienen citoplasma ni ribosomas","no tienen *metabolismo* propio / solo pueden reproducirse dentro de una célula hospedadora"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique cómo se reproduce el fago lambda en el ciclo lisogénico.","pts":["el fago se fija a receptores específicos de la superficie de *E. coli* e inyecta su ADN en la célula","el ADN del fago se integra en el cromosoma bacteriano y pasa a llamarse *profago*","los genes del fago que producirían nuevos virus no se expresan / quedan reprimidos, así que la bacteria no muere","el profago se *replica* junto con el cromosoma cada vez que la bacteria se divide por fisión binaria","todas las células hijas heredan el profago, así que el número de copias del virus aumenta con la población bacteriana","un estímulo (p. ej., daño en el ADN / radiación UV) puede hacer que el profago se separe y pase al *ciclo lítico*, produciendo nuevos fagos y lisando la célula"],"hl":false,"mod":"El fago lambda se fija a receptores específicos de la superficie de E. coli e inyecta su ADN. En el ciclo lisogénico este ADN se integra en el cromosoma bacteriano como profago, y los genes que producirían nuevos virus se mantienen reprimidos, de modo que la bacteria sigue viva. Cada vez que la bacteria se divide por fisión binaria, el profago se replica junto con el cromosoma, por lo que todas las células hijas lo heredan y el virus se multiplica sin destruir al hospedador. Más tarde, un estímulo como el daño en el ADN puede activar el profago, que pasa al ciclo lítico y produce nuevos fagos."},{"l":"d","m":2,"q":"Resuma pruebas de que los virus pueden haber evolucionado más de una vez.","pts":["los virus son muy diversos en su material genético: ADN o ARN, de cadena simple o doble","tienen estructuras muy distintas (con o sin envoltura, distintas formas de cápside)","no hay ningún gen / rasgo compartido por *todos* los virus, así que no parecen tener un ancestro común","algunos genes virales se parecen más a genes de sus hospedadores que a los de otros virus, lo que sugiere que surgieron por separado a partir de distintos organismos celulares"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":2019,"p":"2","t":"B1.2","also":["B3.3"],"title":"La proteína gigante titina","blocks":[{"k":"p","v":"La titina es la proteína humana más grande que se conoce: un único polipéptido de más de 30 000 aminoácidos. Contiene muchas regiones plegadas que se repiten."}],"parts":[{"l":"a","m":1,"q":"Indique los productos de una reacción de condensación entre dos aminoácidos.","pts":["un *dipéptido* (unido por un enlace peptídico) y una molécula de *agua* (se necesitan ambos)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Describa cómo la diversidad de aminoácidos da a las proteínas una gran variedad de formas.","pts":["hay 20 aminoácidos con *grupos R* distintos (polares, apolares, ácidos, básicos, con azufre)","pueden unirse en cualquier orden y número, así que hay un número enorme de secuencias posibles (20ⁿ para n aminoácidos)","la *secuencia* de aminoácidos determina qué enlaces / interacciones se forman entre grupos R, y por tanto cómo se pliega la proteína","ejemplo: los grupos R hidrofóbicos quedan en el interior de las proteínas globulares y los hidrofílicos en la superficie"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Describa los dos tipos de estructura secundaria de las proteínas.","pts":["*hélice α*: el polipéptido se enrolla en espiral","*lámina β plegada*: tramos del polipéptido se colocan uno junto a otro en zigzag, formando una lámina","ambas se mantienen por *enlaces de hidrógeno* entre los grupos C=O y N–H del esqueleto (no entre grupos R)"],"hl":true,"mod":""},{"l":"d","m":2,"q":"Explique la función de la titina en los sarcómeros.","pts":["la titina es una proteína enorme que actúa como un *muelle* y se extiende desde la línea Z hasta la línea M","cuando el músculo se estira, sus regiones plegadas se despliegan y almacenan *energía elástica*","esta energía ayuda al sarcómero a recuperar su longitud de reposo tras la contracción / relajación","evita que el sarcómero se estire en exceso / mantiene los filamentos de miosina centrados en el sarcómero"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":3},{"qid":2020,"p":"2X","t":"A1.1","also":["D3.3","D4.3"],"title":"Respuesta extensa: el agua y la vida","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma cómo benefician a los seres vivos las propiedades cohesivas del agua.","pts":["las moléculas de agua son *polares* y forman *enlaces de hidrógeno* entre sí, lo que causa la cohesión","en el xilema, la cohesión permite que una columna continua de agua sea arrastrada hacia arriba sin romperse por la tensión de la transpiración","así el agua puede llegar a las hojas de árboles altos sin gasto de ATP por la planta / transporte pasivo","la cohesión produce *tensión superficial*, que permite a algunos organismos (p. ej., zapateros) caminar sobre el agua","la tensión superficial proporciona un hábitat en la superficie del agua (organismos que se adhieren a ella)","junto con la adhesión, la cohesión permite el ascenso del agua por *capilaridad* en el suelo / en paredes celulares"],"hl":false,"mod":"Las moléculas de agua son polares y forman enlaces de hidrógeno entre sí, lo que da lugar a la cohesión. En las plantas, la cohesión permite que la tensión generada por la transpiración arrastre hacia arriba una columna continua de agua por el xilema sin que se rompa, de modo que el agua llega a las hojas de árboles altos sin gasto de ATP. Además, la cohesión produce tensión superficial, que permite a insectos como los zapateros caminar sobre el agua y ofrece un hábitat en la superficie. Junto con la adhesión, también permite el ascenso del agua por capilaridad en el suelo."},{"l":"b","m":4,"q":"Describa cómo el deshielo del hielo marino puede provocar cambios ecológicos.","pts":["*pérdida de hábitat* para especies que usan el hielo para cazar, descansar o criar (p. ej., osos polares, morsas, focas)","los osos polares cazan focas desde el hielo, así que su alimentación y su éxito reproductivo disminuyen","menos algas crecen bajo el hielo, así que hay menos alimento para el *kril* y cambia toda la red trófica (peces, pingüinos, ballenas)","el océano oscuro refleja menos luz que el hielo (*menor albedo*), absorbe más calor y se acelera el calentamiento (retroalimentación positiva)","el agua más cálida / menos salina altera las corrientes oceánicas y el *afloramiento* de nutrientes, reduciendo la productividad","las especies desplazan su área de distribución hacia los polos y especies de aguas templadas invaden y compiten con las especies árticas"],"hl":false,"mod":"El deshielo del hielo marino supone una pérdida de hábitat para especies que lo usan para cazar o criar; por ejemplo, los osos polares cazan focas desde el hielo, así que tienen menos alimento y menor éxito reproductivo. Al haber menos hielo crecen menos algas bajo él, lo que reduce el alimento del kril y afecta a toda la red trófica, desde los peces hasta las ballenas. Además, el océano oscuro refleja menos luz que el hielo, absorbe más calor y acelera el calentamiento, una retroalimentación positiva. Como consecuencia, muchas especies desplazan su área de distribución hacia los polos y especies de aguas templadas compiten con las especies árticas."},{"l":"c","m":7,"q":"Explique cómo la retroalimentación negativa controla el contenido de agua de la sangre.","pts":["los *osmorreceptores* del hipotálamo detectan un aumento de la concentración de solutos de la sangre (p. ej., por deshidratación)","la neurohipófisis (hipófisis posterior) libera *ADH* a la sangre","la ADH actúa sobre las células de la pared del *conducto colector* (y del túbulo contorneado distal)","se insertan más *acuaporinas* en sus membranas plasmáticas, desde vesículas","aumenta la permeabilidad al agua, así que se reabsorbe más agua por ósmosis hacia la médula, que es hipertónica","el agua reabsorbida vuelve a la sangre por los capilares / vasos rectos","se produce un volumen pequeño de orina concentrada","la concentración de solutos de la sangre baja hasta el *punto de ajuste*","los osmorreceptores detectan la corrección y disminuye la secreción de ADH: el cambio revierte el estímulo (*retroalimentación negativa*)","si la sangre está demasiado diluida, se secreta menos ADH, se retiran acuaporinas de la membrana y se reabsorbe menos agua","se produce un gran volumen de orina diluida y la concentración de la sangre sube hasta el punto de ajuste","la sed también se estimula cuando la concentración de solutos es alta, aumentando la ingesta de agua"],"hl":true,"mod":"Cuando la concentración de solutos de la sangre aumenta, por ejemplo por deshidratación, los osmorreceptores del hipotálamo lo detectan y la neurohipófisis libera ADH a la sangre. La ADH actúa sobre las células del conducto colector y hace que se inserten más acuaporinas en sus membranas plasmáticas. Así aumenta la permeabilidad al agua y se reabsorbe más agua por ósmosis hacia la médula hipertónica y de allí a la sangre, de modo que se produce un volumen pequeño de orina concentrada. La concentración de solutos de la sangre vuelve al punto de ajuste y, al detectarlo, el hipotálamo reduce la secreción de ADH; como la respuesta revierte el estímulo, es retroalimentación negativa. Si la sangre está demasiado diluida ocurre lo contrario: se secreta menos ADH, se retiran acuaporinas, se reabsorbe menos agua y se produce mucha orina diluida, hasta que la concentración sube de nuevo al punto de ajuste."}],"hl":false,"mk":15,"mkSL":8},{"qid":2021,"p":"2X","t":"D1.3","also":["D2.1","D2.2"],"title":"Respuesta extensa: los genes y la división celular","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa las causas y las consecuencias de las mutaciones por sustitución de bases.","pts":["errores poco frecuentes durante la replicación del ADN","*mutágenos* químicos, p. ej., sustancias del humo del tabaco","radiación de alta energía: luz UV, rayos X, radiación gamma de isótopos radiactivos","una base se sustituye por otra, así que cambia un solo codón (sin desplazar el marco de lectura)","puede ser *silenciosa* porque el código genético es *degenerado* y el nuevo codón codifica el mismo aminoácido","puede cambiar un aminoácido y alterar el plegamiento y la función de la proteína, p. ej., anemia falciforme (GAG → GTG: glutamato → valina en la hemoglobina)","puede crear un *codón de parada*, así que la proteína queda más corta y normalmente no funciona","en células germinales se transmite a la descendencia; en células somáticas no se hereda, pero puede causar cáncer"],"hl":false,"mod":"Las sustituciones de bases pueden deberse a errores poco frecuentes de la replicación del ADN o a mutágenos, como sustancias químicas del humo del tabaco y radiación de alta energía (UV, rayos X o gamma). En ellas una base se sustituye por otra, de modo que solo cambia un codón. Como el código genético es degenerado, la mutación puede ser silenciosa si el nuevo codón codifica el mismo aminoácido. Si cambia un aminoácido, puede alterarse el plegamiento y la función de la proteína, como en la anemia falciforme, donde GAG pasa a GTG y la valina sustituye al glutamato en la hemoglobina. Si se forma un codón de parada, la proteína queda incompleta. Las mutaciones en células germinales pasan a la descendencia, mientras que las de células somáticas pueden causar cáncer."},{"l":"b","m":4,"q":"Distinga entre la división celular por mitosis y por meiosis.","pts":["mitosis: una división; meiosis: dos divisiones sucesivas","la mitosis produce dos células hijas; la meiosis, cuatro","mitosis: mantiene el número de cromosomas (diploide → diploide); meiosis: lo reduce a la mitad (diploide → *haploide*)","mitosis: células hijas genéticamente idénticas; meiosis: genéticamente distintas","el emparejamiento de homólogos y el *entrecruzamiento* solo ocurren en la meiosis (profase I)","en la meiosis I se separan cromosomas homólogos; en la mitosis se separan cromátidas hermanas","mitosis: crecimiento, reparación de tejidos y reproducción asexual; meiosis: producción de gametos / esporas"],"hl":false,"mod":"La mitosis consiste en una sola división y produce dos células hijas, mientras que la meiosis consiste en dos divisiones sucesivas y produce cuatro. La mitosis mantiene el número de cromosomas, de diploide a diploide, y las células hijas son genéticamente idénticas; la meiosis lo reduce a la mitad, de diploide a haploide, y las células son genéticamente distintas. Solo en la meiosis se emparejan los cromosomas homólogos y hay entrecruzamiento en la profase I, y en la meiosis I se separan los homólogos, mientras que en la mitosis se separan las cromátidas hermanas. La mitosis sirve para el crecimiento, la reparación y la reproducción asexual; la meiosis, para producir gametos."},{"l":"c","m":7,"q":"Explique cómo puede regularse la expresión génica en el nivel de la transcripción.","pts":["la transcripción comienza cuando la *ARN polimerasa* se une al *promotor* del gen","los *factores de transcripción* son proteínas que se unen al promotor / a secuencias reguladoras del ADN","los activadores facilitan la unión de la ARN polimerasa y aumentan la transcripción; los represores la impiden","los potenciadores son secuencias reguladoras, a veces lejos del gen, que al unir activadores aumentan la transcripción","el ADN está enrollado en *histonas* (nucleosomas); cuanto más condensada está la cromatina, menos accesible es para la ARN polimerasa","la *acetilación* de histonas descondensa la cromatina y aumenta la transcripción","la metilación de histonas puede condensar la cromatina y reducir la transcripción","la *metilación del ADN* (de citosinas, sobre todo en los promotores) silencia / reduce la transcripción","estos cambios son *epigenéticos*: modifican la expresión sin cambiar la secuencia de bases y pueden transmitirse a las células hijas","el ambiente (p. ej., dieta, contaminantes, estrés) puede modificar las marcas epigenéticas / explica diferencias entre gemelos monocigóticos","las hormonas esteroideas (p. ej., estrógeno) atraviesan la membrana y se unen a receptores que actúan como factores de transcripción","células distintas expresan conjuntos distintos de genes, lo que permite la diferenciación celular"],"hl":true,"mod":"La transcripción empieza cuando la ARN polimerasa se une al promotor del gen, y esa unión puede regularse de varias formas. Los factores de transcripción son proteínas que se unen al promotor o a secuencias reguladoras: los activadores facilitan la unión de la ARN polimerasa y aumentan la transcripción, mientras que los represores la impiden; los potenciadores, a veces lejos del gen, aumentan la transcripción al unir activadores. Además, el ADN está enrollado en histonas, y cuanto más condensada está la cromatina, menos accesible es. La acetilación de las histonas descondensa la cromatina y aumenta la transcripción, mientras que su metilación puede condensarla y reducirla; la metilación de citosinas del ADN en los promotores silencia los genes. Estos cambios son epigenéticos, porque alteran la expresión sin cambiar la secuencia de bases, se transmiten a las células hijas y pueden verse afectados por el ambiente, lo que explica diferencias entre gemelos monocigóticos. Las hormonas esteroideas, como el estrógeno, se unen a receptores que actúan como factores de transcripción. Así, células distintas expresan genes distintos y se diferencian."}],"hl":false,"mk":15,"mkSL":8},{"qid":2022,"p":"2X","t":"B2.2","also":["B3.1","C3.2"],"title":"Respuesta extensa: trabajar en equipo","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma cómo cooperan los orgánulos para producir y secretar una proteína.","pts":["el gen se *transcribe* en el núcleo y el ARNm sale por los poros nucleares","los ribosomas del *RE rugoso* traducen el ARNm y el polipéptido entra en la luz del RE, donde se pliega","la proteína se transporta en *vesículas* desde el RE hasta el aparato de Golgi","en el *Golgi* se modifica (p. ej., glicosilación) y se empaqueta","las vesículas de secreción se fusionan con la membrana plasmática y liberan la proteína por *exocitosis*","las *mitocondrias* aportan el ATP necesario para la síntesis y el transporte de vesículas"],"hl":true,"mod":"El gen se transcribe en el núcleo y el ARNm sale al citoplasma por los poros nucleares. Los ribosomas del RE rugoso lo traducen y el polipéptido entra en la luz del RE, donde se pliega. Después se transporta en vesículas al aparato de Golgi, que lo modifica, por ejemplo por glicosilación, y lo empaqueta en vesículas de secreción. Estas se fusionan con la membrana plasmática y liberan la proteína por exocitosis, y las mitocondrias aportan el ATP necesario para todo el proceso."},{"l":"b","m":4,"q":"Describa cómo los músculos producen la inspiración.","pts":["los músculos *intercostales externos* se contraen (y los internos se relajan)","la caja torácica se mueve hacia arriba y hacia fuera","el *diafragma* se contrae, se aplana y desciende","los músculos de la pared abdominal se relajan, permitiendo que los órganos abdominales se desplacen hacia abajo","aumenta el *volumen* de la cavidad torácica / de los pulmones","la *presión* en los pulmones baja por debajo de la atmosférica, así que el aire entra hasta igualar las presiones"],"hl":false,"mod":"Durante la inspiración, los músculos intercostales externos se contraen mientras los internos se relajan, y la caja torácica se mueve hacia arriba y hacia fuera. Al mismo tiempo, el diafragma se contrae, se aplana y desciende, y los músculos abdominales se relajan. Como resultado aumenta el volumen de la cavidad torácica, la presión dentro de los pulmones baja por debajo de la presión atmosférica y el aire entra hasta que las presiones se igualan."},{"l":"c","m":7,"q":"Explique cómo distintas células de la sangre colaboran para producir la inmunidad adaptativa.","pts":["los *macrófagos* / fagocitos engloban al patógeno, lo digieren y presentan sus antígenos en su membrana","cada linfocito tiene receptores específicos para un solo antígeno; solo los que tienen receptores complementarios se activan","los *linfocitos T colaboradores* con receptores complementarios se unen al antígeno presentado y se activan","los linfocitos B se unen al antígeno mediante sus anticuerpos de membrana","los linfocitos T colaboradores activados se unen a los linfocitos B específicos y los *activan* (mediante señales químicas)","los linfocitos B activados se dividen por mitosis formando un clon (*selección / expansión clonal*)","la mayoría se diferencian en *células plasmáticas* que secretan grandes cantidades de anticuerpos específicos","los anticuerpos se unen a los antígenos y causan aglutinación / neutralización / marcan al patógeno para la fagocitosis","algunos linfocitos B y T activados se convierten en *células de memoria* de larga vida","ante una segunda infección, las células de memoria producen una respuesta secundaria más rápida y mayor: *inmunidad*"],"hl":false,"mod":"Cuando un patógeno entra en el cuerpo, los macrófagos lo engloban, lo digieren y presentan sus antígenos en su membrana. Cada linfocito tiene receptores para un solo antígeno, así que solo se activan los linfocitos T colaboradores con receptores complementarios, que se unen al antígeno presentado. A la vez, los linfocitos B específicos se unen al antígeno con sus anticuerpos de membrana, y los linfocitos T colaboradores activados se unen a ellos y los activan mediante señales químicas. Los linfocitos B activados se dividen por mitosis y forman un clon, y la mayoría se diferencian en células plasmáticas que secretan grandes cantidades de anticuerpos específicos. Estos anticuerpos se unen a los antígenos y aglutinan o neutralizan a los patógenos, o los marcan para que los fagocitos los destruyan. Algunos linfocitos activados se convierten en células de memoria de larga vida, de modo que, ante una nueva infección por el mismo patógeno, la respuesta secundaria es más rápida y mayor, lo que constituye la inmunidad."}],"hl":false,"mk":15,"mkSL":11},{"qid":2023,"p":"2X","t":"D2.1","also":["A2.2","C4.1"],"title":"Respuesta extensa: células vegetales y animales","blocks":[],"parts":[{"l":"a","m":3,"q":"Distinga entre la estructura de las células vegetales y la de las animales.","pts":["vegetales: *pared celular* de celulosa; animales: sin pared celular","vegetales: cloroplastos (plastos) en muchas células; animales: sin cloroplastos","vegetales: gran vacuola central permanente; animales: vacuolas pequeñas y temporales, si las hay","animales: *centriolos*; la mayoría de las vegetales no los tienen","reserva de glúcidos: almidón en vegetales; glucógeno en animales","vegetales: forma regular y fija; animales: forma variable / a menudo redondeada"],"hl":false,"mod":"Las células vegetales tienen una pared celular de celulosa por fuera de la membrana, que las células animales no tienen, y por eso tienen una forma regular y fija, mientras que las animales tienen forma variable. Muchas células vegetales tienen cloroplastos, ausentes en las animales, y una gran vacuola central permanente, mientras que las animales solo tienen vacuolas pequeñas y temporales. En cambio, las células animales tienen centriolos, que la mayoría de las vegetales no tiene. Además, las vegetales almacenan almidón y las animales glucógeno."},{"l":"b","m":4,"q":"Resuma adaptaciones de los herbívoros para alimentarse de plantas y de las plantas para resistir a los herbívoros.","pts":["mamíferos herbívoros: molares anchos y planos para triturar el material vegetal","insectos: piezas bucales masticadoras para comer hojas / picadoras-chupadoras para extraer savia del floema (p. ej., pulgones)","muchos herbívoros tienen microbios mutualistas en el intestino que digieren la celulosa (p. ej., rumiantes)","algunos herbívoros desintoxican o almacenan las sustancias tóxicas de las plantas (p. ej., la oruga de la mariposa monarca)","plantas: defensas *físicas*, como espinas, pelos y hojas duras","plantas: *compuestos secundarios* tóxicos o de sabor desagradable (p. ej., alcaloides, taninos)","plantas: sustancias que atraen a los depredadores de los herbívoros / látex o resinas que atrapan insectos"],"hl":false,"mod":"Los mamíferos herbívoros tienen molares anchos y planos para triturar el material vegetal, y los insectos tienen piezas bucales masticadoras para comer hojas o picadoras-chupadoras, como los pulgones, para extraer savia del floema. Muchos herbívoros, como los rumiantes, tienen microbios mutualistas en el intestino que digieren la celulosa, y algunos desintoxican o almacenan las toxinas de las plantas. Las plantas, por su parte, se defienden físicamente con espinas, pelos y hojas duras, y químicamente con compuestos secundarios tóxicos o de sabor desagradable, como alcaloides y taninos."},{"l":"c","m":8,"q":"Compare y contraste la mitosis y la citocinesis en las células animales y vegetales.","pts":["en ambas, el ADN se replica en la interfase antes de la mitosis","en ambas, en la profase los cromosomas se condensan, se forma el huso de microtúbulos y se desintegra la envoltura nuclear","en ambas, los cromosomas se alinean en el ecuador en la metafase y las cromátidas hermanas se separan hacia los polos en la anafase","en ambas, la envoltura nuclear se forma de nuevo en la telofase","en ambas se obtienen dos células hijas genéticamente idénticas, entre las que se reparten el citoplasma y los orgánulos","las células animales tienen *centriolos* en los polos del huso; las vegetales no","citocinesis animal: un anillo contráctil de *actina y miosina* se forma bajo la membrana en el ecuador","el anillo estrangula la membrana hacia dentro (surco de división) hasta separar las dos células, de fuera hacia dentro","citocinesis vegetal: vesículas del aparato de Golgi se acumulan en el ecuador y se fusionan formando la *placa celular*, de dentro hacia fuera","las membranas de las vesículas forman las nuevas membranas plasmáticas y se deposita celulosa, que forma una nueva pared celular","la pared celular rígida impide el estrangulamiento, por eso las células vegetales forman una placa celular"],"hl":false,"mod":"La mitosis es esencialmente igual en las células animales y vegetales. En ambas, el ADN se replica en la interfase; en la profase los cromosomas se condensan, se forma el huso de microtúbulos y se desintegra la envoltura nuclear; en la metafase los cromosomas se alinean en el ecuador, en la anafase las cromátidas hermanas se separan hacia los polos y en la telofase se forma de nuevo la envoltura nuclear. En ambas se obtienen dos células hijas genéticamente idénticas. La principal diferencia en la mitosis es que las células animales tienen centriolos en los polos del huso y las vegetales no. La citocinesis, en cambio, es distinta: en las células animales se forma un anillo contráctil de actina y miosina bajo la membrana en el ecuador, que la estrangula hacia dentro formando un surco de división hasta separar las dos células. En las vegetales, la pared celular rígida impide este estrangulamiento, así que vesículas del aparato de Golgi se acumulan en el ecuador y se fusionan formando una placa celular que crece de dentro hacia fuera; sus membranas forman las nuevas membranas plasmáticas y se deposita celulosa, que forma una nueva pared entre las células hijas."}],"hl":false,"mk":15,"mkSL":15},{"qid":2024,"p":"2X","t":"A4.1","also":["D4.1","A3.2"],"title":"Respuesta extensa: pruebas y patrones de la evolución","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa las pruebas de la evolución que aportan las estructuras homólogas.","pts":["las *estructuras homólogas* tienen el mismo plan estructural básico aunque realicen funciones distintas","ejemplo: la *extremidad pentadáctila* del brazo humano, el ala del murciélago / del ave, la aleta de la ballena y la pata del caballo","tienen los mismos huesos en la misma disposición: húmero, radio y cúbito, carpos, metacarpos y falanges (cinco dígitos)","no habría razón funcional para usar el mismo plan en funciones tan distintas (volar, nadar, agarrar, correr) si no compartieran un *ancestro común*","las diferencias en la forma / el tamaño de los huesos se deben a la selección natural en hábitats distintos (*evolución divergente* / radiación adaptativa)","las *estructuras vestigiales* (p. ej., la pelvis reducida de la ballena) también indican ascendencia común","se distinguen de las estructuras análogas (p. ej., alas de insecto y de ave), que tienen funciones similares pero origen distinto por evolución convergente"],"hl":false,"mod":"Las estructuras homólogas tienen el mismo plan básico aunque desempeñen funciones distintas. El ejemplo clásico es la extremidad pentadáctila: el brazo humano, el ala del murciélago y la aleta de la ballena contienen los mismos huesos (húmero, radio, cúbito, carpos, metacarpos y falanges) en la misma disposición. Como no hay razón funcional para que estructuras usadas para volar, nadar o agarrar compartan el mismo plan, la explicación es que descienden de un ancestro común. Las diferencias de forma y tamaño se deben a que la selección natural las modificó para funciones distintas, es decir, a evolución divergente o radiación adaptativa."},{"l":"b","m":3,"q":"Resuma las condiciones necesarias para aplicar la ecuación de Hardy-Weinberg y cómo se usa.","pts":["condiciones: población *muy grande* y *apareamiento al azar*","condiciones: sin mutación, sin migración (flujo génico) y sin selección natural / todos los genotipos con igual éxito reproductivo","ecuaciones: p + q = 1 (frecuencias alélicas) y *p² + 2pq + q² = 1* (frecuencias genotípicas)","a partir de la frecuencia de homocigotos recesivos (q²) se calcula q, luego p, y así la frecuencia de *portadores* heterocigotos (2pq)","si las frecuencias observadas difieren de las esperadas / cambian entre generaciones, la población *está evolucionando* (no se cumple alguna condición)"],"hl":true,"mod":"La ecuación de Hardy-Weinberg solo se aplica a una población muy grande, con apareamiento al azar y sin mutación, migración ni selección natural. En ese caso, p + q = 1 para las frecuencias alélicas y p² + 2pq + q² = 1 para las genotípicas. Se usa, por ejemplo, para calcular la frecuencia de portadores (2pq) a partir de la frecuencia de homocigotos recesivos (q²), y si las frecuencias observadas no coinciden con las esperadas se deduce que la población está evolucionando."},{"l":"c","m":8,"q":"Explique cómo se construyen los cladogramas y cómo se usan en la clasificación.","pts":["un *clado* es un grupo formado por un ancestro común y todos sus descendientes","se comparan las *secuencias de bases* del ADN / las secuencias de aminoácidos de proteínas (o rasgos morfológicos) entre especies","se buscan *caracteres derivados compartidos*, que indican que los grupos que los poseen descienden de un ancestro común","cuantas menos diferencias de secuencia, más estrecho es el parentesco y más reciente el punto de ramificación","las diferencias se acumulan a un ritmo aproximadamente constante (*reloj molecular*), lo que permite estimar el momento de divergencia","cada *nodo* representa un ancestro común hipotético / un suceso de especiación; la raíz es el ancestro de todo el grupo","se elige el árbol que requiere el menor número de cambios (*parsimonia*), normalmente con programas informáticos","los cladogramas son *hipótesis* sobre las relaciones evolutivas y pueden revisarse con nuevas pruebas","en clasificación se busca que cada grupo taxonómico sea un clado / clasificación natural, que refleja la historia evolutiva y permite predecir rasgos","los cladogramas han llevado a *reclasificaciones*: p. ej., más de la mitad de las especies de la familia de las escrofulariáceas se trasladaron a otras familias","los grupos tradicionales que no son clados (p. ej., «reptiles» sin las aves) se dividen o se fusionan para que todos los grupos sean clados"],"hl":true,"mod":"Un clado es un grupo formado por un ancestro común y todos sus descendientes, y un cladograma muestra las relaciones entre clados. Para construirlo se comparan secuencias de bases del ADN o de aminoácidos de proteínas entre especies y se buscan caracteres derivados compartidos. Cuantas menos diferencias hay entre dos especies, más estrecho es su parentesco y más reciente es su punto de ramificación; como las mutaciones se acumulan a un ritmo aproximadamente constante, el número de diferencias funciona como reloj molecular. Cada nodo representa un ancestro común hipotético y, entre los árboles posibles, se elige el que requiere menos cambios, según el principio de parsimonia. Como los cladogramas son hipótesis, pueden cambiar con nuevas pruebas. En clasificación se usan para que los grupos taxonómicos sean clados y reflejen la historia evolutiva; por eso han provocado reclasificaciones, como el traslado de más de la mitad de las especies de la familia de las escrofulariáceas a otras familias, o la inclusión de las aves dentro del clado de los reptiles."}],"hl":false,"mk":15,"mkSL":4},{"qid":2025,"p":"2X","t":"C1.3","also":["C1.2","B4.2"],"title":"Respuesta extensa: la energía en las células","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique las propiedades del ATP que lo hacen adecuado para distribuir energía en las células.","pts":["es *soluble* en agua, así que se mueve con facilidad por el citoplasma hasta donde se necesita energía","es *estable* al pH del citoplasma / no se hidroliza espontáneamente, así que la energía queda almacenada hasta que se necesita","no atraviesa libremente la bicapa de fosfolípidos (tiene carga / es hidrofílico), así que se queda dentro de la célula","la hidrólisis del fosfato terminal (ATP → ADP + Pi) libera una cantidad de energía adecuada para los procesos celulares","la energía se libera rápidamente, controlada por enzimas, y en pequeñas cantidades según se necesita (se desperdicia poca como calor)","el ADP se vuelve a fosforilar rápidamente a ATP en la respiración celular / fotosíntesis, así que se recicla"],"hl":false,"mod":"El ATP es soluble en agua, de modo que se desplaza con facilidad por el citoplasma hasta los lugares donde se necesita energía. Es estable al pH celular y no se hidroliza espontáneamente, por lo que guarda la energía hasta que una enzima lo hidroliza. Como tiene carga, no atraviesa libremente la membrana y se queda dentro de la célula. Al hidrolizarse el fosfato terminal y formarse ADP y fosfato se libera rápidamente una cantidad de energía adecuada para procesos como la contracción muscular o el transporte activo, sin desperdiciar mucha como calor. Además, el ADP se vuelve a fosforilar rápidamente a ATP durante la respiración celular, de modo que el ATP se recicla continuamente."},{"l":"b","m":7,"q":"Describa cómo las células vegetales usan la energía luminosa para producir ATP.","pts":["la clorofila y los pigmentos accesorios de los *fotosistemas* de las membranas tilacoidales absorben la luz","los pigmentos, agrupados en complejos captadores de luz, transfieren la energía al *centro de reacción* (par especial de clorofila a)","en el centro de reacción se excitan electrones y el fotosistema II los emite (fotoactivación)","los electrones excitados pasan por una *cadena de transporte de electrones* de transportadores en la membrana tilacoidal","la energía liberada se usa para bombear protones del estroma a la luz / el espacio del tilacoide","la *fotólisis* del agua en el fotosistema II repone los electrones y libera O₂ (producto de desecho) y H⁺ en la luz del tilacoide","se forma un gradiente de protones a través de la membrana tilacoidal (concentración alta en la luz del tilacoide)","los protones vuelven al estroma por difusión a través de la *ATP sintasa* (*quimiosmosis*)","la energía se usa para fosforilar ADP + Pi y formar ATP: *fotofosforilación*","los electrones de la cadena llegan al fotosistema I, se reexcitan y reducen NADP (fotofosforilación no cíclica)","en la fotofosforilación cíclica los electrones del fotosistema I vuelven a la cadena, produciendo más ATP sin NADP reducido","el ATP se forma en el estroma, donde se usa en las reacciones independientes de la luz (ciclo de Calvin)"],"hl":true,"mod":"La clorofila y los pigmentos accesorios de los fotosistemas, situados en las membranas tilacoidales, absorben la luz. Estos pigmentos están agrupados en complejos captadores de luz que transfieren la energía al centro de reacción, donde se excitan electrones de un par especial de clorofila a. El fotosistema II emite estos electrones excitados, que pasan por una cadena de transporte de electrones en la membrana tilacoidal. Los electrones que pierde el fotosistema II se reponen mediante la fotólisis del agua, que libera oxígeno como desecho y protones en la luz del tilacoide.\nAl pasar los electrones de un transportador a otro se libera energía que se usa para bombear protones desde el estroma hacia la luz del tilacoide. Así se forma un gradiente de protones, que vuelven al estroma difundiendo a través de la ATP sintasa. Esta quimiosmosis aporta la energía para fosforilar ADP y formar ATP, proceso llamado fotofosforilación. Los electrones llegan después al fotosistema I, se reexcitan y reducen NADP; en la fotofosforilación cíclica, en cambio, vuelven a la cadena y se produce más ATP. El ATP queda en el estroma, donde se usa en el ciclo de Calvin."},{"l":"c","m":5,"q":"Compare y contraste cómo obtienen energía distintos tipos de heterótrofos.","pts":["semejanza: todos los heterótrofos obtienen compuestos de carbono (y su energía) de otros organismos, vivos o muertos; no pueden fabricarlos a partir de carbono inorgánico","semejanza: todos liberan la energía de esos compuestos mediante la *respiración celular* para producir ATP","semejanza: todos deben digerir moléculas grandes (polímeros) en moléculas pequeñas y solubles para absorberlas","los animales holozoicos *ingieren* el alimento, lo digieren internamente en el tubo digestivo, absorben los productos y egestan los restos","los *saprótrofos* (hongos, bacterias) secretan enzimas sobre la materia orgánica muerta (digestión *externa*) y absorben los productos","los *detritívoros* (por ejemplo, lombrices) ingieren materia orgánica muerta y la digieren internamente","diferencia: los consumidores se alimentan de organismos vivos (o recién muertos), mientras que saprótrofos y detritívoros usan materia orgánica muerta","los parásitos obtienen alimento de un hospedador vivo, al que normalmente perjudican","los *mixótrofos* (por ejemplo, *Euglena*) pueden hacer fotosíntesis cuando hay luz y también obtener compuestos de carbono de forma heterótrofa"],"hl":false,"mod":"Todos los heterótrofos obtienen compuestos de carbono, y con ellos energía, de otros organismos, ya que no pueden fabricarlos a partir de CO₂. En todos los casos deben digerir las moléculas grandes en moléculas pequeñas y solubles para absorberlas, y luego liberan su energía mediante la respiración celular para producir ATP. La diferencia está en la fuente y en dónde ocurre la digestión. Los animales holozoicos ingieren organismos vivos o recién muertos y los digieren internamente, egestando los restos. Los detritívoros, como las lombrices, también ingieren y digieren internamente, pero su alimento es materia orgánica muerta. Los saprótrofos, como los hongos y muchas bacterias, también usan materia muerta, pero secretan enzimas sobre ella y absorben los productos, es decir, la digestión es externa. Los parásitos obtienen su alimento de un hospedador vivo, y los mixótrofos, como Euglena, pueden además hacer fotosíntesis cuando hay luz."}],"hl":false,"mk":15,"mkSL":8},{"qid":3000,"p":"2X","t":"A2.2","also":["B3.2"],"title":"Respuesta extensa: microscopía y diversidad de células","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Compare y contraste la microscopía óptica y la microscopía electrónica.","pts":["ambas producen imágenes ampliadas / en ambas aumento = tamaño de la imagen ÷ tamaño real","ambas pueden usar tinciones o marcadores para resaltar estructuras","el microscopio electrónico tiene mucha mayor *resolución* (los electrones tienen menor longitud de onda que la luz)","el microscopio electrónico permite mayores aumentos / muestra la ultraestructura (ribosomas, membranas)","el microscopio óptico permite observar células *vivas*; en el electrónico las muestras están muertas / en el vacío","el óptico da imágenes en color; el electrónico, en blanco y negro (el color se añade después)","el óptico es más barato, portátil y su preparación de muestras es más sencilla","técnicas modernas de microscopía electrónica: criofractura / criomicroscopía electrónica; en la óptica: tinciones fluorescentes / inmunofluorescencia"],"mod":"Ambos tipos de microscopio producen imágenes ampliadas y en los dos el aumento se calcula como tamaño de la imagen dividido por el tamaño real. La diferencia clave es la resolución: como los electrones tienen una longitud de onda mucho menor que la luz, el microscopio electrónico distingue estructuras muy próximas y revela la ultraestructura, como ribosomas o membranas, con aumentos mucho mayores. En cambio, el microscopio óptico permite observar células vivas y en color, mientras que en el electrónico las muestras están muertas porque se observan en el vacío y la imagen es en blanco y negro. Además, el óptico es más barato y su preparación es sencilla."},{"l":"b","m":5,"hl":false,"q":"Resuma cómo un organismo unicelular como Paramecium realiza las funciones de la vida.","pts":["*nutrición*: ingiere alimento por endocitosis y lo encierra en vacuolas alimenticias","digiere el alimento con enzimas de los lisosomas / vacuolas digestivas","*metabolismo*: las reacciones catalizadas por enzimas ocurren en el citoplasma / respiración celular en las mitocondrias","*excreción*: los desechos metabólicos (CO₂, amoníaco) salen por difusión a través de la membrana","*homeostasis*: las vacuolas contráctiles expulsan el exceso de agua que entra por ósmosis","*movimiento*: el batido de los cilios lo desplaza","*respuesta a estímulos*: invierte el batido de los cilios al chocar con un obstáculo / se acerca al alimento","*crecimiento*: aumenta de tamaño sintetizando sus propias moléculas","*reproducción*: asexual por división (mitosis + citocinesis) / sexual por conjugación"],"mod":"Paramecium, siendo una sola célula, realiza todas las funciones de la vida. Se nutre ingiriendo partículas de alimento por endocitosis, que quedan en vacuolas alimenticias donde las enzimas de los lisosomas las digieren. Su metabolismo ocurre en el citoplasma, y la respiración celular en las mitocondrias aporta ATP. Excreta desechos como CO₂ y amoníaco por difusión a través de la membrana. Mantiene la homeostasis gracias a las vacuolas contráctiles, que expulsan el agua que entra por ósmosis. Se mueve con el batido de los cilios y responde a estímulos invirtiendo ese batido al chocar con un obstáculo. Crece sintetizando moléculas y se reproduce asexualmente por división celular."},{"l":"c","m":7,"hl":false,"q":"Explique por qué algunas células se consideran atípicas, relacionando su estructura con su función.","pts":["la *teoría celular* considera la célula típica como una unidad con un solo núcleo","los *glóbulos rojos* (eritrocitos) maduros de mamíferos no tienen núcleo","sin núcleo (ni mitocondrias) queda más espacio para la *hemoglobina* / transportan más oxígeno","forma bicóncava: gran superficie para la difusión del oxígeno / flexibles para pasar por los capilares","sin núcleo no pueden dividirse ni reparar proteínas, por eso viven unos 120 días","los *tubos cribosos* del floema pierden el núcleo y casi todos los orgánulos","así ofrecen menos resistencia al flujo de la savia elaborada / placas cribosas permiten el paso entre células","dependen de las *células acompañantes*, unidas por plasmodesmos, que les aportan ATP y proteínas","las *fibras musculares esqueléticas* son multinucleadas, formadas por fusión de células","son muy largas y necesitan muchos núcleos para producir las proteínas de toda la fibra","las *hifas aseptadas* de hongos tienen muchos núcleos en un citoplasma continuo, lo que facilita el crecimiento y el transporte por la hifa"],"mod":"La teoría celular toma como modelo una célula con un único núcleo, pero varias células especializadas se apartan de ese modelo, y su estructura atípica se explica por su función. Los glóbulos rojos maduros de los mamíferos pierden el núcleo y las mitocondrias, lo que deja más espacio para la hemoglobina y aumenta el transporte de oxígeno; su forma bicóncava aumenta la superficie para la difusión y su flexibilidad les permite pasar por los capilares. El coste es que no pueden dividirse ni repararse, por lo que viven unos 120 días. Los tubos cribosos del floema también pierden el núcleo y casi todos los orgánulos, de modo que la savia elaborada fluye con poca resistencia a través de las placas cribosas; por eso dependen de las células acompañantes, conectadas por plasmodesmos, que les suministran ATP y proteínas. En el extremo opuesto, las fibras musculares esqueléticas se forman por fusión de células y son multinucleadas: al ser muy largas, necesitan muchos núcleos para mantener la síntesis de proteínas en toda la fibra. Las hifas aseptadas de los hongos también tienen muchos núcleos en un citoplasma continuo, lo que facilita el crecimiento rápido de la hifa."}],"hl":false,"mk":16,"mkSL":16},{"qid":3001,"p":"2X","t":"A3.1","also":["A4.1"],"title":"Respuesta extensa: especies y genomas","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Resuma el sistema binomial de nomenclatura de las especies.","pts":["cada especie recibe un nombre de dos partes: *género* + epíteto específico","el género se escribe con mayúscula inicial y la especie en minúscula","se escribe en cursiva (o subrayado si se escribe a mano)","ejemplo: Homo sapiens / tras la primera mención el género puede abreviarse (H. sapiens)","es un sistema *internacional*: el mismo nombre en todos los idiomas, evita la confusión de los nombres comunes","cada nombre corresponde a una sola especie / especies del mismo género están emparentadas","lo acuerdan los científicos en congresos internacionales / se basa en el latín"],"mod":"En el sistema binomial cada especie recibe un nombre formado por dos partes: el género, escrito con mayúscula inicial, y el epíteto específico, en minúscula, ambos en cursiva o subrayados si se escriben a mano, como en Homo sapiens. Después de la primera mención el género puede abreviarse (H. sapiens). Es un sistema internacional acordado por los científicos, de modo que el mismo nombre se usa en todos los idiomas y se evita la confusión de los nombres comunes; además, cada nombre corresponde a una sola especie y el género indica parentesco."},{"l":"b","m":5,"hl":false,"q":"Explique por qué puede ser difícil decidir si dos poblaciones pertenecen a la misma especie o a especies distintas.","pts":["según el *concepto biológico de especie*, son la misma especie si pueden cruzarse y tener descendencia fértil","cuando dos poblaciones quedan aisladas, *divergen* de forma gradual","no hay un momento concreto en que pasen a ser especies distintas","poblaciones separadas geográficamente nunca se encuentran, así que no se puede comprobar si se cruzarían","algunas especies distintas forman *híbridos* / la fertilidad de los híbridos puede ser parcial","no se puede aplicar a organismos con reproducción asexual (por ejemplo, bacterias)","tampoco a especies extintas / fósiles","ejemplo: chimpancés y bonobos, separados por el río Congo, se consideran especies distintas aunque pueden producir híbridos en cautividad"],"mod":"Según el concepto biológico de especie, dos poblaciones son la misma especie si pueden cruzarse y tener descendencia fértil, pero este criterio es difícil de aplicar. Cuando dos poblaciones quedan aisladas divergen poco a poco, y no existe un momento concreto en que pasen a ser especies distintas. Si están separadas geográficamente nunca se encuentran, así que no se puede comprobar si se cruzarían en la naturaleza; por ejemplo, chimpancés y bonobos, separados por el río Congo, se consideran especies distintas aunque en cautividad pueden producir híbridos. Además, algunas especies forman híbridos con fertilidad parcial, y el criterio no puede aplicarse a organismos asexuales ni a especies extintas conocidas solo por fósiles."},{"l":"c","m":7,"hl":false,"q":"Discuta el uso de la secuenciación del genoma completo en la investigación biológica y la medicina.","pts":["*genoma* = toda la información genética de un organismo","el tamaño del genoma varía mucho y no se corresponde con la complejidad del organismo / gran parte es ADN *no codificante*","los individuos de una especie comparten casi todo el genoma, pero difieren en *SNP* (unidad y diversidad)","la secuenciación es ahora mucho más rápida y barata, lo que permite secuenciar muchos individuos y especies","comparar genomas revela relaciones *evolutivas*: secuencias más parecidas = ancestro común más reciente","permite identificar genes / alelos asociados a enfermedades","*medicina personalizada*: elegir fármacos o dosis según el genoma del paciente","pero muchas variantes solo aumentan el riesgo / la relación genotipo-enfermedad suele ser probabilística","genera enormes cantidades de datos difíciles de almacenar e interpretar","problemas éticos: privacidad, uso por aseguradoras o empleadores / discriminación","puede revelar hallazgos inesperados que causen ansiedad / afecten a familiares","el coste sigue siendo alto para muchos sistemas de salud"],"mod":"El genoma es toda la información genética de un organismo, y hoy puede secuenciarse completo de forma mucho más rápida y barata que antes. Esto ha mostrado que el tamaño del genoma varía mucho y no se corresponde con la complejidad, porque gran parte es ADN no codificante, y que los individuos de una especie comparten casi todo el genoma pero difieren en SNP. En investigación, comparar genomas permite deducir relaciones evolutivas, ya que cuanto más parecidas son las secuencias más reciente es el ancestro común. En medicina, permite identificar alelos asociados a enfermedades y aplicar una medicina personalizada, eligiendo fármacos o dosis según el genoma del paciente. Sin embargo, tiene límites: muchas variantes solo aumentan el riesgo de enfermedad, de modo que la información es probabilística; se generan enormes cantidades de datos difíciles de interpretar; y surgen problemas éticos de privacidad y posible discriminación por aseguradoras o empleadores, además de hallazgos inesperados que pueden causar ansiedad o afectar a familiares. En conjunto, es una herramienta muy valiosa, siempre que se use con regulación y asesoramiento genético."}],"hl":false,"mk":16,"mkSL":16},{"qid":3002,"p":"2X","t":"A4.2","also":["D4.2"],"title":"Respuesta extensa: la crisis de la biodiversidad","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Distinga entre los tres componentes de la biodiversidad.","pts":["*diversidad de ecosistemas*: variedad de hábitats / ecosistemas en una zona o en el planeta","ejemplo: bosque, humedal y pradera en una misma región","*diversidad de especies*: número de especies distintas (y su abundancia relativa)","ejemplo: número de especies de aves en un bosque","*diversidad genética*: variedad de alelos dentro de una especie / del acervo génico","ejemplo: distintas variedades de una especie cultivada","los tres niveles dependen entre sí: perder ecosistemas reduce especies y diversidad genética"],"mod":"La biodiversidad tiene tres componentes. La diversidad de ecosistemas es la variedad de hábitats o ecosistemas de una región o del planeta, por ejemplo bosques, humedales y praderas. La diversidad de especies es el número de especies distintas y su abundancia relativa, como el número de especies de aves de un bosque. La diversidad genética es la variedad de alelos en el acervo génico de una especie, por ejemplo las distintas variedades de un cultivo. Los tres niveles están relacionados: al perder ecosistemas se pierden especies y diversidad genética."},{"l":"b","m":5,"hl":false,"q":"Describa las pruebas de que existe una crisis de la biodiversidad.","pts":["la tasa actual de extinción es muy superior a la *tasa de fondo* del registro fósil","evaluaciones de especies como la *Lista Roja de la UICN* clasifican el riesgo de extinción","el número de especies amenazadas en esas evaluaciones ha aumentado con el tiempo","*censos de poblaciones* repetidos muestran descensos del tamaño de muchas poblaciones","la *ciencia ciudadana* (conteos de aves, insectos) aporta muchos datos de zonas amplias","imágenes de satélite muestran la pérdida de superficie de bosques y humedales","las pruebas son fiables solo si se usan métodos estandarizados y repetidos durante muchos años"],"mod":"Hay varias pruebas de una crisis de la biodiversidad. La tasa actual de extinción es muy superior a la tasa de fondo que muestra el registro fósil. Las evaluaciones de especies, como la Lista Roja de la UICN, clasifican el riesgo de extinción y muestran que el número de especies amenazadas aumenta. Los censos de poblaciones repetidos durante años revelan descensos en muchas poblaciones, y la ciencia ciudadana, como los conteos de aves, aporta datos de zonas muy amplias. Las imágenes de satélite muestran además la pérdida de bosques y humedales. Estas pruebas son fiables c
