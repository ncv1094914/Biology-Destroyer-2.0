,"predators: keen senses (forward-facing eyes for binocular vision, echolocation, smell) to locate prey","predators: camouflage to stalk / venom / hunting in groups","prey: *camouflage* / mimicry to avoid detection","prey: eyes on the side of the head for a wide field of view / speed to escape","prey: *warning colouration* linked to toxins / bad taste, spines or shells","prey: living in groups (more eyes watching, dilution effect)"],"hl":false,"mod":"Predators have adaptations for locating and catching prey: keen senses, such as forward-facing eyes giving binocular vision to judge distance, speed to give chase, as in the cheetah, and sharp teeth or claws to kill; some use camouflage to stalk or venom. Prey, by contrast, have adaptations for avoiding detection or capture: camouflage, eyes on the sides of the head giving a wide field of view, and speed to escape. Others have toxins and warning colouration that predators learn to avoid, or live in groups, where more individuals keep watch and the risk to each one is reduced."},{"l":"c","m":8,"q":"Evaluate methods used to restore and conserve ecosystems.","pts":["*rewilding*: reintroduction of apex predators / keystone species, e.g. wolves in Yellowstone","strength: restores *trophic cascades* (fewer deer, recovery of riverside vegetation) / natural processes without continuous intervention","limitation: conflict with farmers / unpredictable outcomes / needs large areas and long time scales","*in situ* conservation: nature reserves protect the habitat and all species with their interactions","limitation of reserves: they may be small / isolated and need management and protection from poaching","*corridors* link fragmented habitats and allow gene flow","removal of *invasive species* allows native species to recover, although it is expensive and sometimes impossible to complete","*ex situ* conservation: seed banks, zoos and botanic gardens preserve genetic material and allow captive breeding for reintroduction","limitation of ex situ: small populations with low *genetic diversity* / loss of natural behaviour / does not conserve the ecosystem","sustainable fishing / hunting quotas and pollution control (e.g. reducing fertilizer to prevent eutrophication)","success depends on long-term monitoring, funding and the support / involvement of local people","justified conclusion: no single method is enough; combining in situ (the priority) with ex situ as a back-up is most effective"],"hl":false,"mod":"Rewilding, such as the reintroduction of wolves to Yellowstone, can restore trophic cascades: as the deer population fell, riverside vegetation recovered and the ecosystem came to function without continuous intervention. However, it causes conflict with farmers, needs large areas and its results are slow and unpredictable. In situ conservation in reserves protects the whole habitat and the interactions between species, and corridors reduce fragmentation and allow gene flow, although many reserves are small and need protection. Removing invasive species allows native species to recover, but it is expensive and hard to complete. Ex situ conservation in seed banks and zoos preserves genetic material and allows captive breeding for reintroduction, but populations are small with low genetic diversity, may lose natural behaviour, and the ecosystem itself is not conserved. Sustainable harvesting quotas and pollution control tackle the causes of decline. In conclusion, the success of every method depends on monitoring and local support, and the most effective approach is to combine in situ conservation as the priority with ex situ conservation as a back-up."}],"hl":false,"mk":16,"mkSL":16},{"qid":262,"p":"2X","t":"C1.1","also":["C1.2"],"title":"Extended response: enzymes and metabolism","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe the induced-fit model of enzyme action.","pts":["the substrate collides with the enzyme (random molecular motion) and binds to the *active site*","initially the shape of the active site is not exactly complementary to the substrate","binding of the substrate causes the active site / enzyme to change shape slightly so it fits the substrate more closely (*induced fit*)","an enzyme–substrate complex is formed","the change in shape strains / weakens bonds in the substrate","this lowers the *activation energy*, so the reaction happens faster","the products are released and the active site returns to its original shape","the enzyme is unchanged and can be reused / the model explains why some enzymes act on several similar substrates"],"hl":false,"mod":"The substrate collides with the enzyme because of random molecular motion and binds to the active site, whose shape is initially not exactly complementary. On binding, the active site changes shape slightly and fits the substrate more closely: this is induced fit, and an enzyme–substrate complex forms. The change in shape strains and weakens bonds in the substrate, which lowers the activation energy and speeds up the reaction. Finally the products are released, the active site returns to its original shape and the enzyme, unchanged, can be used again."},{"l":"b","m":4,"q":"Explain how metabolic pathways can be controlled.","pts":["metabolic pathways are chains / cycles of reactions and each step is catalysed by a *specific enzyme*","the rate of the pathway depends on the amount / activity of its enzymes (e.g. by regulating expression of their genes)","*end-product inhibition* / feedback inhibition: the end product inhibits the first enzyme of the pathway","the end product binds to an *allosteric site* on the enzyme, not to the active site","this changes the shape of the active site so the substrate can no longer bind (non-competitive inhibition)","the inhibition is reversible: when the end-product concentration falls, it detaches and the pathway restarts","so the pathway is switched off when the product is abundant, and energy / substrates are not wasted nor intermediates accumulated","example: isoleucine inhibits threonine deaminase, the first enzyme of the threonine-to-isoleucine pathway"],"hl":false,"mod":"A metabolic pathway is a chain of reactions in which each step is catalysed by a specific enzyme, so the pathway can be controlled by regulating its enzymes. The main mechanism is end-product inhibition: the end product of the pathway binds to an allosteric site on the first enzyme, not to the active site. This changes the shape of the active site so the substrate can no longer bind, which is non-competitive inhibition. Because binding is reversible, when there is plenty of end product the pathway is switched off and energy and substrates are not wasted, and when the product is used up and its concentration falls, it detaches from the enzyme and the pathway restarts. An example is isoleucine, which inhibits threonine deaminase."},{"l":"c","m":8,"q":"Explain the stages of aerobic respiration that occur in the mitochondrion.","pts":["in the presence of oxygen, pyruvate from glycolysis is transported into the mitochondrial *matrix*","link reaction: pyruvate is *decarboxylated* (CO₂ released) and oxidised (hydrogen removed, NAD reduced)","the acetyl group combines with coenzyme A to form *acetyl CoA*","Krebs cycle (in the matrix): the acetyl group (2C) joins a 4C compound (oxaloacetate) to form a 6C compound (citrate)","the 6C compound is decarboxylated twice, releasing 2 CO₂, and the 4C compound is regenerated","oxidation reactions in the cycle transfer hydrogen / electrons to NAD and FAD: *reduced NAD* and reduced FAD are formed","a small amount of ATP (1 ATP) is made per turn of the cycle by substrate-level phosphorylation","reduced NAD and FAD donate electrons to the *electron transport chain* in the inner membrane / cristae","as electrons pass from carrier to carrier, energy is released and used to pump protons from the matrix into the intermembrane space","a proton concentration gradient builds up (the intermembrane space is small, so the gradient forms quickly)","protons diffuse back into the matrix through *ATP synthase* (*chemiosmosis*), which phosphorylates ADP to ATP (oxidative phosphorylation)","*oxygen* is the final electron acceptor: it combines with electrons and protons to form water","by removing electrons, oxygen keeps the chain flowing; without oxygen the chain stops","oxidative phosphorylation produces most of the ATP from respiration; cristae increase the surface area for the chain and ATP synthase"],"hl":false,"mod":"If oxygen is present, pyruvate produced in glycolysis is transported into the mitochondrial matrix. In the link reaction pyruvate is decarboxylated, releasing CO₂, and oxidised, reducing NAD; the remaining acetyl group combines with coenzyme A to form acetyl CoA. In the Krebs cycle, which takes place in the matrix, the 2C acetyl group joins a 4C compound to form a 6C compound. This is decarboxylated twice, releasing 2 CO₂, until the 4C compound is regenerated. Oxidation reactions in the cycle produce reduced NAD and reduced FAD, and 1 ATP is made per turn by substrate-level phosphorylation.\nReduced NAD and FAD donate their electrons to the electron transport chain on the inner membrane. As electrons pass from carrier to carrier, energy is released and used to pump protons from the matrix into the intermembrane space. Because this space is small, a proton gradient builds up quickly. Protons diffuse back into the matrix through ATP synthase, and this chemiosmosis provides the energy to phosphorylate ADP to ATP. Oxygen is the final electron acceptor: it combines with electrons and protons to form water, which keeps the chain flowing. This oxidative phosphorylation produces most of the ATP, and the cristae increase the surface area available for it."}],"hl":true,"mk":16,"mkSL":16},{"qid":263,"p":"2X","t":"C1.3","also":["C4.2"],"title":"Extended response: photosynthesis","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline how the rate of photosynthesis can be measured experimentally.","pts":["the rate is measured as O₂ production / CO₂ uptake / increase in biomass per unit time","e.g. with an aquatic plant (*Elodea* / *Cabomba*): count bubbles or collect O₂ in an inverted measuring cylinder / gas syringe / capillary tube per minute","CO₂ uptake can be measured from the change in pH (hydrogencarbonate indicator / pH probe) / with O₂ or CO₂ sensors and data loggers","the independent variable is varied, e.g. light intensity by changing the distance from the lamp / CO₂ concentration using sodium hydrogencarbonate","other variables are controlled: temperature (water bath / heat shield), CO₂ concentration, same plant / mass of plant","the plant is allowed to acclimatise to each condition before measuring","measurements are repeated and a mean is calculated"],"hl":false,"mod":"The rate of photosynthesis is measured as the amount of O₂ produced, CO₂ taken up or increase in biomass per unit time. A common method is to place an aquatic plant such as Elodea in water containing sodium hydrogencarbonate and count the bubbles per minute or collect the O₂ in a gas syringe. To investigate the effect of light, the distance between the lamp and the plant is changed, while temperature is controlled with a water bath and CO₂ concentration is kept constant. The plant is allowed to acclimatise before each reading, and measurements are repeated so a mean can be calculated."},{"l":"b","m":4,"q":"Explain the light-independent reactions (Calvin cycle).","pts":["they occur in the *stroma* of the chloroplast","CO₂ is fixed by the enzyme *Rubisco*","CO₂ combines with ribulose bisphosphate (RuBP, 5C) to form two molecules of *glycerate 3-phosphate* (3C)","glycerate 3-phosphate is reduced to *triose phosphate* using reduced NADP (supplies hydrogen) and ATP (supplies energy) from the light-dependent reactions","some triose phosphate (1 in 6) is used to make glucose / starch / sucrose / other carbon compounds","most (5 in 6) is used to *regenerate RuBP*, using ATP","regeneration of RuBP allows CO₂ fixation to continue / the cycle stops in darkness when ATP and reduced NADP run out"],"hl":false,"mod":"The light-independent reactions take place in the stroma. The enzyme Rubisco fixes CO₂ by combining it with ribulose bisphosphate (RuBP), a 5C compound, forming two molecules of glycerate 3-phosphate. This is reduced to triose phosphate using reduced NADP, which supplies hydrogen, and ATP, which supplies energy, both from the light-dependent reactions. A small proportion of the triose phosphate is used to make glucose, starch and other carbon compounds, but most is used, with more ATP, to regenerate RuBP. This allows the cycle to keep fixing CO₂ as long as ATP and reduced NADP are supplied by the light-dependent reactions."},{"l":"c","m":8,"q":"Explain how energy flows and carbon cycles through ecosystems.","pts":["sunlight is the main source of energy for most ecosystems","producers / autotrophs convert light energy into *chemical energy* in carbon compounds by photosynthesis","chemical energy passes along food chains when consumers feed","at each trophic level energy released by cell respiration is lost as *heat*","heat cannot be converted back into chemical energy, so energy *flows* and is not recycled / ecosystems need a continuous input of energy","only about 10% of energy passes from one trophic level to the next, which limits the number of trophic levels","carbon, by contrast, is *recycled*: autotrophs fix CO₂ into carbon compounds by photosynthesis","carbon compounds pass along food chains as consumers feed","all organisms return CO₂ to the atmosphere / water by cell respiration","saprotrophs / decomposers digest dead organic matter and release CO₂","in waterlogged / anaerobic soils decomposition is incomplete and peat forms; over millions of years fossil fuels form","combustion of biomass / fossil fuels releases CO₂","carbon sinks (forests, oceans, peat) store carbon and sources release it","human activity (deforestation, combustion) unbalances the cycle and raises atmospheric CO₂ concentration"],"hl":false,"mod":"The main source of energy for ecosystems is sunlight. Producers convert it into chemical energy stored in carbon compounds by photosynthesis, and this energy passes along food chains when consumers feed. At each trophic level much of the energy released by cell respiration is lost as heat, which cannot be converted back into chemical energy, so only about 10% passes to the next level. Energy therefore flows through the ecosystem and is not recycled: a continuous input of light is needed.\nCarbon, in contrast, is recycled. Autotrophs fix CO₂ into carbon compounds during photosynthesis and these pass to consumers through feeding. All organisms return CO₂ to the air or water by cell respiration, and decomposers release CO₂ when they digest dead organic matter. In waterlogged soils decomposition is incomplete and peat forms, which over millions of years can form fossil fuels. Forests, oceans and peat act as carbon sinks, while combustion of biomass and fossil fuels is a source of CO₂. Deforestation and burning of fossil fuels unbalance the cycle and increase the concentration of CO₂ in the atmosphere."}],"hl":true,"mk":16,"mkSL":16},{"qid":264,"p":"2X","t":"C2.2","also":["C3.1"],"title":"Extended response: nerves and coordination","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe how a resting potential is maintained.","pts":["*Na⁺/K⁺ pumps* actively transport 3 Na⁺ out and 2 K⁺ in per cycle","the pumps use energy from hydrolysis of *ATP* (active transport)","concentration gradients are created: more Na⁺ outside and more K⁺ inside","the membrane is more permeable to K⁺ than to Na⁺ (K⁺ leak channels), so K⁺ diffuses out","more positive charge builds up outside than inside","there are negatively charged proteins / organic ions inside that cannot leave","the inside is negative relative to the outside: resting potential of about *–70 mV*"],"hl":false,"mod":"The resting potential is maintained mainly by sodium–potassium pumps, which use energy from ATP to move 3 Na⁺ out and 2 K⁺ in per cycle. This creates concentration gradients, with more Na⁺ outside and more K⁺ inside, and removes more positive charge than it brings in. In addition, the membrane is much more permeable to K⁺ than to Na⁺, so K⁺ diffuses out through leak channels. Negatively charged proteins and organic ions remain inside the neuron because they cannot leave. As a result the inside is negative relative to the outside, with a resting potential of about –70 mV."},{"l":"b","m":4,"q":"Outline the roles of the brain and spinal cord in a pain reflex.","pts":["a pain receptor (free nerve endings in the skin) detects the stimulus and generates an impulse","a *sensory neuron* carries the impulse to the spinal cord (via the dorsal root)","in the grey matter of the spinal cord it synapses with an *interneuron* / relay neuron","the interneuron synapses with a *motor neuron*, which carries the impulse to a muscle, which contracts and withdraws the body part","the spinal cord coordinates the response without the brain, so it is *involuntary* and fast (few synapses)","other neurons carry impulses up the white matter of the spinal cord to the brain","the brain (cerebral cortex) produces *conscious* perception of pain, after the reflex has occurred","the brain can inhibit / modify the reflex voluntarily or initiate voluntary actions afterwards"],"hl":false,"mod":"A pain receptor in the skin detects the stimulus and generates an impulse that a sensory neuron carries to the spinal cord. In the grey matter the sensory neuron synapses with an interneuron, which in turn synapses with a motor neuron. This carries the impulse to the muscle, which contracts and withdraws the hand. The spinal cord coordinates this response without involving the brain, which is why it is involuntary and very fast. At the same time, other neurons carry impulses up the spinal cord to the brain, which produces the conscious perception of pain after the reflex and can then initiate voluntary actions."},{"l":"c","m":8,"q":"Explain how a nerve impulse travels along an axon and across a synapse.","pts":["if depolarisation reaches the *threshold* (about –50 mV), voltage-gated Na⁺ channels open","Na⁺ diffuses in and the inside becomes positive (depolarisation, about +30 mV)","Na⁺ channels close and voltage-gated K⁺ channels open; K⁺ diffuses out (*repolarisation*)","Na⁺/K⁺ pumps then restore the resting potential","*local currents*: Na⁺ diffuses along the inside of the axon to the adjacent region and depolarises it to threshold, propagating the action potential","the region just depolarised is in a *refractory period*, so the impulse travels in one direction only","the *myelin* sheath insulates the axon and the impulse jumps from one node of Ranvier to the next (saltatory conduction), making it faster","when the impulse reaches the presynaptic terminal, voltage-gated Ca²⁺ channels open and *Ca²⁺* enters","Ca²⁺ causes vesicles to fuse with the presynaptic membrane and release the *neurotransmitter* (e.g. acetylcholine) by exocytosis","the neurotransmitter diffuses across the synaptic cleft","it binds to *receptors* on the postsynaptic membrane and opens ion channels; Na⁺ enters and the membrane is depolarised (excitatory postsynaptic potential)","if threshold is reached, an action potential is generated in the postsynaptic neuron","the neurotransmitter is removed from the cleft (e.g. acetylcholinesterase breaks down acetylcholine / it is reabsorbed) so the stimulation ends","excitatory and inhibitory signals from several presynaptic neurons are *summated* and determine whether threshold is reached"],"hl":false,"mod":"When a region of the axon is depolarised to threshold, about –50 mV, voltage-gated Na⁺ channels open. Na⁺ diffuses in and the inside becomes positive. These channels then close and K⁺ channels open, so K⁺ leaves and the membrane repolarises; Na⁺/K⁺ pumps later restore the resting potential. The Na⁺ that entered diffuses along the inside to the adjacent region and depolarises it to threshold by local currents, so the action potential is propagated. The previous region is in its refractory period, so the impulse only moves in one direction. In myelinated axons the impulse jumps from one node of Ranvier to the next (saltatory conduction) and travels faster.\nWhen the impulse reaches the presynaptic terminal it opens Ca²⁺ channels and Ca²⁺ enters. This makes vesicles fuse with the membrane and release neurotransmitter, for example acetylcholine, by exocytosis. The neurotransmitter diffuses across the synaptic cleft and binds to receptors on the postsynaptic membrane, opening channels that let Na⁺ in and depolarise the membrane. If threshold is reached, an action potential is generated in the postsynaptic neuron. Excitatory and inhibitory signals arriving are summated. Finally, the neurotransmitter is removed from the cleft, for example acetylcholinesterase breaks down acetylcholine, so the signal is not prolonged."}],"hl":true,"mk":16,"mkSL":16},{"qid":265,"p":"2X","t":"C3.2","also":["D4.1"],"title":"Extended response: defence against disease","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline the primary defences of the body against pathogens.","pts":["the *skin* is a physical barrier: its outer layer of dead keratinised cells is tough and hard to penetrate","skin secretions (sebum, sweat) are acidic / contain antimicrobial substances that inhibit growth of pathogens","*mucous membranes* of the airways, digestive tract and urogenital tract secrete sticky mucus that traps pathogens","*cilia* in the airways sweep mucus with trapped pathogens out of the airways","lysozyme in tears / saliva / mucus breaks down bacterial cell walls","hydrochloric acid in the stomach kills pathogens ingested with food","blood *clotting* (platelets, fibrin) seals cuts in the skin and prevents entry of pathogens","they are non-specific / innate defences: they act in the same way against any pathogen"],"hl":false,"mod":"The first line of defence is the skin, whose outer layer of dead keratinised cells is tough and forms a physical barrier; its secretions are also acidic and inhibit the growth of pathogens. Mucous membranes of the airways, digestive and urogenital tracts secrete sticky mucus that traps pathogens, and in the airways cilia sweep this mucus out. Lysozyme in tears and saliva breaks down bacterial cell walls, and stomach acid kills pathogens in food. If the skin is cut, blood clotting seals the wound and prevents pathogens from entering. All these defences are non-specific."},{"l":"b","m":4,"q":"Explain how vaccination leads to herd immunity.","pts":["the vaccine contains *antigens* (weakened / inactivated pathogen, fragments) or mRNA coding for an antigen, without causing the disease","it triggers a primary immune response: specific B-lymphocytes are activated, form clones and produce antibodies","*memory cells* are formed, giving long-term immunity","if the person is infected, a rapid secondary response destroys the pathogen before it multiplies / before the person can transmit it","vaccinated people do not become infected / do not transmit the pathogen","when a high enough proportion of the population is immune, an infected person is unlikely to contact susceptible people, so *chains of transmission* are broken","the pathogen cannot spread, protecting those who cannot be vaccinated (babies, immunocompromised people): *herd immunity*","the proportion needed is higher the more infectious the pathogen is"],"hl":false,"mod":"A vaccine contains antigens from a pathogen, for example an inactivated pathogen or mRNA coding for an antigen, without causing the disease. These antigens trigger a primary response in which specific B-lymphocytes are activated, form clones and produce antibodies, and long-lived memory cells are formed. If the vaccinated person is later exposed to the pathogen, a rapid secondary response destroys it before it multiplies, so the person neither becomes ill nor transmits it. When a high enough proportion of the population is immune, an infected person is unlikely to meet susceptible people, so chains of transmission are broken. The pathogen therefore cannot spread and unvaccinated people, such as babies or immunocompromised people, are also protected: this is herd immunity."},{"l":"c","m":8,"q":"Explain how antibiotic resistance evolves and how its spread can be reduced.","pts":["antibiotics block processes in prokaryotic cells (cell wall synthesis, 70S ribosomes) that do not occur in eukaryotic cells","there is variation in a bacterial population: random *mutations* give some bacteria resistance","the antibiotic acts as a *selection pressure*","susceptible bacteria are killed","resistant bacteria survive and reproduce rapidly by binary fission, passing on the resistance gene","the frequency of resistance alleles / genes increases in the population (*natural selection* / evolution)","resistance genes can be transferred between bacteria, even of different species, on *plasmids* (horizontal gene transfer)","exposure to several antibiotics produces multi-resistant strains, e.g. MRSA","evolution is rapid because bacteria have short generation times / huge populations","reduce: prescribe antibiotics only when necessary / not for viral infections","reduce: patients complete the full course so that partly resistant bacteria do not survive","reduce: limit antibiotic use in livestock farming (e.g. as growth promoters)","reduce: hygiene and infection control in hospitals (hand washing, isolating infected patients)","reduce: develop new antibiotics / use combinations of antibiotics / vaccinate to reduce the number of infections"],"hl":false,"mod":"Antibiotics work by blocking processes specific to bacteria, such as cell wall synthesis or the function of 70S ribosomes. There is variation in a bacterial population because random mutations make some bacteria resistant. When an antibiotic is used it acts as a selection pressure: susceptible bacteria die, while resistant ones survive and reproduce by binary fission, passing on the resistance gene. The frequency of resistance genes in the population therefore increases, which is evolution by natural selection, and it is rapid because bacteria have very short generation times. In addition, resistance genes can pass to other bacteria, even of other species, on plasmids, and exposure to several antibiotics has produced multi-resistant strains such as MRSA.\nTo reduce its spread, doctors should prescribe antibiotics only when necessary and never for viral infections, and patients should complete the full course. Antibiotic use in livestock farming should also be limited. In hospitals, hygiene, hand washing and isolation of infected patients prevent resistant strains being transmitted. Finally, developing new antibiotics and vaccinating to reduce the number of infections lowers the selection pressure."}],"hl":false,"mk":16,"mkSL":16},{"qid":266,"p":"2X","t":"D2.1","also":["D3.1"],"title":"Extended response: cell division and reproduction","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe the events of mitosis.","pts":["DNA has been replicated beforehand, in interphase, so each chromosome consists of two *sister chromatids* joined at the centromere","prophase: chromosomes *condense* by supercoiling and become visible","prophase: *spindle* microtubules form and the nuclear membrane breaks down","metaphase: microtubules attach to the centromeres and chromosomes line up on the *equatorial plane*","anaphase: centromeres separate and microtubules pull the sister chromatids to opposite poles","telophase: chromosomes reach the poles and decondense; a new nuclear membrane forms around each set","*cytokinesis* divides the cytoplasm into two genetically identical daughter cells"],"hl":false,"mod":"Before mitosis, DNA is replicated in interphase, so each chromosome consists of two sister chromatids joined at the centromere. In prophase, chromosomes condense by supercoiling, spindle microtubules form and the nuclear membrane breaks down. In metaphase, microtubules attach to the centromeres and the chromosomes line up on the equatorial plane. In anaphase, the centromeres separate and microtubules pull the sister chromatids to opposite poles. In telophase, the chromosomes decondense at the poles and a nuclear membrane forms around each set. Finally, cytokinesis divides the cytoplasm, giving two genetically identical daughter cells."},{"l":"b","m":4,"q":"Compare and contrast spermatogenesis and oogenesis.","pts":["in both, germ cells divide by *mitosis*, grow and then undergo *meiosis*","both produce *haploid* gametes","spermatogenesis: each cell entering meiosis gives four sperm; oogenesis: gives only one egg and polar bodies","in oogenesis *cytokinesis is unequal*, so the oocyte keeps almost all the cytoplasm / in spermatogenesis it is equal","spermatogenesis: millions per day, continuously from puberty; oogenesis: usually one oocyte per menstrual cycle","oogenesis starts before birth and pauses in prophase I / meiosis II is only completed after fertilisation","spermatogenesis occurs in the seminiferous tubules of the testes; oogenesis in the follicles of the ovaries","oogenesis ends at menopause; spermatogenesis continues throughout adult life"],"hl":false,"mod":"Both processes begin with mitotic divisions of germ cells, followed by growth and meiosis, and both produce haploid gametes. However, in spermatogenesis each cell entering meiosis gives four sperm, whereas in oogenesis cytokinesis is unequal, producing only one egg, which keeps almost all the cytoplasm, and polar bodies that degenerate. Spermatogenesis occurs in the seminiferous tubules continuously from puberty and produces millions of gametes per day; oogenesis begins before birth, pauses in prophase I, usually releases one oocyte per cycle and ends at menopause."},{"l":"c","m":8,"q":"Explain how sexual reproduction promotes genetic variation.","pts":["*meiosis* halves the chromosome number / each haploid gamete receives one chromosome from each homologous pair","in prophase I homologous chromosomes pair up (bivalents)","*crossing over*: exchange of segments between non-sister chromatids at chiasmata","crossing over forms recombinant chromatids with *new combinations of alleles* of linked genes","*random orientation* of bivalents in metaphase I / independent assortment of maternal and paternal chromosomes","number of combinations = 2ⁿ: in humans 2²³ ≈ 8 million different gametes (without crossing over)","random orientation in metaphase II also adds variation, because chromatids are no longer identical after crossing over","*random fertilisation*: any male gamete can fuse with any female gamete","fertilisation combines alleles from two different parents, so each zygote has a unique combination","in plants, *cross-pollination* between different individuals increases variation","mechanisms preventing self-pollination: self-incompatibility / anthers and stigmas maturing at different times / separate male and female plants","mutation produces new alleles that sexual reproduction recombines","genetic variation allows adaptation by natural selection / evolution"],"hl":false,"mod":"Sexual reproduction generates variation at several stages. Meiosis halves the chromosome number, so each haploid gamete receives one chromosome from each homologous pair. In prophase I homologues pair up and crossing over occurs: non-sister chromatids exchange segments at chiasmata, forming recombinant chromatids with new combinations of alleles of linked genes. In metaphase I, the random orientation of bivalents means maternal and paternal chromosomes assort independently; in humans this gives 2²³, about 8 million, possible combinations, and random orientation in metaphase II adds further variation because chromatids are no longer identical. Then random fertilisation allows any male gamete to fuse with any female gamete, combining alleles from two different parents, so every zygote is unique. In plants, cross-pollination and mechanisms such as self-incompatibility or anthers and stigmas maturing at different times prevent self-pollination and increase the mixing of alleles. Mutation provides new alleles, and sexual reproduction recombines them, producing the variation on which natural selection acts."}],"hl":true,"mk":16,"mkSL":16},{"qid":267,"p":"2X","t":"D3.2","also":["D2.1"],"title":"Extended response: inheritance","blocks":[],"parts":[{"l":"a","m":4,"q":"Explain how sex is determined in humans and why sex-linked conditions are more common in males.","pts":["females have two X chromosomes (XX) and males have one X and one Y (XY)","all eggs carry an X; half of the sperm carry X and half carry Y, so the chance of each sex is 50%","the Y chromosome carries the *SRY* gene, which triggers development of testes / male sex","the Y chromosome is small and lacks loci for most of the genes on the X","males have only one allele of each X-linked gene, so a *recessive* allele is always expressed","females need two copies of the recessive allele to be affected; with one they are *carriers*","as the recessive allele is rare, inheriting two copies is unlikely / examples: haemophilia, red–green colour blindness","sons inherit their X from their mother; a father passes his X to all daughters and his Y to sons"],"hl":false,"mod":"Sex is determined by the sex chromosomes: females are XX and males XY. All eggs carry an X, whereas half of the sperm carry X and half carry Y, so each sex has a 50% probability; the SRY gene on the Y chromosome triggers male development. The Y chromosome is small and lacks loci for most genes on the X, so males have only one allele of each X-linked gene and a recessive allele, such as that for haemophilia, is always expressed. Females need two copies of the recessive allele to be affected; with only one they are carriers, and because the allele is rare, inheriting two copies is unlikely."},{"l":"b","m":4,"q":"Outline how pedigree charts can be used to deduce patterns of inheritance.","pts":["conventions: squares = males, circles = females, shaded symbols = affected; horizontal lines = couples, vertical lines = offspring","two unaffected parents with an affected child: the allele is *recessive* and both parents are carriers","two affected parents with an unaffected child: the allele is *dominant* and both parents are heterozygous","if every affected person has at least one affected parent / the trait appears in every generation, it is probably dominant","if it mainly affects males and passes through unaffected carrier mothers, it is *X-linked* recessive","if an affected father has a son affected through him, the gene is not X-linked (a father does not pass his X to his sons)","the genotypes of individuals are deduced and the probability of affected offspring is predicted"],"hl":false,"mod":"A pedigree chart shows males as squares and females as circles, with affected individuals shaded, couples joined by horizontal lines and offspring by vertical lines. If two unaffected parents have an affected child, the allele is recessive and both parents are carriers; if two affected parents have an unaffected child, the allele is dominant and both are heterozygous. If the trait mainly affects males and passes through unaffected carrier mothers, it is X-linked recessive. Once the pattern is identified, the genotypes of each individual can be deduced and probabilities for offspring predicted."},{"l":"c","m":8,"q":"Explain the inheritance of two genes, including the effect of linkage.","pts":["each gene occupies a *locus* on a chromosome and may have different alleles","unlinked genes are on different chromosomes","they separate by *independent assortment* in meiosis, due to random orientation of bivalents in metaphase I","a dihybrid AaBb produces four types of gamete (AB, Ab, aB, ab) in equal proportions","a cross between two heterozygous dihybrids gives a 9 : 3 : 3 : 1 phenotypic ratio","a test cross with the homozygous recessive (aabb) gives 1 : 1 : 1 : 1","*linked* genes have their loci on the same chromosome","they tend to be inherited together, so they do not assort independently and more offspring have parental combinations","*recombinants* are only formed by *crossing over* between the two loci in prophase I","the closer the loci, the less crossing over between them and the fewer recombinants","the *chi-squared* test compares observed with expected frequencies (degrees of freedom = number of classes – 1)","if χ² exceeds the critical value (p = 0.05), the null hypothesis is rejected: the difference is significant, e.g. due to linkage"],"hl":false,"mod":"Each gene occupies a locus on a chromosome and may have different alleles. If two genes are unlinked, they are on different chromosomes and separate by independent assortment in meiosis, because the orientation of each bivalent in metaphase I is random. A dihybrid AaBb therefore produces four types of gamete, AB, Ab, aB and ab, in equal proportions; crossing two dihybrids gives a 9 : 3 : 3 : 1 phenotypic ratio and a test cross with aabb gives 1 : 1 : 1 : 1. In contrast, linked genes have their loci on the same chromosome, so they tend to be inherited together and do not assort independently: more offspring show the parental combinations. Recombinants are only formed when crossing over occurs between the two loci in prophase I, and they are rarer the closer the loci are. To find out whether results deviate from the expected ratio, the chi-squared test is used: if χ² exceeds the critical value at p = 0.05, the null hypothesis is rejected and the difference is significant, which may indicate linkage."}],"hl":true,"mk":16,"mkSL":16},{"qid":268,"p":"2X","t":"D3.3","also":["C2.1"],"title":"Extended response: homeostasis","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline the role of the kidney in osmoregulation and excretion.","pts":["*ultrafiltration* in the glomerulus: high pressure forces plasma (water, glucose, urea, ions) into Bowman's capsule; proteins and cells stay in the blood","*selective reabsorption* in the proximal convoluted tubule: all glucose, amino acids and most water and ions are reabsorbed","the loop of Henle creates a concentration gradient / a hypertonic medulla","*ADH* increases the water permeability of the collecting duct by inserting aquaporins, so more water is reabsorbed","if blood is too concentrated more ADH is secreted and urine is small in volume and concentrated; if dilute, less ADH and large volumes of dilute urine","osmoregulation keeps the solute concentration / water balance of the blood constant","excretion: *urea* (made in the liver from amino acids) is not fully reabsorbed and is removed in urine"],"hl":false,"mod":"The kidney filters blood in its nephrons. In the glomerulus ultrafiltration occurs: high pressure forces plasma, containing water, glucose, urea and ions, into Bowman's capsule, while proteins and cells stay in the blood. In the proximal convoluted tubule all the glucose, amino acids and most of the water and ions are selectively reabsorbed. The loop of Henle creates a hypertonic medulla, and ADH controls how much water is reabsorbed in the collecting duct by inserting aquaporins: if blood is concentrated, more ADH is secreted and urine is small in volume and concentrated. This is osmoregulation, and urea, which is not fully reabsorbed, is excreted in the urine."},{"l":"b","m":4,"q":"Explain thermoregulation in humans.","pts":["the *hypothalamus* detects blood temperature and receives information from thermoreceptors in the skin","the hypothalamus compares the temperature with the set point (about 37 °C) and triggers responses by *negative feedback*","too hot: *vasodilation* of skin arterioles, so more blood reaches the surface and more heat is lost","too hot: sweating; evaporation of sweat removes heat","too cold: *vasoconstriction* of skin arterioles, so less heat is lost","too cold: shivering; rapid muscle contraction releases heat from cell respiration","brown adipose tissue: *uncoupled respiration* produces heat instead of ATP","hair erection, trapping an insulating layer of air / thyroxin increases metabolic rate"],"hl":false,"mod":"Body temperature is regulated by negative feedback. The hypothalamus detects blood temperature and receives information from skin thermoreceptors, and compares it with the set point of about 37 °C. If temperature rises, it causes vasodilation of skin arterioles, so more blood reaches the surface and more heat is lost, and sweating, whose evaporation removes heat. If temperature falls, it causes vasoconstriction of skin arterioles to reduce heat loss, shivering, in which muscle contraction releases heat, and uncoupled respiration in brown adipose tissue, which produces heat instead of ATP. Temperature therefore returns to the set point."},{"l":"c","m":8,"q":"Discuss the causes and management of type 1 and type 2 diabetes.","pts":["type 1: the immune system destroys the *β-cells* of the pancreas (*autoimmune* disease)","type 1: little or no insulin is produced","type 1: usually begins in childhood or youth; has a genetic predisposition and is not caused by lifestyle","type 1: managed with insulin injections / an insulin pump and frequent blood glucose monitoring","type 2: insulin is produced but target cells respond less / *insulin resistance*","type 2: risk factors: obesity, diet high in sugars and fats, physical inactivity and family history / genetics","type 2: usually appears in adults, but increasingly in young people as obesity rises","type 2: managed with a low-sugar diet, exercise and weight loss, and drugs (insulin in advanced cases)","in both, blood glucose stays high / glucose appears in urine","long-term complications in both: damage to eyes, kidneys, nerves and blood vessels / cardiovascular disease","type 2 is much more common and can be prevented or delayed through lifestyle; type 1 cannot","balanced conclusion: genes contribute to both, but lifestyle is far more important in type 2 / type 1 requires replacing the hormone, type 2 improving the response to it"],"hl":false,"mod":"Type 1 diabetes is an autoimmune disease: the immune system destroys the β-cells of the pancreas, so little or no insulin is produced. It usually begins in childhood, has a genetic predisposition and is not caused by lifestyle, so it cannot be prevented; it is managed with insulin injections and frequent blood glucose monitoring. In type 2 diabetes insulin is produced, but target cells respond less to it, that is, there is insulin resistance. Its risk factors are obesity, a diet high in sugars and fats, physical inactivity and family history; it usually appears in adults, though increasingly in young people. It is managed with diet, exercise, weight loss and drugs, and with insulin in advanced cases. In both types blood glucose stays high, which in the long term damages the eyes, kidneys, nerves and blood vessels. In conclusion, genes contribute to both, but type 2, which is much more common, depends mainly on lifestyle and can be prevented, whereas type 1 requires lifelong replacement of the hormone."}],"hl":true,"mk":16,"mkSL":16},{"qid":2000,"p":"1B","t":"A2.2","also":["B4.1","C4.1"],"title":"Measuring a stem under the microscope","blocks":[{"k":"p","v":"A student viewed a transverse section of a young sunflower stem with a light microscope. In a photomicrograph taken at a magnification of ×40, the diameter of the stem measures 96 mm."},{"k":"table","cap":"Leaf features of three plant species from different habitats","rows":[["Species","Habitat","Leaf area / cm²","Cuticle thickness / µm","Stomata per mm² (lower surface)"],["P","tropical rainforest","210","2","310"],["Q","temperate meadow","45","5","180"],["R","hot desert","0.8","18","60"]]}],"parts":[{"l":"a","m":2,"q":"Calculate the actual diameter of the stem in mm, showing your working.","pts":["working: actual size = image size ÷ magnification = 96 mm ÷ 40","= *2.4 mm* (unit required)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Outline how an eyepiece graticule can be used to measure the actual size of a structure.","pts":["the eyepiece graticule is *calibrated* against a stage micrometer by lining up the two scales","calibration is done with the same objective lens / magnification that will be used for measuring (recalibrate if the objective is changed)","the value of one graticule division is calculated (e.g. 10 graticule divisions = 0.1 mm on the micrometer → 1 division = 10 µm)","the micrometer is removed, the number of graticule divisions across the structure is counted and multiplied by the value of one division"],"hl":false,"mod":""},{"l":"c","m":1,"q":"State one way in which plants protect themselves from herbivores.","pts":["physical defence: spines / thorns / hairs (trichomes) / tough or silica-containing leaves / sticky latex","chemical defence: toxic or bitter-tasting substances (e.g. alkaloids, tannins)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Explain two leaf adaptations of species R to a hot desert, using the data in the table.","pts":["very small leaf area, *0.8 cm²* (compared with 210 cm² in P): less surface through which water is lost / less heat absorbed","thick cuticle, *18 µm* (compared with 2 µm in P): the waterproof wax reduces evaporation through the epidermis","few stomata, *60 per mm²* (compared with 310 in P): fewer pores through which water vapour diffuses, so less *transpiration*","each adaptation conserves water in a habitat with very little available water and high temperatures"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Calculate how many times thicker the cuticle of R is than that of P.","pts":["18 µm ÷ 2 µm = *9* times (accept ×9)"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":2001,"p":"1B","t":"C1.1","also":["C3.2"],"title":"Plant extracts that inhibit amylase","blocks":[{"k":"p","v":"People with type 2 diabetes can benefit if starch digestion is slowed. Researchers tested three plant extracts (E1, E2 and E3) as inhibitors of α-amylase. The activity of the enzyme was measured at different extract concentrations, with all other conditions kept the same."},{"k":"chart","type":"line","title":"Effect of plant extracts on α-amylase activity","x":"Extract concentration / µg ml⁻¹","y":"Amylase activity / %","s":[{"n":"E1","pts":[["0",100.0],["50",72.0],["100",51.0],["150",38.0],["200",30.0],["250",26.0]]},{"n":"E2","pts":[["0",100.0],["50",91.0],["100",80.0],["150",69.0],["200",58.0],["250",47.0]]},{"n":"E3","pts":[["0",100.0],["50",98.0],["100",97.0],["150",95.0],["200",94.0],["250",93.0]]}]}],"parts":[{"l":"a","m":1,"q":"Identify the independent variable in this investigation.","pts":["the *concentration* of plant extract (µg ml⁻¹)","accept: the type of extract (E1, E2 or E3)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"State one variable that needs to be controlled.","pts":["temperature / pH","starch (substrate) concentration / amylase concentration or volume / reaction time"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Compare and contrast the effects of E1 and E2 on amylase activity.","pts":["similarity: both extracts *reduce* amylase activity as their concentration increases","similarity: with both, activity is 100 % with no extract (0 µg ml⁻¹)","difference: E1 reduces activity more than E2 at every concentration above 0 / E1 is a more potent inhibitor","difference: with E1 activity falls steeply at low concentrations then levels off (curve), whereas with E2 it falls at an almost constant rate (almost linear, about 10 % per 50 µg ml⁻¹)","at 100 µg ml⁻¹: E1 51 % vs E2 80 % / E1 halves activity at about 100 µg ml⁻¹ while E2 needs about 230–250 µg ml⁻¹","at 250 µg ml⁻¹: E1 *26 %* vs E2 *47 %*"],"hl":false,"mod":"Both extracts reduce amylase activity as their concentration increases, starting from 100 % with no extract. However, E1 is more potent: it reduces activity more at every concentration above 0; for example, at 100 µg ml⁻¹ activity is 51 % with E1 and 80 % with E2, and at 250 µg ml⁻¹ it is 26 % compared with 47 %. The pattern also differs: with E1 activity falls steeply at low concentrations and then levels off, whereas with E2 it decreases at an almost constant rate, about 10 % per 50 µg ml⁻¹."},{"l":"d","m":1,"q":"Outline how the rate of the amylase reaction could be measured.","pts":["measure the disappearance of *starch* per unit time (iodine test: time until the blue-black colour no longer appears / colorimeter)","or measure the appearance of *maltose* (reducing sugar) per unit time (e.g. with Benedict's reagent)"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Distinguish between competitive and non-competitive inhibition.","pts":["a competitive inhibitor binds to the *active site*; a non-competitive inhibitor binds to an *allosteric site* (elsewhere on the enzyme)","a competitive inhibitor has a shape / chemical structure similar to the substrate; a non-competitive inhibitor does not resemble the substrate","a competitive inhibitor competes with the substrate and blocks the active site; a non-competitive inhibitor changes the shape of the active site","competitive inhibition is overcome by increasing substrate concentration (the same maximum rate is reached); non-competitive inhibition is not overcome and lowers the maximum rate"],"hl":true,"mod":""},{"l":"f","m":2,"q":"Describe the role of an enzyme in one named process that protects the body against infection.","pts":["named process: *thrombin* in blood clotting / *lysozyme* in tears, saliva or mucus","clotting: after a cut, platelets release clotting factors that, in a cascade, activate thrombin (from prothrombin)","thrombin converts soluble *fibrinogen* into insoluble *fibrin*","fibrin fibres form a mesh that traps blood cells, forming a clot that seals the wound and prevents entry of pathogens","OR: lysozyme hydrolyses bonds in the peptidoglycan of bacterial cell walls, so the bacteria burst (lysis)"],"hl":false,"mod":""}],"hl":false,"mk":10,"mkSL":8},{"qid":2002,"p":"1B","t":"D4.1","also":["D3.2"],"title":"Beak size after a drought","blocks":[{"k":"p","v":"On an island, the beak depth of a population of seed-eating finches was measured before and after a severe drought. During the drought, only large, hard seeds were available. The table summarises the data."},{"k":"table","cap":"Beak depth of finches / mm","rows":[["Year","Minimum","Lower quartile","Median","Upper quartile","Maximum","Number measured"],["Before drought","7.3","8.6","9.2","9.8","11.0","640"],["After drought","8.1","9.3","9.9","10.5","11.4","98"]]}],"parts":[{"l":"a","m":1,"q":"State the median beak depth after the drought.","pts":["9.9 mm"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Calculate the interquartile range before the drought.","pts":["upper quartile – lower quartile = 9.8 – 8.6 = 1.2 mm"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain the change in beak depth between the two years.","pts":["beak depth increased: the median rose from 9.2 mm to 9.9 mm / all values (minimum, quartiles, maximum) are higher afterwards","during the drought only large, hard seeds were available, which finches with deep beaks could crack","finches with shallow beaks could not feed and died (numbers fell from 640 to 98)","beak depth is *heritable*: survivors reproduced and passed on alleles for deep beaks","this is *natural selection*: the frequency of alleles for deep beaks in the population increased"],"hl":false,"mod":"Beak depth increased: the median rose from 9.2 mm to 9.9 mm and the minimum from 7.3 mm to 8.1 mm. During the drought only large, hard seeds were available, which only finches with deep beaks could crack, so finches with shallow beaks could not feed and died, as shown by the fall from 640 to 98 individuals. Because beak depth is heritable, the survivors passed alleles for deep beaks to their offspring, so their frequency in the population increased by natural selection."},{"l":"d","m":2,"q":"Suggest, using the data, why beak depth is likely to be polygenic.","pts":["it shows *continuous variation*: values range from 7.3 mm to 11.0 mm","there are no distinct categories, but many intermediate values","values cluster around the median (quartiles ±0.6 mm), suggesting a normal / bell-shaped distribution","this pattern results from many genes with small additive effects"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Identify the type of selection shown and distinguish it from disruptive selection.","pts":["*directional* selection","directional selection favours one extreme of the range (deep beaks), so the mean / median shifts","disruptive selection favours both extremes and selects against intermediate phenotypes","disruptive selection may produce a bimodal distribution / increases variation without necessarily shifting the mean"],"hl":true,"mod":""},{"l":"f","m":2,"q":"Outline how the Hardy–Weinberg equation can be used in population studies.","pts":["it links allele and genotype frequencies: p + q = 1 and p² + 2pq + q² = 1","from the frequency of the recessive phenotype (q²), q, p and the carrier frequency (2pq) can be calculated","it predicts the expected frequencies if the population is not evolving (large population, random mating, no selection, migration or mutation)","if observed frequencies differ from expected, a condition is not met: evolution is occurring (selection / non-random mating / migration)"],"hl":true,"mod":""}],"hl":false,"mk":11,"mkSL":7},{"qid":2003,"p":"1B","t":"B3.1","also":["B3.2"],"title":"Haemoglobin and oxygen","blocks":[{"k":"p","v":"The graph shows how the percentage saturation of adult haemoglobin with oxygen changes with the partial pressure of oxygen (pO₂)."},{"k":"chart","type":"line","title":"Oxygen dissociation curve of adult haemoglobin","x":"pO₂ / kPa","y":"Saturation / %","s":[{"n":"Adult haemoglobin","pts":[["0",0.0],["1",8.0],["2",23.0],["3",45.0],["4",62.0],["5",75.0],["6",84.0],["8",93.0],["10",97.0],["12",98.0],["14",99.0]]}]}],"parts":[{"l":"a","m":1,"q":"Identify the percentage saturation of haemoglobin at a pO₂ of 4 kPa.","pts":["*62 %* (accept 61–63 %)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Describe the relationship between pO₂ and the percentage saturation of haemoglobin.","pts":["positive relationship: saturation increases as pO₂ increases","the relationship is not linear: the curve is *sigmoid* (S-shaped)","slow rise at low pO₂ (0–1 kPa) and very steep rise between 2 and 6 kPa (from 23 % to 84 %)","levels off above about 8 kPa, approaching 100 % (99 % at 14 kPa)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain why the curve for foetal haemoglobin lies to the left of this curve.","pts":["foetal haemoglobin has a higher *affinity* for oxygen than adult haemoglobin / is more saturated at the same pO₂","in the *placenta*, pO₂ is low and maternal haemoglobin releases O₂","foetal haemoglobin can take up this O₂ and become loaded, so oxygen passes from maternal to foetal blood"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Explain the effect of a rise in CO₂ concentration on this curve.","pts":["the curve shifts to the *right* (Bohr shift)","CO₂ forms carbonic acid / H⁺, which lowers the *pH* of the blood","low pH reduces the affinity of haemoglobin for O₂, so at the same pO₂ saturation is lower","more O₂ is released in actively respiring tissues, which are the ones producing most CO₂"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Describe one adaptation of haemoglobin for transporting oxygen.","pts":["it has four subunits each with a *haem* group (containing Fe²⁺), so each molecule carries up to four O₂","*cooperative binding*: binding of one O₂ changes the shape (quaternary structure) and makes binding of the next easier / release of one makes release of the others easier"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":2004,"p":"1B","t":"D4.2","also":["C4.2","C4.1"],"title":"Mercury in a reservoir food web","blocks":[{"k":"p","v":"The concentration of methylmercury, a toxic pollutant, was measured in the fat and muscle tissue of organisms in a reservoir. Bacteria in the mud release methylmercury into the water."},{"k":"table","cap":"Mean methylmercury concentration / parts per billion (ppb)","rows":[["Organism","Main food","Concentration / ppb"],["Phytoplankton","– (producer)","6"],["Water fleas","phytoplankton","25"],["Perch","water fleas and insect larvae","180"],["Pike","perch and other fish","950"],["Otter","pike and perch","2100"],["Carp","plants and detritus","70"]]}],"parts":[{"l":"a","m":2,"q":"Explain why the otter has a higher methylmercury concentration than the perch.","pts":["methylmercury is not broken down / not excreted, so it accumulates in tissues (fat and muscle)","the otter feeds at a higher trophic level: it eats pike and perch","each predator eats many prey and accumulates the methylmercury from all of them: *biomagnification*","otter 2100 ppb compared with perch 180 ppb (about 12 times higher)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Identify, with a reason, which fish would be safest for humans to eat.","pts":["carp","it has the lowest concentration of the fish: 70 ppb (compared with 180 ppb for perch and 950 ppb for pike)","it feeds on plants and detritus, at a low trophic level, so there is less biomagnification"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Outline how the population size of perch in the reservoir could be estimated.","pts":["capture a first sample of perch (e.g. with nets) and count them (M)","*mark* them in a way that does not harm them or make them more visible to predators (e.g. fin clip / tag)","release them and allow time for them to mix randomly with the population","capture a second sample by the same method; count the total (N) and the marked recaptures (R)","*Lincoln index*: population size = (M × N) ÷ R","assumptions: no migration, births or deaths between samples / marks are not lost"],"hl":false,"mod":"The capture–mark–release–recapture method would be used. A first sample of perch is caught with nets, counted (M) and marked with a fin clip or tag that does not harm them. They are then released and given time to mix randomly with the population. Later a second sample is caught by the same method and the total (N) and the number of marked individuals (R) are counted. Population size is estimated with the Lincoln index: (M × N) ÷ R, assuming there is no migration, birth or death between samples."},{"l":"d","m":3,"q":"Discuss how overfishing could affect the reservoir and how sustainable fishing can be assessed.","pts":["removing predators (pike) may allow their prey (perch) to increase / the food web is disrupted","removing perch reduces food for pike and otters, whose populations may decline","if fish are caught before they breed, the *breeding stock* is reduced and the population cannot recover","assess: estimate population size each year (e.g. capture–recapture) / monitor catch per unit effort","assess: analyse the age or size structure of catches; few large adults indicates overfishing","fishing is *sustainable* if the catch does not exceed the population's rate of replacement / quotas, minimum mesh size, closed breeding seasons"],"hl":false,"mod":"Overfishing can disrupt the food web: if predators such as pike are removed, their prey, such as perch, may increase, and if perch are removed, pike and otters lose food. In addition, if fish are caught before they breed, the breeding stock falls and the population cannot recover. To assess whether fishing is sustainable, population size is estimated each year, for example by capture–recapture, and the age structure of catches is analysed: if few large adults remain, overfishing is occurring. Fishing is sustainable if the catch does not exceed the rate of replacement, which can be achieved with quotas, a minimum mesh size and closed breeding seasons."}],"hl":false,"mk":10,"mkSL":10},{"qid":2005,"p":"1B","t":"A1.2","also":["D1.1"],"title":"Which molecule carries genetic information?","blocks":[{"k":"p","v":"Bacteriophages were grown with either radioactive phosphorus (³²P) or radioactive sulfur (³⁵S). Each group of phages was mixed with bacteria for 10 minutes, then shaken in a blender to remove phage coats and centrifuged. Bacteria form a pellet at the bottom of the tube; free phage coats stay in the liquid above (supernatant)."},{"k":"chart","type":"bar","title":"Location of radioactivity after centrifugation","x":"Fraction","y":"Radioactivity / % of total","s":[{"n":"³²P-labelled phages","pts":[["Pellet (bacteria)",78.0],["Supernatant",22.0]]},{"n":"³⁵S-labelled phages","pts":[["Pellet (bacteria)",19.0],["Supernatant",81.0]]}]}],"parts":[{"l":"a","m":1,"q":"State which molecule each isotope labels.","pts":["³²P labels *DNA* (phosphorus in phosphate groups) and ³⁵S labels *protein* (sulfur in amino acids; DNA contains no sulfur) (both needed)"],"hl":true,"mod":""},{"l":"b","m":3,"q":"Explain how these results provide evidence that DNA is the genetic material.","pts":["with ³²P-labelled phages, *78 %* of the radioactivity is in the pellet, so DNA entered the bacteria","with ³⁵S-labelled phages, *81 %* of the radioactivity is in the supernatant, so the protein (capsid) stayed outside the bacteria","new phages are produced inside the bacteria, so whatever entered them carries the instructions for making phages","since DNA enters but protein does not, the *genetic material* is DNA","the coats were removed by blending / centrifugation, so radioactivity in the pellet reflects what had entered the bacteria"],"hl":true,"mod":"With ³²P-labelled phages, 78 % of the radioactivity ended up in the pellet, which contains the bacteria, so the phage DNA entered them. With ³⁵S-labelled phages, 81 % stayed in the supernatant with the coats removed by blending, so the capsid protein stayed outside. Since new complete phages are made inside the bacteria, the molecule that entered must contain the instructions for making them; that molecule is DNA, not protein, so DNA is the genetic material."},{"l":"c","m":1,"q":"Suggest why some ³⁵S was found in the pellet.","pts":["some phage coats were still attached to the surface of the bacteria / blending did not remove all the coats","some phages were not separated and sedimented with the bacteria / some supernatant was trapped in the pellet"],"hl":true,"mod":""},{"l":"d","m":3,"q":"Draw a labelled diagram of one DNA nucleotide.","pts":["phosphate drawn as a circle and labelled *phosphate*","sugar drawn as a pentagon and labelled *deoxyribose* (not just 'sugar' or 'ribose')","base drawn as a rectangle and labelled nitrogenous base / A, T, C or G","phosphate attached to C5 of deoxyribose (the carbon outside the ring)","base attached to C1 of deoxyribose (opposite side to the phosphate), with covalent bonds drawn as lines"],"hl":false,"mod":"The drawing shows a pentagon labelled deoxyribose. A circle labelled phosphate is joined by a line (covalent bond) to carbon 5, which lies outside the ring. A rectangle labelled nitrogenous base (for example adenine) is joined to carbon 1, on the opposite side."},{"l":"e","m":1,"q":"List the purines and pyrimidines of DNA.","pts":["purines: *adenine* and *guanine*; pyrimidines: cytosine and thymine (both groups correct needed)"],"hl":true,"mod":""}],"hl":false,"mk":9,"mkSL":3},{"qid":2006,"p":"1B","t":"B2.1","also":["D2.3","D3.3"],"title":"Water channels in frog eggs","blocks":[{"k":"p","v":"Frog egg cells normally have very few water channels. In an experiment, 12 eggs were injected with mRNA coding for an aquaporin and 12 control eggs were injected with water. All eggs were then placed in a hypotonic solution and their volume was measured every minute. Volume is given relative to the starting volume."},{"k":"chart","type":"line","title":"Swelling of frog eggs in a hypotonic solution","x":"Time / min","y":"Mean relative volume","s":[{"n":"Aquaporin mRNA","pts":[["0",1.0],["1",1.08],["2",1.17],["3",1.27],["4",1.38]]},{"n":"Control","pts":[["0",1.0],["1",1.01],["2",1.02],["3",1.03],["4",1.04]]}]},{"k":"p","v":"All the eggs injected with aquaporin mRNA burst between 4 and 5 minutes."}],"parts":[{"l":"a","m":1,"q":"State the direction of net water movement in both groups of eggs.","pts":["*into* the eggs, from the hypotonic solution (by osmosis)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Explain the difference between the two groups.","pts":["eggs with aquaporin mRNA increased in volume much faster: 1.38 compared with 1.04 at 4 minutes","the eggs *translated* the injected mRNA and inserted *aquaporins* into their plasma membrane","aquaporins increase permeability to water, so water entered by osmosis much faster","control eggs have very few water channels, so water only enters slowly through the bilayer / the eggs with aquaporins swelled until they burst"],"hl":false,"mod":""},{"l":"c","m":1,"q":"Outline why results are shown as relative volume rather than actual volume.","pts":["eggs differ in *starting size*, so relative volume (volume ÷ starting volume) allows a fair comparison of the change between eggs / groups"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Comment on the reliability of the results.","pts":["for: 12 eggs per group and use of means / control group / large, consistent difference between groups","against: no error bars / standard deviation shown, so the variability is not known / only one experiment was done"],"hl":false,"mod":""},{"l":"e","m":3,"q":"Discuss the role of aquaporins in the collecting ducts of the kidney when the blood is too concentrated.","pts":["*hypothalamus* osmoreceptors detect the high solute concentration of the blood","the posterior pituitary secretes *ADH*, which reaches the kidney in the blood","ADH causes more *aquaporins* to be inserted (from vesicles) into the membranes of collecting duct cells","permeability to water increases and more water is reabsorbed by osmosis into the *hypertonic* medulla and then the blood","a small volume of concentrated urine is produced and blood concentration returns to the set point","evaluation: aquaporins allow rapid adjustment of water reabsorption without making new proteins, but urine cannot be more concentrated than the medulla"],"hl":true,"mod":"When the blood is too concentrated, osmoreceptors in the hypothalamus detect it and the posterior pituitary secretes ADH, which reaches the kidneys in the blood. ADH causes vesicles containing aquaporins to fuse with the membranes of collecting duct cells, so their permeability to water increases. More water is therefore reabsorbed by osmosis into the hypertonic medulla and from there into the blood, a small volume of concentrated urine is produced, and blood concentration returns to the set point. An advantage of this mechanism is that it is rapid, because existing aquaporins are simply inserted into or removed from the membrane."},{"l":"f","m":2,"q":"Explain why there is usually a delay between injecting mRNA and observing its effect.","pts":["the mRNA must be *translated* by ribosomes, which takes time","the polypeptide must fold / be modified in the rough ER and Golgi apparatus","the protein is transported in *vesicles* and inserted into the plasma membrane","enough aquaporins must be in the membrane for the effect to be measurable"],"hl":false,"mod":""}],"hl":false,"mk":10,"mkSL":7},{"qid":2007,"p":"1B","t":"C1.2","also":["B2.2"],"title":"Antibiotics that block ATP synthase","blocks":[{"k":"p","v":"Two drugs, X and Y, were tested as inhibitors of ATP synthase extracted from a bacterium. Relative activity was measured at different drug concentrations. A value of 1.0 is the activity with no drug."},{"k":"chart","type":"logline","title":"Effect of two inhibitors on ATP synthase","x":"Drug concentration / µM (log scale)","y":"Relative activity","s":[{"n":"Drug X","pts":[["0.001",1.0],["0.01",0.98],["0.1",0.85],["1",0.45],["10",0.12],["100",0.05]]},{"n":"Drug Y","pts":[["0.001",1.0],["0.01",1.0],["0.1",0.99],["1",0.95],["10",0.7],["100",0.3]]}]}],"parts":[{"l":"a","m":1,"q":"Identify the two independent variables in this investigation.","pts":["the type of drug (X or Y) *and* the drug concentration (µM) (both required)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Outline how temperature could be kept constant.","pts":["carry out the assays in a *thermostatically controlled water bath* / an incubator at a fixed temperature","monitor the temperature with a thermometer during the assay and adjust if it changes / equilibrate solutions to that temperature beforehand"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain the benefit of using a logarithmic scale for drug concentration.","pts":["the concentrations span five *orders of magnitude* (0.001 to 100 µM)","on a linear scale the low values (0.001–1 µM) would be crowded together near zero and could not be distinguished","on a log scale each tenfold increase takes the same space, so all the points and the trend can be seen clearly","it makes it easier to compare the concentrations at which X and Y reduce activity (e.g. by half)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Compare the effectiveness of drugs X and Y.","pts":["X is more effective: it inhibits ATP synthase at much lower concentrations than Y","data quoted: at 1 µM, X reduces activity to *0.45* but Y only to *0.95* / at 10 µM, X 0.12 vs Y 0.70","both have little effect at very low concentrations (≤ 0.01 µM, activity ≥ 0.98)","both reduce activity at high concentrations, but even at 100 µM X (0.05) inhibits more than Y (0.30)","X halves activity at about 1 µM, whereas Y needs about 30 µM (between 10 and 100 µM)"],"hl":false,"mod":""},{"l":"e","m":1,"q":"State the precise location of ATP synthase in a mitochondrion.","pts":["in the *inner mitochondrial membrane* / on the cristae"],"hl":true,"mod":""},{"l":"f","m":3,"q":"Explain how ATP synthase produces ATP.","pts":["the electron transport chain uses energy from electrons to pump protons from the matrix into the intermembrane space","a *proton gradient* is created (high concentration in the intermembrane space)","the inner membrane is impermeable to protons, which can only return to the matrix through ATP synthase","protons diffuse down their gradient through ATP synthase: *chemiosmosis*","the flow of protons makes part of ATP synthase rotate","the energy is used to phosphorylate ADP + Pi to form ATP (oxidative phosphorylation)"],"hl":true,"mod":"The electron transport chain in the inner mitochondrial membrane uses energy from electrons to pump protons from the matrix into the intermembrane space, creating a proton gradient. Because the inner membrane is impermeable to protons, they can only return to the matrix by diffusing through the channel in ATP synthase; this is chemiosmosis. The flow of protons makes part of ATP synthase rotate, and the energy released is used to phosphorylate ADP with inorganic phosphate to form ATP."}],"hl":false,"mk":10,"mkSL":6},{"qid":2008,"p":"1B","t":"B3.3","also":["C3.1"],"title":"Flexibility and age","blocks":[{"k":"p","v":"A physiotherapy clinic measured the maximum angle of knee flexion (how far the knee can bend) in healthy volunteers. The table shows the means, with 95 % confidence intervals in brackets."},{"k":"table","cap":"Mean maximum knee flexion / degrees","rows":[["Age group / years","Females","Males"],["5–12","150.4 (148.9–151.9)","146.2 (144.8–147.6)"],["13–25","143.0 (141.6–144.4)","141.5 (139.9–143.1)"],["26–50","140.1 (139.0–141.2)","136.8 (135.6–138.0)"],["51–75","135.2 (133.9–136.5)","130.0 (128.7–131.3)"]]}],"parts":[{"l":"a","m":1,"q":"State what the values in brackets represent.","pts":["the *95 % confidence interval*: the range within which there is a 95 % probability that the true population mean lies"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Calculate the percentage decrease in mean knee flexion for males from the youngest to the oldest group.","pts":["(146.2 − 130.0) ÷ 146.2 × 100 = *11.1 %* (accept 11 %)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"State two conclusions that can be drawn from the data.","pts":["maximum knee flexion *decreases with age* in both sexes (e.g. males: from 146.2° to 130.0°)","females have greater flexion than males in every age group","the difference between sexes is *significant* in the 5–12, 26–50 and 51–75 groups because the confidence intervals do not overlap; in 13–25 they overlap, so it is not significant"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Describe how the range of motion of a joint can be measured.","pts":["a *goniometer* is used (or photographs / videos are analysed with computer software)","the pivot / centre of the goniometer is placed over the axis of rotation of the joint","each arm is aligned with the long axis of the bone on each side (e.g. femur and tibia)","the angle is measured at full flexion and at full extension; the range is the *difference* between them","the measurement is repeated several times / on several people and a mean calculated, with the same posture and the same warm-up conditions"],"hl":false,"mod":"Range of motion is measured with a goniometer. Its pivot is placed over the axis of rotation of the joint and each arm is aligned with the long axis of the bone on each side, for example the femur and tibia at the knee. The angle is read at full flexion and at full extension, and the range of motion is the difference between them. For a reliable measurement, it is repeated several times and a mean calculated, keeping the same posture."},{"l":"e","m":2,"q":"Distinguish between the skeletons of arthropods and vertebrates.","pts":["arthropods: external *exoskeleton*; vertebrates: internal *endoskeleton*","arthropods: made of *chitin*; vertebrates: made of bone (and cartilage)","in arthropods muscles attach to the inner surface of the skeleton; in vertebrates to the outer surface of bones (via tendons)","the exoskeleton does not grow and must be moulted; the endoskeleton grows with the organism"],"hl":false,"mod":""}],"hl":true,"mk":9,"mkSL":9},{"qid":2009,"p":"2","t":"D4.2","also":["C4.1"],"title":"Mussels as water cleaners","blocks":[{"k":"p","v":"Freshwater mussels filter algae and cyanobacteria from water. Researchers placed mussels in tanks of lake water rich in cyanobacteria, at two levels of dissolved oxygen (DO). The control tank had no mussels. The concentration of chlorophyll is proportional to the density of cyanobacteria."},{"k":"chart","type":"line","title":"Chlorophyll concentration in the tanks","x":"Time / h","y":"Chlorophyll / µg L⁻¹","s":[{"n":"Mussels, DO 8 mg L⁻¹","pts":[["0",320.0],["4",210.0],["8",140.0],["12",95.0],["16",70.0],["20",55.0],["24",45.0]]},{"n":"Mussels, DO 1 mg L⁻¹","pts":[["0",320.0],["4",300.0],["8",285.0],["12",270.0],["16",262.0],["20",255.0],["24",250.0]]},{"n":"Control (no mussels)","pts":[["0",320.0],["4",325.0],["8",332.0],["12",338.0],["16",345.0],["20",350.0],["24",356.0]]}]}],"parts":[{"l":"a","m":1,"q":"State the chlorophyll concentration in the control after 16 hours.","pts":["345 µg L⁻¹"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Suggest a reason for the change in the control.","pts":["cyanobacteria photosynthesised and reproduced, so their density increased (from 320 to 356 µg L⁻¹)","there were no mussels / filter feeders to remove them"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Compare and contrast the filtration by mussels at the two oxygen levels.","pts":["at both levels chlorophyll decreased, whereas in the control it increased (from 320 to 356 µg L⁻¹)","the decrease was much greater at DO 8 mg L⁻¹ (320 to 45 µg L⁻¹) than at DO 1 mg L⁻¹ (320 to 250 µg L⁻¹)","at DO 8 mg L⁻¹ the decrease was rapid at first (320 to 210 µg L⁻¹ in 4 h) and then slowed; at DO 1 mg L⁻¹ it was slow throughout"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Calculate the percentage decrease in chlorophyll with mussels at DO 8 mg L⁻¹ over 24 hours.","pts":["decrease = 320 – 45 = 275 µg L⁻¹","275 ÷ 320 × 100 = 86% (85.9%)"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Explain why mussels filtered less at low dissolved oxygen.","pts":["with little oxygen there is less *aerobic cell respiration*, so less ATP is produced","anaerobic cell respiration produces very little ATP per glucose","less energy is available to move the gill cilia that pump water, so a smaller volume is filtered","mussels may close their shells / reduce activity to save energy"],"hl":false,"mod":""},{"l":"f","m":2,"q":"Explain how mussels could help to reduce the effects of eutrophication in a lake.","pts":["mussels filter out algae / cyanobacteria, so the algal bloom is reduced and the water becomes clearer","more light reaches submerged plants, which continue to photosynthesise and release oxygen","fewer algae die, so there is less organic matter for decomposers","decomposing bacteria use less oxygen (lower biochemical oxygen demand), so oxygen is not depleted and fish do not die"],"hl":false,"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":2010,"p":"2","t":"C2.1","also":["C3.1"],"title":"Epinephrine and its receptor","blocks":[{"k":"p","v":"Epinephrine (adrenaline) is released by the adrenal glands. It binds to a G protein-coupled receptor (GPCR) in the plasma membrane of liver and muscle cells."}],"parts":[{"l":"a","m":1,"q":"State which molecule is the ligand in this system.","pts":["*epinephrine* (adrenaline)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain how epinephrine causes liver cells to release glucose without entering the cell.","pts":["epinephrine binds to the binding site of the *GPCR* on the outer face of the membrane (it does not need to enter the cell)","binding changes the conformation of the receptor, which activates the *G protein* on the inner face (GDP replaced by GTP)","the activated G protein activates adenylyl cyclase, which converts ATP into *cAMP*","cAMP acts as a *second messenger* and activates a protein kinase","a kinase cascade activates enzymes (glycogen phosphorylase) that break down *glycogen* into glucose","each step of the cascade amplifies the signal: one epinephrine molecule leads to many glucose molecules","glucose leaves the cell into the blood by facilitated diffusion"],"hl":false,"mod":"Epinephrine is hydrophilic, so it does not enter the cell: it binds to the binding site of the GPCR on the outer face of the membrane. This binding changes the conformation of the receptor, which activates the G protein on the inner face by replacing its GDP with GTP. The activated G protein activates adenylyl cyclase, which converts ATP into cAMP. cAMP acts as a second messenger and activates a cascade of protein kinases that activates the enzyme that breaks glycogen down into glucose, amplifying the signal at each step. Glucose then leaves the cell into the blood by facilitated diffusion."},{"l":"c","m":2,"q":"Describe two ways in which epinephrine helps muscles to contract intensely.","pts":["increases heart rate / stroke volume, so more blood (O₂ and glucose) reaches the muscles","dilates arterioles supplying skeletal muscles (and constricts those to the gut), diverting blood to the muscles","dilates bronchioles / increases ventilation rate, so more O₂ is absorbed","stimulates glycogen breakdown in liver and muscle, so more glucose is available for cell respiration"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Distinguish between the action of epinephrine and the action of a steroid hormone.","pts":["epinephrine is hydrophilic and does not cross the membrane; steroid hormones are hydrophobic / lipid-soluble and cross the membrane","epinephrine binds to a receptor in the *plasma membrane*; steroids bind to receptors in the *cytoplasm / nucleus*","epinephrine acts via a second messenger (cAMP); the steroid–receptor complex acts directly as a transcription factor, regulating *gene expression*","the response to epinephrine is rapid and short-lived (activates existing enzymes); the steroid response is slower and longer-lasting (new proteins are synthesised)"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":2011,"p":"2"
