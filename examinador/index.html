s se fusionan y el núcleo del espermatozoide entra. Después, cambios en la zona pelúcida impiden la entrada de más espermatozoides, y los cromosomas de ambos gametos se combinan formando un cigoto diploide."},{"l":"c","m":7,"hl":false,"q":"Explique el uso de hormonas en la fecundación in vitro (FIV), comparándolo con el control hormonal del ciclo menstrual natural.","pts":["en el ciclo natural, la *FSH* de la hipófisis estimula el desarrollo de folículos, normalmente madura uno","el estradiol de los folículos provoca el pico de *LH*, que causa la ovulación","la *progesterona* del cuerpo lúteo mantiene el endometrio","en la FIV primero se administra un fármaco que detiene la secreción de FSH y LH de la hipófisis","así se controla el momento del ciclo / se evita la ovulación espontánea","después se inyectan dosis altas de FSH para que se desarrollen *muchos folículos* (superovulación)","una inyección de *hCG* (actúa como la LH) completa la maduración de los ovocitos unas 36 h antes de recogerlos","los ovocitos se extraen y se fecundan con espermatozoides en el laboratorio","se transfieren uno o dos embriones al útero","se administra progesterona para mantener el endometrio y favorecer la implantación"],"mod":"En el ciclo menstrual natural, la FSH de la hipófisis estimula el desarrollo de folículos, de los que normalmente madura uno; el estradiol que este produce provoca un pico de LH que causa la ovulación, y después la progesterona del cuerpo lúteo mantiene el endometrio. En la FIV se toma el control de este sistema. Primero se administra un fármaco que detiene la secreción de FSH y LH de la hipófisis, para controlar el momento del ciclo y evitar una ovulación espontánea. Luego se inyectan dosis de FSH mucho mayores que las naturales, de modo que se desarrollan muchos folículos a la vez. Una inyección de hCG, que actúa como el pico de LH, completa la maduración de los ovocitos unas 36 horas antes de recogerlos. Los ovocitos se fecundan en el laboratorio, uno o dos embriones se transfieren al útero y se administra progesterona para mantener el endometrio, igual que hace el cuerpo lúteo en el ciclo natural."}],"hl":false,"mk":16,"mkSL":16},{"qid":3023,"p":"2X","t":"D3.3","also":["C1.2"],"title":"Respuesta extensa: control del medio interno","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Resuma el papel de la retroalimentación negativa en la homeostasis.","pts":["*homeostasis* = mantener el medio interno dentro de límites estrechos","cada variable tiene un *valor de referencia* (por ejemplo, 37 °C)","los *receptores* detectan un cambio respecto al valor de referencia","un centro de control (hipotálamo, páncreas) envía señales nerviosas u hormonales","los *efectores* producen una respuesta que invierte el cambio","la variable fluctúa ligeramente alrededor del valor de referencia","a diferencia de la retroalimentación positiva, que amplifica el cambio"],"mod":"La homeostasis consiste en mantener el medio interno dentro de límites estrechos alrededor de un valor de referencia, como 37 °C para la temperatura. Se basa en la retroalimentación negativa: los receptores detectan una desviación respecto al valor de referencia, un centro de control como el hipotálamo o el páncreas envía señales nerviosas u hormonales, y los efectores producen una respuesta que invierte el cambio. Por eso la variable fluctúa ligeramente alrededor del valor de referencia, al contrario que en la retroalimentación positiva, que amplifica el cambio."},{"l":"b","m":4,"hl":false,"q":"Compare y contraste las funciones de la insulina y el glucagón.","pts":["ambas son hormonas secretadas por los islotes del *páncreas*","ambas actúan sobre el hígado / regulan la *glucemia* por retroalimentación negativa","la insulina la secretan las células β; el glucagón, las células α","la insulina se secreta cuando la glucemia es alta; el glucagón, cuando es baja","la insulina estimula la captación de glucosa por las células (músculo, tejido adiposo)","la insulina estimula la síntesis de *glucógeno*; el glucagón, su degradación a glucosa","la insulina reduce la glucemia; el glucagón la aumenta (efectos antagónicos)"],"mod":"La insulina y el glucagón son hormonas secretadas por los islotes del páncreas que regulan la glucemia por retroalimentación negativa, actuando ambas sobre el hígado. Sin embargo, la insulina la producen las células β cuando la glucemia es alta, mientras que el glucagón lo producen las células α cuando es baja. La insulina estimula la captación de glucosa por las células y la síntesis de glucógeno en el hígado y los músculos, reduciendo la glucemia; el glucagón estimula la degradación del glucógeno a glucosa y la aumenta. Por eso tienen efectos antagónicos."},{"l":"c","m":8,"hl":false,"q":"Explique cómo un mamífero genera y conserva calor cuando la temperatura ambiente es baja.","pts":["los *termorreceptores* de la piel (y del hipotálamo) detectan el descenso de temperatura","el *hipotálamo* actúa como centro de control de la termorregulación","*vasoconstricción* de las arteriolas de la piel: llega menos sangre a la superficie","se pierde menos calor por radiación / conducción desde la piel","*erección del vello*: atrapa una capa de aire aislante","*escalofríos*: contracciones musculares rápidas que aumentan la respiración celular","la respiración celular libera parte de la energía como calor","la *grasa parda* tiene muchas mitocondrias y realiza respiración desacoplada","la energía se libera como calor en lugar de usarse para producir ATP","la *tiroxina* aumenta la tasa metabólica / la producción de calor","la capa de grasa subcutánea actúa como aislante","todo es retroalimentación negativa: al volver la temperatura al valor de referencia, las respuestas se reducen"],"mod":"Cuando la temperatura ambiente baja, los termorreceptores de la piel detectan el descenso y envían impulsos al hipotálamo, que actúa como centro de control. Para conservar calor, las arteriolas de la piel se contraen (vasoconstricción), de modo que llega menos sangre a la superficie y se pierde menos calor por radiación; además, la erección del vello atrapa una capa de aire aislante y la grasa subcutánea reduce la pérdida. Para generar calor se producen escalofríos: contracciones musculares rápidas que aumentan la respiración celular, que libera parte de la energía como calor. La grasa parda, con muchas mitocondrias, realiza respiración desacoplada, en la que la energía se libera como calor en lugar de producir ATP. La tiroxina aumenta la tasa metabólica y, por tanto, la producción de calor. Es un ejemplo de retroalimentación negativa: cuando la temperatura vuelve al valor de referencia, estas respuestas se reducen."}],"hl":false,"mk":16,"mkSL":16},{"qid":3024,"p":"2X","t":"D4.3","also":["D4.2","C4.2"],"title":"Respuesta extensa: ecosistemas, carbono y clima","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Describa cómo se pueden usar los mesocosmos para investigar la estabilidad de los ecosistemas.","pts":["*mesocosmo* = ecosistema pequeño y cerrado montado para experimentar (por ejemplo, un frasco sellado o un acuario)","contiene productores, consumidores y *descomponedores* con suelo o agua","recibe luz como aporte de energía, pero la materia se recicla dentro","se cambia una sola variable (por ejemplo, luz, temperatura, presencia de descomponedores)","se mantienen constantes las demás variables / se usan réplicas y un control","se mide durante semanas si las poblaciones / el O₂ se mantienen estables","consideración ética: evitar el sufrimiento de los animales incluidos"],"mod":"Un mesocosmo es un ecosistema pequeño y cerrado que se monta para experimentar, como un frasco sellado o un acuario con suelo o agua, productores, consumidores y descomponedores. Recibe luz como aporte de energía, pero la materia debe reciclarse dentro. Para investigar la estabilidad se cambia una sola variable, por ejemplo la luz o la presencia de descomponedores, manteniendo constantes las demás y usando réplicas y un control, y se mide durante semanas si las poblaciones o la concentración de O₂ se mantienen estables. Hay que evitar el sufrimiento de los animales incluidos."},{"l":"b","m":5,"hl":false,"q":"Explique cómo los ciclos de retroalimentación positiva pueden acelerar el calentamiento global.","pts":["la *retroalimentación positiva* amplifica un cambio en lugar de invertirlo","el calentamiento derrite el hielo y la nieve, reduciendo el *albedo*","la superficie oscura (agua, suelo) absorbe más radiación y se calienta más, lo que derrite más hielo","el deshielo del *permafrost* permite la descomposición de materia orgánica antes congelada","se libera *metano* y CO₂, gases de efecto invernadero que aumentan el calentamiento","las sequías provocan más *incendios* forestales, que liberan CO₂","los bosques boreales pueden pasar de sumideros a fuentes de carbono","puede alcanzarse un *punto de inflexión* a partir del cual el cambio es difícil de revertir"],"mod":"La retroalimentación positiva amplifica un cambio en lugar de invertirlo. El calentamiento derrite el hielo y la nieve y reduce el albedo, de modo que el agua y el suelo oscuros absorben más radiación, se calientan más y derriten aún más hielo. El deshielo del permafrost permite que se descomponga materia orgánica que estaba congelada, liberando metano y CO₂, gases de efecto invernadero que intensifican el calentamiento. Además, las sequías aumentan los incendios forestales, que liberan CO₂, y los bosques boreales pueden pasar de sumideros a fuentes de carbono. Así se puede alcanzar un punto de inflexión a partir del cual el cambio es difícil de revertir."},{"l":"c","m":7,"hl":false,"q":"Discuta la forestación y la restauración de turberas como formas de secuestro de carbono.","pts":["la *fotosíntesis* fija CO₂ atmosférico en compuestos de carbono de la biomasa","*forestación* = plantar bosques en terrenos donde no los había; los árboles almacenan carbono en la madera y el suelo durante décadas","si se usan especies nativas, también crea hábitat y aumenta la biodiversidad","en las *turberas* el suelo encharcado es anaeróbico / ácido, así que la descomposición es muy lenta","por eso la materia orgánica se acumula y almacena carbono durante miles de años","drenar turberas libera CO₂ al oxidarse la turba; rehumedecerlas detiene esas emisiones","limitación: los bosques pueden arder o morir por sequía y plagas y devolver el carbono","los monocultivos de plantación tienen poca biodiversidad","el secuestro es lento (décadas) y compite con el uso del suelo para la agricultura","las turberas rehumedecidas pueden emitir algo de metano al principio","no sustituyen a la reducción de las emisiones de combustibles fósiles"],"mod":"Ambas estrategias aprovechan el ciclo del carbono. En la forestación se plantan bosques en terrenos donde no los había; por fotosíntesis, los árboles fijan CO₂ atmosférico y almacenan el carbono en la madera y el suelo durante décadas, y si se usan especies nativas también crean hábitat. En las turberas, el suelo encharcado es anaeróbico y ácido, así que la descomposición es muy lenta y la materia orgánica se acumula, guardando carbono durante miles de años; cuando se drenan, la turba se oxida y libera CO₂, de modo que rehumedecerlas detiene esas emisiones. Sin embargo, hay limitaciones: los bosques pueden arder o morir por sequías y plagas y devolver el carbono a la atmósfera; las plantaciones en monocultivo tienen poca biodiversidad; el secuestro es lento y compite con el suelo agrícola; y las turberas rehumedecidas pueden emitir algo de metano al principio. Son medidas útiles, pero no sustituyen a la reducción de las emisiones de combustibles fósiles."}],"hl":false,"mk":16,"mkSL":16},{"qid":3025,"p":"1B","t":"D3.3","also":[],"title":"Una prueba de tolerancia a la glucosa","blocks":[{"k":"p","v":"Dos adultos, X e Y, ayunaron 10 horas y luego bebieron una solución con 75 g de glucosa. Se midió su concentración de glucosa en sangre cada 30 minutos. Una de las dos personas tiene diabetes tipo 2."},{"k":"chart","type":"line","title":"Glucosa en sangre tras beber 75 g de glucosa","x":"Tiempo / min","y":"Glucosa en sangre / mmol dm⁻³","s":[{"n":"Persona X","pts":[[0,5.0],[30,8.2],[60,7.0],[90,5.8],[120,5.2],[150,5.0]]},{"n":"Persona Y","pts":[[0,7.2],[30,12.4],[60,14.0],[90,13.1],[120,11.6],[150,10.2]]}]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Indique la concentración de glucosa en sangre de la persona Y en ayunas.","pts":["7,2 mmol dm⁻³"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calcule el porcentaje de aumento de la glucemia de la persona Y entre 0 min y su valor máximo.","pts":["(14,0 − 7,2) ÷ 7,2 × 100","= 94,4 %","aceptar 94 %"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Sugiera por qué se pidió a ambas personas que ayunaran y que bebieran la misma cantidad de glucosa.","pts":["para que la glucemia inicial no dependa de una comida reciente","para que el único factor que cambie la glucemia sea la glucosa ingerida / *variable controlada*","así las curvas de ambas personas son comparables"],"mod":""},{"l":"d","m":3,"hl":false,"q":"Explique la diferencia entre las curvas de X e Y, identificando qué persona tiene diabetes tipo 2.","pts":["Y tiene diabetes tipo 2: glucemia en ayunas más alta / pico más alto y tardío / no vuelve al valor inicial","en X, la subida de glucosa estimula a las células β a secretar *insulina*","la insulina hace que las células capten glucosa y que el hígado forme glucógeno, así que X vuelve a 5,0 mmol dm⁻³ en unos 120–150 min","en la diabetes tipo 2 las células son *resistentes a la insulina* / responden menos a ella","por eso la glucosa se retira lentamente de la sangre en Y"],"mod":"La persona Y es la que tiene diabetes tipo 2: su glucemia en ayunas ya es alta (7,2 mmol dm⁻³), alcanza un pico más alto y más tardío (14,0 a los 60 min) y a los 150 min sigue muy por encima del valor inicial. En X, la subida de glucosa estimula a las células β del páncreas a secretar insulina, que hace que las células del cuerpo capten glucosa y que el hígado la almacene como glucógeno, de modo que la glucemia vuelve a 5,0 mmol dm⁻³. En la diabetes tipo 2 las células son resistentes a la insulina, así que la glucosa se retira de la sangre muy lentamente."}],"hl":false,"mk":8,"mkSL":8},{"qid":3026,"p":"1B","t":"D3.1","also":["C1.1"],"title":"Temperatura y germinación de semillas","blocks":[{"k":"p","v":"Un estudiante colocó 20 semillas de rábano sobre papel de filtro húmedo en cada una de tres placas de Petri por temperatura, en incubadoras a distintas temperaturas. Tras 5 días contó las semillas germinadas en cada placa."},{"k":"table","cap":"Semillas germinadas de 20 por placa tras 5 días","rows":[["Temperatura / °C","Placa 1","Placa 2","Placa 3"],["5","2","1","3"],["10","8","10","9"],["15","15","16","14"],["20","18","19","17"],["25","19","18","20"],["30","14","12","13"],["35","4","5","3"]]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Identifique la variable independiente.","pts":["la *temperatura*"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calcule el porcentaje medio de germinación a 20 °C.","pts":["media = (18 + 19 + 17) ÷ 3 = 18 semillas","18 ÷ 20 × 100","= 90 %"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Deduzca la temperatura óptima para la germinación de estas semillas, justificando su respuesta con los datos.","pts":["25 °C (aceptar entre 20 y 25 °C)","a 25 °C la media es la más alta: 19 de 20 = 95 %","la germinación disminuye por debajo (5–15 °C) y por encima (30–35 °C) de esa temperatura"],"mod":""},{"l":"d","m":2,"hl":false,"q":"Explique la baja germinación a 5 °C.","pts":["la germinación depende de *enzimas* que movilizan las reservas de la semilla","a baja temperatura las moléculas tienen menos energía cinética / hay menos choques enzima-sustrato","la respiración celular es lenta y hay poco ATP para el crecimiento del embrión"],"mod":""},{"l":"e","m":2,"hl":false,"q":"Sugiera dos variables que el estudiante debería controlar y cómo hacerlo.","pts":["volumen de *agua* añadida a cada placa (misma cantidad, medida con probeta / pipeta)","especie / lote / edad de las semillas (mismo paquete)","exposición a la luz (todas las incubadoras a oscuras / misma iluminación)","tipo de papel de filtro / número de semillas por placa / tiempo de incubación"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3027,"p":"1B","t":"D4.3","also":[],"title":"Una planta alpina que sube por la montaña","blocks":[{"k":"p","v":"En una cordillera se registró cada 10 años la altitud media del límite inferior de distribución de una especie de planta alpina en 12 laderas. También se registró la temperatura media de julio en una estación meteorológica cercana."},{"k":"table","cap":"Límite inferior de la planta y temperatura media de julio","rows":[["Año","Altitud media del límite inferior / m","Temperatura media de julio / °C"],["1990","2150","9,8"],["2000","2185","10,1"],["2010","2230","10,6"],["2020","2270","11,0"]]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Indique el cambio total en la altitud del límite inferior entre 1990 y 2020.","pts":["aumentó 120 m (de 2150 a 2270 m)"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calcule la velocidad media de desplazamiento del límite inferior en metros por década.","pts":["120 m ÷ 3 décadas","= 40 m por década","unidad correcta (m por década)"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Evalúe si estos datos demuestran que el aumento de temperatura causó el desplazamiento.","pts":["hay una *correlación* positiva: al subir la temperatura (1,2 °C), sube el límite","pero correlación no implica *causalidad*","otros factores podrían influir (pastoreo, competencia, cambios en el uso del suelo) / solo hay 4 puntos de datos / una sola estación meteorológica"],"mod":""},{"l":"d","m":3,"hl":false,"q":"Explique por qué las especies de montaña se desplazan a mayor altitud con el calentamiento global y por qué esto puede amenazarlas.","pts":["cada especie tiene un rango de *tolerancia* térmica","al calentarse, las zonas bajas superan su tolerancia / especies de zonas más bajas y cálidas suben y las desplazan por *competencia*","las zonas altas se vuelven adecuadas, así que el área se desplaza montaña arriba","la superficie disponible disminuye con la altitud / el hábitat se reduce","al llegar a la cima no pueden subir más: riesgo de *extinción* local"],"mod":"Cada especie vive dentro de un rango de tolerancia térmica. Con el calentamiento global, las zonas bajas de su distribución superan esa tolerancia y, además, especies propias de altitudes más bajas y cálidas suben y compiten con ella, mientras que las zonas más altas, antes demasiado frías, se vuelven adecuadas. Por eso el área de distribución se desplaza montaña arriba. Esto la amenaza porque la superficie disponible disminuye con la altitud, de modo que su hábitat se reduce, y cuando llega a la cima ya no puede subir más, con riesgo de extinción local."}],"hl":false,"mk":8,"mkSL":8}]}};</script>
<script>
"use strict";
/* ---------- state ---------- */
const PK="axisz.examinador.v1";
let P={};try{P=JSON.parse(localStorage.getItem(PK))||{};}catch(e){}
P.lang=P.lang==="en"?"en":"es";P.lvl=P.lvl==="HL"?"HL":"SL";P.hist=P.hist||[];P.drafts=P.drafts||{};
const save=()=>{try{localStorage.setItem(PK,JSON.stringify(P));}catch(e){}};
const L=(en,es)=>P.lang==="es"?es:en;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);};
let D,Q,TM;
function build(){D=KDATA[P.lang];TM={};D.topics.forEach(t=>TM[t.c]=t);const hl=P.lvl==="HL";
  Q=D.wr.filter(w=>hl||!w.hl).map(w=>{const q=Object.assign({},w);if(!hl){q.parts=w.parts.filter(p=>!p.hl);q.mk=w.mkSL;}return q;}).filter(q=>q.parts.length);}
const PL=()=>({"1B":L("Paper 1B · data-based","Prueba 1B · análisis de datos"),"2":L("Paper 2 · short answer","Prueba 2 · respuesta corta"),"2X":L("Paper 2 · extended response","Prueba 2 · respuesta extensa"),"own":L("Your own question","Pregunta propia")});
const PSW={"1B":"1B","2":"P2","2X":"ER","own":"★"};

/* ---------- text analysis ---------- */
const SUB={"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","⁺":"+","⁻":"-","²":"2","³":"3"};
const STOP=new Set(("de la el los las un una unos unas y o en con por para del al que se es son su sus lo como mas más muy pero sin sobre entre cada este esta estos estas ese esa ser hay tiene tienen puede pueden cuando donde desde hasta tambien también otro otra otros otras mismo misma ya no si sí le les nos fue han hace hacen asi así cual cuál "+
"the a an and or of in on to for with by from as at is are be been being it its this that these those their there which who whom into than then so such not no can may also more most other each some any both either between within per via was were has have had will would should could do does").split(" "));
const norm=s=>String(s).replace(/[₀-₉⁺⁻²³]/g,c=>SUB[c]).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const stem=w=>w.length>6?w.slice(0,6):w;
function toks(s){return norm(s).replace(/\([^)]*\)/g," ").split(/[^a-z0-9+\-]+/).filter(w=>w&&(w.length>=4||/\d/.test(w)||/^(co2|o2|atp|adn|arn|dna|rna|nad|ph|h2o|ldl|hdl|lh|fsh|adh)$/.test(w))&&!STOP.has(w)).map(stem);}
function ansSet(a){const s=new Set(toks(a));return s;}
function kwList(t){return [...String(t).matchAll(/\*([^*]+)\*/g)].map(m=>m[1]);}
function scorePoint(pt,A){let best={c:0,kw:true,hit:[]};
  String(pt).split(/\s\/\s/).forEach(alt=>{const kws=kwList(alt);const clean=alt.replace(/\*/g,"");const tk=[...new Set(toks(clean))];if(!tk.length)return;
    const has=tk.filter(t=>A.has(t));const kwOk=kws.every(k=>{const kt=toks(k);return kt.length&&kt.every(t=>A.has(t));});
    const c=has.length/tk.length;if(c+(kwOk?0.001:0)>best.c+(best.kw?0.001:0)||(kwOk&&!best.kw&&c>=best.c-0.15))best={c,kw:kwOk,hit:has};});
  const st=best.c>=0.5&&best.kw?"g":(best.c>=0.3||(best.kw&&best.c>=0.25))?"p":"n";return {st,c:best.c,hit:best.hit};}
function ideas(a){return String(a).split(/[.;\n•]+|\s(?:y además|además|and also|also)\s/i).map(s=>s.trim()).filter(s=>s.split(/\s+/).filter(Boolean).length>=4).length;}
const CAUSE=/\b(porque|ya que|debido|por (lo )?tanto|por eso|asi que|así que|lo que (provoca|causa|permite|hace)|provoca|causa|permite|de modo que|por consiguiente|en consecuencia|because|therefore|so that|thus|hence|due to|leads? to|causes?|results? in|which means|allowing|allows)\b/i;
const CONTR=/\b(mientras|en cambio|a diferencia|por el contrario|sin embargo|whereas|while|unlike|in contrast|however|but|pero|mayor|menor|más|menos|higher|lower|greater|smaller|more|less|faster|slower)\b/i;
const BOTH=/\b(ambos|ambas|los dos|las dos|igual que|al igual|both|similarly|also|like)\b/i;
const BAL=/\b(sin embargo|por otro lado|no obstante|aunque|pero|however|on the other hand|although|but|whereas)\b/i;
const CONCL=/\b(en conclusi[oó]n|por lo tanto|en general|en definitiva|concluyo|in conclusion|overall|therefore|on balance)\b/i;
function ctOf(q){const l=norm(q);let best=null;(D.ct||[]).forEach(c=>{const n=norm(c[0]);const v=P.lang==="es"?[n,n.replace(/(.+)a$/,"$1e"),n.replace(/e$/,"a"),n.replace(/e$/,"a").replace(/ y contraste$/," y contrasta")]:[n];if(v.some(x=>l.startsWith(x))&&(!best||c[0].length>best[0].length))best=c;});return best;}
function ctKey(q){const l=norm(q);const m=[["explain","expli"],["distinguish","disting"],["compare and contrast","compare y contr"],["compare","compar"],["calculate","calcul"],["evaluate","evalu"],["discuss","discut"],["suggest","sugier"],["describe","descri"],["outline","resum"],["state","indiqu"],["state","indica"],["deduce","deduz"],["determine","determin"],["predict","predig"],["draw","dibuj"],["identify","identif"],["estimate","estim"],["analyse","analic"],["define","defin"],["justify","justifiq"]];
  for(const [en,es] of m){if(l.startsWith(en)||l.startsWith(es))return en;}return "";}
function hasData(q){return (q.blocks||[]).some(b=>b.k==="table"||b.k==="chart");}
function unitsOf(q){const u=new Set();(q.blocks||[]).forEach(b=>{const heads=b.k==="table"?b.rows[0]:b.k==="chart"?[b.x,b.y]:[];heads.forEach(h=>{const m=String(h).split("/");if(m.length>1)u.add(m.slice(1).join("/").trim());});});return [...u].filter(x=>x&&x.length<18);}
function checks(q,p,a){const out=[];const k=ctKey(p.q);const txt=String(a);const n=ideas(txt);
  if(!txt.trim()){out.push(["w",L("No answer written for this part.","No escribiste nada en este apartado.")]);return out;}
  if(p.m>=2&&n<p.m)out.push(["w",L(`You made about ${n} separate point(s) for ${p.m} marks. Write at least one distinct idea per mark.`,`Escribiste unas ${n} idea(s) distintas para ${p.m} puntos. Escribe al menos una idea distinta por punto.`)]);
  else if(p.m>=2)out.push(["o",L(`About ${n} separate ideas for ${p.m} marks: good amount.`,`Unas ${n} ideas distintas para ${p.m} puntos: buena cantidad.`)]);
  if(k==="explain"&&!CAUSE.test(txt))out.push(["w",L("“Explain” needs reasons: link cause → effect with “because”, “so”, “therefore”.","«Explique» exige razones: une causa → efecto con «porque», «por lo tanto», «lo que provoca».")]);
  if((k==="distinguish"||k==="compare and contrast")&&!CONTR.test(txt))out.push(["w",L("Mention both things in each point and use contrast words (“whereas”, “higher than”).","Menciona las dos cosas en cada punto y usa palabras de contraste («mientras que», «mayor que»).")]);
  if(k==="compare"&&!(BOTH.test(txt)||CONTR.test(txt)))out.push(["w",L("“Compare” asks for similarities (and differences), referring to both items each time.","«Compare» pide semejanzas (y diferencias), nombrando ambos elementos cada vez.")]);
  if((k==="evaluate"||k==="discuss")&&!(BAL.test(txt)&&CONCL.test(txt)))out.push(["w",L("Give both sides and finish with a justified conclusion.","Da argumentos a favor y en contra y termina con una conclusión justificada.")]);
  if(k==="calculate"){if(!/\d/.test(txt))out.push(["w",L("A calculation needs numbers: show the working and the final value.","Un cálculo necesita números: muestra el procedimiento y el valor final.")]);else if(!/[=×x\/÷*+\-]/.test(txt))out.push(["w",L("Show your working, not only the answer.","Muestra el procedimiento, no solo el resultado.")]);}
  if(hasData(q)&&(k==="describe"||k==="compare"||k==="compare and contrast"||k==="distinguish"||k==="deduce"||k==="analyse"||/dato|data|gr[aá]fic|graph|tabla|table/i.test(p.q))&&!/\d/.test(txt))out.push(["w",L("Quote values from the data to support your answer.","Cita valores de los datos para apoyar tu respuesta.")]);
  const U=unitsOf(q);if(/\d/.test(txt)&&U.length&&(k==="calculate"||hasData(q))){const nt=norm(txt).replace(/\s/g,"");const ok=U.some(u=>nt.includes(norm(u).replace(/\s/g,"").replace(/[⁻-]1/g,"")));if(!ok)out.push(["w",L("Check your units (data uses: ","Revisa las unidades (los datos usan: ")+U.join(", ")+")."]);}
  if((k==="state"||k==="identify")&&p.m===1&&txt.length>220)out.push(["w",L("“State/Identify” only needs a short answer; don't lose time.","«Indique/Identifique» solo pide una respuesta corta; no pierdas tiempo.")]);
  return out;}

/* ---------- rendering helpers ---------- */
const ptHTML=t=>esc(t).replace(/\*([^*]+)\*/g,'<u class="kw">$1</u>');
function tableHTML(rows,cap){return `<div class="tscroll">${cap?`<div class="dcap">${esc(cap)}</div>`:""}<table class="dt"><thead><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
const nf=v=>P.lang==="es"?String(v).replace(".",","):String(v);
function niceStep(r){const raw=r/5,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function chartSVG(b){const W=660,H=340,ml=64,mr=18,mt=20,mb=58,iw=W-ml-mr,ih=H-mt-mb;const cols=["var(--tA)","var(--tD)","var(--tB)","var(--tC)"];
  const ys=b.s.flatMap(s=>s.pts.map(p=>p[1]));let y0=Math.min(0,...ys),y1=Math.max(...ys);const st=niceStep((y1-y0)||1);y0=Math.floor(y0/st)*st;y1=Math.ceil(y1/st)*st;const Y=v=>mt+ih-(v-y0)/((y1-y0)||1)*ih;let g="",mk="";
  for(let v=y0;v<=y1+1e-9;v+=st){const yy=Y(v);g+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="13" fill="var(--muted)">${nf(+v.toFixed(2))}</text>`;}
  if(b.type==="bar"){const cats=b.s[0].pts.map(p=>p[0]);const gw=iw/cats.length,bw=Math.min(46,gw*.7/b.s.length);cats.forEach((c,i)=>{const cx=ml+gw*i+gw/2;b.s.forEach((s,k)=>{const v=s.pts[i][1];const x=cx-bw*b.s.length/2+k*bw;mk+=`<rect x="${x+2}" y="${Y(Math.max(v,0))}" width="${bw-4}" height="${Math.abs(Y(v)-Y(0))}" rx="4" fill="${cols[k]}"/><text x="${x+bw/2}" y="${Y(Math.max(v,0))-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${nf(v)}</text>`;});mk+=`<text x="${cx}" y="${H-mb+18}" text-anchor="middle" font-size="13" fill="var(--muted)">${esc(c)}</text>`;});}
  else{const lg=b.type==="logline",T=v=>lg?Math.log10(v):v;const xs=b.s.flatMap(s=>s.pts.map(p=>+p[0]));const x0=Math.min(...xs.map(T)),x1=Math.max(...xs.map(T));const X=v=>ml+(T(v)-x0)/((x1-x0)||1)*iw;
    [...new Set(xs)].sort((a,c)=>a-c).forEach(v=>{mk+=`<text x="${X(v)}" y="${H-mb+18}" text-anchor="middle" font-size="13" fill="var(--muted)">${nf(v)}</text>`;});
    b.s.forEach((s,k)=>{mk+=`<polyline points="${s.pts.map(p=>X(+p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="${cols[k]}" stroke-width="3"/>`+s.pts.map(p=>`<circle cx="${X(+p[0])}" cy="${Y(p[1])}" r="4.5" fill="var(--surface)" stroke="${cols[k]}" stroke-width="2.5"/>`).join("");});}
  const ax=`<line x1="${ml}" x2="${ml}" y1="${mt}" y2="${H-mb}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${ml}" x2="${W-mr}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="var(--ink)" stroke-width="1.5"/>`;
  const lab=`<text x="${ml+iw/2}" y="${H-12}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${esc(b.x)}</text><text transform="translate(16,${mt+ih/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${esc(b.y)}</text>`;
  const leg=b.s.length>1?`<div class="tip">${b.s.map((s,k)=>`<span style="color:${cols[k]}">■</span> ${esc(s.n)}`).join(" &nbsp; ")}</div>`:"";
  return `<figure><figcaption>${esc(b.title)}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.title)}">${g}${ax}${mk}${lab}</svg>${leg}</figure>`;}
const blocksHTML=q=>(q.blocks||[]).map(b=>b.k==="p"?`<p class="intro">${esc(b.v)}</p>`:b.k==="table"?tableHTML(b.rows,b.cap):chartSVG(b)).join("");

  <div class="list">${list.map(q=>{const b=best(q.qid);return `<button class="item ${tcls(q)}" data-q="${q.qid}"><span class="sw">${PSW[q.p]}</span><span><span class="tt">${esc(q.title)}</span><br><span class="sub">${esc(q.t)} ${esc(TM[q.t]?TM[q.t].n:"")} · ${q.mk} ${L("marks","puntos")}</span></span><span class="sc">${b?b.s+"/"+b.mk:""}</span></button>`;}).join("")||`<p class="muted">${L("No questions match.","No hay preguntas que coincidan.")}</p>`}</div>`;

let S=null;
function openQ(id,own){const q=own||Q.find(x=>x.qid===id);if(!q)return;const key=(own?"own":q.qid)+"_"+P.lvl+"_"+P.lang;
  S={q,key,ans:(P.drafts[key]&&P.drafts[key].ans)||{},plan:(P.drafts[key]&&P.drafts[key].plan)||{},phase:"write",ticks:{}};go("q");}
function saveDraft(){if(!S)return;P.drafts[S.key]={ans:S.ans,plan:S.plan};save();}
VIEWS.q=m=>{if(!S)return go("home");const q=S.q;if(S.phase==="mark")return markView(m);const mins=Math.round(q.mk*(q.p==="1B"?1.6:1.9));

  <div class="row" style="justify-content:space-between;margin-top:12px"><div><div class="eyebrow">${PL()[q.p]} · ${q.mk} ${L("marks","puntos")} · ${L("aim for","objetivo")} ~${mins} min</div><h1>${esc(q.title)}</h1></div><button class="btn ghost sm" id="tmr">⏱ ${mins} min</button></div>
  <div class="qcard ${tcls(q)}">${blocksHTML(q)}
  ${q.parts.map((p,i)=>{const ct=ctOf(p.q);const big=p.m>=4;return `<div class="part"><div class="ph"><span class="l">(${esc(p.l)})</span><span class="q">${esc(p.q)}</span><span class="m">[${p.m}]</span></div>

    ${big?`<details class="planner" ${S.plan[i]&&S.plan[i].length?"open":""}><summary>🧭 ${L("Plan first (recommended for ","Planifica primero (recomendado para ")}${p.m} ${L("marks)","puntos)")}</summary><p class="tip">${L("One line per idea. Chain cause → mechanism → consequence. Aim for more ideas than marks.","Una línea por idea. Encadena causa → mecanismo → consecuencia. Apunta a más ideas que puntos.")}</p><div data-plan="${i}">${(S.plan[i]&&S.plan[i].length?S.plan[i]:[{k:"c",t:""}]).map((x,j)=>ideaRow(i,j,x)).join("")}</div><div class="row"><button class="btn ghost sm" data-addidea="${i}">+ ${L("idea","idea")}</button><button class="btn ghost sm" data-useplan="${i}">⤵ ${L("Turn plan into draft","Pasar el plan al borrador")}</button><span class="counter" id="pc${i}"></span></div></details>`:""}
    <textarea rows="${p.m>=6?8:p.m>=3?5:2}" data-a="${i}" placeholder="${L("Your answer…","Tu respuesta…")}">${esc(S.ans[i]||"")}</textarea><div class="counter" id="ac${i}"></div></div>`;}).join("")}</div>
  <button class="btn brand" id="mark" style="width:100%;padding:16px;font-size:18px">✓ ${L("Check my answer","Corregir mi respuesta")}</button>`;
  const upd=i=>{const p=q.parts[i];const n=ideas(S.ans[i]||"");const el=$("#ac"+i);if(el){el.textContent=(S.ans[i]||"").trim()?L(`~${n} idea(s) · ${p.m} mark(s)`,`~${n} idea(s) · ${p.m} punto(s)`):"";el.className="counter "+((S.ans[i]||"").trim()?(n>=p.m?"ok":"low"):"");}
    const pc=$("#pc"+i);if(pc){const k=(S.plan[i]||[]).filter(x=>x.t.trim()).length;pc.textContent=L(`${k} ideas planned / ${p.m} marks`,`${k} ideas planificadas / ${p.m} puntos`);pc.className="counter "+(k>p.m?"ok":"low");}};
  q.parts.forEach((_,i)=>upd(i));
  $$("[data-a]",m).forEach(t=>t.oninput=()=>{S.ans[t.dataset.a]=t.value;saveDraft();upd(+t.dataset.a);});
  const bindPlan=()=>{$$("[data-pi]",m).forEach(inp=>inp.oninput=()=>{const [i,j]=inp.dataset.pi.split("-").map(Number);S.plan[i]=S.plan[i]||[];S.plan[i][j]=S.plan[i][j]||{k:"c",t:""};S.plan[i][j].t=inp.value;saveDraft();upd(i);});
    $$("[data-pk]",m).forEach(sel=>sel.onchange=()=>{const [i,j]=sel.dataset.pk.split("-").map(Number);S.plan[i]=S.plan[i]||[];S.plan[i][j]=S.plan[i][j]||{k:"c",t:""};S.plan[i][j].k=sel.value;saveDraft();});};
  bindPlan();
  $$("[data-addidea]",m).forEach(b=>b.onclick=()=>{const i=+b.dataset.addidea;S.plan[i]=S.plan[i]&&S.plan[i].length?S.plan[i]:[{k:"c",t:""}];S.plan[i].push({k:"m",t:""});const box=$(`[data-plan="${i}"]`,m);box.innerHTML=S.plan[i].map((x,j)=>ideaRow(i,j,x)).join("");bindPlan();upd(i);$$(`[data-pi^="${i}-"]`,m).pop().focus();});
  $$("[data-useplan]",m).forEach(b=>b.onclick=()=>{const i=+b.dataset.useplan;const lines=(S.plan[i]||[]).map(x=>x.t.trim()).filter(Boolean);if(!lines.length)return toast(L("Write some ideas first.","Escribe primero algunas ideas."));const t=$(`[data-a="${i}"]`,m);t.value=(t.value.trim()?t.value.trim()+"\n":"")+lines.map(x=>/[.!?]$/.test(x)?x:x+".").join(" ");S.ans[i]=t.value;saveDraft();upd(i);t.focus();});
  let iv=null;$("#tmr").onclick=e=>{const b=e.currentTarget,end=Date.now()+mins*6e4;clearInterval(iv);iv=setInterval(()=>{const l=end-Date.now();if(l<=0){b.textContent=L("⏰ Time!","⏰ ¡Tiempo!");b.className="timer low";clearInterval(iv);return;}b.className="timer"+(l<6e4?" low":"");b.textContent=String(Math.floor(l/6e4)).padStart(2,"0")+":"+String(Math.floor(l%6e4/1e3)).padStart(2,"0");},500);};
  cleanup=()=>clearInterval(iv);
  $("#mark").onclick=()=>{const total=Object.values(S.ans).join("").trim().length;if(total<10)return toast(L("Write your answer first.","Escribe primero tu respuesta."));S.phase="mark";S.res=null;render();window.scrollTo(0,0);};};
function ideaRow(i,j,x){const K=[["c",L("Cause","Causa")],["m",L("Mechanism","Mecanismo")],["e",L("Effect","Consecuencia")],["d",L("Data/example","Dato/ejemplo")]];
  return `<div class="idea"><select data-pk="${i}-${j}" aria-label="${L("Type","Tipo")}">${K.map(([k,n])=>`<option value="${k}" ${x.k===k?"selected":""}>${n}</option>`).join("")}</select><input type="text" data-pi="${i}-${j}" value="${esc(x.t)}" placeholder="${L("Idea","Idea")} ${j+1}"></div>`;}

/* ---------- marking ---------- */
function analyse(){const q=S.q;S.res=q.parts.map((p,i)=>{const A=ansSet(S.ans[i]||"");const pts=p.pts.map(t=>scorePoint(t,A));return {pts,flags:checks(q,p,S.ans[i]||"")};});
  S.res.forEach((r,i)=>r.pts.forEach((x,j)=>{if(S.ticks[i+"-"+j]===undefined)S.ticks[i+"-"+j]=x.st==="g";}));}
function partScore(p,i){const n=p.pts.filter((_,j)=>S.ticks[i+"-"+j]).length;return p.pts.length===1?(n?p.m:0):Math.min(n,p.m);}
function autoRange(){let lo=0,hi=0;S.q.parts.forEach((p,i)=>{const r=S.res[i].pts;const g=r.filter(x=>x.st==="g").length,pp=r.filter(x=>x.st==="p").length;const cap=v=>p.pts.length===1?(v?p.m:0):Math.min(v,p.m);lo+=cap(g);hi+=cap(g+pp);});return [lo,hi];}
function hilite(text,hits){if(!hits.size)return esc(text);return esc(text).replace(/[A-Za-zÀ-ÿ0-9₀-₉]+/g,w=>hits.has(stem(norm(w).replace(/[^a-z0-9+\-]/g,"")))?`<mark class="hit">${w}</mark>`:w);}
function markView(m){const q=S.q;if(!S.res)analyse();const [lo,hi]=autoRange();
  m.innerHTML=`<button class="btn ghost sm" id="back">← ${L("Edit my answer","Editar mi respuesta")}</button>
  <div style="margin-top:12px"><div class="eyebrow">${PL()[q.p]} · ${L("automatic check","revisión automática")}</div><h1>${esc(q.title)}</h1>
  <div class="card"><b>${L("Estimated mark: ","Nota estimada: ")}<span class="est">${lo===hi?lo:lo+"–"+hi} / ${q.mk}</span></b><p class="tip" style="margin:6px 0 0">${L("Green = probably credited; amber = partly there, check the wording; grey = missing. The tool compares words, so it can miss a correct idea written differently or credit a wrong one. Tick what an examiner would really accept.","Verde = probablemente acreditado; ámbar = está a medias, revisa la redacción; gris = falta. La herramienta compara palabras, así que puede no reconocer una idea correcta dicha de otra forma o dar por buena una incorrecta. Marca lo que un examinador realmente aceptaría.")}</p></div></div>
  ${q.parts.map((p,i)=>{const r=S.res[i];const hits=new Set(r.pts.flatMap(x=>x.st!=="n"?x.hit:[]));return `<div class="res"><div class="rh"><span>(${esc(p.l)}) ${esc(p.q)}</span><span class="est" id="ps${i}">${partScore(p,i)}/${p.m}</span></div><div class="rb">
    <div class="eyebrow">${L("Your answer","Tu respuesta")}</div><div class="yours">${hilite(S.ans[i]||"—",hits)}</div>
    ${r.flags.map(([k,t])=>`<div class="flag ${k}">${k==="w"?"⚠️":"✅"} <span>${esc(t)}</span></div>`).join("")}
    <div class="eyebrow" style="margin-top:8px">${L("Markscheme","Esquema de calificación")} · ${p.pts.length>p.m?L("any ","cualquier ")+p.m+" · ":""}${L("max","máx.")} ${p.m}</div>
    ${p.pts.map((t,j)=>{const x=r.pts[j];const tag=x.st==="g"?L("found","hallado"):x.st==="p"?L("partial","parcial"):L("missing","falta");return `<label class="pt ${x.st} ${S.ticks[i+"-"+j]?"on":""}"><input type="checkbox" data-t="${i}-${j}" ${S.ticks[i+"-"+j]?"checked":""}><span class="tag">${tag}</span><span>${ptHTML(t)}</span></label>`;}).join("")}
    ${p.mod?`<details class="mod"><summary>${L("Model answer (grade 7)","Respuesta modelo (nivel 7)")}</summary><p style="font-weight:600;margin:8px 0 0">${esc(p.mod)}</p></details>`:""}</div></div>`;}).join("")}
  <div class="ai"><h3>🤖 ${L("Get a full examiner correction","Corrección completa de examinador")}</h3><p class="tip" style="margin-top:0">${L("Copy this prompt and paste it into Claude or another AI chat. It contains the question, the markscheme, IB marking rules and your answer.","Copia este mensaje y pégalo en Claude u otro chat de IA. Contiene la pregunta, el esquema, las reglas de corrección del IB y tu respuesta.")}</p>
    <textarea id="prompt" readonly>${esc(buildPrompt())}</textarea><div class="row" style="margin-top:8px"><button class="btn brand" id="copy">📋 ${L("Copy prompt","Copiar mensaje")}</button><a class="btn ghost" href="https://claude.ai/new" target="_blank" rel="noopener">${L("Open Claude ↗","Abrir Claude ↗")}</a></div></div>
  <div class="scorebar"><span>${L("Your mark","Tu nota")}</span><b id="tot"></b><span class="row"><button class="btn pop sm" id="save">${L("Save","Guardar")}</button><button class="btn sm" id="again">${L("Retry","Reintentar")}</button></span></div>`;
  const tot=()=>{let s=0;q.parts.forEach((p,i)=>{const v=partScore(p,i);s+=v;const e=$("#ps"+i);if(e)e.textContent=v+"/"+p.m;});s=Math.min(s,q.mk);$("#tot").textContent=s+" / "+q.mk;return s;};tot();
  $$("[data-t]",m).forEach(c=>c.onchange=()=>{S.ticks[c.dataset.t]=c.checked;c.closest(".pt").classList.toggle("on",c.checked);tot();});
  $("#back").onclick=()=>{S.phase="write";render();};
  $("#again").onclick=()=>{S.ans={};S.ticks={};S.res=null;S.phase="write";saveDraft();render();};
  $("#copy").onclick=async()=>{const t=$("#prompt");try{await navigator.clipboard.writeText(t.value);}catch(e){t.select();document.execCommand&&document.execCommand("copy");}toast(L("Prompt copied","Mensaje copiado"));};
  $("#save").onclick=()=>{const s=tot();const errs={};q.parts.forEach((p,i)=>S.res[i].flags.forEach(([k,t])=>{if(k!=="w")return;const c=/units|unidades/i.test(t)||/data|datos/i.test(t)?"dt":/ideas?|point|punto/i.test(t)?"np":"ct";errs[c]=1;}));
    const missKw=q.parts.some((p,i)=>p.pts.some((t,j)=>kwList(t).length&&!S.ticks[i+"-"+j]));if(missKw)errs.kw=1;
    if(s<q.mk*0.5)errs.cn=1;
    P.hist.push({id:q.own?"own":q.qid,t:q.t,title:q.title,p:q.p,lvl:P.lvl,s,mk:q.mk,d:new Date().toISOString().slice(0,10),e:Object.keys(errs)});P.hist=P.hist.slice(-400);save();toast(L("Saved: ","Guardado: ")+s+"/"+q.mk);};}
function buildPrompt(){const q=S.q,es=P.lang==="es";const blk=(q.blocks||[]).map(b=>b.k==="p"?b.v:b.k==="table"?(b.cap?b.cap+"\n":"")+b.rows.map(r=>"| "+r.join(" | ")+" |").join("\n"):(es?"Gráfico: ":"Graph: ")+b.title+" ("+b.x+" vs "+b.y+")\n"+b.s.map(s=>(s.n?s.n+": ":"")+s.pts.map(p=>"("+p[0]+", "+p[1]+")").join(" ")).join("\n")).join("\n\n");
  const parts=q.parts.map((p,i)=>`(${p.l}) ${p.q} [${p.m}]\n${es?"Esquema de calificación":"Markscheme"} (${p.pts.length>p.m?(es?"cualquier ":"any ")+p.m:(es?"máx. ":"max ")+p.m}):\n${p.pts.map(t=>"- "+t.replace(/\*([^*]+)\*/g,"$1 [término clave obligatorio]".replace("término clave obligatorio",es?"término clave obligatorio":"required key term"))).join("\n")}\n${es?"RESPUESTA DEL ALUMNO":"STUDENT ANSWER"}:\n"""\n${(S.ans[i]||"").trim()||(es?"(en blanco)":"(blank)")}\n"""`).join("\n\n");
  return es?`Actúa como un examinador experto del IB de Biología (programa con primera evaluación en 2025, nivel ${P.lvl==="SL"?"Medio":"Superior"}). Corrige la respuesta del alumno con el esquema de calificación, de forma estricta pero justa.

Reglas:
- Un punto por cada idea del esquema que esté clara y sea correcta; no superes el máximo de cada apartado.
- Acepta redacciones equivalentes (OWTTE), pero no ideas vagas, incompletas o contradictorias. Si el alumno escribe algo incorrecto que contradice una idea correcta, no la acredites.
- Los términos marcados como "término clave obligatorio" deben aparecer (o un sinónimo técnico exacto) para dar ese punto.
- Comprueba que la respuesta hace lo que pide el término de instrucción (p. ej. "Explique" exige razones; "Distinga" exige diferencias que nombren ambos elementos).
- En preguntas con datos, exige valores citados con unidades cuando proceda.
- No inventes puntos que no estén en el esquema salvo que sean biología correcta y claramente equivalente; si los aceptas, dilo.

PREGUNTA: ${q.title}${q.t?" ("+q.t+")":""}
${blk?blk+"\n\n":""}${parts}

Responde en español con este formato:
1. Una tabla por apartado: punto del esquema | ¿acreditado? (✔/✘) | cita de la frase del alumno que lo justifica.
2. Nota de cada apartado y nota total /${q.mk}.
3. Los 3 errores más importantes y cómo evitarlos en el examen.
4. Una versión mejorada de la respuesta del alumno, de nivel 7, que conserve su estilo y obtenga todos los puntos.`:
`Act as an expert IB Biology examiner (syllabus first assessed in 2025, ${P.lvl==="SL"?"Standard":"Higher"} Level). Mark the student's answer against the markscheme, strictly but fairly.

Rules:
- One mark per markscheme idea that is clear and correct; never exceed each part's maximum.
- Accept equivalent wording (OWTTE) but not vague, incomplete or contradictory ideas. If the student writes something wrong that contradicts a correct idea, do not credit it.
- Points flagged "required key term" need that term (or an exact technical synonym) to be credited.
- Check the answer does what the command term asks (e.g. "Explain" needs reasons; "Distinguish" needs differences naming both items).
- For data questions, require quoted values with units where relevant.
- Do not invent marks outside the markscheme unless the biology is correct and clearly equivalent; if you accept one, say so.

QUESTION: ${q.title}${q.t?" ("+q.t+")":""}
${blk?blk+"\n\n":""}${parts}

Reply in English using this format:
1. A table per part: markscheme point | credited? (✔/✘) | quote from the student's answer that justifies it.
2. Mark for each part and total /${q.mk}.
3. The 3 most important mistakes and how to avoid them in the exam.
4. An improved grade-7 version of the student's answer that keeps their style and earns every mark.`;}

/* ---------- own question ---------- */
VIEWS.own=m=>{const o=P.own||{};
  m.innerHTML=`<div class="eyebrow">${L("Any question with a markscheme","Cualquier pregunta con esquema")}</div><h1>${L("Your own question","Pregunta propia")}</h1><p class="muted" style="font-weight:600">${L("Paste a question and its markscheme (from your teacher, a textbook or a past paper you are allowed to use). Nothing leaves your device.","Pega una pregunta y su esquema (de tu profesor, del libro o de un examen que puedas usar). Nada sale de tu dispositivo.")}</p>
  <div class="card"><label class="eyebrow" for="oq">${L("Question","Pregunta")}</label><textarea id="oq" rows="3">${esc(o.q||"")}</textarea>
  <div class="row" style="margin:10px 0"><label class="eyebrow" for="om">${L("Marks","Puntos")}</label><input type="number" id="om" min="1" max="20" value="${o.m||4}" style="width:90px"></div>
  <label class="eyebrow" for="ops">${L("Markscheme: one point per line. Use “ / ” for alternatives and *asterisks* for required key terms.","Esquema: un punto por línea. Usa « / » para alternativas y *asteriscos* para términos clave obligatorios.")}</label><textarea id="ops" rows="7" placeholder="${L("e.g.\nwater is *polar*\nhydrogen bonds form between molecules / cohesion","ej.\nel agua es *polar*\nse forman enlaces de hidrógeno entre moléculas / cohesión")}">${esc(o.pts||"")}</textarea>
  <button class="btn brand" id="ogo" style="margin-top:12px">${L("Answer this question →","Responder esta pregunta →")}</button></div>`;
  $("#ogo").onclick=()=>{const qv=$("#oq").value.trim(),pv=$("#ops").value.split("\n").map(s=>s.replace(/^\s*[-•*]\s+/,"").trim()).filter(Boolean),mv=Math.max(1,Math.min(20,+$("#om").value||1));
    if(!qv||!pv.length)return toast(L("Add the question and at least one markscheme point.","Añade la pregunta y al menos un punto del esquema."));
    P.own={q:qv,m:mv,pts:$("#ops").value};save();
    openQ(null,{own:true,qid:-1,p:"own",t:"",title:qv.length>70?qv.slice(0,67)+"…":qv,blocks:[],mk:mv,parts:[{l:"a",q:qv,m:mv,pts:pv,mod:""}]});};};

/* ---------- history ---------- */
VIEWS.hist=m=>{const h=P.hist.filter(x=>x.lvl===P.lvl);const E=[["ct",L("Command term not followed","No seguí el término de instrucción")],["np",L("Fewer ideas than marks","Menos ideas que puntos")],["kw",L("Missing key vocabulary","Faltó vocabulario clave")],["dt",L("Data / units not used","No usé datos o unidades")],["cn",L("Content gaps (under 50%)","Lagunas de contenido (menos del 50 %)")]];
  const cnt={};h.forEach(x=>(x.e||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1));const mx=Math.max(1,...Object.values(cnt));
  const byT={};h.forEach(x=>{if(!x.t)return;const k=x.t;byT[k]=byT[k]||{s:0,m:0};byT[k].s+=x.s;byT[k].m+=x.mk;});
  const weak=Object.entries(byT).map(([k,v])=>[k,Math.round(100*v.s/v.m)]).sort((a,b)=>a[1]-b[1]).slice(0,8);
  m.innerHTML=`<div class="eyebrow">${L("Saved in this browser only","Guardado solo en este navegador")} · ${P.lvl==="SL"?L("SL","NM"):L("HL","NS")}</div><h1>${L("My progress","Mi progreso")}</h1>
  ${h.length?`<h2>${L("Where you lose marks","Dónde pierdes puntos")}</h2><div class="card bars">${E.map(([k,t])=>`<div class="r"><div class="row" style="justify-content:space-between;font-weight:700"><span>${t}</span><span style="font-family:var(--mono)">${cnt[k]||0}</span></div><div class="bar"><i style="width:${100*(cnt[k]||0)/mx}%"></i></div></div>`).join("")}</div>
  ${weak.length?`<h2>${L("Weakest topics","Temas más débiles")}</h2><div class="card bars">${weak.map(([k,v])=>`<div class="r"><div class="row" style="justify-content:space-between;font-weight:700"><span>${esc(k)} ${esc(TM[k]?TM[k].n:"")}</span><span style="font-family:var(--mono)">${v}%</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div>`:""}
  <h2>${L("History","Historial")}</h2><div class="list">${h.slice().reverse().slice(0,60).map(x=>`<div class="item ${x.t?"t"+x.t[0]:""}"><span class="sw">${PSW[x.p]||"?"}</span><span><span class="tt">${esc(x.title)}</span><br><span class="sub">${esc(x.d)} ${esc(x.t||"")}</span></span><span class="sc">${x.s}/${x.mk}</span></div>`).join("")}</div>
  <p style="margin-top:16px"><button class="btn ghost sm" id="clr">${L("Delete my history","Borrar mi historial")}</button></p>`:`<p class="muted" style="font-weight:600">${L("Mark your first answer to see where you lose marks.","Corrige tu primera respuesta para ver dónde pierdes puntos.")}</p>`}`;
  const c=$("#clr");if(c)c.onclick=()=>{if(c.dataset.ok){P.hist=P.hist.filter(x=>x.lvl!==P.lvl);save();render();}else{c.dataset.ok=1;c.textContent=L("Tap again to confirm","Toca otra vez para confirmar");}};};

/* ---------- help ---------- */
VIEWS.help=m=>{m.innerHTML=`<h1>${L("How it works","Cómo funciona")}</h1><div class="card">
  <h3>1. ${L("Instant check (works offline)","Revisión instantánea (sin internet)")}</h3><p>${L("Your answer is compared with each markscheme point: it looks for the important words and the required key terms (highlighted). It also checks the command term, the number of separate ideas against the marks, and whether you quoted data and units. It is fast feedback, not an official mark: always read the markscheme and adjust the ticks.","Tu respuesta se compara con cada punto del esquema: busca las palabras importantes y los términos clave obligatorios (resaltados). También revisa el término de instrucción, el número de ideas distintas frente a los puntos, y si citaste datos y unidades. Es una retroalimentación rápida, no una nota oficial: lee siempre el esquema y ajusta las marcas.")}</p>
  <h3>2. ${L("Full examiner correction","Corrección completa de examinador")}</h3><p>${L("The tool writes a detailed prompt with the question, markscheme, IB marking rules and your answer. Paste it into Claude or another AI chat to get a point-by-point correction and an improved grade-7 answer. This page never sends your answers anywhere.","La herramienta prepara un mensaje detallado con la pregunta, el esquema, las reglas de corrección del IB y tu respuesta. Pégalo en Claude u otro chat de IA para recibir una corrección punto por punto y una versión mejorada de nivel 7. Esta página nunca envía tus respuestas a ningún sitio.")}</p>
  <h3>3. ${L("Exam technique in 5 rules","Técnica de examen en 5 reglas")}</h3><ol class="steps"><li>${L("Read the command term first: it decides what earns marks.","Lee primero el término de instrucción: decide qué da puntos.")}</li><li>${L("One clear idea per mark, and a few spare ones for long answers.","Una idea clara por punto, y algunas de sobra en las respuestas largas.")}</li><li>${L("Use the exact key terms of the syllabus.","Usa los términos clave exactos del programa.")}</li><li>${L("With data: describe the trend, quote values with units, then explain.","Con datos: describe la tendencia, cita valores con unidades y luego explica.")}</li><li>${L("In Section B, choose the question where you can make the most correct points, not the one with the easiest first part.","En la Sección B, elige la pregunta en la que puedas dar más puntos correctos, no la que tenga el primer apartado más fácil.")}</li></ol></div>`;};

build();render();
</script>
