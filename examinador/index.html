,"t":"C1.2","also":["C1.1"],"title":"Glycolysis","blocks":[{"k":"p","v":"In glycolysis, glucose is converted into fructose bisphosphate, which splits into two molecules of triose phosphate. Each triose phosphate is then converted into pyruvate."}],"parts":[{"l":"a","m":2,"q":"State where in this pathway phosphorylation and oxidation take place.","pts":["phosphorylation: at the start, when glucose is converted into *fructose bisphosphate* (2 phosphates added from 2 ATP)","phosphorylation makes the molecule less stable / more reactive, allowing it to split into two triose phosphates","oxidation: when *triose phosphate* is converted into pyruvate (hydrogen removed and NAD reduced)","also accept: phosphorylation of ADP to ATP during conversion of triose phosphate into pyruvate"],"hl":false,"mod":""},{"l":"b","m":1,"q":"State where in the cell glycolysis takes place.","pts":["in the *cytoplasm* (cytosol)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Outline how NAD is made available for glycolysis during anaerobic respiration in human muscle.","pts":["without oxygen, reduced NAD cannot be oxidised by the electron transport chain","reduced NAD transfers hydrogen to *pyruvate* (pyruvate is reduced)","pyruvate is converted to *lactate* and NAD (oxidised) is regenerated","NAD can accept hydrogen again in glycolysis, so glycolysis continues, producing 2 ATP net per glucose"],"hl":false,"mod":""},{"l":"d","m":2,"q":"State the net yield of ATP and reduced NAD from glycolysis of one glucose.","pts":["4 ATP are produced by substrate-level phosphorylation","minus 2 ATP used in the initial phosphorylation = *2 ATP net*","*2 reduced NAD*"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Distinguish between a linear and a cyclical metabolic pathway, using glycolysis as an example.","pts":["in a *linear* pathway the end product differs from the initial substrate and does not regenerate it: glycolysis is linear (glucose → pyruvate)","in a *cyclical* pathway the last step regenerates the starting compound (e.g. the Krebs cycle regenerates the 4C compound / the Calvin cycle regenerates RuBP)"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":2012,"p":"2","t":"A4.1","also":["A4.2"],"title":"Squirrels on two sides of a canyon","blocks":[{"k":"p","v":"Two closely related squirrel species live on opposite rims of a deep canyon, which the squirrels cannot cross. Both are descended from one ancestral population that lived there before the canyon formed."}],"parts":[{"l":"a","m":1,"q":"State the type of speciation shown.","pts":["*allopatric* speciation (by geographical isolation)"],"hl":true,"mod":""},{"l":"b","m":3,"q":"Describe how the two species evolved from the common ancestor.","pts":["the formation of the canyon split the ancestral population in two / caused *geographical isolation*","*gene flow* / interbreeding stopped between the squirrels on the two rims","different *selection pressures* (e.g. climate, food, predators) acted on each rim","different mutations arose / genetic drift occurred in each population","allele frequencies diverged over many generations","*reproductive isolation* developed: they can no longer produce fertile offspring together, so they are separate species"],"hl":false,"mod":"The formation of the canyon split the ancestral population in two and, because the squirrels cannot cross it, gene flow between them stopped. Different selection pressures acted on each rim and different mutations arose, so the allele frequencies of the two populations diverged over many generations. Eventually reproductive isolation developed: they can no longer produce fertile offspring together and are two separate species."},{"l":"c","m":2,"q":"Explain how deforestation could cause a decline in the population of one of these species.","pts":["*habitat loss*: fewer trees for nesting / shelter","loss of *food sources* (seeds, cones, nuts from trees), so competition increases","greater exposure to *predators* because there is less cover","fragmentation isolates small subpopulations / the population cannot escape because the canyon limits its range","as a result fewer individuals survive and reproduce / the death rate exceeds the birth rate"],"hl":false,"mod":""},{"l":"d","m":1,"q":"State one other cause of the current biodiversity crisis.","pts":["overexploitation (overhunting / overfishing) / pollution / *invasive species*","climate change / disease / urbanization / intensive agriculture (monocultures)"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":6},{"qid":2013,"p":"2","t":"D3.2","also":["D1.3","B2.3"],"title":"Haemophilia and gene editing","blocks":[{"k":"p","v":"Haemophilia A is a sex-linked disorder caused by a recessive allele (Xʰ) of a gene on the X chromosome. People with haemophilia lack a working clotting factor."}],"parts":[{"l":"a","m":3,"q":"Using a Punnett grid, deduce the probability that a son of a carrier woman and an unaffected man has haemophilia.","pts":["parental genotypes: mother XᴴXʰ, father XᴴY","gametes: mother Xᴴ and Xʰ; father Xᴴ and Y","correct Punnett grid with offspring XᴴXᴴ, XᴴXʰ, XᴴY and XʰY","of the possible sons (XᴴY and XʰY), one in two is XʰY: probability = *0.5* / 50%","no daughter is affected; half of daughters are carriers / for any child the probability is 0.25"],"hl":false,"mod":"The carrier mother is XᴴXʰ and the unaffected father is XᴴY. The mother produces Xᴴ and Xʰ gametes, and the father Xᴴ and Y gametes. The Punnett grid gives four equally likely combinations: XᴴXᴴ, XᴴXʰ, XᴴY and XʰY. Sons receive the Y from their father, so they can be XᴴY or XʰY; one in two is XʰY, so the probability that a son has haemophilia is 0.5 (50%)."},{"l":"b","m":1,"q":"Explain why haemophilia is much more common in males than in females.","pts":["males have only one X chromosome (the Y lacks this gene), so a single copy of the recessive allele causes the condition","females need two copies of the recessive allele, which is unlikely because the allele is rare"],"hl":false,"mod":""},{"l":"c","m":1,"q":"Distinguish between a deletion mutation and an insertion mutation.","pts":["a deletion removes one or more nucleotides / bases from the sequence; an insertion adds one or more"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Explain how CRISPR–Cas9 could be used to correct the faulty allele.","pts":["a *guide RNA* is designed with a sequence complementary to the target sequence in the faulty gene","the guide RNA binds to Cas9 and directs it to the target sequence by complementary base pairing","*Cas9* is an endonuclease that cuts both strands of the DNA at that point","a DNA template with the correct sequence of the gene is supplied","the cell repairs the cut by copying the template, so the faulty allele is replaced by the correct one","the edited cells express the corrected gene and produce a functional clotting factor"],"hl":true,"mod":"A guide RNA is designed with a sequence complementary to the target sequence in the faulty gene. This RNA binds to the Cas9 enzyme and directs it to the target sequence by complementary base pairing, where Cas9, an endonuclease, cuts both strands of the DNA. If a DNA template with the correct sequence is supplied, the cell copies it when repairing the cut, so the faulty allele is replaced by the correct one. The edited cells then express the corrected gene and produce a functional clotting factor."},{"l":"e","m":1,"q":"Suggest why pluripotent rather than multipotent stem cells might be used in such treatments.","pts":["*pluripotent* cells can differentiate into almost any type of body cell, whereas multipotent cells only form a few related types","so they can give rise to the cell type that makes the clotting factor (e.g. liver cells)"],"hl":false,"mod":""}],"hl":false,"mk":9,"mkSL":6},{"qid":2014,"p":"2","t":"D3.3","also":["D4.3"],"title":"Temperature at two scales","blocks":[{"k":"p","v":"Normal human core body temperature is about 37 °C. The mean global surface temperature has risen by about 1.2 °C since the late 19th century."}],"parts":[{"l":"a","m":2,"q":"Outline two responses of the body when core temperature rises above normal.","pts":["*vasodilation* of skin arterioles: more blood flows near the surface and more heat is lost by radiation","*sweating*: sweat glands secrete sweat, whose evaporation removes heat","the hypothalamus detects the rise and sends nerve impulses to these effectors"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Identify, with a reason, whether these responses are positive or negative feedback.","pts":["*negative* feedback","because they reverse the change and return temperature towards the set point (about 37 °C)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain how burning fossil fuels has contributed to the rise in global temperature.","pts":["combustion releases *CO₂* from carbon stored for millions of years into the atmosphere, so its concentration rises","CO₂ is a *greenhouse gas*","the Earth's surface emits long-wave (infrared) radiation, which CO₂ absorbs and re-emits, partly back towards the Earth","more heat is retained (enhanced greenhouse effect), so mean global temperature rises"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Melting sea ice exposes dark ocean water. Identify, with a reason, whether this causes positive or negative feedback.","pts":["*positive* feedback","dark water reflects less sunlight (lower albedo), so it absorbs more heat and more ice melts: the change is amplified"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Explain one effect of warmer oceans on coral reefs.","pts":["heat stress causes corals to expel their *zooxanthellae* (*bleaching*)","corals lose the carbohydrates from zooxanthellae photosynthesis, their main food source","if warming continues, the corals die","the habitat of many species is lost, so reef biodiversity falls"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":2015,"p":"2","t":"B3.1","also":["B3.2"],"title":"Inside a leaf","blocks":[{"k":"p","v":"A student examined a vertical section through the leaf of a privet plant. From the top, the tissues were: waxy cuticle, upper epidermis, palisade mesophyll, spongy mesophyll with air spaces and a vascular bundle, lower epidermis with stomata."}],"parts":[{"l":"a","m":2,"q":"Suggest functions of the upper epidermis and the palisade mesophyll.","pts":["upper epidermis: secretes the waxy *cuticle*, which reduces water loss / protects against pathogens","upper epidermis: is transparent / lacks chloroplasts, so it lets light through to the mesophyll","palisade mesophyll: main site of *photosynthesis*, with elongated cells packed with chloroplasts","palisade mesophyll: located near the top to absorb the maximum light"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Explain the roles of two leaf structures in gas exchange.","pts":["*stomata* allow CO₂ to diffuse in and O₂ and water vapour to diffuse out","*guard cells* open or close the stomata, balancing CO₂ uptake against water loss","*air spaces* in the spongy mesophyll allow gases to diffuse rapidly to and from all cells","the moist walls of mesophyll cells provide a large surface area where CO₂ dissolves before entering the cells"],"hl":false,"mod":""},{"l":"c","m":2,"q":"State the functions of xylem and phloem in the leaf.","pts":["xylem: brings *water* and mineral ions to the leaf (for photosynthesis / to replace water lost by transpiration)","phloem: carries the products of photosynthesis, mainly *sucrose*, out of the leaf to sinks","xylem also supports the leaf (lignified veins)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Explain why transpiration rate increases on a windy day.","pts":["wind removes the humid air / layer of water vapour that builds up around the stomata","a steep water vapour *concentration gradient* is maintained between the inside of the leaf and the outside air","so water vapour diffuses out through the stomata faster"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":2016,"p":"2","t":"A3.2","also":["A1.2"],"title":"Building cladograms","blocks":[{"k":"p","v":"A cladogram was constructed from differences in the amino acid sequence of the protein cytochrome c in six vertebrates."}],"parts":[{"l":"a","m":2,"q":"Outline what is meant by the root and a node of a cladogram.","pts":["root: the base of the cladogram, representing the *common ancestor* of all the organisms included","node: a branching point where one lineage splits into two (or more)","each node represents the most recent *hypothetical common ancestor* of the clades that branch from it / a speciation event"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Discuss the use of amino acid sequences as the basis for constructing cladograms.","pts":["sequence differences accumulate gradually by mutation, so more differences indicate a more distant relationship","if the rate of change is roughly constant, they act as a *molecular clock* to estimate when groups diverged","they are objective, quantitative data / avoid errors from *convergent evolution* in morphological traits / allow very different organisms to be compared","but the rate of change may vary between proteins / lineages / over time, so molecular clock estimates are approximate","the genetic code is *degenerate*: some DNA mutations do not change the amino acid, so base sequences give more information","a single protein may not reflect the evolutionary history of the whole organism / it is better to use several sequences"],"hl":false,"mod":"Amino acid sequences are useful because differences accumulate gradually by mutation: the more differences between two species, the more distant their relationship, and if the rate is roughly constant they can be used as a molecular clock to estimate when they diverged. They are also objective, quantitative data that are not affected by convergent evolution, unlike morphological traits. However, the rate of change can vary between proteins and lineages, so dates are only approximate, and because the genetic code is degenerate, some DNA mutations do not change the amino acid; for this reason base sequences give more detail than amino acid sequences."},{"l":"c","m":1,"q":"Identify one type of data other than amino acid sequence that can be used to construct a cladogram.","pts":["*base sequences* of DNA / RNA (e.g. ribosomal RNA)","morphological / anatomical traits (shared derived characters)"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Outline the principle of parsimony.","pts":["of all possible cladograms, the one requiring the *fewest evolutionary changes* / mutations to explain the observed differences is chosen as most likely"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":2017,"p":"2","t":"C3.2","also":["A2.3"],"title":"Immunity and vaccines","blocks":[{"k":"p","v":"The graph shows the concentration of specific antibodies in a person's blood after a first exposure to an antigen (day 0) and a second exposure to the same antigen (day 40)."},{"k":"chart","type":"line","title":"Antibody concentration after two exposures","x":"Time / days","y":"Antibody concentration / arbitrary units","s":[{"n":"Antibody","pts":[["0",0.0],["5",2.0],["10",10.0],["15",14.0],["20",9.0],["30",4.0],["40",3.0],["45",60.0],["50",120.0],["60",95.0],["70",70.0]]}]}],"parts":[{"l":"a","m":1,"q":"Distinguish between innate and adaptive immunity.","pts":["innate immunity is *non-specific* (same response to all pathogens); adaptive immunity is *specific* to each antigen","adaptive immunity develops memory after exposure; innate immunity has no memory / does not change with exposure"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain the differences between the primary and secondary responses shown.","pts":["the secondary response is faster: 5 days after exposure there are 60 units (day 45), compared with only 2 units in the primary response (day 5)","the peak is reached sooner: about *10 days* after the second exposure (day 50) compared with about *15 days* in the primary response","the secondary response is much larger: peak of *120* units compared with *14* (about 8–9 times more)","it lasts longer: 30 days after exposure 70 units remain, compared with 4 units 30 days after the primary response","the primary response is slow because there are few specific B-lymphocytes, which must be activated and form clones (clonal selection)","*memory cells* formed in the primary response persist; on second exposure they are activated at once and divide rapidly into plasma cells, which produce more antibody"],"hl":false,"mod":"The secondary response is faster and larger than the primary one: the peak occurs about 10 days after exposure (day 50) instead of about 15 days, and reaches 120 units compared with only 14. It also lasts longer, since 30 days later 70 units remain compared with 4 in the primary response. This is because at the first exposure there are very few B-lymphocytes specific to the antigen, which must be activated and form clones, which takes time. During this response memory cells are formed that persist in the body; on second exposure they are activated at once and divide rapidly into plasma cells, which secrete more antibody, sooner."},{"l":"c","m":2,"q":"Explain why a vaccine can protect against a disease.","pts":["the vaccine contains *antigens* / weakened or inactivated pathogen / mRNA coding for an antigen, without causing the disease","it triggers a primary immune response: specific B-lymphocytes are activated and produce antibodies","*memory cells* are formed and persist in the body","if infection occurs, a rapid and larger secondary response destroys the pathogen before it causes symptoms"],"hl":false,"mod":""},{"l":"d","m":1,"q":"State the term for an infectious disease that can be transmitted from animals to humans.","pts":["*zoonosis*"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":2018,"p":"2","t":"A2.3","also":["A2.1"],"title":"Phage lambda","blocks":[{"k":"p","v":"Bacteriophage lambda is a virus that infects the bacterium Escherichia coli. It has a head made of protein containing double-stranded DNA, attached to a tail."}],"parts":[{"l":"a","m":1,"q":"Identify the part of the virus that encloses its DNA.","pts":["the *capsid* (protein coat)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"State one reason that viruses are not usually considered to be living.","pts":["they are not made of *cells* / have no cytoplasm or ribosomes","they have no *metabolism* of their own / can only reproduce inside a host cell"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain how phage lambda reproduces in the lysogenic cycle.","pts":["the phage attaches to specific receptors on the surface of *E. coli* and injects its DNA into the cell","the phage DNA integrates into the bacterial chromosome and is then called a *prophage*","the phage genes that would produce new viruses are not expressed / are repressed, so the bacterium is not killed","the prophage is *replicated* with the chromosome each time the bacterium divides by binary fission","all daughter cells inherit the prophage, so the number of copies of the virus increases with the bacterial population","a stimulus (e.g. DNA damage / UV radiation) can cause the prophage to excise and enter the *lytic cycle*, producing new phages and lysing the cell"],"hl":false,"mod":"Phage lambda attaches to specific receptors on the surface of E. coli and injects its DNA. In the lysogenic cycle this DNA integrates into the bacterial chromosome as a prophage, and the genes that would produce new viruses stay repressed, so the bacterium remains alive. Each time the bacterium divides by binary fission, the prophage is replicated with the chromosome, so all daughter cells inherit it and the virus multiplies without destroying its host. Later, a stimulus such as DNA damage can activate the prophage, which enters the lytic cycle and produces new phages."},{"l":"d","m":2,"q":"Outline evidence that viruses may have evolved more than once.","pts":["viruses are very diverse in their genetic material: DNA or RNA, single- or double-stranded","they have very different structures (with or without an envelope, different capsid shapes)","there is no gene / feature shared by *all* viruses, so they do not seem to have a common ancestor","some viral genes are more similar to genes of their hosts than to those of other viruses, suggesting they arose separately from different cellular organisms"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":2019,"p":"2","t":"B1.2","also":["B3.3"],"title":"The giant protein titin","blocks":[{"k":"p","v":"Titin is the largest known human protein, a single polypeptide of more than 30 000 amino acids. It contains many repeated folded regions."}],"parts":[{"l":"a","m":1,"q":"State the products of a condensation reaction between two amino acids.","pts":["a *dipeptide* (linked by a peptide bond) and a molecule of *water* (both needed)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Describe how the diversity of amino acids gives proteins a wide range of forms.","pts":["there are 20 amino acids with different *R-groups* (polar, non-polar, acidic, basic, sulfur-containing)","they can be linked in any order and number, so there is a huge number of possible sequences (20ⁿ for n amino acids)","the *sequence* of amino acids determines which bonds / interactions form between R-groups, and therefore how the protein folds","example: hydrophobic R-groups end up inside globular proteins and hydrophilic ones on the surface"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Describe the two types of secondary structure found in proteins.","pts":["*α-helix*: the polypeptide is coiled into a spiral","*β-pleated sheet*: sections of polypeptide lie side by side in a zigzag, forming a sheet","both are held by *hydrogen bonds* between C=O and N–H groups of the backbone (not between R-groups)"],"hl":true,"mod":""},{"l":"d","m":2,"q":"Explain the role of titin in sarcomeres.","pts":["titin is a huge protein that acts as a *spring* and extends from the Z line to the M line","when the muscle is stretched, its folded regions unfold and store *elastic energy*","this energy helps the sarcomere return to its resting length after contraction / relaxation","it prevents the sarcomere from overstretching / keeps the myosin filaments centred in the sarcomere"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":3},{"qid":2020,"p":"2X","t":"A1.1","also":["D3.3","D4.3"],"title":"Extended response: water and life","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline how the cohesive properties of water benefit living organisms.","pts":["water molecules are *polar* and form *hydrogen bonds* with each other, causing cohesion","in xylem, cohesion allows a continuous column of water to be pulled upwards under transpiration tension without breaking","so water can reach the leaves of tall trees without the plant using ATP / passive transport","cohesion produces *surface tension*, which allows some organisms (e.g. pond skaters) to walk on water","surface tension provides a habitat at the water surface (organisms that hang from it)","together with adhesion, cohesion allows water to rise by *capillary action* in soil / cell walls"],"hl":false,"mod":"Water molecules are polar and form hydrogen bonds with each other, which causes cohesion. In plants, cohesion allows the tension generated by transpiration to pull a continuous column of water up the xylem without it breaking, so water reaches the leaves of tall trees without the use of ATP. Cohesion also produces surface tension, which allows insects such as pond skaters to walk on water and provides a habitat at the surface. Together with adhesion, it also allows water to rise by capillary action in soil."},{"l":"b","m":4,"q":"Describe how the melting of sea ice can lead to ecological change.","pts":["*habitat loss* for species that use the ice to hunt, rest or breed (e.g. polar bears, walruses, seals)","polar bears hunt seals from the ice, so their feeding and reproductive success decrease","fewer algae grow under the ice, so there is less food for *krill* and the whole food web (fish, penguins, whales) changes","dark ocean reflects less light than ice (*lower albedo*), absorbs more heat and warming accelerates (positive feedback)","warmer / less saline water alters ocean currents and nutrient *upwelling*, reducing productivity","species shift their range towards the poles and temperate species invade and compete with Arctic species"],"hl":false,"mod":"Melting of sea ice means habitat loss for species that use it to hunt or breed; for example, polar bears hunt seals from the ice, so they have less food and lower reproductive success. With less ice, fewer algae grow beneath it, which reduces the food for krill and affects the whole food web, from fish to whales. In addition, dark ocean reflects less light than ice, absorbs more heat and speeds up warming, a positive feedback. As a result, many species shift their range towards the poles and temperate species compete with Arctic species."},{"l":"c","m":7,"q":"Explain how negative feedback controls the water content of the blood.","pts":["*osmoreceptors* in the hypothalamus detect a rise in the solute concentration of the blood (e.g. due to dehydration)","the posterior pituitary releases *ADH* into the blood","ADH acts on cells in the wall of the *collecting duct* (and distal convoluted tubule)","more *aquaporins* are inserted into their plasma membranes from vesicles","permeability to water increases, so more water is reabsorbed by osmosis into the medulla, which is hypertonic","the reabsorbed water returns to the blood via capillaries / vasa recta","a small volume of concentrated urine is produced","the solute concentration of the blood falls back to the *set point*","the osmoreceptors detect the correction and ADH secretion decreases: the change reverses the stimulus (*negative feedback*)","if the blood is too dilute, less ADH is secreted, aquaporins are removed from the membrane and less water is reabsorbed","a large volume of dilute urine is produced and blood concentration rises to the set point","thirst is also stimulated when solute concentration is high, increasing water intake"],"hl":true,"mod":"When the solute concentration of the blood rises, for example due to dehydration, osmoreceptors in the hypothalamus detect it and the posterior pituitary releases ADH into the blood. ADH acts on cells of the collecting duct and causes more aquaporins to be inserted into their plasma membranes. Permeability to water therefore increases and more water is reabsorbed by osmosis into the hypertonic medulla and from there into the blood, so a small volume of concentrated urine is produced. The solute concentration of the blood returns to the set point and, detecting this, the hypothalamus reduces ADH secretion; because the response reverses the stimulus, this is negative feedback. If the blood is too dilute the opposite happens: less ADH is secreted, aquaporins are removed, less water is reabsorbed and a large volume of dilute urine is produced, until the concentration rises back to the set point."}],"hl":false,"mk":15,"mkSL":8},{"qid":2021,"p":"2X","t":"D1.3","also":["D2.1","D2.2"],"title":"Extended response: genes and cell division","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe the causes and consequences of base substitution mutations.","pts":["rare errors during DNA replication","chemical *mutagens*, e.g. substances in tobacco smoke","high-energy radiation: UV light, X-rays, gamma radiation from radioactive isotopes","one base is replaced by another, so only one codon changes (no frameshift)","it may be *silent* because the genetic code is *degenerate* and the new codon codes for the same amino acid","it may change one amino acid, altering protein folding and function, e.g. sickle-cell anaemia (GAG → GTG: glutamate → valine in haemoglobin)","it may create a *stop codon*, so the protein is shortened and usually non-functional","in germ cells it is passed to offspring; in somatic cells it is not inherited but may cause cancer"],"hl":false,"mod":"Base substitutions can result from rare errors in DNA replication or from mutagens, such as chemicals in tobacco smoke and high-energy radiation (UV, X-rays or gamma). One base is replaced by another, so only one codon changes. Because the genetic code is degenerate, the mutation may be silent if the new codon codes for the same amino acid. If one amino acid changes, protein folding and function may be altered, as in sickle-cell anaemia, where GAG becomes GTG and valine replaces glutamate in haemoglobin. If a stop codon is created, the protein is incomplete. Mutations in germ cells are passed to offspring, whereas those in somatic cells may cause cancer."},{"l":"b","m":4,"q":"Distinguish between cell division by mitosis and by meiosis.","pts":["mitosis: one division; meiosis: two successive divisions","mitosis produces two daughter cells; meiosis produces four","mitosis: keeps the chromosome number (diploid → diploid); meiosis: halves it (diploid → *haploid*)","mitosis: genetically identical daughter cells; meiosis: genetically different","pairing of homologues and *crossing over* only occur in meiosis (prophase I)","in meiosis I homologous chromosomes separate; in mitosis sister chromatids separate","mitosis: growth, tissue repair and asexual reproduction; meiosis: production of gametes / spores"],"hl":false,"mod":"Mitosis involves one division and produces two daughter cells, whereas meiosis involves two successive divisions and produces four. Mitosis keeps the chromosome number, diploid to diploid, and the daughter cells are genetically identical; meiosis halves it, diploid to haploid, and the cells are genetically different. Only in meiosis do homologous chromosomes pair and cross over in prophase I, and in meiosis I homologues separate, whereas in mitosis sister chromatids separate. Mitosis is used for growth, repair and asexual reproduction; meiosis for producing gametes."},{"l":"c","m":7,"q":"Explain how gene expression can be regulated at the level of transcription.","pts":["transcription starts when *RNA polymerase* binds to the *promoter* of the gene","*transcription factors* are proteins that bind to the promoter / to regulatory DNA sequences","activators help RNA polymerase to bind and increase transcription; repressors prevent it","enhancers are regulatory sequences, sometimes far from the gene, that increase transcription when activators bind","DNA is wound around *histones* (nucleosomes); the more condensed the chromatin, the less accessible it is to RNA polymerase","histone *acetylation* loosens chromatin and increases transcription","histone methylation can condense chromatin and reduce transcription","*DNA methylation* (of cytosines, especially in promoters) silences / reduces transcription","these changes are *epigenetic*: they alter expression without changing the base sequence and can be passed to daughter cells","the environment (e.g. diet, pollutants, stress) can modify epigenetic marks / explains differences between monozygotic twins","steroid hormones (e.g. oestrogen) cross the membrane and bind to receptors that act as transcription factors","different cells express different sets of genes, which allows cell differentiation"],"hl":true,"mod":"Transcription begins when RNA polymerase binds to the promoter of the gene, and this binding can be regulated in several ways. Transcription factors are proteins that bind to the promoter or to regulatory sequences: activators help RNA polymerase to bind and increase transcription, whereas repressors prevent it; enhancers, sometimes far from the gene, increase transcription when activators bind. In addition, DNA is wound around histones, and the more condensed the chromatin, the less accessible it is. Histone acetylation loosens chromatin and increases transcription, whereas histone methylation can condense it and reduce transcription; methylation of cytosines in promoter DNA silences genes. These changes are epigenetic, because they alter expression without changing the base sequence, are passed to daughter cells and can be affected by the environment, which explains differences between monozygotic twins. Steroid hormones, such as oestrogen, bind to receptors that act as transcription factors. In this way, different cells express different genes and differentiate."}],"hl":false,"mk":15,"mkSL":8},{"qid":2022,"p":"2X","t":"B2.2","also":["B3.1","C3.2"],"title":"Extended response: working together","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline how organelles cooperate to produce and secrete a protein.","pts":["the gene is *transcribed* in the nucleus and mRNA exits through the nuclear pores","ribosomes on the *rough ER* translate the mRNA and the polypeptide enters the ER lumen, where it folds","the protein is transported in *vesicles* from the ER to the Golgi apparatus","in the *Golgi* it is modified (e.g. glycosylation) and packaged","secretory vesicles fuse with the plasma membrane and release the protein by *exocytosis*","*mitochondria* supply the ATP needed for synthesis and vesicle transport"],"hl":true,"mod":"The gene is transcribed in the nucleus and the mRNA leaves through the nuclear pores. Ribosomes on the rough ER translate it and the polypeptide enters the ER lumen, where it folds. It is then transported in vesicles to the Golgi apparatus, which modifies it, for example by glycosylation, and packages it into secretory vesicles. These fuse with the plasma membrane and release the protein by exocytosis, while mitochondria supply the ATP needed for the whole process."},{"l":"b","m":4,"q":"Describe how muscles cause inhalation.","pts":["the *external intercostal* muscles contract (and the internal intercostals relax)","the ribcage moves upwards and outwards","the *diaphragm* contracts, flattens and moves down","the abdominal wall muscles relax, allowing the abdominal organs to be pushed down","the *volume* of the thoracic cavity / lungs increases","the *pressure* in the lungs falls below atmospheric pressure, so air flows in until pressures are equal"],"hl":false,"mod":"During inhalation, the external intercostal muscles contract while the internal intercostals relax, and the ribcage moves upwards and outwards. At the same time the diaphragm contracts, flattens and moves down, and the abdominal muscles relax. As a result the volume of the thoracic cavity increases, the pressure inside the lungs falls below atmospheric pressure and air flows in until the pressures are equal."},{"l":"c","m":7,"q":"Explain how different blood cells work together to produce adaptive immunity.","pts":["*macrophages* / phagocytes engulf the pathogen, digest it and present its antigens on their membrane","each lymphocyte has receptors specific to one antigen; only those with complementary receptors are activated","*helper T-lymphocytes* with complementary receptors bind to the presented antigen and are activated","B-lymphocytes bind the antigen by means of their membrane-bound antibodies","activated helper T-lymphocytes bind to the specific B-lymphocytes and *activate* them (by chemical signals)","activated B-lymphocytes divide by mitosis to form a clone (*clonal selection / expansion*)","most differentiate into *plasma cells* that secrete large amounts of specific antibodies","antibodies bind to antigens and cause agglutination / neutralization / mark the pathogen for phagocytosis","some activated B- and T-lymphocytes become long-lived *memory cells*","on a second infection, memory cells produce a faster and larger secondary response: *immunity*"],"hl":false,"mod":"When a pathogen enters the body, macrophages engulf it, digest it and present its antigens on their membrane. Each lymphocyte has receptors for only one antigen, so only helper T-lymphocytes with complementary receptors are activated, binding to the presented antigen. Meanwhile, specific B-lymphocytes bind the antigen with their membrane-bound antibodies, and activated helper T-lymphocytes bind to them and activate them with chemical signals. Activated B-lymphocytes divide by mitosis to form a clone, and most differentiate into plasma cells that secrete large amounts of specific antibodies. These antibodies bind to antigens and agglutinate or neutralize the pathogens or mark them for destruction by phagocytes. Some activated lymphocytes become long-lived memory cells, so on a second infection by the same pathogen the secondary response is faster and larger, which is immunity."}],"hl":false,"mk":15,"mkSL":11},{"qid":2023,"p":"2X","t":"D2.1","also":["A2.2","C4.1"],"title":"Extended response: plant and animal cells","blocks":[],"parts":[{"l":"a","m":3,"q":"Distinguish between the structure of plant and animal cells.","pts":["plant: cellulose *cell wall*; animal: no cell wall","plant: chloroplasts (plastids) in many cells; animal: no chloroplasts","plant: large permanent central vacuole; animal: small temporary vacuoles, if any","animal: *centrioles*; most plant cells lack them","carbohydrate store: starch in plants; glycogen in animals","plant: regular, fixed shape; animal: variable / often rounded shape"],"hl":false,"mod":"Plant cells have a cellulose cell wall outside the membrane, which animal cells lack, so plant cells have a regular, fixed shape, whereas animal cells have a variable shape. Many plant cells contain chloroplasts, which are absent from animal cells, and a large permanent central vacuole, whereas animal cells have only small temporary vacuoles. In contrast, animal cells have centrioles, which most plant cells lack. In addition, plant cells store starch and animal cells store glycogen."},{"l":"b","m":4,"q":"Outline adaptations of herbivores for feeding on plants and of plants to resist herbivores.","pts":["mammalian herbivores: broad, flat molars for grinding plant material","insects: chewing mouthparts for eating leaves / piercing–sucking mouthparts for extracting phloem sap (e.g. aphids)","many herbivores have mutualistic gut microbes that digest cellulose (e.g. ruminants)","some herbivores detoxify or store toxic plant chemicals (e.g. monarch butterfly caterpillars)","plants: *physical* defences, such as thorns, hairs and tough leaves","plants: toxic or unpleasant-tasting *secondary compounds* (e.g. alkaloids, tannins)","plants: chemicals that attract predators of the herbivores / latex or resins that trap insects"],"hl":false,"mod":"Mammalian herbivores have broad, flat molars for grinding plant material, and insects have chewing mouthparts for eating leaves or piercing–sucking mouthparts, as in aphids, for extracting phloem sap. Many herbivores, such as ruminants, have mutualistic gut microbes that digest cellulose, and some detoxify or store plant toxins. Plants, in turn, defend themselves physically with thorns, hairs and tough leaves, and chemically with toxic or unpleasant-tasting secondary compounds, such as alkaloids and tannins."},{"l":"c","m":8,"q":"Compare and contrast mitosis and cytokinesis in animal and plant cells.","pts":["in both, DNA is replicated in interphase before mitosis","in both, in prophase chromosomes condense, a spindle of microtubules forms and the nuclear membrane breaks down","in both, chromosomes line up at the equator in metaphase and sister chromatids separate to the poles in anaphase","in both, the nuclear membrane re-forms in telophase","in both, two genetically identical daughter cells are formed, sharing the cytoplasm and organelles","animal cells have *centrioles* at the spindle poles; plant cells do not","animal cytokinesis: a contractile ring of *actin and myosin* forms beneath the membrane at the equator","the ring pulls the membrane inwards (cleavage furrow) until the two cells separate, from the outside inwards","plant cytokinesis: vesicles from the Golgi apparatus gather at the equator and fuse to form a *cell plate*, from the inside outwards","the vesicle membranes form the new plasma membranes and cellulose is deposited, forming a new cell wall","the rigid cell wall prevents furrowing, which is why plant cells form a cell plate"],"hl":false,"mod":"Mitosis is essentially the same in animal and plant cells. In both, DNA is replicated in interphase; in prophase chromosomes condense, a spindle of microtubules forms and the nuclear membrane breaks down; in metaphase chromosomes line up at the equator, in anaphase sister chromatids separate to the poles and in telophase the nuclear membrane re-forms. In both, two genetically identical daughter cells are produced. The main difference in mitosis is that animal cells have centrioles at the spindle poles and plant cells do not. Cytokinesis, however, is different: in animal cells a contractile ring of actin and myosin forms beneath the membrane at the equator and pulls it inwards, forming a cleavage furrow until the two cells separate. In plant cells, the rigid cell wall prevents this furrowing, so vesicles from the Golgi apparatus gather at the equator and fuse to form a cell plate that grows from the inside outwards; their membranes form the new plasma membranes and cellulose is deposited, forming a new wall between the daughter cells."}],"hl":false,"mk":15,"mkSL":15},{"qid":2024,"p":"2X","t":"A4.1","also":["D4.1","A3.2"],"title":"Extended response: evidence and patterns of evolution","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe the evidence for evolution from homologous structures.","pts":["*homologous structures* have the same basic structural plan even though they carry out different functions","example: the *pentadactyl limb* in the human arm, bat / bird wing, whale flipper and horse leg","they have the same bones in the same arrangement: humerus, radius and ulna, carpals, metacarpals and phalanges (five digits)","there would be no functional reason to use the same plan for such different functions (flying, swimming, grasping, running) unless they shared a *common ancestor*","the differences in bone shape / size are due to natural selection in different habitats (*divergent evolution* / adaptive radiation)","*vestigial structures* (e.g. the reduced pelvis of whales) also indicate common ancestry","they are distinguished from analogous structures (e.g. insect and bird wings), which have similar functions but different origins due to convergent evolution"],"hl":false,"mod":"Homologous structures have the same basic plan even though they perform different functions. The classic example is the pentadactyl limb: the human arm, bat wing and whale flipper contain the same bones (humerus, radius, ulna, carpals, metacarpals and phalanges) in the same arrangement. Since there is no functional reason for structures used for flying, swimming or grasping to share the same plan, the explanation is that they are descended from a common ancestor. The differences in shape and size are due to natural selection modifying them for different functions, that is, divergent evolution or adaptive radiation."},{"l":"b","m":3,"q":"Outline the conditions needed for the Hardy–Weinberg equation to apply and how it is used.","pts":["conditions: a *very large* population and *random mating*","conditions: no mutation, no migration (gene flow) and no natural selection / all genotypes with equal reproductive success","equations: p + q = 1 (allele frequencies) and *p² + 2pq + q² = 1* (genotype frequencies)","from the frequency of recessive homozygotes (q²), q is calculated, then p, and hence the frequency of heterozygous *carriers* (2pq)","if observed frequencies differ from expected / change between generations, the population *is evolving* (a condition is not met)"],"hl":true,"mod":"The Hardy–Weinberg equation only applies to a very large population with random mating and no mutation, migration or natural selection. In that case, p + q = 1 for allele frequencies and p² + 2pq + q² = 1 for genotype frequencies. It is used, for example, to calculate the frequency of carriers (2pq) from the frequency of recessive homozygotes (q²), and if observed frequencies do not match the expected ones it can be deduced that the population is evolving."},{"l":"c","m":8,"q":"Explain how cladograms are constructed and used in classification.","pts":["a *clade* is a group consisting of a common ancestor and all its descendants","*base sequences* of DNA / amino acid sequences of proteins (or morphological traits) are compared between species","*shared derived characteristics* are looked for, which indicate that the groups possessing them share a common ancestor","the fewer sequence differences, the closer the relationship and the more recent the branch point","differences accumulate at a roughly constant rate (*molecular clock*), allowing the time of divergence to be estimated","each *node* represents a hypothetical common ancestor / a speciation event; the root is the ancestor of the whole group","the tree requiring the fewest changes is chosen (*parsimony*), usually using computer software","cladograms are *hypotheses* about evolutionary relationships and can be revised with new evidence","in classification the aim is for each taxonomic group to be a clade / natural classification, which reflects evolutionary history and allows traits to be predicted","cladograms have led to *reclassification*: e.g. more than half the species of the figwort family were moved to other families","traditional groups that are not clades (e.g. 'reptiles' without birds) are split or merged so that all groups are clades"],"hl":true,"mod":"A clade is a group made up of a common ancestor and all its descendants, and a cladogram shows the relationships between clades. To construct one, DNA base sequences or protein amino acid sequences are compared between species and shared derived characteristics are identified. The fewer the differences between two species, the closer their relationship and the more recent their branch point; because mutations accumulate at a roughly constant rate, the number of differences acts as a molecular clock. Each node represents a hypothetical common ancestor and, of the possible trees, the one requiring the fewest changes is chosen according to the principle of parsimony. Since cladograms are hypotheses, they can change with new evidence. In classification they are used so that taxonomic groups are clades and reflect evolutionary history; this has led to reclassifications, such as moving more than half the species of the figwort family to other families, or including birds within the reptile clade."}],"hl":false,"mk":15,"mkSL":4},{"qid":2025,"p":"2X","t":"C1.3","also":["C1.2","B4.2"],"title":"Extended response: energy in cells","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain the properties of ATP that make it suitable for distributing energy in cells.","pts":["it is *soluble* in water, so it moves easily through the cytoplasm to where energy is needed","it is *stable* at cytoplasmic pH / is not hydrolysed spontaneously, so energy stays stored until needed","it cannot pass freely through the phospholipid bilayer (charged / hydrophilic), so it stays inside the cell","hydrolysis of the terminal phosphate (ATP → ADP + Pi) releases an amount of energy suitable for cell processes","energy is released quickly, controlled by enzymes, in small amounts as needed (little wasted as heat)","ADP is rapidly rephosphorylated to ATP in cell respiration / photosynthesis, so it is recycled"],"hl":false,"mod":"ATP is soluble in water, so it moves easily through the cytoplasm to the places where energy is needed. It is stable at cellular pH and is not hydrolysed spontaneously, so it holds energy until an enzyme hydrolyses it. Because it is charged, it cannot pass freely through the membrane and stays inside the cell. Hydrolysis of the terminal phosphate to form ADP and phosphate quickly releases an amount of energy suitable for processes such as muscle contraction or active transport, without much being wasted as heat. In addition, ADP is rapidly rephosphorylated to ATP during cell respiration, so ATP is continually recycled."},{"l":"b","m":7,"q":"Describe how plant cells use light energy to produce ATP.","pts":["chlorophyll and accessory pigments in *photosystems* on the thylakoid membranes absorb light","the pigments, grouped in light-harvesting arrays, pass the energy to the *reaction centre* (special pair of chlorophyll a)","electrons in the reaction centre are excited and emitted from photosystem II (photoactivation)","the excited electrons pass along an *electron transport chain* of carriers in the thylakoid membrane","the energy released is used to pump protons from the stroma into the thylakoid lumen / space","*photolysis* of water at photosystem II replaces the electrons and releases O₂ (waste product) and H⁺ in the thylakoid lumen","a proton gradient forms across the thylakoid membrane (high concentration in the lumen)","protons diffuse back into the stroma through *ATP synthase* (*chemiosmosis*)","the energy is used to phosphorylate ADP + Pi to form ATP: *photophosphorylation*","electrons from the chain reach photosystem I, are re-excited and reduce NADP (non-cyclic photophosphorylation)","in cyclic photophosphorylation electrons from photosystem I return to the chain, producing more ATP without reduced NADP","ATP is formed in the stroma, where it is used in the light-independent reactions (Calvin cycle)"],"hl":true,"mod":"Chlorophyll and accessory pigments in the photosystems, located on the thylakoid membranes, absorb light. These pigments are grouped in light-harvesting arrays that pass the energy to the reaction centre, where electrons in a special pair of chlorophyll a molecules are excited. Photosystem II emits these excited electrons, which pass along an electron transport chain in the thylakoid membrane. The electrons lost from photosystem II are replaced by photolysis of water, which releases oxygen as a waste product and protons into the thylakoid lumen.\nAs electrons pass from carrier to carrier, energy is released and used to pump protons from the stroma into the thylakoid lumen. This builds up a proton gradient, and protons diffuse back into the stroma through ATP synthase. This chemiosmosis provides the energy to phosphorylate ADP to form ATP, a process called photophosphorylation. The electrons then reach photosystem I, are re-excited and reduce NADP; in cyclic photophosphorylation, instead, they return to the chain and more ATP is produced. The ATP is released into the stroma, where it is used in the Calvin cycle."},{"l":"c","m":5,"q":"Compare and contrast how different types of heterotrophs obtain energy.","pts":["similarity: all heterotrophs obtain carbon compounds (and their energy) from other organisms, living or dead; they cannot make them from inorganic carbon","similarity: all release energy from these compounds by *cell respiration* to produce ATP","similarity: all must digest large molecules (polymers) into small soluble molecules in order to absorb them","holozoic animals *ingest* food, digest it internally in the digestive system, absorb the products and egest the remains","*saprotrophs* (fungi, bacteria) secrete enzymes onto dead organic matter (*external* digestion) and absorb the products","*detritivores* (e.g. earthworms) ingest dead organic matter and digest it internally","difference: consumers feed on living (or recently killed) organisms, whereas saprotrophs and detritivores use dead organic matter","parasites obtain food from a living host, which they usually harm","*mixotrophs* (e.g. *Euglena*) can photosynthesise when there is light and also obtain carbon compounds heterotrophically"],"hl":false,"mod":"All heterotrophs obtain carbon compounds, and therefore energy, from other organisms, because they cannot make them from CO₂. In every case they must digest large molecules into small soluble ones to absorb them, and then release the energy by cell respiration to produce ATP. The differences are in the food source and where digestion happens. Holozoic animals ingest living or recently killed organisms and digest them internally, egesting the remains. Detritivores, such as earthworms, also ingest and digest internally, but their food is dead organic matter. Saprotrophs, such as fungi and many bacteria, also use dead matter but secrete enzymes onto it and absorb the products, so digestion is external. Parasites obtain food from a living host, and mixotrophs, such as Euglena, can also photosynthesise when there is light."}],"hl":false,"mk":15,"mkSL":8},{"qid":3000,"p":"2X","t":"A2.2","also":["B3.2"],"title":"Extended response: microscopy and the diversity of cells","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Compare and contrast light microscopy and electron microscopy.","pts":["both produce magnified images / in both magnification = image size ÷ actual size","both can use stains or labels to highlight structures","the electron microscope has much higher *resolution* (electrons have a shorter wavelength than light)","the electron microscope gives higher magnification / shows ultrastructure (ribosomes, membranes)","the light microscope can be used to view *living* cells; in the electron microscope specimens are dead / in a vacuum","light microscope images are in colour; electron micrographs are black and white (colour added afterwards)","the light microscope is cheaper, portable and specimen preparation is simpler","modern techniques in electron microscopy: freeze-fracture / cryogenic electron microscopy; in light microscopy: fluorescent stains / immunofluorescence"],"mod":"Both types of microscope produce magnified images, and in both magnification is calculated as image size divided by actual size. The key difference is resolution: because electrons have a much shorter wavelength than light, the electron microscope can distinguish structures that are very close together and reveals ultrastructure, such as ribosomes or membranes, at much higher magnification. In contrast, the light microscope allows living cells to be viewed in colour, whereas in the electron microscope specimens are dead because they are viewed in a vacuum, and the image is black and white. The light microscope is also cheaper and specimen preparation is simple."},{"l":"b","m":5,"hl":false,"q":"Outline how a unicellular organism such as Paramecium carries out the functions of life.","pts":["*nutrition*: takes in food by endocytosis, enclosing it in food vacuoles","food digested by enzymes from lysosomes / digestive vacuoles","*metabolism*: enzyme-catalysed reactions take place in the cytoplasm / cell respiration in mitochondria","*excretion*: metabolic wastes (CO₂, ammonia) leave by diffusion across the membrane","*homeostasis*: contractile vacuoles expel excess water that enters by osmosis","*movement*: beating of cilia moves it","*response to stimuli*: reverses the beating of its cilia on hitting an obstacle / moves towards food","*growth*: increases in size by synthesising its own molecules","*reproduction*: asexual by division (mitosis + cytokinesis) / sexual by conjugation"],"mod":"Paramecium, being a single cell, carries out all the functions of life. It feeds by taking in food particles by endocytosis into food vacuoles, where enzymes from lysosomes digest them. Its metabolism takes place in the cytoplasm, and cell respiration in mitochondria supplies ATP. It excretes wastes such as CO₂ and ammonia by diffusion across its membrane. It maintains homeostasis using contractile vacuoles, which expel water that enters by osmosis. It moves by the beating of its cilia and responds to stimuli by reversing this beating when it hits an obstacle. It grows by synthesising molecules and reproduces asexually by cell division."},{"l":"c","m":7,"hl":false,"q":"Explain why some cells are considered atypical, relating their structure to their function.","pts":["*cell theory* treats the typical cell as a unit with a single nucleus","mature mammalian *red blood cells* (erythrocytes) have no nucleus","no nucleus (or mitochondria) leaves more space for *haemoglobin* / carry more oxygen","biconcave shape: large surface area for diffusion of oxygen / flexible to pass through capillaries","without a nucleus they cannot divide or repair proteins, so they live about 120 days","phloem *sieve tubes* lose their nucleus and most organelles","so they offer less resistance to the flow of phloem sap / sieve plates allow flow between cells","they depend on *companion cells*, linked by plasmodesmata, which supply ATP and proteins","*skeletal muscle fibres* are multinucleate, formed by fusion of cells","they are very long and need many nuclei to produce proteins for the whole fibre","*aseptate hyphae* of fungi have many nuclei in a continuous cytoplasm, which helps growth and transport along the hypha"],"mod":"Cell theory uses a cell with a single nucleus as its model, but several specialized cells depart from it, and their atypical structure is explained by their function. Mature mammalian red blood cells lose their nucleus and mitochondria, leaving more room for haemoglobin and increasing oxygen transport; their biconcave shape increases the surface area for diffusion and their flexibility lets them pass through capillaries. The cost is that they cannot divide or repair themselves, so they live about 120 days. Phloem sieve tubes also lose their nucleus and most organelles, so phloem sap flows with little resistance through the sieve plates; they therefore depend on companion cells, connected by plasmodesmata, which supply ATP and proteins. At the opposite extreme, skeletal muscle fibres form by fusion of cells and are multinucleate: being very long, they need many nuclei to maintain protein synthesis along the whole fibre. Aseptate fungal hyphae also have many nuclei in a continuous cytoplasm, which allows rapid growth of the hypha."}],"hl":false,"mk":16,"mkSL":16},{"qid":3001,"p":"2X","t":"A3.1","also":["A4.1"],"title":"Extended response: species and genomes","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Outline the binomial system of naming species.","pts":["each species is given a two-part name: *genus* + species name","the genus has a capital initial letter and the species is lower case","written in italics (or underlined when handwritten)","example: Homo sapiens / after first use the genus may be abbreviated (H. sapiens)","an *international* system: the same name in all languages, avoids confusion from common names","each name refers to only one species / species in the same genus are related","agreed by scientists at international congresses / based on Latin"],"mod":"In the binomial system each species is given a two-part name: the genus, written with a capital initial letter, and the species name, in lower case, both in italics or underlined when handwritten, as in Homo sapiens. After the first use the genus may be abbreviated (H. sapiens). It is an international system agreed by scientists, so the same name is used in every language and the confusion of common names is avoided; also, each name refers to only one species and the genus indicates relationship."},{"l":"b","m":5,"hl":false,"q":"Explain why it can be difficult to decide whether two populations belong to the same species or to different species.","pts":["according to the *biological species concept*, they are the same species if they can interbreed and produce fertile offspring","when two populations become isolated, they *diverge* gradually","there is no single point at which they become separate species","geographically separated populations never meet, so whether they would interbreed cannot be tested","some different species form *hybrids* / hybrid fertility may be partial","cannot be applied to asexually reproducing organisms (for example, bacteria)","nor to extinct species / fossils","example: chimpanzees and bonobos, separated by the Congo River, are considered different species although they can produce hybrids in captivity"],"mod":"According to the biological species concept, two populations are the same species if they can interbreed and produce fertile offspring, but this criterion is hard to apply. When two populations become isolated they diverge gradually, and there is no single point at which they become separate species. If they are geographically separated they never meet, so whether they would interbreed in the wild cannot be tested; for example, chimpanzees and bonobos, separated by the Congo River, are considered different species although they can produce hybrids in captivity. In addition, some species form hybrids with partial fertility, and the criterion cannot be applied to asexual organisms or to extinct species known only from fossils."},{"l":"c","m":7,"hl":false,"q":"Discuss the use of whole-genome sequencing in biological research and medicine.","pts":["*genome* = all the genetic information of an organism","genome size varies greatly and does not correspond to the complexity of the organism / much of it is *non-coding* DNA","members of a species share almost all of their genome but differ in *SNPs* (unity and diversity)","sequencing is now much faster and cheaper, so many individuals and species can be sequenced","comparing genomes reveals *evolutionary* relationships: more similar sequences = more recent common ancestor","allows genes / alleles associated with diseases to be identified","*personalized medicine*: choosing drugs or doses according to the patient's genome","but many variants only increase risk / the genotype–disease link is often probabilistic","produces huge amounts of data that are hard to store and interpret","ethical issues: privacy, use by insurers or employers / discrimination","may reveal unexpected findings that cause anxiety / affect relatives","cost is still high for many health systems"],"mod":"The genome is all the genetic information of an organism, and it can now be sequenced in full much faster and more cheaply than before. This has shown that genome size varies greatly and does not correspond to complexity, because much of it is non-coding DNA, and that members of a species share almost all of their genome but differ in SNPs. In research, comparing genomes allows evolutionary relationships to be deduced, since the more similar the sequences, the more recent the common ancestor. In medicine, it allows alleles associated with diseases to be identified and personalized medicine to be used, choosing drugs or doses according to the patient's genome. However, it has limitations: many variants only increase the risk of disease, so the information is probabilistic; huge amounts of data are produced that are hard to interpret; and there are ethical issues of privacy and possible discrimination by insurers or employers, as well as unexpected findings that may cause anxiety or affect relatives. Overall it is a very valuable tool, provided it is used with regulation and genetic counselling."}],"hl":false,"mk":16,"mkSL":16},{"qid":3002,"p":"2X","t":"A4.2","also":["D4.2"],"title":"Extended response: the biodiversity crisis","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Distinguish between the three components of biodiversity.","pts":["*ecosystem diversity*: variety of habitats / ecosystems in an area or on the planet","example: forest, wetland and grassland in the same region","*species diversity*: number of different species (and their relative abundance)","example: number of bird species in a forest","*genetic diversity*: variety of alleles within a species / gene pool","example: different varieties of a crop species","the three levels depend on each other: losing ecosystems reduces species and genetic diversity"],"mod":"Biodiversity has three components. Ecosystem diversity is the variety of habitats or ecosystems in a region or on the planet, for example forests, wetlands and grasslands. Species diversity is the number of different species and their relative abundance, such as the number of bird species in a forest. Genetic diversity is the variety of alleles in the gene pool of a species, for example the different varieties of a crop. The three levels are linked: when ecosystems are lost, species and genetic diversity are lost too."},{"l":"b","m":5,"hl":false,"q":"Describe the evidence that there is a biodiversity crisis.","pts":["the current rate of extinction is far higher than the *background rate* in the fossil record","species assessments such as the *IUCN Red List* classify extinction risk","the number of threatened species in these assessments has increased over time","repeated *population surveys* show declines in the size of many populations","*citizen science* (bird and insect counts) provides large amounts of data from wide areas","satellite images show the loss of area of forests and wetlands","evidence is reliable only if standardized methods are repeated over many years"],"mod":"There are several lines of evidence for a biodiversity crisis. The current rate of extinction is far higher than the background rate shown by the fossil record. Species assessments, such as the IUCN Red List, classify extinction risk and show that the number of threatened species is increasing. Population surveys repeated over years reveal declines in many populations, and citizen science, such as bird counts, provides data from very wide areas. Satellite images also show the loss of forests and wetlands. This evidence is reliable when it is gathered using standardized methods repeated over a long time."},{"l":"c","m":7,"hl":false,"q":"Explain why several strategies are needed to conserve biodiversity, including the EDGE approach.","pts":["*in situ* conservation protects species in their natural habitat (reserves, national parks)","maintains interactions between species and ecosystem processes","*rewilding* restores natural processes, for example by reintroducing predators (wolves in Yellowstone)","*ex situ* conservation is needed if the population is very small or the habitat has been destroyed","zoos: captive breeding and reintroduction to the wild","botanic gardens / *seed banks* store genetic diversity for a long time","resources are limited, so priorities must be set","*EDGE* = evolutionarily distinct and globally endangered species","they have few close relatives, so their extinction means losing much evolutionary history / unique genetic diversity","example: aye-aye / Chinese giant salamander / long-beaked echidna","other criteria: protecting keystone species or flagship species / no single strategy is enough"],"mod":"No single conservation strategy is enough on its own. In situ conservation protects species in their natural habitat through reserves and national parks, and has the advantage of maintaining interactions between species and ecosystem processes; rewilding goes further and restores these processes, for example with the reintroduction of wolves to Yellowstone. But when a population is very small or its habitat has been destroyed, ex situ conservation is needed: zoos carry out captive breeding to reintroduce individuals, and botanic gardens and seed banks store genetic diversity for decades. Because resources are limited, priorities must be set. The EDGE approach prioritizes evolutionarily distinct and globally endangered species, such as the aye-aye: having few close relatives, their extinction would mean losing much evolutionary history and unique genetic diversity. Other criteria, such as protecting keystone species, complement this approach."}],"hl":false,"mk":16,"mkSL":16},{"qid":3003,"p":"2X","t":"A4.1","also":["A1.2"],"title":"Extended response: DNA and evidence for evolution","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Describe how the structure of DNA allows it to store an almost limitless amount of information.","pts":["information is stored in the *base sequence* (A, T, C, G)","any base can follow any other along a strand / no restriction on the sequence","with 4 bases, a sequence of n bases has *4ⁿ* possible combinations","DNA molecules are very long (millions of bases)","the covalent sugar–phosphate backbone is stable and protects the information","bases are inside the double helix / complementary base pairing allows the information to be copied"],"mod":"Genetic information is coded in the sequence of the bases A, T, C and G. Because any base can follow any other along the strand, a sequence of n bases can have 4ⁿ combinations; since DNA molecules have millions of bases, the amount of possible information is almost limitless. In addition, the covalent sugar–phosphate backbone is stable, the bases are protected inside the double helix and complementary base pairing allows the information to be copied accurately."},{"l":"b","m":5,"hl":false,"q":"Explain why the universality of the genetic code is evidence that all organisms share a common ancestor.","pts":["the *genetic code* is the correspondence between codons (base triplets) and amino acids","almost all organisms use the same code (the same 64 codons with the same meaning)","the code is arbitrary: there is no chemical reason for a codon to correspond to a particular amino acid","it is very unlikely that the same code arose independently several times","so it is best explained by *inheritance* from a common ancestor (LUCA)","changing the code would be harmful because it would alter many proteins at once, so it has been conserved","small variations (for example, in mitochondria) are minor later changes","application: a human gene (insulin) is expressed correctly in bacteria"],"mod":"The genetic code is the correspondence between codons and amino acids, and almost all organisms use the same one: the 64 codons have the same meaning in bacteria, plants and animals. This code is arbitrary, because there is no chemical reason for a particular codon to correspond to a particular amino acid, so it would be very unlikely for the same code to arise independently several times. The simplest explanation is that all organisms inherited it from a common ancestor. It has been conserved because any change would alter many proteins at once and would be harmful; small variations, as in mitochondria, are minor later changes. A practical consequence is that a human gene, such as the insulin gene, is translated correctly in bacteria."},{"l":"c","m":7,"hl":false,"q":"Discuss the extent to which selective breeding and homologous structures provide evidence for evolution.","pts":["*selective breeding*: humans choose individuals with desired traits to breed over many generations","produces large heritable changes in a short time / example: cabbage, broccoli and cauliflower from wild cabbage / maize from teosinte","shows that heritable variation exists and that selection changes populations","if artificial selection causes so much change in centuries, *natural selection* can cause evolution over millions of years","limitation: selection is directed by humans and does not usually produce new species","*homologous structures* have the same basic structure but different functions","example: the *pentadactyl* limb in the human arm, bat wing and whale flipper","explained by a common ancestor and *divergent evolution* (adaptation to different ways of life)","limitation: similar structures may be analogous (convergent evolution), such as bird and insect wings","evidence from DNA and protein sequences confirms the relationships / no single piece of evidence is enough, but together they are consistent"],"mod":"Selective breeding involves humans choosing, over many generations, the individuals with desired traits to breed. Large heritable changes have been produced in a short time in this way: cabbage, broccoli and cauliflower come from wild cabbage, and maize from teosinte. This shows that heritable variation exists and that selection changes populations, so it is reasonable that natural selection causes evolution over millions of years. Its limitation is that the selection is directed by humans and rarely produces new species. Homologous structures, such as the pentadactyl limb of the human arm, bat wing and whale flipper, share the same basic structure despite having different functions; this is explained by a common ancestor followed by divergent evolution. However, similar structures may be analogous, the result of convergent evolution, like bird and insect wings, so they must be distinguished. Overall, neither piece of evidence is enough alone, but they agree with evidence from DNA and protein sequences and strongly support evolution."}],"hl":false,"mk":16,"mkSL":16},{"qid":3004,"p":"1B","t":"A1.1","also":[],"title":"Capillary action in glass tubes","blocks":[{"k":"p","v":"A student stood glass capillary tubes of different internal diameter upright in a container of water at 20 °C and measured the height reached by the water inside each tube. The measurement was repeated three times for each diameter."},{"k":"table","cap":"Height reached by water in tubes of different diameter","rows":[["Internal diameter / mm","Trial 1 / mm","Trial 2 / mm","Trial 3 / mm","Mean / mm"],["0.5","58","61","60","?"],["1.0","30","29","31","30.0"],["1.5","21","19","20","20.0"],["2.0","15","14","16","15.0"]]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Identify the independent variable in this experiment.","pts":["the *internal diameter* of the tube"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calculate the mean height reached by the water in the 0.5 mm tube.","pts":["(58 + 61 + 60) ÷ 3","= 59.7 mm","answer with unit / accept 59.67 mm"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Describe the relationship between tube diameter and the height reached by the water.","pts":["the larger the diameter, the lower the height / inverse relationship","height does not fall linearly: doubling the diameter halves the height (from 1.0 to 2.0 mm: 30 → 15 mm)","the largest difference is between 0.5 and 1.0 mm"],"mod":""},{"l":"d","m":3,"hl":false,"q":"Explain the results with reference to the properties of water.","pts":["*adhesion*: water forms hydrogen bonds with the polar glass surface and rises up the wall","*cohesion*: water molecules are held together by *hydrogen bonds*, so they pull the rest of the column up","in a narrow tube the glass surface area is large relative to the volume / weight of water","so in narrow tubes adhesion supports a taller column against gravity","the same happens in soil and in the cellulose walls of plant cells"],"mod":"Water rises up the tube by adhesion: its polar molecules form hydrogen bonds with the glass surface and move up the wall. By cohesion, because water molecules are held together by hydrogen bonds, they pull the rest of the column up with them. In a narrow tube the glass surface is large relative to the volume and weight of water to be supported, so the column rises higher before gravity balances it; this is why height decreases as diameter increases."}],"hl":false,"mk":8,"mkSL":8},{"qid":3005,"p":"1B","t":"A4.2","also":[],"title":"A citizen-science butterfly survey","blocks":[{"k":"p","v":"Every summer, volunteers walked the same 30 transects of 1 km in a farming region and counted the individuals of one butterfly species. The table shows the mean number per transect and the standard deviation (SD)."},{"k":"table","cap":"Butterflies counted per transect (n = 30 transects)","rows":[["Year","Mean per transect","SD"],["2010","48","9"],["2013","44","10"],["2016","37","8"],["2019","30","9"],["2022","26","7"],["2024","24","6"]]},{"k":"chart","type":"line","title":"Mean number of butterflies per transect","x":"Year","y":"Mean per transect","s":[{"n":"Mean","pts":[[2010,48],[2013,44],[2016,37],[2019,30],[2022,26],[2024,24]]}]}],"parts":[{"l":"a","m":1,"hl":false,"q":"State the trend shown by the data.","pts":["the mean number of butterflies *decreases* steadily from 2010 to 2024"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calculate the percentage decrease in the mean number between 2010 and 2024.","pts":["(48 − 24) ÷ 48 × 100","= 50 %","answer with % sign / accept “halved”"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Using the standard deviations, deduce whether the difference between 2010 and 2013 and the difference between 2010 and 2024 are likely to be significant.","pts":["2010 (48 ± 9) and 2013 (44 ± 10): ranges *overlap* greatly, so the difference is probably not significant","2010 (39–57) and 2024 (18–30): no overlap, so the difference is probably significant","a statistical test (for example, a t-test) would be needed to confirm this"],"mod":""},{"l":"d","m":2,"hl":false,"q":"Suggest one advantage and one limitation of using citizen science in this study.","pts":["advantage: many volunteers cover many transects / wide areas / many years at low cost","advantage: large sample size, which increases reliability","limitation: volunteers may misidentify the species / vary in experience","limitation: differences in effort or counting conditions (time of day, weather)"],"mod":""},{"l":"e","m":2,"hl":false,"q":"Suggest two causes of the decline of this population in a farming region.","pts":["*habitat loss* / removal of hedgerows and flower meadows","use of pesticides / herbicides that kill butterflies or their food plants","fewer nectar plants because of monocultures","climate change / fertilizer pollution"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3006,"p":"1B","t":"A2.2","also":["D2.3"],"title":"Contractile vacuoles of Paramecium","blocks":[{"k":"p","v":"Paramecium were placed in solutions with different NaCl concentrations at 20 °C. After 10 minutes, the number of times the contractile vacuole emptied in one minute was counted under the microscope. Five individuals were observed per solution and the mean was calculated."},{"k":"chart","type":"line","title":"Contractile vacuole emptying rate","x":"NaCl concentration / mmol dm⁻³","y":"Emptyings per minute","s":[{"n":"Mean (n = 5)","pts":[[0,12.0],[25,9.4],[50,6.8],[75,4.1],[100,1.5]]}]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Identify the dependent variable.","pts":["the number of *contractile vacuole emptyings* per minute"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calculate the percentage decrease in emptying rate between 0 and 100 mmol dm⁻³ NaCl.","pts":["(12.0 − 1.5) ÷ 12.0 × 100","= 87.5 %","accept 88 %"],"mod":""},{"l":"c","m":3,"hl":false,"q":"Explain the results.","pts":["in fresh water / low NaCl the medium has a higher *water potential* than the cytoplasm (is hypotonic)","water enters the cell by *osmosis*","the contractile vacuole expels the excess water / prevents the cell bursting (*homeostasis*)","as NaCl increases the water potential difference decreases, less water enters and less emptying is needed","emptying uses ATP, so energy is saved when less water enters"],"mod":"In water with little salt the medium is hypotonic: it has a higher water potential than the cytoplasm, so water enters Paramecium by osmosis. Since it has no cell wall, it must expel this excess water to avoid bursting, and it does so with the contractile vacuole, an example of homeostasis. As NaCl concentration increases, the water potential difference between the medium and the cytoplasm decreases, less water enters and the vacuole empties less often; at 100 mmol dm⁻³ very little water enters."},{"l":"d","m":2,"hl":false,"q":"Suggest two improvements to increase the reliability of the experiment.","pts":["observe more individuals per concentration / repeat the experiment","keep temperature constant (water bath) / same acclimatization time","use Paramecium from the same culture / of similar age","count for longer (for example, 3 minutes) and calculate the mean per minute","add more intermediate concentrations"],"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":3007,"p":"2X","t":"B1.1","also":["B2.1"],"title":"Extended response: carbohydrates and lipids","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline how polysaccharides are formed and broken down by condensation and hydrolysis reactions.","hl":false,"pts":["the monomers of polysaccharides are monosaccharides / e.g. α-glucose","*condensation*: two monosaccharides are joined
