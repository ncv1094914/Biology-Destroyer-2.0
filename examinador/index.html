 may rupture and a clot form (thrombosis) that blocks the artery completely","consequence: less blood / less *oxygen* and glucose reaches part of the cardiac muscle, causing pain (angina)","without oxygen cardiac muscle cells cannot produce enough ATP and die: myocardial *infarction* / heart attack"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":2},{"qid":233,"p":"2","t":"B3.3","also":[],"title":"Movement","blocks":[],"parts":[{"l":"a","m":4,"q":"Explain the sliding filament model of muscle contraction.","pts":["a nerve impulse / action potential reaches the muscle fibre and causes release of *Ca²⁺* from the sarcoplasmic reticulum","Ca²⁺ binds to troponin, which moves *tropomyosin* and exposes the binding sites on actin","myosin heads bind to actin forming *cross-bridges*","the myosin heads swivel (*power stroke*) and pull the actin filaments towards the centre of the sarcomere / M line","a new *ATP* binds to the myosin head and detaches it from the actin","hydrolysis of ATP returns the head to its starting (cocked) position for the next cycle","the filaments slide over each other without changing length, so the sarcomere shortens (Z lines move closer) and the muscle contracts"],"hl":false,"mod":"When an action potential reaches the muscle fibre, the sarcoplasmic reticulum releases Ca²⁺, which binds to troponin and moves tropomyosin, exposing the binding sites on actin. Myosin heads attach to these sites forming cross-bridges and swivel in the power stroke, pulling the actin towards the centre of the sarcomere. A new ATP then binds to the myosin head and detaches it from the actin, and its hydrolysis re-cocks the head for another cycle. Repeated cycles make the filaments slide over each other, so the sarcomere shortens and the muscle contracts."},{"l":"b","m":2,"q":"Outline how antagonistic muscles produce movement at a joint.","pts":["muscles can only *pull* (contract), not push, so pairs of muscles are needed to move a joint in two directions","when one muscle of the pair contracts, the other relaxes and is stretched","example: at the elbow, the *biceps* contracts to flex the arm and the *triceps* contracts to extend it","muscles pull on bones via tendons, and the bones act as levers pivoting at the joint"],"hl":false,"mod":""}],"hl":true,"mk":6,"mkSL":6},{"qid":234,"p":"2","t":"B4.1","also":["B4.2"],"title":"Biomes","blocks":[{"k":"p","v":"The table shows climate data for two biomes."},{"k":"table","cap":"Mean values","rows":[["","Biome P","Biome Q"],["Mean annual temperature / °C","27","25"],["Annual rainfall / mm","2800","150"]]}],"parts":[{"l":"a","m":2,"q":"Identify the two biomes.","pts":["P: *tropical rainforest*: high temperature and very high rainfall (2800 mm)","Q: *hot desert*: high temperature and very low rainfall (150 mm)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Describe adaptations of plants to biome Q.","pts":["thick waxy cuticle reducing evaporation through the epidermis","leaves reduced / modified into *spines*, with less surface area for transpiration (and protection from herbivores)","*succulent* stems that store water / photosynthesis in the stem","sunken stomata / few stomata / hairs that trap humid air","stomata that open at night when it is cooler (*CAM* metabolism)","deep roots reaching groundwater / extensive shallow roots that absorb rain quickly"],"hl":false,"mod":"In a hot desert water is very scarce, so plants have adaptations to conserve it. Many have a thick waxy cuticle and leaves reduced to spines, which decreases the surface through which water is lost by transpiration. Their stems are succulent and store water, and their stomata are often sunken and open only at night (CAM metabolism), when it is cooler. They also have very extensive shallow roots or very deep roots to absorb as much water as possible."},{"l":"c","m":2,"q":"Explain why biomes in different continents have similar communities.","pts":["biomes are defined by similar *abiotic* conditions, especially temperature and rainfall","similar conditions exert similar *selection pressures*","unrelated species develop similar adaptations by *convergent evolution* (e.g. American cacti and African euphorbias)","so communities are similar in structure / growth forms even though the species are different"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":235,"p":"2","t":"B4.2","also":["C4.1"],"title":"Niches","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinguish between fundamental and realized niche.","pts":["*fundamental* niche: the full range of conditions / resources a species could occupy according to its tolerance, in the absence of competitors","*realized* niche: the range the species actually occupies","the realized niche is smaller / part of the fundamental niche because *competition* (biotic interactions) excludes the species from part of it"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Outline the principle of competitive exclusion.","pts":["two species cannot occupy the *same niche* in the same habitat indefinitely","they compete for the same limited resources and one is the better competitor","the less competitive species is eliminated locally / becomes *locally extinct*","alternatively the species coexist because their realized niches separate (they use different resources / zones / times)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Compare and contrast holozoic and saprotrophic nutrition.","pts":["similarity: both are *heterotrophic* / obtain organic carbon compounds made by other organisms","similarity: in both, large molecules are digested by enzymes and the products absorbed","holozoic: *ingestion* of food followed by *internal* digestion (in a gut) / e.g. animals","saprotrophic: secretion of enzymes and *external* digestion of dead organic matter, followed by absorption / e.g. fungi and decomposer bacteria"],"hl":false,"mod":""}],"hl":false,"mk":6,"mkSL":6},{"qid":236,"p":"2","t":"C1.1","also":[],"title":"Enzyme activity","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain the effect of increasing temperature on enzyme activity.","pts":["as temperature rises the rate of reaction increases to a maximum at the *optimum* temperature","enzyme and substrate molecules have more kinetic energy / move faster","there are more frequent *collisions* between substrate and active site, so more enzyme–substrate complexes form per unit time","above the optimum, vibrations break the (hydrogen) bonds that maintain the three-dimensional structure of the enzyme","the shape of the active site changes and the substrate can no longer bind: the enzyme is *denatured*","the rate falls steeply (to zero) and denaturation is usually irreversible"],"hl":false,"mod":"As temperature increases, enzyme and substrate molecules gain kinetic energy and move faster, so collisions between substrate and active site are more frequent, more enzyme–substrate complexes form and the rate of reaction rises to a maximum at the optimum temperature. Above the optimum, vibrations break the hydrogen bonds that maintain the three-dimensional structure of the enzyme. The active site changes shape, the substrate can no longer bind and the enzyme is denatured, so the rate falls steeply, usually irreversibly."},{"l":"b","m":3,"q":"Distinguish between competitive and non-competitive inhibition of enzymes.","pts":["a competitive inhibitor binds to the *active site*, whereas a non-competitive inhibitor binds to an *allosteric* site / a site other than the active site","a competitive inhibitor is structurally similar to the substrate; a non-competitive inhibitor is not similar to the substrate","a competitive inhibitor physically prevents the substrate from binding; a non-competitive inhibitor changes the conformation of the active site, so that the substrate does not bind or is not catalysed","increasing the substrate concentration reduces the effect of a competitive inhibitor but not that of a non-competitive inhibitor","with a competitive inhibitor the same maximum rate can be reached; with a non-competitive inhibitor the maximum rate is lower"],"hl":true,"mod":"A competitive inhibitor is structurally similar to the substrate and binds to the active site, so it competes with the substrate and prevents it from binding; in contrast, a non-competitive inhibitor is not similar to the substrate and binds to an allosteric site, which changes the conformation of the active site. Increasing the substrate concentration reduces the effect of a competitive inhibitor and the same maximum rate can be reached, whereas the effect of a non-competitive inhibitor is not reduced and the maximum rate remains lower."},{"l":"c","m":1,"q":"Define activation energy.","pts":["the (minimum) energy needed for a reaction to start / to break or weaken bonds in the substrate and reach the transition state"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":4},{"qid":237,"p":"2","t":"C1.2","also":[],"title":"Cell respiration","blocks":[],"parts":[{"l":"a","m":3,"q":"Compare and contrast aerobic and anaerobic cell respiration in humans.","pts":["similarity: both produce *ATP* / both use glucose as a substrate","similarity: both begin with glycolysis in the cytoplasm","aerobic requires *oxygen*, whereas anaerobic does not","aerobic has a much higher yield of ATP per glucose than anaerobic (net 2 ATP)","aerobic produces carbon dioxide and water, whereas anaerobic produces *lactate* (and no CO₂)","aerobic is completed in the *mitochondria*, whereas anaerobic occurs only in the cytoplasm","aerobic can use carbohydrates, lipids and amino acids; anaerobic only carbohydrates"],"hl":false,"mod":"Both types of cell respiration produce ATP from glucose and begin with glycolysis in the cytoplasm. However, aerobic respiration requires oxygen and is completed in the mitochondria, whereas anaerobic respiration uses no oxygen and occurs only in the cytoplasm. Aerobic respiration oxidises glucose completely to carbon dioxide and water and has a much higher yield of ATP; anaerobic respiration produces lactate and only a net 2 ATP per glucose."},{"l":"b","m":3,"q":"Explain how ATP is produced by chemiosmosis in mitochondria.","pts":["reduced NAD donates electrons to the *electron transport chain* in the inner mitochondrial membrane","energy is released as electrons pass from carrier to carrier","this energy is used to pump *protons* from the matrix into the intermembrane space","a proton gradient / high H⁺ concentration is generated in the intermembrane space","protons diffuse back to the matrix down the gradient through *ATP synthase*","ATP synthase uses the energy released to phosphorylate ADP to ATP (oxidative phosphorylation)"],"hl":true,"mod":"Reduced NAD donates electrons to the electron transport chain in the inner mitochondrial membrane. As the electrons pass from carrier to carrier, energy is released and used to pump protons from the matrix into the intermembrane space. A high concentration of H⁺ builds up, generating a proton gradient. The protons diffuse back to the matrix down this gradient through ATP synthase, and the enzyme uses the energy released to phosphorylate ADP, producing ATP."},{"l":"c","m":1,"q":"State the role of oxygen in aerobic cell respiration.","pts":["it is the *terminal electron acceptor* of the electron transport chain","it accepts electrons and protons to form water, allowing electron flow to continue"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":3},{"qid":238,"p":"2","t":"C1.3","also":[],"title":"Light-dependent reactions","blocks":[],"parts":[{"l":"a","m":3,"q":"Outline the events in photosystem II during the light-dependent reactions.","pts":["pigments / chlorophyll molecules of the photosystem absorb light (photons)","excitation energy is passed from pigment to pigment to the *reaction centre*","a chlorophyll in the reaction centre emits an excited electron, which passes to an acceptor / the chain of electron carriers","the electrons lost are replaced by *photolysis* of water","photolysis produces protons in the thylakoid space and oxygen as a waste product"],"hl":false,"mod":"The pigments of photosystem II, located in the thylakoid membrane, absorb photons and pass the excitation energy from molecule to molecule to the reaction centre. There a chlorophyll emits an excited electron, which passes to the chain of electron carriers. The electrons lost are replaced by photolysis of water, which also releases protons into the thylakoid space and oxygen as a waste product."},{"l":"b","m":2,"q":"Explain how ATP is produced in the light-dependent reactions.","pts":["excited electrons pass along a chain of electron carriers in the thylakoid membrane, releasing energy","the energy is used to pump *protons* from the stroma into the thylakoid space, generating a proton gradient","protons diffuse back to the stroma through *ATP synthase* (chemiosmosis)","ATP synthase phosphorylates ADP to form ATP (photophosphorylation)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Outline the interdependence of the light-dependent and light-independent reactions.","pts":["the light-dependent reactions supply *ATP* and *reduced NADP* to the light-independent reactions / the Calvin cycle","the Calvin cycle uses them to reduce glycerate 3-phosphate to triose phosphate / to regenerate RuBP","the light-independent reactions return ADP, phosphate and NADP to the light-dependent reactions","without light ATP and reduced NADP run out and the Calvin cycle stops / without CO₂ NADP is not regenerated and electron flow slows"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":239,"p":"2","t":"C2.1","also":[],"title":"Cell signalling","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinguish between hormones and neurotransmitters.","pts":["hormones are secreted by endocrine glands into the *blood*, whereas neurotransmitters are released by presynaptic neurons into the *synaptic cleft*","hormones act on distant target cells / throughout the body; neurotransmitters act only on the adjacent postsynaptic cell","the effect of hormones is slower and longer-lasting; that of neurotransmitters is very rapid and brief","neurotransmitters are quickly removed from the synapse by enzymatic breakdown / reuptake; hormones persist longer in the blood"],"hl":false,"mod":""},{"l":"b","m":4,"q":"Explain how epinephrine causes a response in a liver cell.","pts":["epinephrine (adrenaline) is hydrophilic and cannot cross the membrane, so it binds to a *transmembrane* receptor in the plasma membrane","the receptor is a *G protein*-coupled receptor, which activates the G protein when the hormone binds","the G protein activates the membrane enzyme adenylyl cyclase","adenylyl cyclase converts ATP to *cyclic AMP* (cAMP), which acts as a *second messenger*","cAMP activates protein kinases, which phosphorylate / activate other enzymes in a cascade","the signal is amplified: a single hormone molecule generates many cAMP molecules","response: glycogen is broken down to glucose, which is released into the blood"],"hl":false,"mod":"Epinephrine is hydrophilic and cannot cross the plasma membrane, so it binds to a transmembrane G protein-coupled receptor on the surface of the liver cell. Binding changes the conformation of the receptor and activates the G protein, which in turn activates the enzyme adenylyl cyclase. This converts ATP to cyclic AMP, which acts as a second messenger inside the cell. cAMP activates protein kinases that phosphorylate other enzymes in a cascade that amplifies the signal. In response, the enzymes that break down glycogen to glucose are activated, and the glucose passes into the blood."},{"l":"c","m":2,"q":"Explain why steroid hormones can bind to intracellular receptors.","pts":["steroids are lipids / *hydrophobic* (non-polar) molecules","they can pass by simple diffusion through the phospholipid bilayer of the plasma membrane","once inside they bind to receptors in the cytoplasm / nucleus","the hormone–receptor complex binds to DNA and regulates the transcription of specific genes"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":240,"p":"2","t":"C2.2","also":[],"title":"Synaptic transmission","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe how a nerve impulse is transmitted across a cholinergic synapse.","pts":["the action potential / nerve impulse arrives at the *presynaptic* membrane and depolarises it","voltage-gated calcium channels open and *Ca²⁺* ions diffuse into the presynaptic neuron","Ca²⁺ causes vesicles containing *acetylcholine* to move to and fuse with the presynaptic membrane","acetylcholine is released by *exocytosis* into the synaptic cleft","acetylcholine diffuses across the cleft and binds to *receptors* in the postsynaptic membrane","ion channels open and Na⁺ enters the postsynaptic neuron, which is depolarised","if threshold is reached an action potential is initiated in the postsynaptic neuron","acetylcholinesterase breaks down acetylcholine in the cleft (and choline is reabsorbed), ending the signal"],"hl":false,"mod":"When the action potential reaches the presynaptic membrane it depolarises it, voltage-gated calcium channels open and Ca²⁺ ions diffuse into the neuron. The calcium causes vesicles to fuse with the presynaptic membrane and release acetylcholine by exocytosis into the synaptic cleft. Acetylcholine diffuses across the cleft and binds to receptors in the postsynaptic membrane, opening ion channels through which Na⁺ enters. The postsynaptic membrane is depolarised and, if threshold is reached, a new action potential is initiated. Finally, acetylcholinesterase breaks down the acetylcholine, so the signal ends."},{"l":"b","m":2,"q":"Explain the role of summation in a postsynaptic neuron.","pts":["a postsynaptic neuron receives inputs from many presynaptic neurons; a single excitatory postsynaptic potential is usually not enough to reach threshold","excitatory neurotransmitters depolarise the membrane and inhibitory ones hyperpolarise it; their effects are added together","an action potential is initiated only if the combined effect reaches the *threshold* potential","this allows information from several sources to be integrated / decisions to be made (all-or-nothing response)"],"hl":true,"mod":""},{"l":"c","m":1,"q":"State one effect of an exogenous chemical on synaptic transmission.","pts":["cocaine blocks the reuptake of dopamine into the presynaptic neuron, so dopamine stays in the cleft and stimulation is prolonged","neonicotinoids bind to acetylcholine receptors (in insects) and are not broken down by acetylcholinesterase, so they block transmission"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":4},{"qid":241,"p":"2","t":"C3.1","also":[],"title":"Control of heart rate","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain how heart rate is increased during exercise.","pts":["during exercise cell respiration in muscles increases, so the concentration of CO₂ in the blood rises / blood pH falls","*chemoreceptors* (in the aorta / carotid arteries / medulla) detect the rise in CO₂ / fall in pH","*baroreceptors* detect changes in blood pressure","impulses are sent to the cardiovascular centre in the *medulla oblongata*","the medulla sends impulses along a sympathetic nerve / accelerator nerve to the *sinoatrial node* (SA node / pacemaker)","the SA node initiates impulses more frequently, so the heart beats faster","*epinephrine* (adrenaline) released by the adrenal glands also increases the rate at which the SA node fires","so more O₂ / glucose is delivered to muscles and CO₂ is removed faster"],"hl":false,"mod":"During exercise the muscles respire faster, so the concentration of CO₂ in the blood rises and blood pH falls. Chemoreceptors in the aorta, carotid arteries and medulla detect this change, and baroreceptors detect changes in blood pressure. They send impulses to the cardiovascular centre in the medulla oblongata, which then sends impulses along a sympathetic nerve to the sinoatrial node. The SA node, which is the pacemaker, initiates impulses more frequently, so the heart beats faster. In addition, epinephrine secreted by the adrenal glands increases the rate of firing of the SA node. As a result more oxygen and glucose reach the muscles and CO₂ is removed more quickly."},{"l":"b","m":2,"q":"Outline the roles of the hypothalamus and pituitary gland.","pts":["the *hypothalamus* links / integrates the nervous and endocrine systems","the hypothalamus detects changes in the blood / internal environment (e.g. body temperature, solute concentration)","the hypothalamus controls the pituitary: it secretes releasing hormones to the anterior pituitary / its neurosecretory cells make hormones (ADH, oxytocin) released from the posterior pituitary","the *pituitary* secretes hormones (e.g. TSH, FSH, LH, ADH, growth hormone) that regulate other endocrine glands / target organs","together they regulate homeostasis (thermoregulation, osmoregulation) / growth / reproduction"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain how auxin causes cells to elongate.","pts":["auxin binds to a receptor and stimulates synthesis / activation of *proton pumps* in the plasma membrane","H⁺ ions are pumped from the cytoplasm into the cell wall, which becomes acidic / its pH falls","low pH activates proteins (expansins) that loosen the connections / bonds between *cellulose microfibrils*","the wall becomes more extensible and water uptake / turgor pressure stretches the cell, so it elongates"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":5},{"qid":242,"p":"2","t":"C3.2","also":[],"title":"Antibody production","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe the production of antibodies after infection.","pts":["a *macrophage* engulfs the pathogen by phagocytosis and presents its antigens on its membrane","a helper T-lymphocyte with a complementary receptor binds to the antigen and is activated","a specific B-lymphocyte binds the same antigen with the antibodies / receptors in its membrane","the activated helper T-cell binds to the B-lymphocyte and *activates* it (also by chemical signals / cytokines)","the activated B-lymphocyte divides by mitosis to form a *clone* of identical cells (clonal selection)","most cells of the clone differentiate into *plasma cells*","plasma cells (with extensive rough endoplasmic reticulum) secrete large quantities of the specific antibody","some cells of the clone become long-lived *memory cells*"],"hl":false,"mod":"After infection, a macrophage engulfs the pathogen by phagocytosis and presents its antigens on its membrane. A helper T-lymphocyte whose receptor is complementary to this antigen binds to it and is activated. Meanwhile, a specific B-lymphocyte binds the same antigen using the antibodies in its membrane, and the activated helper T-cell binds to this B-lymphocyte and activates it. The activated B-lymphocyte divides repeatedly by mitosis to form a clone. Most of these cells differentiate into plasma cells, which have extensive rough ER and secrete large quantities of the specific antibody, while others become long-lived memory cells."},{"l":"b","m":2,"q":"Explain why the secondary immune response is faster.","pts":["*memory cells* formed during the primary response persist in the body for a long time","there are many more cells specific to the antigen than before the first exposure / a rare lymphocyte does not have to be selected and cloned from scratch","on a second exposure memory cells are activated immediately and divide rapidly to form plasma cells","antibodies are produced sooner and in larger amounts, so the pathogen is destroyed before symptoms appear"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain how antibiotic resistance spreads in a population of bacteria.","pts":["a random *mutation* gives resistance to some bacteria / there is variation in resistance within the population","the antibiotic acts as a *selection pressure*: it kills susceptible bacteria","resistant bacteria survive and reproduce (binary fission), passing the resistance gene to their offspring","resistance genes can be transferred between bacteria on *plasmids* (horizontal gene transfer), even between species","overuse / misuse of antibiotics increases selection, so the frequency of resistant bacteria in the population rises"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":243,"p":"2","t":"C4.1","also":[],"title":"Populations","blocks":[],"parts":[{"l":"a","m":3,"q":"Describe the capture–mark–release–recapture method.","pts":["capture a large sample of the population with a suitable method (e.g. traps) and count the individuals (M)","mark each individual in a way that is harmless, does not affect its survival and is not lost","release them where they were caught and allow enough time for them to *mix* randomly with the population","capture a second sample using the same method / effort and count the total (N) and the marked individuals (R)","estimate population size with the *Lincoln index*: population = (M × N) ÷ R","the method is suitable for mobile animals, which cannot be counted with quadrats"],"hl":false,"mod":"First a large sample of the population is captured, for example with traps, and the individuals are counted (M). Each one is marked harmlessly, so that the mark does not affect its survival and is not lost. They are then released at the same place and enough time is allowed for them to mix randomly with the rest of the population. A second sample is captured using the same method and effort, and the total number of individuals (N) and the number that are marked (R) are counted. Population size is estimated with the Lincoln index: population = (M × N) ÷ R."},{"l":"b","m":2,"q":"State two assumptions of this method.","pts":["marks do not affect survival / behaviour / chance of being eaten by predators","marks are not lost between the two samples","there are no births, deaths, immigration or emigration between samples (closed population)","marked individuals mix randomly with the rest of the population","all individuals have the same chance of being caught (none avoid or are attracted to traps)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain how predator and prey populations affect each other.","pts":["if the prey population increases, predators have more food, survive and reproduce more, and their population increases (after a time lag)","more predators eat more prey, so the prey population decreases","with fewer prey there is food shortage / competition between predators, so the predator population decreases","with fewer predators the prey recover, producing *oscillations* / cycles in which predator peaks lag behind prey peaks","this is *density-dependent* control / negative feedback that keeps both populations near an equilibrium"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":244,"p":"2","t":"C4.2","also":[],"title":"Energy and carbon","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain why energy is lost between trophic levels.","pts":["most of the energy released by *cell respiration* is lost as *heat*","heat is lost to the environment and cannot be converted back into chemical energy by organisms / is not recycled","not all parts of organisms are eaten (e.g. bones, hair, roots, wood)","not all ingested food is digested / absorbed: some is lost in faeces (egestion)","some organisms die without being eaten and their energy passes to decomposers / detritivores","some energy is lost in excretory products (e.g. urea)","so only about *10%* of the energy is transferred to the next trophic level"],"hl":false,"mod":"Most of the chemical energy an organism obtains is used in cell respiration, and much of it is lost as heat to the environment; this heat cannot be converted back into chemical energy, so it is not passed on. In addition, not all parts of organisms are eaten, such as bones or roots, and not all ingested food is digested and absorbed, so some is lost in faeces. Some organisms die without being eaten and their energy passes to decomposers, and some energy is lost in excretory products such as urea. For all these reasons only about 10% of the energy is passed to the next trophic level."},{"l":"b","m":2,"q":"Distinguish between primary and secondary production.","pts":["primary production: accumulation of carbon compounds in biomass by *autotrophs* / producers; secondary: in biomass by *heterotrophs* / consumers","primary fixes inorganic carbon (CO₂) using light energy (photosynthesis) / chemical energy (chemosynthesis); secondary uses carbon compounds already made, obtained by feeding","in the same ecosystem primary production is greater than secondary production, because energy is lost between trophic levels"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Outline how combustion of fossil fuels affects the carbon cycle.","pts":["fossil fuels (coal, oil, natural gas) contain carbon from organisms that was stored for millions of years","combustion oxidises these compounds, releasing the carbon as *CO₂* into the atmosphere","carbon is released faster than it is absorbed by photosynthesis / oceans / sinks, so the atmospheric CO₂ concentration increases","the cycle is no longer balanced: there is a net flux of carbon from the lithosphere to the atmosphere","the increase in CO₂ enhances the greenhouse effect / acidifies the oceans"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":245,"p":"2","t":"D1.1","also":[],"title":"DNA replication","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe the roles of enzymes in DNA replication in prokaryotes.","pts":["*helicase* unwinds the double helix and separates the strands by breaking the hydrogen bonds between bases","DNA gyrase relieves the strain ahead of helicase / single-strand binding proteins keep the strands apart","DNA *primase* synthesises a short RNA primer on each template strand","*DNA polymerase III* adds complementary DNA nucleotides to the 3' end of the primer / in a 5'→3' direction","synthesis is continuous on the leading strand and discontinuous, in Okazaki fragments, on the lagging strand","*DNA polymerase I* removes the RNA primers and replaces them with DNA","DNA *ligase* joins the Okazaki fragments by forming sugar–phosphate bonds","DNA polymerase III proofreads, removing mismatched nucleotides"],"hl":true,"mod":"Helicase unwinds the double helix and separates the two strands by breaking the hydrogen bonds between bases, while gyrase relieves the strain ahead of it. Primase synthesises a short RNA primer on each template strand and DNA polymerase III adds complementary nucleotides to the 3' end, in a 5'→3' direction: continuously on the leading strand and as Okazaki fragments on the lagging strand. DNA polymerase I replaces the RNA primers with DNA and ligase joins the Okazaki fragments."},{"l":"b","m":2,"q":"Explain why DNA replication is described as semi-conservative.","pts":["the two strands of the original molecule separate and each acts as a *template*","each new molecule contains one original (conserved) strand and one newly synthesised strand","the new strand is formed by *complementary* base pairing (A with T, C with G)","the two molecules produced are identical to each other and to the original"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Outline one application of the polymerase chain reaction (PCR).","pts":["PCR *amplifies* / makes many copies of a specific DNA sequence from a very small sample","DNA profiling: DNA from blood / semen / hair at a crime scene is amplified so it can be compared with that of suspects (forensics)","paternity testing: DNA from the child and possible parents is amplified so their profiles can be compared","diagnosis of infection, e.g. COVID-19: viral RNA is copied to DNA and amplified to detect the virus"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":4},{"qid":246,"p":"2","t":"D1.2","also":[],"title":"Protein synthesis","blocks":[],"parts":[{"l":"a","m":3,"q":"Describe how mRNA is produced by transcription.","pts":["*RNA polymerase* binds to the DNA at the start of the gene","RNA polymerase unwinds the DNA and separates the two strands / breaks the hydrogen bonds","only one of the DNA strands is used as the *template*","free RNA nucleotides pair with the *complementary* bases on the template strand","uracil pairs with adenine / RNA has uracil instead of thymine","RNA polymerase links the RNA nucleotides by covalent (sugar–phosphate) bonds","the mRNA separates from the DNA and the double helix reforms"],"hl":false,"mod":"RNA polymerase binds to the DNA at the start of the gene, unwinds the double helix and separates the two strands. Only one strand acts as the template: free RNA nucleotides pair with its complementary bases (uracil with adenine, instead of thymine) and RNA polymerase links them by covalent sugar–phosphate bonds. At the end of the gene the mRNA separates and the DNA reforms its double helix."},{"l":"b","m":3,"q":"Explain the roles of tRNA in translation.","pts":["each tRNA carries a *specific* amino acid to the ribosome","tRNA has an *anticodon* of three bases","the anticodon pairs with the complementary *codon* on the mRNA (by hydrogen bonds)","so amino acids are placed in the order determined by the sequence of codons on the mRNA / the genetic code is translated","the amino acid is joined to the growing polypeptide chain by a *peptide bond*","the tRNA is released from the ribosome and can be reloaded with its amino acid"],"hl":false,"mod":"Each tRNA carries a specific amino acid to the ribosome and has an anticodon of three bases. The anticodon pairs with the complementary codon on the mRNA, so amino acids are placed in the order dictated by the codon sequence. The amino acid is joined to the growing polypeptide by a peptide bond and the empty tRNA is released to be reloaded."},{"l":"c","m":2,"q":"Outline how eukaryotic mRNA is modified after transcription.","pts":["*introns* (non-coding sequences) are removed","*exons* are spliced together to form mature mRNA","a cap is added to the 5' end and a poly-A tail to the 3' end","the cap and tail stabilise the mRNA / protect it from being broken down","alternative splicing of exons allows different polypeptides to be produced from one gene"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":6},{"qid":247,"p":"2","t":"D1.3","also":[],"title":"Mutation","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinguish between base substitution mutations and frameshift mutations.","pts":["substitution: one base is replaced by a different base, whereas a frameshift is caused by the *insertion* or *deletion* of bases","substitution does not change the number of bases; insertion / deletion does (by a number that is not a multiple of three)","substitution alters only one codon; a frameshift alters every codon after the mutation","substitution changes at most one amino acid / may change none (degenerate code); a frameshift changes many amino acids / usually gives a non-functional polypeptide"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Outline two causes of gene mutations.","pts":["errors in DNA *replication* / in DNA repair (spontaneous mutations)","high-energy / ionising radiation, e.g. X-rays, gamma rays or ultraviolet radiation, which damages DNA","chemical mutagens, e.g. substances in tobacco smoke (benzopyrene), which chemically alter bases","*mutagens* increase the mutation rate above the spontaneous rate"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain how CRISPR–Cas9 can be used to edit a gene.","pts":["a *guide RNA* is designed with a base sequence complementary to the target sequence in the gene","the guide RNA binds to the enzyme / endonuclease *Cas9* and directs it to the target sequence","the guide RNA pairs with the target DNA by complementary base pairing","Cas9 cuts both strands of the DNA at that point","when the cell repairs the cut, bases may be added or lost, which inactivates the gene","if a DNA template is supplied, the cell uses it for repair and a new sequence is inserted / the allele is corrected"],"hl":true,"mod":"A guide RNA is designed with a sequence complementary to the target sequence in the gene. The guide RNA binds to the endonuclease Cas9 and, by complementary base pairing, directs it to that exact point in the genome, where Cas9 cuts both strands of the DNA. When the cell repairs the cut, bases may be lost or added, which inactivates the gene; if a DNA template is also supplied, the repair copies it and the desired sequence is inserted."}],"hl":false,"mk":7,"mkSL":4},{"qid":248,"p":"2","t":"D2.1","also":[],"title":"Meiosis and variation","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain how meiosis produces genetic variation.","pts":["homologous chromosomes pair up (form bivalents) in prophase I","*crossing over*: non-sister chromatids exchange segments of DNA","crossing over produces chromatids with new combinations of alleles (recombinants)","*random orientation* of the pairs of homologous chromosomes (bivalents) at the equator in metaphase I","the orientation of each pair is independent of the others, so maternal and paternal chromosomes assort independently","there are 2ⁿ possible combinations of chromosomes in the gametes (2²³ in humans)"],"hl":false,"mod":"In prophase I homologous chromosomes pair up and their non-sister chromatids exchange segments of DNA by crossing over, producing chromatids with new combinations of alleles. In metaphase I the orientation of each homologous pair at the equator is random and independent of the other pairs, so maternal and paternal chromosomes assort independently. This allows 2ⁿ combinations of chromosomes in the gametes (2²³ in humans), so every gamete is genetically different."},{"l":"b","m":2,"q":"Explain how non-disjunction can result in Down syndrome.","pts":["*non-disjunction*: homologous chromosomes fail to separate in anaphase I / sister chromatids fail to separate in anaphase II","a gamete is formed with two copies of chromosome 21 / with 24 chromosomes","at fertilisation it fuses with a normal gamete carrying one copy","the zygote has three copies of chromosome 21 (*trisomy* 21) / 47 chromosomes"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Compare and contrast mitosis and meiosis.","pts":["similarity: in both, DNA is replicated before division / chromosomes condense / a spindle of microtubules forms","mitosis involves one division and produces two cells; meiosis involves two divisions and produces four","mitosis maintains the chromosome number (diploid → diploid); meiosis halves it (diploid → *haploid*)","mitosis produces genetically identical cells; meiosis produces genetically different cells","pairing of homologous chromosomes and crossing over occur only in meiosis"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":249,"p":"2","t":"D2.2","also":[],"title":"Gene expression","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain how transcription of a gene can be regulated.","pts":["*transcription factors* are proteins that bind to specific base sequences in DNA","RNA polymerase only starts transcription if it can bind to the *promoter* of the gene","transcription factors bound to the promoter / to enhancers promote (activators) or prevent (repressors) binding of RNA polymerase","*methylation* of DNA (of cytosine) in the promoter represses transcription","chemical modification of histones (e.g. acetylation or methylation) makes the DNA more or less tightly packed in nucleosomes","less condensed DNA is accessible to RNA polymerase and is transcribed; more condensed DNA is not","external signals such as hormones or chemicals (e.g. lactose in bacteria) switch genes on or off"],"hl":false,"mod":"Transcription only begins if RNA polymerase can bind to the promoter of the gene. Transcription factors are proteins that bind to specific DNA sequences, such as the promoter or enhancers, and promote or prevent this binding, so they activate or repress the gene. There is also epigenetic control: methylation of cytosine in the promoter represses transcription, and modification of histones makes the DNA more or less tightly packed in nucleosomes and therefore less or more accessible to RNA polymerase."},{"l":"b","m":2,"q":"Distinguish between genome and proteome.","pts":["genome: all the genetic information / the entire base sequence of the DNA of a cell or organism; proteome: all the proteins produced by a cell, a tissue or an organism","the genome is the same in (almost) all cells of an organism; the proteome differs between cell types because they express different genes","the genome is fixed throughout life; the proteome changes over time / with conditions","the proteome depends on the pattern of *gene expression* / only part of the genome is expressed in each cell"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Outline how monozygotic twin studies help to investigate gene expression.","pts":["monozygotic twins develop from a single zygote, so they have identical genomes","phenotypic differences between them cannot be due to base sequence, so must be due to the *environment*","the environment alters *epigenetic* tags (e.g. the methylation pattern) and so changes gene expression","epigenetic differences between twins increase with age / when they live in different environments"],"hl":false,"mod":""}],"hl":true,"mk":7,"mkSL":7},{"qid":250,"p":"2","t":"D2.3","also":[],"title":"Water potential","blocks":[{"k":"p","v":"Potato cylinders were placed in sucrose solutions for 24 hours."},{"k":"table","cap":"Percentage change in mass","rows":[["Sucrose concentration / mol dm⁻³","0.0","0.2","0.4","0.6","0.8"],["Change in mass / %","+12","+5","–2","–9","–15"]]}],"parts":[{"l":"a","m":2,"q":"Estimate the concentration of sucrose that is isotonic with the potato tissue.","pts":["the isotonic solution is the one in which the change in mass is zero / there is no net movement of water","it lies between 0.2 mol dm⁻³ (+5%) and 0.4 mol dm⁻³ (–2%), where the change switches from positive to negative","0.34 mol dm⁻³ (accept 0.32 to 0.36 mol dm⁻³; unit required)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain the change in mass observed in the 0.8 mol dm⁻³ solution.","pts":["the mass decreased by 15%","the solution is *hypertonic* to the tissue / has a higher solute concentration than the cells (accept: lower water potential)","there is net movement of water out of the cells by *osmosis*","through the plasma membrane, which is partially permeable / through aquaporins","water moves from the lower solute concentration to the higher solute concentration","the cells lose turgor / become flaccid / are *plasmolysed* (the membrane pulls away from the cell wall)"],"hl":false,"mod":"The mass decreased by 15% because the 0.8 mol dm⁻³ solution is hypertonic to the tissue: its solute concentration is higher than that inside the cells. There is therefore net movement of water by osmosis from the cells into the solution, through the partially permeable plasma membrane. As they lose water the cells lose turgor and become plasmolysed, and the cylinder loses mass."},{"l":"c","m":2,"q":"Explain why percentage change in mass is used rather than change in mass.","pts":["the cylinders have different initial masses","a cylinder with a greater mass would gain or lose more water / more mass in absolute terms","the percentage expresses the change relative to the initial mass, allowing a valid comparison between cylinders"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":251,"p":"2","t":"D3.1","also":[],"title":"Reproduction","blocks":[],"parts":[{"l":"a","m":4,"q":"Explain the roles of hormones in the menstrual cycle.","pts":["*FSH*, secreted by the pituitary gland, stimulates the development of follicles in the ovary","the developing follicles secrete *oestradiol* (oestrogen)","oestradiol stimulates repair and thickening of the endometrium","oestradiol stimulates the secretion of more FSH and of LH (positive feedback), rising to a peak","the surge of *LH* causes *ovulation* (at about day 14)","LH causes the empty follicle to develop into the corpus luteum, which secretes *progesterone* (and oestradiol)","progesterone maintains the thick, vascularised endometrium ready for implantation","high progesterone and oestradiol inhibit the secretion of FSH and LH (negative feedback)","if there is no fertilisation, the corpus luteum degenerates, progesterone falls and the endometrium is shed (menstruation)"],"hl":false,"mod":"The pituitary gland secretes FSH, which stimulates the development of follicles in the ovary. The follicles secrete oestradiol, which thickens the endometrium and, by positive feedback, stimulates the secretion of more FSH and of LH. The LH surge causes ovulation at about day 14 and converts the empty follicle into the corpus luteum, which secretes progesterone. Progesterone maintains the endometrium ready for implantation and, together with oestradiol, inhibits FSH and LH by negative feedback. If there is no fertilisation, the corpus luteum degenerates, progesterone falls and menstruation occurs."},{"l":"b","m":3,"q":"Outline the features of an insect-pollinated flower.","pts":["large, brightly coloured petals that attract insects","scent that attracts insects","*nectaries* at the base of the flower that produce nectar, the reward for the insect","large, sticky or spiky pollen grains that stick to the body of the insect","*anthers* positioned inside the flower, where they brush against the insect and deposit pollen","sticky *stigma* positioned inside the flower, where it collects pollen from the body of the insect"],"hl":false,"mod":"An insect-pollinated flower has large, brightly coloured petals and often scent to attract insects, and nectaries at its base that produce nectar as a reward. The anthers lie inside the flower, so they brush against the insect as it seeks the nectar and deposit large, sticky or spiky pollen that adheres to its body. The stigma, also inside the flower and sticky, collects the pollen the insect brings from another flower."}],"hl":false,"mk":7,"mkSL":7},{"qid":252,"p":"2","t":"D3.2","also":[],"title":"Inheritance","blocks":[],"parts":[{"l":"a","m":3,"q":"A man with haemophilia has children with a woman who is homozygous for normal clotting. Deduce the possible genotypes and phenotypes of their children.","pts":["parental genotypes: father XʰY, mother XᴴXᴴ","gametes: father produces Xʰ and Y; mother produces only Xᴴ / correct Punnett grid","all daughters are XᴴXʰ: *carriers* with normal clotting","all sons are XᴴY: normal clotting / unaffected and not carriers","sons receive the Y chromosome from their father and an X from their mother, so they cannot inherit Xʰ","no child has haemophilia / probability of an affected child = 0"],"hl":false,"mod":"The father is XʰY and the mother is XᴴXᴴ. The father produces Xʰ and Y gametes, and the mother produces only Xᴴ gametes. Every daughter receives Xʰ from her father and Xᴴ from her mother, so she is XᴴXʰ: a carrier, but with normal clotting because Xᴴ is dominant. Every son receives Y from his father and Xᴴ from his mother, so he is XᴴY, with normal clotting and not a carrier. Therefore none of the children has haemophilia."},{"l":"b","m":2,"q":"Distinguish between codominance and incomplete dominance.","pts":["codominance: in the heterozygote *both alleles* are fully expressed / expressed together","incomplete dominance: the heterozygote has a phenotype *intermediate* between the two homozygotes","example of codominance: AB blood group (IᴬIᴮ), with both A and B antigens on red blood cells","example of incomplete dominance: pink flowers in the heterozygote from a red × white cross (e.g. four o'clock plant)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explain why height in humans shows continuous variation.","pts":["height is *polygenic* / controlled by many genes","each gene has alleles that add a small (additive) effect to height","the many combinations of alleles produce many intermediate phenotypes / a normal distribution with no distinct categories","the *environment* (e.g. nutrition, health) also has an effect, blurring the differences further"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":253,"p":"2","t":"D3.3","also":[],"title":"Homeostasis","blocks":[],"parts":[{"l":"a","m":4,"q":"Explain the control of blood glucose concentration.","pts":["glucose concentration is detected by cells in the islets of the *pancreas*","if glucose is high (e.g. after a meal), *β-cells* secrete *insulin*","insulin increases the uptake of glucose by liver, muscle and adipose cells","insulin stimulates the conversion of glucose into *glycogen* in the liver and muscle","if glucose is low (e.g. when fasting or exercising), *α-cells* secrete *glucagon*","glucagon stimulates the hydrolysis of glycogen to glucose in the liver, which is released into the blood","the hormones travel in the blood and act on target cells with specific receptors","*negative feedback*: each response returns the concentration towards the set point"],"hl":false,"mod":"Blood glucose concentration is kept stable by negative feedback and is detected by cells in the islets of the pancreas. When it rises, for example after a meal, β-cells secrete insulin, which travels in the blood to target cells: it increases glucose uptake by liver and muscle cells and stimulates its conversion to glycogen, so blood glucose falls. When glucose falls, for example when fasting, α-cells secrete glucagon, which stimulates the hydrolysis of liver glycogen to glucose, which is released into the blood, so blood glucose rises. Each deviation therefore triggers a response that returns it to the set point."},{"l":"b","m":3,"q":"Explain how the loop of Henle helps to conserve water.","pts":["the ascending limb pumps *sodium ions* (Na⁺, followed by Cl⁻) by active transport into the interstitial fluid of the medulla","the ascending limb is impermeable to water, so water does not follow the ions","a *hypertonic* medulla / a solute concentration gradient that increases deeper into the medulla is created","water leaves the descending limb (permeable to water) by *osmosis* and is reabsorbed into the blood","the collecting duct passes through the hypertonic medulla, so water leaves by osmosis through *aquaporins* (when ADH is present)","flow in opposite directions (countercurrent multiplier) maintains the gradient / longer loops allow more concentrated urine"],"hl":true,"mod":"The ascending limb of the loop of Henle pumps sodium ions by active transport into the interstitial fluid of the medulla, and because it is impermeable to water, water does not follow. This makes the medulla hypertonic, with a solute concentration that increases deeper into it. Water therefore leaves by osmosis from the descending limb, which is permeable, and from the collecting duct as it passes through the medulla, through aquaporins when ADH is present. This water is reabsorbed into the blood, so concentrated urine is produced and water is conserved; the longer the loop, the steeper the gradient."}],"hl":false,"mk":7,"mkSL":4},{"qid":254,"p":"2","t":"D4.1","also":[],"title":"Natural selection","blocks":[],"parts":[{"l":"a","m":4,"q":"Explain how natural selection can lead to evolution.","pts":["there is *variation* between individuals in a population","variation is caused by mutation / meiosis and sexual reproduction","more offspring are produced than the environment can support / *overproduction*","there is *competition* for limited resources / a struggle for survival","individuals with better adapted characteristics survive and reproduce more / less well adapted individuals die or leave fewer offspring","characteristics must be *heritable*, so favourable alleles are passed to offspring","the *allele frequency* in the population changes over many generations","this change in the heritable characteristics of the population is evolution / acquired characteristics are not inherited"],"hl":false,"mod":"In a population there is variation between individuals, caused by mutation and by meiosis and sexual reproduction. More offspring are produced than the environment can support, so there is competition for limited resources. Individuals with better adapted characteristics survive and reproduce more, while less well adapted ones die or leave fewer offspring. Because these characteristics are heritable, favourable alleles are passed to the next generation more often. Repeated over many generations, the allele frequency of the population changes, and this change in heritable characteristics is evolution."},{"l":"b","m":3,"q":"In a population, 9% of individuals show the recessive phenotype. Calculate the frequency of heterozygotes.","pts":["frequency of recessive phenotype = q² = 0.09, so q = √0.09 = 0.3","p = 1 – q = 0.7","frequency of heterozygotes = 2pq = 2 × 0.7 × 0.3","= 0.42 / 42%"],"hl":true,"mod":"Using the Hardy–Weinberg equation, the frequency of the recessive phenotype is q² = 0.09, so q = √0.09 = 0.3. Since p + q = 1, p = 1 – 0.3 = 0.7. The frequency of heterozygotes is 2pq = 2 × 0.7 × 0.3 = 0.42, that is, 42% of the population."}],"hl":false,"mk":7,"mkSL":4},{"qid":255,"p":"2","t":"D4.2","also":[],"title":"Ecosystem stability","blocks":[],"parts":[{"l":"a","m":3,"q":"Outline the factors needed for an ecosystem to remain stable.","pts":["a continuous supply of *energy* (sunlight) for producers","*recycling of nutrients* by decomposers / saprotrophs","high *biodiversity* / genetic diversity, which gives resilience to change","climatic variables (temperature, rainfall) within the tolerance limits of the species","not passing a tipping point / no severe human disturbance (e.g. large-scale deforestation)"],"hl":false,"mod":"A stable ecosystem needs a continuous supply of energy, usually sunlight used by producers, and recycling of nutrients by decomposers, as nutrients are limited. It also needs high biodiversity and genetic diversity, which give resilience because other species can take over the role of those that are lost. Finally, climatic variables such as temperature and rainfall must stay within the tolerance limits of the species; if disturbance is too great, a tipping point can be passed and the ecosystem collapses."},{"l":"b","m":2,"q":"Explain, with an example, the role of a keystone species.","pts":["a *keystone species* has a disproportionate effect on community structure / stability relative to its abundance","if it is removed, the ecosystem changes greatly / may collapse","example: sea otters prey on sea urchins","without otters, urchins increase and destroy kelp forests, which provide habitat for many species"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Outline how rewilding restores natural processes.","pts":["*reintroduction* of lost species, especially apex predators / keystone species (e.g. wolves)","predators control herbivores, so vegetation recovers (trophic cascade)","human management (farming, flood control, intensive grazing) is reduced, so processes such as flooding and succession return","connectivity between habitats is re-established / corridors are created"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":256,"p":"2","t":"D4.3","also":[],"title":"Climate change","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain why coral reefs are threatened by climate change.","pts":["higher water temperatures cause heat stress in corals","corals expel their symbiotic *zooxanthellae* (*bleaching*)","they lose carbohydrates from zooxanthellae photosynthesis / their main food, and die if stress continues","more atmospheric CO₂ dissolves in the ocean, causing *acidification* (lower pH)","fewer carbonate ions are available, so deposition of *calcium carbonate* / reef building is reduced","death of corals removes the habitat of many species / may lead to ecosystem collapse"],"hl":false,"mod":"Climate change raises water temperature, causing heat stress in corals: they expel their symbiotic zooxanthellae and bleach. Because they lose the carbohydrates the zooxanthellae supplied by photosynthesis, they die if warming continues. In addition, rising atmospheric CO₂ means more CO₂ dissolves in the ocean, which becomes more acidic; with fewer carbonate ions, corals deposit less calcium carbonate and the reef grows more slowly or dissolves. The death of corals removes the habitat of many species and may lead to ecosystem collapse."},{"l":"b","m":2,"q":"Outline why a mismatch in phenology can reduce bird populations.","pts":["*phenology* is the timing of annual biological events, controlled by cues such as temperature or photoperiod","warming brings forward the peak of food (e.g. caterpillars / insects), which depends on temperature","the timing of bird breeding depends mainly on photoperiod, which does not change, so it does not shift as much","chicks hatch after the food peak, so fewer survive / breeding success falls"],"hl":true,"mod":""},{"l":"c","m":2,"q":"Suggest two ways of increasing carbon sequestration.","pts":["afforestation / reforestation: trees fix CO₂ by photosynthesis and store it in their biomass","restoration of wetlands / peatlands, where organic matter does not fully decompose and accumulates as peat","protection / restoration of mangroves and seagrass meadows","farming practices that increase soil carbon (e.g. no-till, cover crops)"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":5},{"qid":257,"p":"2X","t":"A1.2","also":["D1.2","D1.3"],"title":"Extended response: DNA and proteins","blocks":[],"parts":[{"l":"a","m":4,"q":"Draw a labelled diagram of a short section of DNA showing two pairs of nucleotides.","pts":["nucleotides drawn with correct symbols: phosphate (circle), *deoxyribose* (pentagon) and base (rectangle), with each component labelled at least once","sugar–phosphate backbone: phosphate of one nucleotide linked to the sugar of the next by a *covalent* bond in each strand","bases attached to C1 of deoxyribose and phosphate to C5 (correct positions on the pentagon)","*complementary base pairing* labelled: A with T and C with G","*hydrogen bonds* between complementary bases labelled (accept 2 between A–T and 3 between C–G)","*antiparallel* strands: one strand inverted relative to the other / 5' and 3' ends labelled on both strands"],"hl":false,"mod":"The drawing shows two strands of two nucleotides each. Each nucleotide is shown as a circle (phosphate) attached to C5 of a pentagon (deoxyribose) and a rectangle (base) attached to C1. Within each strand the phosphate of one nucleotide is linked by a covalent bond to the deoxyribose of the next, forming the sugar–phosphate backbone. The bases of the two strands pair complementarily, A with T and C with G, held together by hydrogen bonds (labelled). One strand is drawn upside down relative to the other, with the 5' and 3' ends labelled, to show that they are antiparallel."},{"l":"b","m":4,"q":"Describe how the base sequence of a gene is used to produce a polypeptide.","pts":["*transcription*: RNA polymerase separates the DNA strands and uses one (the template strand) to synthesize mRNA","RNA nucleotides pair complementarily with the template strand (with *uracil* instead of thymine)","mRNA leaves the nucleus through nuclear pores and binds to a *ribosome* (small subunit)","*translation*: the ribosome reads the mRNA in triplets of bases called *codons*","each tRNA carries a specific amino acid and has an *anticodon* that pairs with the complementary codon","the ribosome links adjacent amino acids by *peptide bonds*, forming the polypeptide","translation starts at a start codon (AUG) and ends at a stop codon / the ribosome moves along one codon at a time","the base sequence determines the amino acid sequence because the genetic code is universal / each codon codes for one amino acid"],"hl":false,"mod":"First, in transcription, RNA polymerase separates the DNA strands and uses the template strand to synthesize an mRNA molecule by complementary base pairing (with uracil instead of thymine). The mRNA leaves the nucleus through nuclear pores and binds to a ribosome. In translation, the ribosome reads the mRNA in codons, starting at the AUG start codon. Each tRNA carries a specific amino acid and its anticodon pairs with the complementary codon. The ribosome links adjacent amino acids with peptide bonds and moves along codon by codon until it reaches a stop codon, when the polypeptide is released. In this way the base sequence determines the amino acid sequence."},{"l":"c","m":8,"q":"Explain how mutations can affect the structure and function of proteins.","pts":["a gene mutation is a change in the *base sequence* of the DNA of a gene","a base *substitution* changes a single codon of the mRNA","it may be silent / have no effect because the genetic code is *degenerate* (the new codon codes for the same amino acid)","it may replace one amino acid with another in the primary structure (missense mutation)","it may create a premature *stop codon*, giving a shorter, usually non-functional, polypeptide","an *insertion* or *deletion* of bases (not a multiple of three) shifts the reading frame","all later codons change, so the amino acid sequence changes greatly and the protein is usually non-functional","a change in primary structure changes the bonds between R-groups and so the folding / *tertiary structure*","the shape of an enzyme's *active site* / a binding site may change, reducing or abolishing its function","example: in *sickle-cell anaemia* the codon GAG becomes GTG, and glutamic acid is replaced by valine in haemoglobin","haemoglobin S forms fibres / crystallizes at low oxygen concentration, red blood cells become sickle-shaped, carry less O₂ and block capillaries","some mutations are neutral or beneficial and are the original source of genetic *variation* for evolution"],"hl":false,"mod":"A gene mutation is a change in the base sequence of a gene, and because mRNA is transcribed from it, the amino acid sequence may change. A substitution alters a single codon: it may be silent because the code is degenerate, it may replace one amino acid with another, or it may create a premature stop codon that shortens the polypeptide. Insertions or deletions shift the reading frame and change every later codon, so they usually give non-functional proteins. A change in primary structure alters the interactions between R-groups and therefore the folding and tertiary structure; if the shape of the active site or a binding site changes, the protein loses function. For example, in sickle-cell anaemia the substitution GAG→GTG replaces glutamic acid with valine; the haemoglobin forms fibres at low oxygen concentration, red blood cells become sickle-shaped and carry less oxygen. However, some mutations are neutral or beneficial and provide the variation on which natural selection acts."}],"hl":false,"mk":16,"mkSL":16},{"qid":258,"p":"2X","t":"A4.1","also":["D4.1"],"title":"Extended response: evolution","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline the evidence for evolution from DNA and protein sequences.","pts":["*base sequences* of the same gene / amino acid sequences of the same protein (e.g. cytochrome c, haemoglobin) are compared between species","the more similar the sequences, the closer the relationship / the more recent the *common ancestor*","differences accumulate at a roughly constant rate, so the number of differences can be used to estimate when species diverged (*molecular clock*)","the *universal genetic code* / use of DNA, RNA and the same 20 amino acids by all organisms indicates common origin","the patterns of relationship from sequences largely agree with those from comparative anatomy / the fossil record","sequences are objective, quantitative data that allow comparison of organisms that look very different"],"hl":false,"mod":"The base sequences of the same gene, or the amino acid sequences of the same protein such as cytochrome c, can be compared between species. The more similar they are, the more recent their common ancestor, because differences accumulate by mutation at a roughly constant rate (molecular clock), which also allows the time of divergence to be estimated. The fact that all organisms use the same universal genetic code and the same 20 amino acids indicates common origin. In addition, the relationships obtained from sequences largely agree with those from comparative anatomy and fossils."},{"l":"b","m":4,"q":"Explain allopatric speciation, with an example.","pts":["a population is divided by a *geographical barrier* (e.g. a river, mountain range, sea)","there is no *gene flow* / interbreeding between the two populations","each population is exposed to different *selection pressures* (as well as different mutations / genetic drift)","the allele frequencies of the two populations diverge over many generations","*reproductive isolation* develops: even if they meet again, they can no longer interbreed / produce fertile offspring","two separate species have formed from one","named example: Kaibab and Abert squirrels on either side of the Grand Canyon / finches on different Galápagos islands / bonobos and chimpanzees separated by the River Congo"],"hl":false,"mod":"Allopatric speciation begins when a geographical barrier divides a population into two, so that gene flow between them stops. Each population is exposed to different selection pressures and accumulates different mutations, so their allele frequencies diverge over many generations. Eventually reproductive isolation develops: even if they met again they could not produce fertile offspring, so they are separate species. For example, bonobos and chimpanzees evolved from a common ancestor after being separated by the River Congo."},{"l":"c","m":8,"q":"Discuss the role of natural selection and other factors in changing allele frequencies in a population.","pts":["there is heritable *variation* between individuals in a population, originally caused by mutation (and recombination in meiosis / sexual reproduction)","more offspring are produced than the environment can support, so there is *competition* / a struggle for survival","individuals with traits better adapted to the selection pressures survive and reproduce more (*differential survival*)","they pass their alleles to offspring, so the frequency of favourable alleles *increases* in the next generation","example: antibiotic resistance in bacteria / pesticide resistance, with an increase in the resistance allele","*sexual selection* (mate choice / male–male competition) favours traits that increase reproductive success even if not survival","directional selection shifts the mean of a trait / stabilizing favours intermediates / disruptive favours extremes (AHL)","*mutation* introduces new alleles but changes frequencies only very slowly","migration / *gene flow* between populations adds or removes alleles","*genetic drift*: random changes in frequencies, important in small populations (e.g. founder effect / bottleneck), which do not produce adaptation","the *Hardy–Weinberg* principle predicts constant frequencies only if the population is large, with random mating and no selection, mutation or migration, so a deviation shows these factors are acting (AHL)","balanced conclusion: natural selection is the only factor that consistently produces *adaptation*, although the other factors also change allele frequencies"],"hl":false,"mod":"Within a population there is heritable variation, originally caused by mutation, and more offspring are produced than the environment can support, so there is competition. Individuals whose traits are better adapted to the selection pressures survive and reproduce more and pass on their alleles, so the frequency of favourable alleles increases from generation to generation. For example, when antibiotics are used, bacteria with a resistance allele survive and the frequency of that allele increases rapidly. Sexual selection also changes frequencies by favouring traits that increase reproductive success, even if they reduce survival. However, selection is not the only factor: mutation provides new alleles, although it changes frequencies very slowly; migration adds or removes alleles through gene flow; and in small populations genetic drift changes frequencies randomly, for example after a founder effect. In conclusion, all these factors alter allele frequencies, but only natural selection does so non-randomly and produces adaptation, so it is the main driver of adaptive evolution."}],"hl":true,"mk":16,"mkSL":16},{"qid":259,"p":"2X","t":"B2.1","also":["B2.2"],"title":"Extended response: membranes","blocks":[],"parts":[{"l":"a","m":4,"q":"Draw the fluid mosaic model of a membrane.","pts":["phospholipid *bilayer* with heads facing outwards and tails inwards","hydrophilic heads and hydrophobic tails labelled","*integral protein* spanning the bilayer (transmembrane) / channel protein with a pore","*peripheral protein* on the surface of one side","*glycoprotein* with a carbohydrate chain on the outer side only (and/or glycolipid)","*cholesterol* between the phospholipids, in the hydrophobic region"],"hl":false,"mod":"The drawing shows a phospholipid bilayer with hydrophilic heads facing outwards and hydrophobic tails facing inwards, both labelled. An integral protein spans the whole bilayer and a peripheral protein sits on the surface of one side. A glycoprotein with a branched carbohydrate chain is shown on the outer side only, and labelled cholesterol molecules lie between the phospholipid tails."},{"l":"b","m":4,"q":"Describe how vesicles are used to move materials within and out of cells.","pts":["proteins synthesized by ribosomes on the *rough ER* are carried in vesicles that bud off the ER","the vesicles move to the *Golgi apparatus* and fuse with it, where the proteins are modified","secretory vesicles / vesicles carrying enzymes to lysosomes bud off the Golgi","in *exocytosis*, vesicles fuse with the plasma membrane and release their contents outside the cell","in *endocytosis*, the plasma membrane folds inwards and pinches off to form a vesicle that brings materials in","membrane *fluidity* allows vesicles to form and to fuse with other membranes","vesicle movement requires *ATP* / motor proteins moving along the cytoskeleton"],"hl":false,"mod":"Proteins made by ribosomes on the rough ER are packaged into vesicles that bud off the ER and fuse with the Golgi apparatus, where they are modified. Secretory vesicles bud off the Golgi, move to the plasma membrane using ATP and fuse with it, releasing their contents outside by exocytosis. Conversely, in endocytosis the plasma membrane folds inwards and pinches off to form a vesicle that brings materials into the cell. All this is possible because the membrane is fluid, which allows vesicles to form and fuse with other membranes."},{"l":"c","m":8,"q":"Explain how different methods of membrane transport allow cells to control what enters and leaves.","pts":["the phospholipid bilayer has a hydrophobic core that is a barrier to ions and large polar molecules","*simple diffusion*: only small non-polar molecules (O₂, CO₂) cross the bilayer, down the gradient; it is not selective","*osmosis*: water crosses the membrane mainly through *aquaporins*, towards the solution with the higher solute concentration","*facilitated diffusion*: specific channel proteins let through only one particular ion / molecule, down the gradient","*gated channels* (voltage- or ligand-gated) open only in response to a signal, so the cell controls when ions pass","*active transport*: specific pump proteins use *ATP* to move substances against their concentration gradient","so the cell can accumulate substances it needs / expel substances even when they are more concentrated outside","example: the Na⁺/K⁺ pump moves 3 Na⁺ out and 2 K⁺ in per ATP (AHL)","indirect active transport: the Na⁺–glucose *cotransporter* uses the Na⁺ gradient to bring glucose in (AHL)","*endocytosis* / *exocytosis* move large molecules or particles in vesicles","the shape specificity of transport proteins produces *selective permeability*","the cell can change the number / type of transport proteins in its membrane (e.g. inserting aquaporins) to adjust permeability"],"hl":false,"mod":"The hydrophobic core of the phospholipid bilayer prevents the passage of ions and large polar molecules, so the cell controls their movement with transport proteins. Only small non-polar molecules such as O₂ and CO₂ cross the bilayer by simple diffusion, which is not selective. Water moves by osmosis, mainly through aquaporins. In facilitated diffusion, specific channel proteins allow only one type of ion or molecule through down its gradient, and voltage- or ligand-gated channels open only in response to a signal, which lets the cell control when ions enter or leave. By active transport, specific pump proteins use ATP to move substances against their gradient, so the cell can accumulate what it needs or expel what it does not. Large molecules enter by endocytosis and leave by exocytosis in vesicles. Because each transport protein is specific in shape, the membrane is selectively permeable, and the cell can adjust what passes by changing the number and type of transport proteins in its membrane, for example by inserting more aquaporins."}],"hl":true,"mk":16,"mkSL":16},{"qid":260,"p":"2X","t":"B3.1","also":["B3.2"],"title":"Extended response: transport and exchange","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe how gas exchange surfaces are adapted for diffusion.","pts":["*large surface area* (e.g. millions of alveoli / gill lamellae) relative to volume","*thin* epithelium (a single layer of flattened cells) giving a short diffusion distance","*moist* surface so that gases dissolve before diffusing","permeable to the respiratory gases (O₂ and CO₂)","steep *concentration gradient* maintained by ventilation, which renews the air / water","and by a dense capillary network whose blood flow continuously removes O₂ and brings CO₂"],"hl":false,"mod":"Gas exchange surfaces have a large surface area relative to volume, such as the millions of alveoli in the lungs, so a lot of gas can diffuse at once. They consist of a very thin epithelium, a single layer of flattened cells, so the diffusion distance is short, and they are moist so that gases dissolve before diffusing. A steep concentration gradient is also maintained by ventilation, which renews the air, and by a dense capillary network whose blood flow continuously removes oxygen and brings carbon dioxide."},{"l":"b","m":4,"q":"Compare and contrast the transport of water in xylem with the transport of sucrose in phloem.","pts":["similarity: both are vascular tissues of continuous tubes that transport substances dissolved in water by mass flow","contents: xylem carries *water and mineral ions*; phloem carries *sucrose* (and amino acids)","direction: xylem only upwards, from roots to leaves; phloem in both directions, from *source to sink*","mechanism: xylem is passive, driven by *tension* from transpiration (negative pressure); phloem requires active loading of sucrose, which generates positive pressure","cells: xylem consists of vessels of dead cells without end walls, strengthened with *lignin*; phloem consists of living sieve tubes with sieve plates and companion cells","energy: xylem transport uses no ATP from the plant; phloem transport does (in active loading)"],"hl":false,"mod":"Both xylem and phloem are vascular tissues that transport substances dissolved in water by mass flow. However, xylem carries water and mineral ions only upwards, from roots to leaves, whereas phloem carries sucrose in both directions, from sources to sinks. Flow in xylem is passive, driven by the tension generated by transpiration, whereas flow in phloem depends on active loading of sucrose using ATP, which generates positive pressure. In addition, xylem vessels are made of dead cells strengthened with lignin, whereas phloem is made of living sieve tubes with companion cells."},{"l":"c","m":8,"q":"Explain how the structure of the mammalian circulatory system allows efficient delivery of oxygen to tissues.","pts":["*double circulation*: blood passes through the heart twice in each complete circuit (pulmonary and systemic)","after being oxygenated in the lungs, blood returns to the heart and is pumped again, so it reaches the tissues at *high pressure*","the *left ventricle* has a thick muscular wall that generates enough pressure for the whole systemic circulation","*valves* in the heart (and veins) prevent backflow and keep flow in one direction","*arteries* have thick walls with elastic fibres that stretch and recoil, maintaining pressure between beats","the muscular walls of arteries / arterioles can contract or relax to direct more blood to active tissues","*capillaries* have walls one cell thick, with pores, giving a short diffusion distance","they form highly branched networks with a large surface area that reach close to every cell / slow flow allows time for exchange","*haemoglobin* in red blood cells carries far more O₂ than could dissolve in plasma","red blood cells have no nucleus (more room for haemoglobin) and are *biconcave* (more surface area, rapid diffusion)","in active tissues, the higher CO₂ concentration shifts the dissociation curve (*Bohr shift*) and more O₂ is released (AHL)","*veins* have a wide lumen and valves that return blood to the heart at low pressure","during exercise heart rate and stroke volume increase, so more O₂ reaches the muscles"],"hl":false,"mod":"Mammals have a double circulation: after being oxygenated in the lungs, blood returns to the heart and is pumped again, so it reaches the tissues at high pressure. The left ventricle has a thick muscular wall that generates this pressure, and valves prevent backflow, so blood flows in one direction. Arteries have thick walls with elastic fibres that recoil between beats and maintain pressure, and their smooth muscle can direct more blood to active tissues. In the tissues, capillaries have walls one cell thick and form highly branched networks close to every cell, giving a large surface area and a short diffusion distance for oxygen to pass into the cells. Oxygen is carried bound to haemoglobin in red blood cells, which have no nucleus and are biconcave, so they hold more haemoglobin and the gas diffuses quickly. Veins, with a wide lumen and valves, return blood to the heart, and during exercise heart rate increases to deliver even more oxygen to the muscles."}],"hl":true,"mk":16,"mkSL":16},{"qid":261,"p":"2X","t":"B4.1","also":["B4.2","D4.2"],"title":"Extended response: adaptation and ecology","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline how abiotic factors affect species distribution.","pts":["each species has a *range of tolerance* for each abiotic factor, with an optimum and limits","abiotic factors: temperature, water availability, light intensity, pH, salinity, soil nutrients","a species is only found where all factors are within its range of tolerance","outside the range, survival / growth / reproduction decrease or are impossible","the factor furthest from the optimum acts as a *limiting factor* that restricts distribution","example: reef-building corals need warm, clear (light for zooxanthellae), shallow water / temperature limits the altitude of mountain species","transects and quadrat sampling allow distribution to be related to gradients in abiotic factors"],"hl":false,"mod":"Each species has a range of tolerance for each abiotic factor, such as temperature, water, light, pH or salinity. It can only survive and reproduce where all these factors are within that range, so its distribution is restricted by the factor furthest from its optimum, which acts as a limiting factor. For example, reef-building corals are only found in warm, clear, shallow water, because their symbiotic algae need light and do not tolerate low temperatures."},{"l":"b","m":4,"q":"Describe adaptations of predators and prey.","pts":["predators: speed / agility to chase prey (e.g. cheetah)","predators: sharp teeth / claws / beaks to catch and kill"
