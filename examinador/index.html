ormación en forma de diagrama, tabla o secuencia lógica.",3],["Deduzca","Llega a una conclusión usando la información que se te da.",3],["Diseñe","Planifica un experimento, un modelo o un procedimiento.",3],["Determine","Encuentra la única respuesta posible.",3],["Discuta","Haz un análisis equilibrado de varios argumentos o factores y termina con una conclusión justificada.",3],["Evalúe","Juzga algo comparando sus puntos fuertes con sus debilidades.",3],["Explique","Da una explicación detallada que incluya razones o causas (\"porque…\").",3],["Justifique","Da razones o pruebas que respalden tu respuesta.",3],["Prediga","Di qué resultado esperas.",3],["Esboce","Haz un diagrama o gráfico aproximado que muestre la forma general y los rasgos clave.",3],["Sugiera","Propón una respuesta, hipótesis o solución posible, aunque pueda haber otras.",3]],"wr":[{"qid":205,"p":"1B","t":"A2.2","also":["B2.2"],"title":"Medir orgánulos","blocks":[{"k":"p","v":"Un estudiante examinó una micrografía electrónica de una célula hepática. La barra de escala de la micrografía mide 25 mm y representa 1 µm. Una mitocondria de la micrografía mide 50 mm de largo."},{"k":"table","cap":"Número de mitocondrias por célula en tres tipos de células humanas","rows":[["Tipo de célula","Número medio de mitocondrias por célula"],["Célula hepática","1800"],["Célula de la piel (epidermis)","300"],["Célula del músculo cardíaco","5000"]]}],"parts":[{"l":"a","m":2,"q":"Calcule la longitud real de la mitocondria, mostrando el procedimiento.","pts":["procedimiento: longitud real = longitud medida ÷ aumento / 50 mm ÷ 25 mm = 2 barras de escala / 50 000 µm ÷ 25 000","longitud real = 2 *µm* (se exige la unidad; aceptar 2,0 µm / 0,002 mm / 2 × 10⁻⁶ m)"],"mod":"","hl":false},{"l":"b","m":1,"q":"Calcule el aumento de la micrografía.","pts":["aumento = longitud de la barra ÷ longitud que representa = 25 mm ÷ 1 µm = 25 000 µm ÷ 1 µm = ×25 000 (aceptar 2,5 × 10⁴; sin unidades)"],"mod":"","hl":false},{"l":"c","m":2,"q":"Sugiera razones para la diferencia en el número de mitocondrias entre las células del músculo cardíaco y las de la piel.","pts":["la célula del músculo cardíaco tiene 5000 mitocondrias frente a 300 en la de la piel / unas 17 veces más (uso de los datos de la tabla)","el músculo cardíaco se contrae continuamente / durante toda la vida, por lo que tiene una demanda de energía / *ATP* muy alta","las mitocondrias producen ATP mediante *respiración celular aeróbica*, de modo que más mitocondrias permiten producir más ATP","las células de la piel tienen una actividad metabólica menor / no se contraen / necesitan menos ATP, por lo que les bastan menos mitocondrias"],"mod":"","hl":false},{"l":"d","m":3,"q":"Resuma las pruebas de que las mitocondrias evolucionaron a partir de procariotas de vida libre.","pts":["tienen *ADN* propio, que es circular y desnudo / sin histonas, como el de los procariotas","tienen ribosomas *70S*, del mismo tamaño que los de los procariotas (y no 80S como los del citoplasma eucariota)","tienen *doble membrana*, lo que concuerda con que un procariota fuera englobado por endocitosis por una célula mayor","solo se forman por división de mitocondrias preexistentes, mediante un proceso parecido a la *fisión binaria*","tienen un tamaño / una forma similar a los de las bacterias","transcriben su ADN y sintetizan algunas de sus propias proteínas / son sensibles a antibióticos que afectan a las bacterias"],"mod":"Las mitocondrias tienen su propio ADN, que es circular y desnudo como el de los procariotas, y ribosomas 70S, del mismo tamaño que los bacterianos y distintos de los 80S del citoplasma. Están rodeadas por una doble membrana, lo que concuerda con que un procariota aeróbico fuera englobado por endocitosis por una célula mayor. Además, solo se originan por división de otras mitocondrias, mediante un proceso similar a la fisión binaria, y tienen un tamaño parecido al de las bacterias. Todo ello apoya la teoría endosimbiótica.","hl":true}],"hl":false,"mk":8,"mkSL":5},{"qid":206,"p":"1B","t":"B2.1","also":["D2.3"],"title":"Membranas de remolacha y temperatura","blocks":[{"k":"p","v":"Se colocaron discos de remolacha en agua a distintas temperaturas durante 30 minutos. El pigmento rojo sale cuando las membranas se dañan. Se midió la absorbancia del agua con un colorímetro (más absorbancia = más pigmento)."},{"k":"chart","type":"line","title":"Pigmento liberado a distintas temperaturas","x":"Temperatura / °C","y":"Absorbancia / UA","s":[{"n":"Absorbancia media","pts":[["10",0.05],["20",0.06],["30",0.08],["40",0.15],["50",0.42],["60",0.81],["70",0.95]]}]}],"parts":[{"l":"a","m":1,"q":"Indique el intervalo de 10 °C en el que más aumentó la absorbancia.","pts":["de *50 a 60 °C* (aumento de 0,39 UA) / aceptar «de 40 a 60 °C» solo si se citan ambos valores de absorbancia"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique la tendencia que se observa por encima de 40 °C.","pts":["la absorbancia aumenta de forma pronunciada, de 0,15 UA a 40 °C a 0,95 UA a 70 °C, porque sale más pigmento","a mayor temperatura, los fosfolípidos tienen más energía cinética / la bicapa se vuelve más *fluida* y más permeable","las *proteínas* de membrana se *desnaturalizan* / pierden su forma tridimensional","se forman huecos en la membrana / la membrana pierde su integridad / deja de ser selectivamente permeable","el pigmento *difunde* fuera de la vacuola y de la célula hacia el agua (atraviesa el tonoplasto y la membrana plasmática)","el aumento se frena entre 60 y 70 °C porque casi todas las membranas ya están dañadas / queda poco pigmento por salir"],"hl":false,"mod":"Por encima de 40 °C la absorbancia aumenta mucho, de 0,15 UA a 0,95 UA a 70 °C, lo que indica que sale cada vez más pigmento. Al subir la temperatura los fosfolípidos ganan energía cinética, de modo que la bicapa se vuelve más fluida y permeable. Además, las proteínas de membrana se desnaturalizan y aparecen huecos, por lo que la membrana deja de ser selectivamente permeable. El pigmento difunde entonces desde la vacuola hasta el agua. Entre 60 y 70 °C el aumento es menor porque casi todas las membranas ya están dañadas."},{"l":"c","m":2,"q":"Identifique dos variables que deberían mantenerse constantes en esta investigación.","pts":["tamaño / área superficial / masa / número de los discos","volumen de agua en cada tubo","tiempo de inmersión (30 minutos)","misma remolacha / misma parte y edad de la raíz","enjuagado previo de los discos para eliminar el pigmento de las células cortadas","misma longitud de onda / mismo filtro del colorímetro"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Sugiera cómo podría mejorarse la fiabilidad de los resultados.","pts":["*repetir* cada temperatura varias veces (al menos tres réplicas) y calcular la *media*","identificar y descartar resultados anómalos / calcular la desviación típica para valorar la variación","usar un baño termostático para mantener constante cada temperatura","calibrar el colorímetro a cero con agua destilada antes de cada lectura","agitar o mezclar el agua antes de tomar la muestra para que el pigmento esté repartido de manera uniforme"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":207,"p":"1B","t":"B3.1","also":["B3.2"],"title":"Densidad estomática en hojas de sol y de sombra","blocks":[{"k":"p","v":"Se tomaron moldes con esmalte de uñas del envés de hojas del mismo árbol. Se contaron los estomas en campos de visión de 0,2 mm² de área."},{"k":"table","cap":"Estomas contados por campo de visión","rows":[["Hoja","Conteo 1","Conteo 2","Conteo 3","Conteo 4","Media"],["Hoja de sol","46","52","49","53","50"],["Hoja de sombra","31","27","30","28","?"]]}],"parts":[{"l":"a","m":1,"q":"Calcule el conteo medio de la hoja de sombra.","pts":["(31 + 27 + 30 + 28) ÷ 4 = *29* (estomas por campo de visión)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calcule la densidad estomática de la hoja de sol en estomas por mm². Muestre el procedimiento.","pts":["densidad = conteo medio ÷ área del campo de visión = 50 ÷ 0,2","= *250* estomas mm⁻² (la unidad es necesaria)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Sugiera una ventaja y una desventaja de una alta densidad estomática en las hojas de sol.","pts":["ventaja: entra más *CO₂* por difusión / intercambio de gases más rápido","ventaja: permite una tasa de *fotosíntesis* mayor cuando la intensidad lumínica es alta / el CO₂ no es el factor limitante","ventaja: más transpiración, que enfría la hoja expuesta al sol","desventaja: se pierde más agua (vapor de agua) por *transpiración*","desventaja: mayor riesgo de marchitez / deshidratación si el suelo está seco (máx. 1 por ventaja y máx. 1 por desventaja)"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Explique cómo la transpiración contribuye al ascenso del agua por el tallo.","pts":["el agua se *evapora* de las paredes húmedas de las células del mesófilo y el vapor sale por difusión a través de los estomas","el agua perdida se repone desde el xilema de la hoja, que tira del agua por acción capilar en las paredes celulares","se genera *tensión* / presión negativa en los vasos del xilema","la *cohesión* entre las moléculas de agua, debida a los enlaces de hidrógeno, mantiene una columna continua","la columna de agua es arrastrada hacia arriba desde la raíz (corriente de transpiración), sin gasto de energía de la planta","la adhesión del agua a las paredes del xilema ayuda a que la columna no se rompa","las paredes del xilema están engrosadas con lignina, por lo que resisten la tensión sin colapsar"],"hl":false,"mod":"El agua se evapora de las paredes húmedas de las células del mesófilo y el vapor sale por difusión a través de los estomas. Esa agua se repone desde el xilema de la hoja, lo que genera tensión (presión negativa) en los vasos del xilema. Como las moléculas de agua están unidas por cohesión, debida a los enlaces de hidrógeno, forman una columna continua que es arrastrada hacia arriba desde la raíz sin que la planta gaste energía. La adhesión a las paredes y la lignina, que evita que el vaso colapse, mantienen la columna."}],"hl":false,"mk":8,"mkSL":8},{"qid":208,"p":"1B","t":"C1.1","also":["B1.2"],"title":"Catalasa y pH","blocks":[{"k":"p","v":"Se añadió catalasa extraída de papa a peróxido de hidrógeno a distintos pH. Se registró el volumen de oxígeno recogido en 2 minutos."},{"k":"chart","type":"bar","title":"Oxígeno producido por la catalasa a distintos pH","x":"pH","y":"Volumen de oxígeno / cm³","s":[{"n":"Volumen medio","pts":[["4",3.1],["5",7.8],["6",13.5],["7",16.2],["8",12.0],["9",4.4]]}]}],"parts":[{"l":"a","m":1,"q":"Indique el pH óptimo de esta catalasa.","pts":["pH *7*"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calcule la velocidad media de producción de oxígeno a pH 6, en cm³ por minuto.","pts":["procedimiento: 13,5 cm³ ÷ 2 min","= 6,75 cm³ min⁻¹ (aceptar 6,8; se requiere la unidad)"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique por qué el volumen de oxígeno es menor a pH 4 que a pH 7.","pts":["pH 7 es el pH *óptimo* de la catalasa / a pH 4 se produce 3,1 cm³ frente a 16,2 cm³ a pH 7","a pH 4 hay una mayor concentración de iones H⁺ que altera los enlaces iónicos / de hidrógeno que mantienen la estructura de la enzima","cambia la forma / las propiedades químicas del *sitio activo*","la enzima se *desnaturaliza* (total o parcialmente)","el sustrato / peróxido de hidrógeno ya no se une bien al sitio activo, por lo que se forman menos complejos enzima–sustrato","disminuye la velocidad de reacción, de modo que se descompone menos peróxido de hidrógeno / se libera menos oxígeno en los 2 minutos"],"hl":false,"mod":"El pH 7 es el óptimo de esta catalasa (16,2 cm³ de oxígeno frente a solo 3,1 cm³ a pH 4). A pH 4 la concentración de iones H⁺ es mucho mayor y estos alteran los enlaces iónicos y de hidrógeno que mantienen la estructura terciaria de la enzima. Como resultado cambia la forma del sitio activo, es decir, la enzima se desnaturaliza parcialmente. El peróxido de hidrógeno ya no encaja bien en el sitio activo, se forman menos complejos enzima–sustrato por unidad de tiempo y la velocidad de reacción baja, por lo que en 2 minutos se libera menos oxígeno."},{"l":"d","m":2,"q":"Sugiera limitaciones de medir el oxígeno contando burbujas en lugar de recoger el gas.","pts":["las burbujas tienen tamaños / volúmenes distintos, así que el número de burbujas no es proporcional al volumen de gas","es difícil contar con exactitud cuando las burbujas salen muy rápido / se pueden pasar por alto burbujas (error humano)","no se obtiene un volumen en cm³ / la medida es menos precisa que la de una jeringa de gases o una probeta invertida","algunas burbujas pueden unirse entre sí o quedar adheridas al tejido / al recipiente"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":209,"p":"1B","t":"C1.2","also":["C1.3"],"title":"Respirómetro con semillas en germinación","blocks":[{"k":"p","v":"Un respirómetro contenía guisantes en germinación e hidróxido de potasio (que absorbe CO₂). Una gota de líquido coloreado en un tubo capilar se movía hacia los guisantes al consumirse oxígeno."},{"k":"table","cap":"Distancia recorrida por la gota en 10 minutos","rows":[["Temperatura / °C","Distancia / mm (ensayo 1)","Distancia / mm (ensayo 2)","Distancia / mm (ensayo 3)"],["15","12","14","13"],["25","26","25","27"],["35","41","43","39"]]}],"parts":[{"l":"a","m":1,"q":"Calcule la distancia media recorrida por la gota a 25 °C.","pts":["(26 + 25 + 27) ÷ 3 = *26 mm* (se requiere la unidad)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Explique por qué la gota se mueve hacia los guisantes.","pts":["los guisantes consumen *oxígeno* en la respiración celular aeróbica","el dióxido de carbono que producen es absorbido por el hidróxido de potasio / no sustituye al oxígeno consumido","disminuye el volumen / la presión del gas dentro del respirómetro","la presión atmosférica exterior, ahora mayor, empuja la gota hacia los guisantes"],"hl":false,"mod":""},{"l":"c","m":2,"q":"El tubo capilar tiene una sección transversal de 0,8 mm². Calcule el volumen de oxígeno consumido por minuto a 35 °C.","pts":["distancia media = (41 + 43 + 39) ÷ 3 = 41 mm; volumen = 41 mm × 0,8 mm² = 32,8 mm³","32,8 ÷ 10 min = 3,28 mm³ min⁻¹ (aceptar 3,3; se requiere la unidad)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Describa un control adecuado para este experimento.","pts":["el mismo montaje sin organismos vivos: con semillas muertas (hervidas) / con bolitas de vidrio en lugar de guisantes","con la misma masa / el mismo volumen de material y la misma cantidad de hidróxido de potasio, a las mismas temperaturas y durante 10 minutos","muestra cualquier movimiento de la gota debido a cambios de temperatura / presión y no a la respiración","la distancia del control se resta de / se usa para corregir la distancia medida con los guisantes en germinación"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Prediga, dando una razón, el efecto de usar semillas de guisante que no están germinando.","pts":["la gota recorrería una distancia (mucho) menor / casi no se movería","las semillas secas / en latencia tienen una tasa de respiración / un metabolismo muy bajos, por lo que consumen poco oxígeno","la germinación requiere mucho ATP para el crecimiento / la división celular, lo que explica el mayor consumo de oxígeno de las semillas en germinación","sin agua absorbida las enzimas de la semilla están inactivas"],"hl":false,"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":210,"p":"1B","t":"C4.1","also":["B4.2"],"title":"Dos especies en una costa rocosa","blocks":[{"k":"p","v":"Unos ecólogos colocaron 100 cuadrantes al azar en una costa rocosa y registraron si había dos especies de algas."},{"k":"table","cap":"Número de cuadrantes","rows":[["","Especie B presente","Especie B ausente","Total"],["Especie A presente","12","38","50"],["Especie A ausente","28","22","50"],["Total","40","60","100"]]}],"parts":[{"l":"a","m":2,"q":"Calcule el número esperado de cuadrantes con ambas especies si no hubiera asociación.","pts":["(total de fila × total de columna) ÷ total general = (50 × 40) ÷ 100","= 20 (cuadrantes)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Indique la hipótesis nula de una prueba de chi-cuadrado con estos datos.","pts":["no hay *asociación* entre la especie A y la especie B / las dos especies se distribuyen de forma *independiente* una de otra"],"hl":false,"mod":""},{"l":"c","m":2,"q":"El valor de χ² calculado es 10,7. El valor crítico para p = 0,05 con 1 grado de libertad es 3,84. Deduzca qué muestra el resultado.","pts":["el valor calculado (10,7) es mayor que el valor crítico (3,84), por lo que se *rechaza* la hipótesis nula","hay una asociación *significativa* entre las dos especies al nivel del 5 % / la probabilidad de que la diferencia se deba al azar es menor que 0,05","la asociación es *negativa*: se observan 12 cuadrantes con ambas especies frente a 20 esperados / las especies tienden a no aparecer juntas"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Sugiera razones para la asociación entre las dos especies.","pts":["*competencia* interespecífica por un recurso como el espacio de fijación en la roca / la luz","una especie excluye a la otra de las zonas donde ambas podrían vivir (exclusión competitiva)","tienen distintas tolerancias a factores abióticos como la desecación / el oleaje / la temperatura, por lo que ocupan zonas distintas de la costa","un herbívoro que se alimenta de una especie es más abundante donde crece la otra / una especie libera sustancias que inhiben a la otra"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Explique por qué los cuadrantes deben colocarse al azar.","pts":["para evitar el *sesgo* del investigador al elegir las zonas, de modo que la muestra sea representativa de toda la costa","cada punto de la zona tiene la misma probabilidad de ser muestreado, condición necesaria para que la prueba de chi-cuadrado sea válida"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":211,"p":"1B","t":"C2.2","also":["C3.1"],"title":"Registro de un potencial de acción","blocks":[{"k":"p","v":"Un electrodo dentro de un axón gigante registró el potencial de membrana tras un estímulo."},{"k":"chart","type":"line","title":"Potencial de membrana tras un estímulo","x":"Tiempo / ms","y":"Potencial de membrana / mV","s":[{"n":"Potencial","pts":[["0",-70.0],["0.5",-70.0],["1",-55.0],["1.5",30.0],["2",10.0],["2.5",-60.0],["3",-80.0],["3.5",-75.0],["4",-70.0],["5",-70.0]]}]}],"parts":[{"l":"a","m":1,"q":"Indique el potencial de reposo del axón.","pts":["*–70 mV* (se requieren el signo y la unidad)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique el cambio de potencial entre 1 ms y 1,5 ms.","pts":["el potencial de membrana sube de –55 mV a +30 mV / se invierte la polaridad de la membrana","a 1 ms se alcanza el potencial *umbral* (unos –55 mV)","se abren los canales de sodio *regulados por voltaje*","los iones Na⁺ *difunden* hacia el interior del axón a favor de su gradiente de concentración","la entrada de cargas positivas hace que el interior se vuelva positivo respecto al exterior: *despolarización*","la entrada de Na⁺ provoca la apertura de más canales de sodio (retroalimentación positiva)"],"hl":false,"mod":"Entre 1 ms y 1,5 ms el potencial de membrana pasa de –55 mV a +30 mV: es la despolarización. A 1 ms el estímulo ha llevado la membrana al potencial umbral (unos –55 mV), lo que abre los canales de sodio regulados por voltaje. Como el Na⁺ está más concentrado fuera del axón, los iones difunden rápidamente hacia el interior a favor de su gradiente de concentración. Esta entrada de cargas positivas abre aún más canales de sodio (retroalimentación positiva) e invierte la polaridad de la membrana, de modo que el interior queda positivo respecto al exterior."},{"l":"c","m":2,"q":"Explique por qué el potencial desciende por debajo de –70 mV a los 3 ms.","pts":["durante la repolarización los iones K⁺ difunden hacia el exterior del axón por canales de potasio regulados por voltaje","los canales de potasio se cierran lentamente / siguen abiertos después de alcanzarse –70 mV","sale más K⁺ del necesario, de modo que el interior queda más negativo (–80 mV) que en reposo: *hiperpolarización*","después, la bomba de sodio-potasio / el cierre de los canales restablece el potencial de reposo de –70 mV"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Calcule el tiempo transcurrido desde que se alcanza el potencial umbral (–55 mV) hasta que se recupera el potencial de reposo.","pts":["umbral a 1 ms y vuelta a –70 mV a los 4 ms: 4 – 1","= 3 ms (se requiere la unidad)"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":212,"p":"1B","t":"C3.2","also":["C4.1"],"title":"Vacunación y casos de sarampión","blocks":[{"k":"p","v":"Los datos muestran la cobertura de vacunación y el número de casos de sarampión en un país durante diez años."},{"k":"chart","type":"line","title":"Vacunación contra el sarampión y casos","x":"Año","y":"Cobertura de vacunación / %","s":[{"n":"Cobertura / %","pts":[["2014",93.0],["2015",94.0],["2016",92.0],["2017",89.0],["2018",86.0],["2019",84.0],["2020",85.0],["2021",88.0],["2022",91.0],["2023",94.0]]}]},{"k":"table","cap":"Casos de sarampión notificados","rows":[["Año","2014","2016","2018","2019","2021","2023"],["Casos","120","150","1900","4200","2100","180"]]}],"parts":[{"l":"a","m":1,"q":"Indique el año con la menor cobertura de vacunación.","pts":["*2019* (84 %)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calcule el aumento porcentual de casos de 2016 a 2019.","pts":["(4200 – 150) ÷ 150 × 100","= 2700 %"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique la relación entre la cobertura de vacunación y el número de casos.","pts":["correlación *negativa*: al bajar la cobertura aumentan los casos y al recuperarse la cobertura disminuyen","cita de datos con unidades, p. ej. la cobertura baja del 92 % (2016) al 84 % (2019) y los casos suben de 150 a 4200","con una cobertura alta hay *inmunidad colectiva* / de grupo: las personas inmunes impiden que el virus llegue a las susceptibles","al bajar la cobertura hay más personas susceptibles / sin células de memoria ni anticuerpos contra el virus","cada persona infectada contagia a más personas, por lo que el virus se propaga / se producen brotes","el sarampión es muy contagioso, por lo que se necesita una cobertura muy alta (alrededor del 95 %) para interrumpir la transmisión"],"hl":false,"mod":"Hay una correlación negativa: cuando la cobertura baja del 92 % en 2016 al 84 % en 2019, los casos suben de 150 a 4200, y cuando la cobertura vuelve al 94 % en 2023 los casos caen a 180. Con una cobertura alta existe inmunidad colectiva, porque la mayoría de las personas tiene células de memoria y anticuerpos y el virus no encuentra huéspedes susceptibles a los que pasar. Al bajar la cobertura aumenta la proporción de personas susceptibles, cada infectado contagia a más personas y el virus se propaga en brotes. Como el sarampión es muy contagioso, basta una caída de pocos puntos porcentuales para perder la inmunidad colectiva."},{"l":"d","m":2,"q":"Describa cómo una vacuna produce inmunidad a largo plazo.","pts":["la vacuna contiene *antígenos* del patógeno (o ácidos nucleicos que codifican antígenos) que no causan la enfermedad","los antígenos activan los linfocitos específicos / desencadenan una respuesta inmunitaria primaria","los linfocitos B activados se dividen y forman células plasmáticas y *células de memoria*","las células de memoria persisten durante años y, ante una infección real, producen anticuerpos más rápido y en mayor cantidad (respuesta secundaria)"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":213,"p":"1B","t":"D3.2","also":["D4.1"],"title":"Un cruzamiento dihíbrido en moscas de la fruta","blocks":[{"k":"p","v":"Se cruzaron moscas heterocigotas para el color del cuerpo (G gris, g ébano) y la forma de las alas (N normales, n vestigiales). Los genes están en cromosomas distintos."},{"k":"table","cap":"Descendencia del cruzamiento GgNn × GgNn","rows":[["Fenotipo","Observado","Esperado"],["Gris, normales","290","288"],["Gris, vestigiales","104","96"],["Ébano, normales","90","96"],["Ébano, vestigiales","28","32"]]}],"parts":[{"l":"a","m":1,"q":"Indique la proporción esperada de fenotipos en la descendencia de este cruzamiento.","pts":["9 : 3 : 3 : 1 (gris, normales : gris, vestigiales : ébano, normales : ébano, vestigiales)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calcule el número esperado de moscas grises con alas normales, mostrando el procedimiento.","pts":["total de descendientes = 290 + 104 + 90 + 28 = 512","la fracción esperada de grises con alas normales es 9/16","9/16 × 512 = 288 (moscas)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Deduzca, con una razón, la conclusión de la prueba de chi-cuadrado, sabiendo que el valor de χ² es 1,56 y que el valor crítico para 3 grados de libertad con p = 0,05 es 7,81.","pts":["el valor calculado (1,56) es *menor* que el valor crítico (7,81)","no se rechaza / se acepta la *hipótesis nula*","no hay diferencia significativa entre lo observado y lo esperado / los resultados se ajustan a la proporción 9 : 3 : 3 : 1","las diferencias se deben al azar / los datos apoyan la distribución independiente de los dos genes"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Explique por qué los resultados serían distintos si los dos genes estuvieran ligados.","pts":["los genes *ligados* están en el mismo cromosoma / sus loci están próximos en el mismo cromosoma","los alelos del mismo cromosoma tienden a heredarse juntos / pasan al mismo gameto","no hay *distribución independiente* de los dos genes en la meiosis","los recombinantes solo se forman por *entrecruzamiento* entre los dos loci (en la profase I)","habría más descendientes con las combinaciones parentales y menos recombinantes de lo esperado","la proporción no sería 9 : 3 : 3 : 1 / el valor de χ² sería mayor que el valor crítico"],"hl":false,"mod":"Si los genes estuvieran ligados, sus loci estarían en el mismo cromosoma, de modo que no habría distribución independiente en la meiosis: los alelos que están juntos en un cromosoma pasarían juntos al mismo gameto. Solo se formarían gametos recombinantes cuando hubiera entrecruzamiento entre los dos loci en la profase I, lo cual es poco frecuente. Por eso aparecerían más descendientes con las combinaciones parentales y menos recombinantes, y la proporción observada se alejaría de 9 : 3 : 3 : 1."}],"hl":true,"mk":8,"mkSL":8},{"qid":214,"p":"1B","t":"D4.2","also":["C4.2"],"title":"Un río eutrofizado","blocks":[{"k":"p","v":"Se tomaron medidas a distintas distancias río abajo de una granja de la que drenan fertilizantes."},{"k":"table","cap":"Medidas en el río","rows":[["Distancia / m","Nitrato / mg dm⁻³","O₂ disuelto / mg dm⁻³","Número de larvas de efímera"],["0","2","9,5","42"],["100","18","3,1","3"],["500","11","5,6","12"],["1000","5","8,4","35"]]}],"parts":[{"l":"a","m":1,"q":"Indique la distancia a la que la concentración de nitrato es mayor.","pts":["100 m (se requiere la unidad)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique la baja concentración de oxígeno disuelto a 100 m.","pts":["el nitrato es máximo a 100 m (18 mg dm⁻³) y el oxígeno mínimo (3,1 mg dm⁻³)","los nitratos son nutrientes que provocan el crecimiento rápido / la proliferación de algas (*eutrofización*)","las algas bloquean la luz, así que las plantas sumergidas no hacen fotosíntesis / las algas y las plantas mueren","las bacterias / los saprótrofos descomponen la materia orgánica muerta y su población aumenta","los descomponedores consumen oxígeno en la respiración celular *aeróbica*","aumenta la *demanda bioquímica de oxígeno* (DBO) / el oxígeno se consume más rápido de lo que se repone"],"hl":false,"mod":"A 100 m la concentración de nitrato es máxima (18 mg dm⁻³) porque ahí llega el fertilizante. Los nitratos provocan eutrofización: las algas proliferan, bloquean la luz y, al morir junto con las plantas sumergidas, aportan mucha materia orgánica muerta. Las bacterias saprótrofas que la descomponen se multiplican y consumen oxígeno en la respiración celular aeróbica, de modo que la demanda bioquímica de oxígeno es alta y el oxígeno disuelto baja hasta 3,1 mg dm⁻³."},{"l":"c","m":2,"q":"Sugiera por qué las larvas de efímera pueden usarse como especie indicadora.","pts":["solo sobreviven en agua con mucho oxígeno disuelto / son sensibles a la contaminación / tienen un rango de tolerancia estrecho","su número es bajo donde el oxígeno es bajo: 3 larvas con 3,1 mg dm⁻³ frente a 42 larvas con 9,5 mg dm⁻³","su presencia / abundancia indica agua limpia y su ausencia indica agua contaminada","son fáciles de capturar, identificar y contar"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Sugiera dos formas en que los agricultores podrían reducir esta contaminación.","pts":["aplicar menos fertilizante / solo la cantidad que el cultivo puede absorber","no aplicar fertilizante antes de lluvias fuertes / aplicarlo cuando el cultivo está creciendo","dejar franjas de vegetación sin fertilizar junto al río que absorban los nitratos","usar fertilizantes orgánicos / de liberación lenta","mantener el suelo cubierto con cultivos para reducir la escorrentía y la lixiviación"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":215,"p":"1B","t":"B3.1","also":["B3.2"],"title":"Curvas de disociación del oxígeno","blocks":[{"k":"p","v":"El gráfico muestra el porcentaje de saturación de la hemoglobina a distintas presiones parciales de oxígeno, con dos concentraciones de CO₂."},{"k":"chart","type":"line","title":"Saturación de la hemoglobina","x":"Presión parcial de oxígeno / kPa","y":"Saturación / %","s":[{"n":"CO₂ bajo","pts":[["0",0.0],["2",20.0],["4",56.0],["6",80.0],["8",92.0],["10",96.0],["12",98.0]]},{"n":"CO₂ alto","pts":[["0",0.0],["2",10.0],["4",38.0],["6",66.0],["8",82.0],["10",91.0],["12",95.0]]}]}],"parts":[{"l":"a","m":1,"q":"Indique el porcentaje de saturación de la hemoglobina a 4 kPa con CO₂ bajo.","pts":["*56 %*"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calcule la diferencia de saturación entre CO₂ bajo y CO₂ alto a 4 kPa e indique qué representa.","pts":["56 − 38 = *18 %* (aceptar 18 puntos porcentuales)","el oxígeno adicional que la hemoglobina libera / descarga en los tejidos cuando la concentración de CO₂ es alta","es el *efecto Bohr* / el desplazamiento de la curva hacia la derecha"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique la ventaja de este efecto para un músculo que respira activamente.","pts":["el músculo activo tiene una tasa alta de respiración celular y produce más *CO₂*","el CO₂ reduce el pH de la sangre / se une a la hemoglobina en un sitio alostérico","disminuye la *afinidad* de la hemoglobina por el oxígeno / la curva se desplaza hacia la derecha","a la misma presión parcial de oxígeno la hemoglobina se disocia más / libera más oxígeno (p. ej. un 18 % más a 4 kPa)","el músculo recibe más oxígeno justo donde la demanda es mayor, para la respiración celular aeróbica / la producción de ATP"],"hl":false,"mod":"Un músculo activo respira más y produce más CO₂. El CO₂ baja el pH de la sangre y se une a la hemoglobina en un sitio alostérico, lo que reduce su afinidad por el oxígeno y desplaza la curva hacia la derecha (efecto Bohr). Por eso, a la misma presión parcial de oxígeno, la hemoglobina libera más oxígeno: a 4 kPa la saturación baja del 56 % al 38 %. Así el músculo recibe más oxígeno justo donde más se necesita para la respiración celular aeróbica y la producción de ATP."},{"l":"d","m":2,"q":"Explique la forma sigmoidea (en S) de las curvas.","pts":["la hemoglobina tiene cuatro subunidades / cuatro grupos hemo, cada uno capaz de unir una molécula de O₂","la unión del primer O₂ provoca un cambio *conformacional* en la hemoglobina","ese cambio aumenta la afinidad de los demás grupos hemo por el oxígeno: unión *cooperativa*","por eso la curva sube poco a presiones parciales bajas y luego se hace muy pronunciada / se aplana al acercarse a la saturación"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":216,"p":"1B","t":"D2.1","also":["D2.2"],"title":"Índice mitótico en tejido tumoral","blocks":[{"k":"p","v":"Se tomaron muestras de tejido normal y de dos tumores. Se contaron al microscopio las células en cada fase."},{"k":"table","cap":"Células contadas en cada muestra","rows":[["Muestra","Interfase","Profase","Metafase","Anafase","Telofase"],["Tejido normal","470","14","8","4","4"],["Tumor X","380","52","34","18","16"],["Tumor Y","440","26","18","8","8"]]}],"parts":[{"l":"a","m":2,"q":"Calcule el índice mitótico del tumor X.","pts":["células en mitosis = 52 + 34 + 18 + 16 = 120","total de células = 380 + 120 = 500","índice mitótico = 120 ÷ 500 = 0,24 / 24 %"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Indique qué muestra tiene el índice mitótico más bajo.","pts":["el tejido normal (30 ÷ 500 = 0,06)"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique cómo las mutaciones pueden dar lugar a un índice mitótico alto.","pts":["las mutaciones en los *protooncogenes* los convierten en *oncogenes*","los oncogenes estimulan en exceso el ciclo celular / la división celular","las mutaciones en los *genes supresores de tumores* impiden que frenen el ciclo celular / fallan los puntos de control","la progresión del ciclo, controlada por ciclinas, deja de estar regulada","las células se dividen por mitosis sin control y forman un tumor","una mayor proporción de células está en mitosis en cualquier momento, así que el índice mitótico es alto"],"hl":true,"mod":"Las mutaciones pueden convertir los protooncogenes en oncogenes, que estimulan en exceso el ciclo celular, o inactivar los genes supresores de tumores, que normalmente lo frenan en los puntos de control. Al perderse la regulación del ciclo por las ciclinas, las células se dividen por mitosis sin control y forman un tumor. Como hay una proporción mayor de células en mitosis en cualquier momento, el índice mitótico es alto."},{"l":"d","m":2,"q":"Sugiera por qué el tumor X podría ser más peligroso que el tumor Y.","pts":["el tumor X tiene un índice mitótico mayor (0,24 frente a 0,12) / el doble que el tumor Y","sus células se dividen más rápido, así que el tumor crece más deprisa","es más probable que sea *maligno* / que invada tejidos vecinos / que produzca *metástasis* (tumores secundarios)","hay menos tiempo para el tratamiento / peor pronóstico"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":3},{"qid":217,"p":"2","t":"A1.1","also":[],"title":"El agua como hábitat","blocks":[{"k":"p","v":"Muchos animales viven en el agua o sobre ella, y se cree que la vida comenzó en el agua."}],"parts":[{"l":"a","m":2,"q":"Dibuje dos moléculas de agua, mostrando la polaridad de cada una y un enlace de hidrógeno entre ellas.","pts":["cada molécula dibujada con un átomo de O unido a dos átomos de H por enlaces covalentes (líneas continuas), en forma de V / angular","polaridad rotulada en ambas moléculas: *δ–* en el O y *δ+* en los H","*enlace de hidrógeno* dibujado con línea discontinua / punteada y rotulado, entre un H (δ+) de una molécula y el O (δ–) de la otra"],"mod":"","hl":false},{"l":"b","m":2,"q":"Explique por qué los animales acuáticos sufren menos cambios de temperatura que los terrestres.","pts":["el agua tiene una *capacidad calorífica específica* alta (mucho mayor que la del aire)","porque deben romperse muchos enlaces de hidrógeno para que aumente la energía cinética / temperatura de las moléculas","hace falta ganar o perder mucha energía para que cambie la temperatura del agua, por lo que esta se calienta y se enfría lentamente","así, los hábitats acuáticos son térmicamente estables, mientras que la temperatura del aire cambia rápida y ampliamente"],"mod":"","hl":false},{"l":"c","m":2,"q":"Resuma cómo afectan a los animales acuáticos la flotabilidad y la viscosidad del agua.","pts":["el agua ejerce una gran fuerza de *flotabilidad* (empuje) porque su densidad es similar a la de los tejidos vivos","por eso el agua sostiene el peso del cuerpo y los animales flotan / se mantienen a una profundidad con poco gasto de energía / necesitan menos soporte esquelético / pueden ser muy grandes","el agua tiene una *viscosidad* alta (mayor que la del aire), por lo que opone resistencia / fricción al movimiento","por eso los nadadores rápidos tienen formas hidrodinámicas que reducen la resistencia (p. ej., foca anillada, colimbo ártico al bucear) / moverse en el agua exige más energía que en el aire"],"mod":"","hl":false}],"hl":false,"mk":6,"mkSL":6},{"qid":218,"p":"2","t":"A1.2","also":["D1.1"],"title":"La estructura del ADN","blocks":[],"parts":[{"l":"a","m":3,"q":"Distinga entre el ADN y el ARN.","pts":["el azúcar (pentosa) del ADN es la *desoxirribosa*, mientras que el del ARN es la *ribosa*","el ADN tiene la base *timina*, mientras que el ARN tiene *uracilo* en su lugar (ambos tienen adenina, citosina y guanina)","el ADN tiene normalmente dos cadenas / hebras de polinucleótidos, mientras que el ARN tiene normalmente una sola","el ADN forma una doble hélice con apareamiento de bases entre las cadenas, mientras que el ARN no forma una doble hélice","las moléculas de ADN son mucho más largas / el ADN almacena la información a largo plazo, mientras que las de ARN son más cortas / de vida corta"],"mod":"El ADN contiene el azúcar desoxirribosa, mientras que el ARN contiene ribosa. El ADN tiene la base timina, pero en el ARN la timina se sustituye por uracilo; las otras tres bases (adenina, citosina y guanina) son comunes a ambos. El ADN está formado por dos cadenas de polinucleótidos unidas por apareamiento complementario de bases en una doble hélice, mientras que el ARN suele tener una sola cadena y es una molécula más corta.","hl":false},{"l":"b","m":2,"q":"Explique cómo el apareamiento de bases complementarias permite copiar el ADN con exactitud.","pts":["las dos cadenas del ADN se separan y cada una actúa como *molde* para una cadena nueva","*adenina* solo se aparea con *timina* y *citosina* solo con *guanina* (mediante enlaces de hidrógeno)","por tanto, la secuencia de bases del molde determina qué nucleótido se añade en cada posición de la cadena nueva","así, las dos moléculas hijas tienen la misma secuencia de bases que la molécula original / la replicación es semiconservativa"],"mod":"","hl":false},{"l":"c","m":2,"q":"Describa qué significa que las dos cadenas del ADN sean antiparalelas.","pts":["las dos cadenas son paralelas entre sí pero están orientadas en *sentidos opuestos*","en una cadena las desoxirribosas / los nucleótidos apuntan en un sentido y en la otra, en el sentido contrario / una está invertida respecto de la otra","una cadena va en sentido 5'→3' y la complementaria en sentido 3'→5' (no se exige en NM)","las cadenas se mantienen unidas por enlaces de hidrógeno entre bases complementarias"],"mod":"","hl":false}],"hl":false,"mk":7,"mkSL":7},{"qid":219,"p":"2","t":"A2.1","also":[],"title":"El origen de la vida","blocks":[],"parts":[{"l":"a","m":2,"q":"Resuma las condiciones que se cree que existían en la Tierra primitiva.","pts":["ausencia / muy poco *oxígeno* libre en la atmósfera (atmósfera reductora) y, por tanto, sin capa de ozono","concentraciones altas de *metano* / dióxido de carbono / amoníaco / hidrógeno / vapor de agua en la atmósfera","temperaturas más altas que las actuales (por el efecto invernadero de esos gases) / intensa actividad volcánica / impactos de meteoritos","radiación ultravioleta intensa que llegaba a la superficie / frecuentes descargas eléctricas (rayos)","esas condiciones permitían la formación espontánea de compuestos de carbono que hoy no se formarían"],"mod":"","hl":false},{"l":"b","m":3,"q":"Describa un experimento que comprobó si podían formarse compuestos de carbono sin organismos vivos.","pts":["experimento de *Miller y Urey*: aparato cerrado y estéril que simulaba las condiciones de la Tierra primitiva","mezcla de gases: metano, amoníaco, hidrógeno y vapor de agua, sin oxígeno (atmósfera reductora)","se hacía hervir agua y luego se condensaba el vapor, simulando el océano y el ciclo del agua (evaporación y lluvia)","se aplicaban *descargas eléctricas* / chispas a la mezcla de gases para simular los rayos como fuente de energía","tras varios días se analizó el líquido y se hallaron *aminoácidos* / otros compuestos de carbono sencillos","conclusión: los compuestos de carbono pudieron formarse de manera abiótica / espontánea en la Tierra primitiva"],"mod":"En el experimento de Miller y Urey se utilizó un aparato cerrado que simulaba la Tierra primitiva. Contenía una mezcla de metano, amoníaco, hidrógeno y vapor de agua, sin oxígeno. El agua se hacía hervir para que el vapor circulara y luego se condensaba, imitando el océano y la lluvia. A través de los gases se hacían saltar chispas eléctricas que simulaban los rayos y aportaban energía. Al cabo de unos días se analizó el agua y se encontraron aminoácidos y otros compuestos de carbono, lo que demostró que estos pudieron formarse espontáneamente sin organismos vivos.","hl":false},{"l":"c","m":2,"q":"Explique por qué la formación de vesículas fue un paso clave hacia las primeras células.","pts":["los ácidos grasos / fosfolípidos son anfipáticos y en el agua forman espontáneamente *bicapas* que se cierran en vesículas esféricas","la vesícula separa un medio interno del entorno / crea un compartimento delimitado por una membrana","así, el medio interno puede tener una composición química distinta / moléculas como el ARN y los catalizadores se mantienen concentrados en su interior","lo que permite el metabolismo y la replicación dentro de la vesícula, que actúa como una protocélula"],"mod":"","hl":false}],"hl":true,"mk":7,"mkSL":7},{"qid":220,"p":"2","t":"A2.2","also":["B2.2"],"title":"Comparar células","blocks":[],"parts":[{"l":"a","m":3,"q":"Distinga entre la estructura de las células procariotas y la de las eucariotas.","pts":["las procariotas no tienen *núcleo* / su ADN está en el nucleoide, en el citoplasma, mientras que las eucariotas tienen un núcleo rodeado por una doble membrana","el ADN procariota es circular y desnudo / sin histonas, mientras que el eucariota es lineal y está asociado a *histonas*","las procariotas tienen ribosomas *70S*, mientras que las eucariotas tienen ribosomas *80S* (más grandes) en el citoplasma","las procariotas no tienen orgánulos rodeados de membrana / citoplasma no compartimentado, mientras que las eucariotas tienen mitocondrias / retículo endoplasmático / aparato de Golgi","las procariotas pueden tener plásmidos, que normalmente no hay en las eucariotas","las células procariotas son más pequeñas (unos 1–10 µm) que las eucariotas (unos 10–100 µm)"],"mod":"Las células procariotas no tienen núcleo: su ADN se encuentra en una región del citoplasma llamada nucleoide, mientras que en las eucariotas el ADN está dentro de un núcleo rodeado por una doble membrana. El ADN procariota es circular y desnudo, mientras que el eucariota es lineal y está asociado a histonas. Los ribosomas de las procariotas son 70S y los de las eucariotas son 80S. Además, las procariotas carecen de orgánulos rodeados de membrana, como las mitocondrias, que sí están presentes en las eucariotas.","hl":false},{"l":"b","m":2,"q":"Indique dos diferencias entre las células vegetales y las células animales.","pts":["las células vegetales tienen *pared celular* (de celulosa), mientras que las animales no la tienen","las células vegetales tienen *cloroplastos* / plastos, mientras que las animales no los tienen","las células vegetales tienen una vacuola grande, central y permanente, mientras que las animales solo tienen vacuolas pequeñas / temporales","las células animales tienen centriolos, mientras que las células vegetales (de plantas con flores) no los tienen","las células vegetales almacenan almidón, mientras que las animales almacenan glucógeno"],"mod":"","hl":false},{"l":"c","m":2,"q":"Explique una ventaja de la compartimentación en las células eucariotas.","pts":["las enzimas y los sustratos de un proceso se concentran en un espacio pequeño, por lo que las reacciones son más rápidas / eficientes","en cada orgánulo se pueden mantener las condiciones óptimas para sus enzimas (p. ej., pH ácido en los lisosomas)","las sustancias / enzimas que podrían dañar la célula quedan aisladas del resto (p. ej., las enzimas digestivas de los lisosomas)","se separan procesos incompatibles / el núcleo separa la transcripción de la traducción, lo que permite modificar el ARNm antes de traducirlo"],"mod":"","hl":false}],"hl":false,"mk":7,"mkSL":7},{"qid":221,"p":"2","t":"A2.3","also":["C3.2"],"title":"Virus","blocks":[],"parts":[{"l":"a","m":2,"q":"Indique dos características estructurales que comparten todos los virus.","pts":["material genético formado por un *ácido nucleico* (ADN o ARN)","*cápside* / cubierta formada por proteínas que rodea el material genético","tamaño muy pequeño y fijo (la mayoría entre 20 y 300 nm) / no crecen","no tienen citoplasma / ribosomas / estructura celular, y tienen pocas enzimas o ninguna"],"mod":"","hl":false},{"l":"b","m":4,"q":"Describa el ciclo lítico de un bacteriófago.","pts":["el fago se fija / se une a moléculas (receptores) específicas de la superficie de la bacteria huésped / hospedadora","el fago *inyecta su ADN* en la bacteria, y la cápside queda fuera","el ADN viral se replica muchas veces usando nucleótidos / enzimas de la célula huésped","los genes virales se transcriben y los *ribosomas* de la bacteria sintetizan las proteínas virales (de la cápside)","el ADN y las proteínas se *ensamblan* y forman muchas partículas víricas nuevas","una enzima (lisozima) digiere la pared celular y la bacteria sufre *lisis* / estalla, liberando los fagos","los fagos liberados infectan otras bacterias / la célula huésped muere"],"mod":"El bacteriófago se une a moléculas específicas de la superficie de la bacteria huésped e inyecta su ADN en el citoplasma, mientras que la cápside queda fuera. El ADN viral se replica muchas veces utilizando los nucleótidos y las enzimas de la bacteria. Los genes del fago se transcriben y los ribosomas bacterianos sintetizan las proteínas de la cápside. Después, el ADN y las proteínas se ensamblan y forman numerosos fagos nuevos. Por último, una enzima viral digiere la pared celular, la bacteria sufre lisis y libera los fagos, que pueden infectar otras bacterias.","hl":false},{"l":"c","m":2,"q":"Explique por qué virus como el VIH evolucionan rápidamente.","pts":["tienen una *tasa de mutación* muy alta, porque la transcriptasa inversa / la replicación del ARN no corrige los errores","el tiempo de generación es muy corto / se producen muchísimas partículas víricas en cada ciclo, por lo que surge mucha variación genética","hay una *selección natural* intensa por el sistema inmunitario del huésped / los fármacos antivirales","las variantes con antígenos modificados / resistentes sobreviven y se reproducen, de modo que sus alelos aumentan de frecuencia","en virus como el de la gripe, la recombinación / el intercambio de segmentos de ARN entre cepas genera variantes nuevas"],"mod":"","hl":false}],"hl":true,"mk":8,"mkSL":8},{"qid":222,"p":"2","t":"A3.1","also":[],"title":"Especies y genomas","blocks":[],"parts":[{"l":"a","m":2,"q":"Indique el concepto biológico de especie.","pts":["una especie es un grupo de organismos / poblaciones que pueden *cruzarse* / reproducirse entre sí (real o potencialmente)","y producir descendencia *fértil*","y que están aislados reproductivamente de otros grupos / no producen descendencia fértil con miembros de otras especies"],"mod":"","hl":false},{"l":"b","m":2,"q":"Explique por qué el concepto biológico de especie es difícil de aplicar a las bacterias.","pts":["las bacterias se reproducen de forma *asexual* (por fisión binaria), de modo que no hay cruzamiento entre individuos","por tanto, no se puede aplicar el criterio de cruzarse y producir descendencia fértil","hay *transferencia horizontal de genes* (p. ej., mediante plásmidos) incluso entre bacterias poco emparentadas","por eso los límites entre especies bacterianas son difusos / las bacterias se clasifican por semejanzas en la secuencia de bases o en la morfología"],"mod":"","hl":true},{"l":"c","m":2,"q":"Resuma cómo se produce y se usa un cariograma.","pts":["se tiñen y se fotografían al microscopio los cromosomas de una célula en *mitosis* / metafase (cuando están condensados y son visibles)","las imágenes de los cromosomas se ordenan en *pares homólogos*","según su longitud (de mayor a menor), la posición del centrómero y el patrón de bandas","se usa para determinar el sexo (XX o XY) / el número de cromosomas del individuo o de la especie","se usa para detectar anomalías cromosómicas, p. ej., la trisomía 21 (síndrome de Down)"],"mod":"","hl":false}],"hl":false,"mk":6,"mkSL":4},{"qid":223,"p":"2","t":"A3.2","also":[],"title":"Cladogramas","blocks":[{"k":"p","v":"La tabla muestra el número de diferencias de bases en un gen entre cuatro especies de primates."},{"k":"table","cap":"Diferencias de bases","rows":[["","Humano","Chimpancé","Gorila"],["Chimpancé","12","–","–"],["Gorila","16","15","–"],["Orangután","30","29","28"]]}],"parts":[{"l":"a","m":1,"q":"Identifique la especie más emparentada con los humanos.","pts":["chimpancé (porque presenta el menor número de diferencias de bases con el humano: 12)"],"mod":"","hl":false},{"l":"b","m":3,"q":"Dibuje un cladograma de las cuatro especies a partir de estos datos.","pts":["diagrama ramificado con una sola raíz / línea de base y las cuatro especies rotuladas en los extremos de las ramas","el orangután es la primera rama en separarse / el grupo externo (porque tiene más diferencias con los demás: 28–30)","el gorila es la segunda rama en separarse (15–16 diferencias con humano y chimpancé)","el humano y el chimpancé comparten el *nodo* más reciente / son grupos hermanos (solo 12 diferencias)","todas las ramificaciones son dicotómicas / tres nodos en total, cada uno representando un ancestro común"],"mod":"El cladograma se dibuja como un árbol ramificado que parte de una única raíz, con el nombre de las cuatro especies en los extremos de las ramas. La primera rama que se separa lleva al orangután, porque es la especie con más diferencias respecto de las demás (de 28 a 30). En el siguiente nodo se separa el gorila (15–16 diferencias). El último nodo, el más reciente, une al humano y al chimpancé, que solo difieren en 12 bases y son por tanto grupos hermanos. Cada uno de los tres nodos representa un ancestro común.","hl":false},{"l":"c","m":2,"q":"Explique por qué las diferencias en la secuencia de bases sirven para estimar cuándo divergieron las especies.","pts":["las diferencias en la secuencia de bases se deben a *mutaciones* que se acumulan después de que dos linajes se separan","las mutaciones se acumulan a un ritmo aproximadamente constante / actúan como un *reloj molecular*","por tanto, cuanto mayor es el número de diferencias, más tiempo ha pasado desde el ancestro común","el ritmo se puede calibrar con fósiles de edad conocida para convertir el número de diferencias en tiempo","es solo una estimación, porque la tasa de mutación varía (con el tiempo de generación / el tamaño de la población / la presión de selección)"],"mod":"","hl":false}],"hl":true,"mk":6,"mkSL":6},{"qid":224,"p":"2","t":"A4.1","also":[],"title":"Pruebas de la evolución","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinga entre estructuras homólogas y estructuras análogas.","pts":["las homólogas tienen la misma estructura básica / disposición de partes aunque su función sea distinta, mientras que las análogas tienen la misma función pero una estructura distinta","las homólogas se heredan de un *ancestro común*, mientras que las análogas tienen orígenes evolutivos distintos","las homólogas resultan de la evolución *divergente* / radiación adaptativa, mientras que las análogas resultan de la evolución *convergente*","ejemplo de cada una: extremidad pentadáctila de los vertebrados (homóloga) frente a ala de insecto y ala de ave / ojo del pulpo y ojo humano (análogas)"],"mod":"","hl":false},{"l":"b","m":3,"q":"Explique cómo la cría selectiva de plantas cultivadas aporta pruebas de la evolución.","pts":["las personas eligen como progenitores a los individuos con las características deseadas (*selección artificial*) y repiten el proceso durante muchas generaciones","las características seleccionadas son *heredables*, por lo que aumentan de frecuencia en la población","los cultivos actuales son muy distintos de sus ancestros silvestres (p. ej., el maíz y el teosinte / las variedades de Brassica oleracea)","esto demuestra que la selección puede causar cambios grandes en las características heredables de una especie en un tiempo relativamente corto","por tanto, es verosímil que la selección natural cause cambios similares o mayores a lo largo de períodos mucho más largos","especies silvestres distintas producen muchas variedades, lo que muestra la variación genética sobre la que actúa la selección"],"mod":"En la cría selectiva, las personas eligen como progenitores a las plantas con las características deseadas, por ejemplo granos más grandes, y repiten esta selección artificial durante muchas generaciones. Como esas características son heredables, su frecuencia aumenta en la población. El resultado es que los cultivos actuales, como el maíz, son muy diferentes de sus ancestros silvestres, como el teosinte. Esto demuestra que la selección puede cambiar considerablemente las características heredables de una especie en poco tiempo, lo que hace verosímil que la selección natural produzca cambios aún mayores a lo largo de millones de años.","hl":false},{"l":"c","m":2,"q":"Resuma el papel del aislamiento reproductivo en la especiación.","pts":["el aislamiento reproductivo impide el cruzamiento / el *flujo génico* entre dos poblaciones de una especie","puede deberse a una barrera geográfica (p. ej., un río o una cordillera) que separa las poblaciones","cada población está sometida a presiones de selección distintas (selección diferencial), por lo que sus acervos génicos / características *divergen*","con el tiempo las diferencias son tan grandes que ya no pueden cruzarse y producir descendencia fértil, de modo que son especies distintas (p. ej., bonobos y chimpancés separados por el río Congo)"],"mod":"","hl":false}],"hl":false,"mk":7,"mkSL":7},{"qid":225,"p":"2","t":"A4.2","also":[],"title":"Conservar la biodiversidad","blocks":[],"parts":[{"l":"a","m":2,"q":"Resuma dos causas de la pérdida actual de biodiversidad.","pts":["*destrucción / pérdida del hábitat*, p. ej., por deforestación, expansión de la agricultura o urbanización, que deja a las especies sin alimento ni lugares de cría","*sobreexplotación*: la caza / pesca / tala elimina individuos más rápido de lo que la población puede reponerlos","*especies invasoras / invasivas* introducidas, que compiten con las especies nativas, las depredan o les transmiten enfermedades","contaminación (p. ej., plaguicidas, plásticos, eutrofización), que mata organismos o degrada los ecosistemas","cambio climático global, que altera los hábitats más rápido de lo que las especies pueden adaptarse o migrar","causa subyacente: crecimiento de la población humana, que aumenta la demanda de recursos"],"mod":"","hl":false},{"l":"b","m":2,"q":"Compare y contraste la conservación in situ y la conservación ex situ.","pts":["semejanza: ambas buscan evitar la extinción de especies / conservar la biodiversidad / se complementan y pueden usarse juntas","la conservación in situ protege a las especies *en su hábitat natural* (p. ej., parques nacionales, reservas naturales), mientras que la ex situ las conserva *fuera de su hábitat natural* (p. ej., zoológicos, jardines botánicos, bancos de semillas)","in situ se conserva todo el ecosistema / las interacciones entre especies y continúa la adaptación al medio, mientras que ex situ solo se conservan las especies elegidas","ex situ ofrece más control y protección (frente a la caza / las enfermedades) y permite la cría en cautividad cuando el hábitat ya no es seguro, pero las poblaciones son pequeñas, con poca diversidad genética y dificultades de reintroducción"],"mod":"","hl":false},{"l":"c","m":2,"q":"Explique por qué es importante conservar la diversidad genética dentro de una especie.","pts":["la diversidad genética supone *variación* entre los individuos / muchos alelos distintos en el acervo génico","si el ambiente cambia (nueva enfermedad / cambio climático), es más probable que algunos individuos tengan alelos que les permitan sobrevivir y reproducirse","por tanto, la población puede adaptarse / evolucionar por *selección natural* y es menor el riesgo de extinción","con poca diversidad hay endogamia / consanguinidad, y aumenta la frecuencia de homocigotos para alelos recesivos perjudiciales","las poblaciones pequeñas pierden alelos al azar, lo que reduce aún más su capacidad de adaptación"],"mod":"","hl":false}],"hl":false,"mk":6,"mkSL":6},{"qid":226,"p":"2","t":"B1.1","also":[],"title":"Glúcidos y lípidos","blocks":[],"parts":[{"l":"a","m":3,"q":"Compare y contraste la estructura del almidón y de la celulosa.","pts":["semejanza: ambos son *polisacáridos* / polímeros de glucosa unidos por enlaces glicosídicos formados por condensación","el almidón está formado por *α-glucosa* y la celulosa por *β-glucosa*","en el almidón todos los monómeros tienen la misma orientación, mientras que en la celulosa los monómeros alternos están invertidos (giro de 180°)","las cadenas de almidón se enrollan en hélice, mientras que las de celulosa son rectas","el almidón puede ser ramificado (amilopectina, con enlaces 1→6) o no (amilosa), mientras que la celulosa nunca está ramificada (solo enlaces 1→4)","las cadenas de celulosa se unen entre sí por enlaces de hidrógeno y forman *microfibrillas*, mientras que las de almidón no"],"hl":false,"mod":"Tanto el almidón como la celulosa son polisacáridos formados por monómeros de glucosa unidos por enlaces glicosídicos mediante condensación. Sin embargo, el almidón está hecho de α-glucosa y sus cadenas se enrollan en hélice; puede ser no ramificado (amilosa) o ramificado (amilopectina). La celulosa, en cambio, está hecha de β-glucosa con los monómeros alternos invertidos, por lo que sus cadenas son rectas y sin ramificar, y se unen entre sí por enlaces de hidrógeno formando microfibrillas."},{"l":"b","m":2,"q":"Explique por qué los triglicéridos son más adecuados que el glucógeno para el almacenamiento de energía a largo plazo.","pts":["liberan aproximadamente el doble de *energía por gramo* en la respiración celular","son *hidrófobos* / insolubles, por lo que se almacenan sin agua asociada y no afectan a la ósmosis","por tanto, la misma cantidad de energía se almacena con menos masa corporal, lo que es una ventaja para el movimiento","son químicamente estables, así que la energía no se pierde con el tiempo; el glucógeno se moviliza más rápido y sirve a corto plazo","el tejido adiposo cumple además funciones secundarias como aislante térmico"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Describa cómo los fosfolípidos forman una bicapa en el agua.","pts":["los fosfolípidos son *anfipáticos*: tienen una parte hidrófila y otra hidrófoba","las cabezas de fosfato *hidrófilas* son atraídas por el agua y se orientan hacia ella, en ambas caras de la bicapa","las colas hidrocarbonadas (de ácidos grasos) *hidrófobas* son repelidas por el agua y se orientan hacia el interior, unas frente a otras","la bicapa se forma de manera espontánea / se mantiene por interacciones hidrófobas entre las colas"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":227,"p":"2","t":"B1.2","also":["C1.1"],"title":"Estructura de las proteínas","blocks":[],"parts":[{"l":"a","m":2,"q":"Dibuje la estructura generalizada de un aminoácido.","pts":["carbono central (carbono alfa) con cuatro enlaces, uno de ellos a un átomo de *H*","grupo *amino* dibujado como NH₂ (o H₂N) unido al carbono central","grupo *carboxilo* dibujado como COOH (aceptar C=O y O–H) unido al carbono central","grupo *R* (cadena lateral variable) unido al carbono central (máx. 1 si los grupos no están rotulados o los enlaces son incorrectos)"],"hl":false,"mod":""},{"l":"b","m":4,"q":"Explique cómo la estructura primaria de una proteína determina su función.","pts":["la estructura primaria es la *secuencia* de aminoácidos del polipéptido, determinada por el gen","la secuencia fija la posición de cada grupo *R* y, por tanto, dónde se pliega la cadena","la estructura secundaria (hélices α y láminas β) se forma por enlaces de hidrógeno entre los grupos del esqueleto polipeptídico","la estructura *terciaria* se debe a interacciones entre grupos R: enlaces de hidrógeno, enlaces iónicos, puentes disulfuro e interacciones hidrófobas","el resultado es una conformación tridimensional específica y precisa","la forma determina la función, p. ej. el sitio activo de una enzima es complementario a su sustrato / el sitio de unión de un receptor","el cambio de un solo aminoácido puede alterar la forma y la función, p. ej. la hemoglobina en la anemia falciforme"],"hl":true,"mod":"La estructura primaria es la secuencia de aminoácidos del polipéptido. Esta secuencia fija la posición de cada grupo R y, con ello, cómo se pliega la cadena: primero en hélices α y láminas β mediante enlaces de hidrógeno, y después en la estructura terciaria gracias a las interacciones entre grupos R (enlaces de hidrógeno, iónicos, puentes disulfuro e interacciones hidrófobas). Así se obtiene una forma tridimensional específica de la que depende la función; por ejemplo, el sitio activo de una enzima es complementario a su sustrato. Por eso, cambiar un solo aminoácido puede alterar la forma y la función, como ocurre con la hemoglobina en la anemia falciforme."},{"l":"c","m":2,"q":"Distinga entre proteínas fibrosas y proteínas globulares, con un ejemplo de cada una.","pts":["las fibrosas son largas y estrechas (polipéptidos sin plegar en estructura terciaria), mientras que las globulares son compactas y redondeadas","las fibrosas son *insolubles* en agua, mientras que las globulares suelen ser *solubles* (grupos R hidrófilos en el exterior)","las fibrosas tienen función estructural, mientras que las globulares tienen funciones metabólicas / de transporte / de regulación","ejemplo de fibrosa: *colágeno* (aceptar queratina); ejemplo de globular: *insulina* (aceptar hemoglobina o una enzima con nombre) (ambos ejemplos necesarios)"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":2},{"qid":228,"p":"2","t":"B2.1","also":[],"title":"Transporte de membrana","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinga entre difusión facilitada y transporte activo.","pts":["la difusión facilitada va a favor del *gradiente de concentración* (de mayor a menor concentración), mientras que el transporte activo va en contra","la difusión facilitada es pasiva / no requiere energía de la célula, mientras que el transporte activo usa *ATP*","la difusión facilitada usa proteínas *canal*, mientras que el transporte activo usa proteínas *bomba*","la difusión facilitada tiende a igualar las concentraciones, mientras que el transporte activo puede acumular una sustancia / crear un gradiente"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explique cómo funciona la bomba de sodio-potasio.","pts":["es una proteína integral que realiza transporte activo en contra de los gradientes de concentración de ambos iones","*tres Na⁺* del citoplasma se unen a la bomba","el *ATP* cede un grupo fosfato a la bomba (fosforilación), lo que provoca un cambio *conformacional*","la bomba se abre hacia el exterior y libera los Na⁺ fuera de la célula","*dos K⁺* del exterior se unen a la bomba y se libera el grupo fosfato","la bomba recupera su forma original y libera los K⁺ en el citoplasma","funciona como intercambiador / genera una diferencia de carga (potencial de membrana) al sacar tres cargas positivas por cada dos que entran"],"hl":true,"mod":"La bomba de sodio-potasio es una proteína integral que hace transporte activo. Tres Na⁺ del citoplasma se unen a la bomba y el ATP le cede un grupo fosfato; esta fosforilación cambia la conformación de la proteína, que se abre hacia el exterior y libera los Na⁺. Entonces dos K⁺ del exterior se unen, se libera el fosfato y la bomba recupera su forma original, de modo que los K⁺ quedan libres en el citoplasma. Como salen tres cargas positivas y entran dos, ambos iones se mueven en contra de su gradiente y se genera un potencial de membrana."},{"l":"c","m":2,"q":"Resuma cómo afecta el colesterol a la fluidez de la membrana.","pts":["el colesterol se sitúa entre los fosfolípidos de la bicapa (en las membranas de las células animales) y actúa como *regulador* de la fluidez","a temperaturas altas *reduce* la fluidez porque limita el movimiento de los fosfolípidos / estabiliza la membrana","a temperaturas bajas *evita* que la membrana se vuelva rígida porque impide que las colas hidrocarbonadas se empaqueten de forma compacta","reduce la permeabilidad de la membrana a las partículas hidrófilas / a iones como Na⁺ y H⁺"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":2},{"qid":229,"p":"2","t":"B2.2","also":[],"title":"Orgánulos","blocks":[],"parts":[{"l":"a","m":3,"q":"Describa cómo está adaptada la estructura del cloroplasto a la fotosíntesis.","pts":["las membranas de los *tilacoides* ofrecen una gran área superficial para los fotosistemas / la clorofila, de modo que se absorbe más luz","los tilacoides se apilan en grana, lo que concentra muchos fotosistemas en poco volumen","el espacio interior del tilacoide tiene un volumen pequeño, por lo que el gradiente de *protones* se genera con rapidez","las membranas tilacoidales contienen cadenas de transporte de electrones y ATP sintasa para la fotofosforilación","el *estroma* contiene las enzimas del ciclo de Calvin (p. ej. rubisco) concentradas en un compartimento","la doble membrana delimita el orgánulo y mantiene las condiciones adecuadas / posee ADN y ribosomas 70S para sintetizar algunas de sus proteínas"],"hl":false,"mod":"El cloroplasto tiene muchos tilacoides apilados en grana, cuyas membranas ofrecen una gran área superficial para los fotosistemas con clorofila, por lo que se absorbe mucha luz. Esas membranas también alojan las cadenas de transporte de electrones y la ATP sintasa. El espacio interior del tilacoide es muy pequeño, de modo que el gradiente de protones se genera rápidamente. El estroma que rodea a los tilacoides concentra las enzimas del ciclo de Calvin, como la rubisco, y la doble membrana mantiene estas condiciones separadas del citoplasma."},{"l":"b","m":3,"q":"Resuma el recorrido de una proteína de secreción desde su síntesis hasta su liberación de la célula.","pts":["el polipéptido se sintetiza en *ribosomas* unidos al retículo endoplasmático rugoso (RER)","entra en la luz / las cisternas del RER a medida que se sintetiza","se transporta en *vesículas* que brotan del RER y se fusionan con la cara cis del aparato de Golgi","en el *aparato de Golgi* se procesa / modifica (p. ej. se añaden glúcidos para formar una glicoproteína)","vesículas de secreción brotan de la cara trans del Golgi y se desplazan hasta la membrana plasmática","la vesícula se fusiona con la membrana plasmática y libera su contenido por *exocitosis*"],"hl":false,"mod":"La proteína se sintetiza en los ribosomas unidos al retículo endoplasmático rugoso y entra en su luz. Desde allí viaja en vesículas que brotan del RER y se fusionan con la cara cis del aparato de Golgi, donde se procesa y modifica, por ejemplo añadiéndole glúcidos. Después, vesículas de secreción brotan de la cara trans del Golgi, se desplazan hasta la membrana plasmática, se fusionan con ella y liberan la proteína al exterior por exocitosis."}],"hl":true,"mk":6,"mkSL":6},{"qid":230,"p":"2","t":"B2.3","also":[],"title":"Especialización celular","blocks":[],"parts":[{"l":"a","m":2,"q":"Resuma las propiedades de las células madre.","pts":["pueden *dividirse* de forma repetida / indefinida por mitosis (autorrenovación)","no están especializadas / son indiferenciadas","pueden *diferenciarse* por distintas vías para dar tipos celulares especializados","su potencial varía: totipotentes, pluripotentes o multipotentes, según cuántos tipos celulares pueden originar"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Distinga entre células madre totipotentes y células madre multipotentes.","pts":["las *totipotentes* pueden originar todos los tipos celulares del organismo, incluidos los tejidos extraembrionarios (placenta), mientras que las *multipotentes* solo originan un número limitado de tipos celulares relacionados","las totipotentes se encuentran en el embrión muy temprano (cigoto y primeras divisiones), mientras que las multipotentes se encuentran en tejidos adultos","ejemplo de multipotentes: las células madre de la médula ósea solo originan los distintos tipos de células sanguíneas","una célula totipotente puede dar lugar a un organismo completo, mientras que una multipotente solo sirve para renovar / reparar un tejido"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique por qué las células son pequeñas, haciendo referencia a la relación entre área superficial y volumen.","pts":["al aumentar el tamaño de la célula, el *volumen* aumenta más rápido que el área superficial (el volumen con el cubo y la superficie con el cuadrado de la dimensión lineal)","por tanto, la *relación área superficial-volumen* disminuye a medida que la célula crece","el volumen determina la tasa metabólica / la demanda de materiales y la producción de desechos y calor","el área superficial (de la membrana) determina la tasa de intercambio de materiales con el entorno","en una célula grande el intercambio sería demasiado lento para cubrir las necesidades / eliminar desechos, y las distancias de difusión hasta el centro serían demasiado largas","una célula pequeña mantiene una relación alta, así que el intercambio es suficiente; por eso las células se dividen en lugar de seguir creciendo"],"hl":false,"mod":"Cuando una célula crece, su volumen aumenta más rápido que su área superficial, de modo que la relación área superficial-volumen disminuye. El volumen determina la tasa metabólica, es decir, cuántos materiales se necesitan y cuántos desechos se producen, mientras que el área superficial de la membrana determina la tasa de intercambio con el entorno. En una célula grande el intercambio sería demasiado lento para cubrir sus necesidades y la difusión hasta el centro tardaría demasiado. Por eso las células se mantienen pequeñas y se dividen en vez de seguir creciendo."},{"l":"d","m":1,"q":"Indique una adaptación que aumente la relación área superficial-volumen de una célula.","pts":["*microvellosidades* (p. ej. células del túbulo contorneado proximal) / forma aplanada (p. ej. neumocitos de tipo I) / forma bicóncava (eritrocitos) / invaginaciones de la membrana"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":7},{"qid":231,"p":"2","t":"B3.1","also":[],"title":"Intercambio de gases en mamíferos","blocks":[],"parts":[{"l":"a","m":3,"q":"Describa las características de los alvéolos que los hacen eficaces para el intercambio de gases.","pts":["hay un número muy elevado de alvéolos, lo que da una *gran área superficial* total para la difusión","la pared está formada por una sola capa de células muy delgadas (neumocitos de tipo I), de modo que la *distancia de difusión* es corta","cada alvéolo está rodeado por una densa red de *capilares* muy próximos, también de pared delgada","el flujo de sangre y la ventilación mantienen gradientes de concentración elevados de O₂ y CO₂","la superficie interna está húmeda, lo que permite que los gases se disuelvan antes de difundir","los neumocitos de tipo II segregan *surfactante*, que reduce la tensión superficial y evita que las paredes se adhieran / que el alvéolo colapse"],"hl":false,"mod":"Los pulmones contienen un número enorme de alvéolos, lo que proporciona una gran área superficial para la difusión. La pared de cada alvéolo es una sola capa de neumocitos de tipo I muy delgados y está rodeada por una densa red de capilares, por lo que la distancia de difusión es muy corta. La ventilación y el flujo de sangre mantienen gradientes de concentración elevados de O₂ y CO₂. Además, la superficie está húmeda para que los gases se disuelvan, y los neumocitos de tipo II segregan surfactante, que reduce la tensión superficial y evita el colapso del alvéolo."},{"l":"b","m":3,"q":"Explique el mecanismo de la inspiración.","pts":["el *diafragma* se contrae y se aplana / desciende","los músculos *intercostales externos* se contraen y mueven la caja torácica hacia arriba y hacia fuera","los músculos antagonistas se relajan: los intercostales internos y los abdominales","aumenta el *volumen* del tórax / de los pulmones","por tanto, la *presión* dentro de los pulmones disminuye por debajo de la presión atmosférica","el aire entra en los pulmones a favor del gradiente de presión, hasta que las presiones se igualan"],"hl":false,"mod":"Durante la inspiración el diafragma se contrae y se aplana, y los músculos intercostales externos se contraen y mueven la caja torácica hacia arriba y hacia fuera, mientras los intercostales internos y los abdominales se relajan. Esto aumenta el volumen del tórax y de los pulmones, por lo que la presión en su interior baja por debajo de la presión atmosférica. Como consecuencia, el aire entra en los pulmones a favor del gradiente de presión hasta que las presiones se igualan."}],"hl":false,"mk":6,"mkSL":6},{"qid":232,"p":"2","t":"B3.2","also":[],"title":"El corazón","blocks":[],"parts":[{"l":"a","m":3,"q":"Explique cómo se relaciona la estructura del ventrículo izquierdo con su función.","pts":["su pared de *músculo cardíaco* es muy gruesa, más que la del ventrículo derecho","al contraerse genera una *presión* elevada","necesaria para bombear la sangre por la aorta a todo el cuerpo (circulación *sistémica*), que ofrece más resistencia / tiene más recorrido que la pulmonar","la válvula auriculoventricular se cierra durante la contracción para que la sangre no vuelva a la aurícula, y la válvula semilunar (aórtica) impide el reflujo desde la aorta","el músculo cardíaco tiene muchas mitocondrias y un buen riego coronario, lo que permite contracciones continuas sin fatiga","las células ramificadas y unidas por discos intercalares propagan el impulso para que toda la pared se contraiga de forma coordinada"],"hl":true,"mod":"El ventrículo izquierdo tiene una pared de músculo cardíaco muy gruesa, mucho más que la del derecho. Al contraerse genera una presión elevada, necesaria para bombear la sangre por la aorta a todo el cuerpo, porque la circulación sistémica es más larga y ofrece más resistencia que la pulmonar. Durante la contracción la válvula auriculoventricular se cierra para evitar el reflujo hacia la aurícula y, después, la válvula semilunar impide que la sangre regrese desde la aorta. Además, las numerosas mitocondrias del músculo cardíaco permiten que se contraiga continuamente sin fatigarse."},{"l":"b","m":2,"q":"Resuma la función de las válvulas del corazón.","pts":["impiden el *reflujo* de la sangre / mantienen el flujo en un solo sentido","las válvulas *auriculoventriculares* (entre aurículas y ventrículos) se cierran cuando los ventrículos se contraen, lo que impide que la sangre vuelva a las aurículas","las válvulas *semilunares* (en la salida hacia la aorta y la arteria pulmonar) se cierran cuando los ventrículos se relajan, lo que impide que la sangre vuelva a los ventrículos","se abren y se cierran de forma pasiva por diferencias de presión de la sangre a ambos lados"],"hl":true,"mod":""},{"l":"c","m":2,"q":"Resuma las causas y las consecuencias de la oclusión de las arterias coronarias.","pts":["causa: depósitos de grasa / colesterol (*ateroma* / placa) en la pared de la arteria, que estrechan su luz","factores de riesgo correlacionados: dieta rica en grasas saturadas, hipertensión, tabaquismo, obesidad, sedentarismo o factores genéticos","la placa puede romperse y formarse un coágulo (trombosis) que bloquea la arteria por completo","consecuencia: llega menos sangre / menos *oxígeno* y glucosa a una parte del músculo cardíaco, lo que causa dolor (angina)","sin oxígeno las células del músculo cardíaco no producen suficiente ATP y mueren: *infarto* de miocardio / ataque al corazón"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":2},{"qid":233,"p":"2","t":"B3.3","also":[],"title":"Movimiento","blocks":[],"parts":[{"l":"a","m":4,"q":"Explique el modelo de filamentos deslizantes de la contracción muscular.","pts":["un impulso nervioso / potencial de acción llega a la fibra muscular y provoca la liberación de *Ca²⁺* del retículo sarcoplásmico","el Ca²⁺ se une a la troponina, que desplaza la *tropomiosina* y deja expuestos los sitios de unión de la actina","las cabezas de miosina se unen a la actina formando *puentes cruzados*","las cabezas de miosina giran (*golpe de fuerza*) y tiran de los filamentos de actina hacia el centro del sarcómero / la línea M","un nuevo *ATP* se une a la cabeza de miosina y la separa de la actina","la hidrólisis del ATP vuelve a colocar la cabeza en su posición inicial (cargada) para el siguiente ciclo","los filamentos se deslizan unos sobre otros sin cambiar de longitud, así que el sarcómero se acorta (las líneas Z se acercan) y el músculo se contrae"],"hl":false,"mod":"Cuando un potencial de acción llega a la fibra muscular, el retículo sarcoplásmico libera Ca²⁺, que se une a la troponina y desplaza la tropomiosina, dejando expuestos los sitios de unión de la actina. Las cabezas de miosina se unen a ellos formando puentes cruzados y giran en el golpe de fuerza, tirando de la actina hacia el centro del sarcómero. Luego un nuevo ATP se une a la cabeza de miosina y la separa de la actina, y su hidrólisis vuelve a cargar la cabeza para un nuevo ciclo. La repetición de estos ciclos hace que los filamentos se deslicen unos sobre otros, de modo que el sarcómero se acorta y el músculo se contrae."},{"l":"b","m":2,"q":"Resuma cómo los músculos antagonistas producen movimiento en una articulación.","pts":["los músculos solo pueden *tirar* (contraerse) y no empujar, así que se necesitan pares de músculos para mover una articulación en dos sentidos","cuando un músculo del par se contrae, el otro se relaja y es estirado","ejemplo: en el codo, el *bíceps* se contrae para flexionar el brazo y el *tríceps* se contrae para extenderlo","los músculos tiran de los huesos a través de los tendones, y los huesos actúan como palancas que giran en la articulación"],"hl":false,"mod":""}],"hl":true,"mk":6,"mkSL":6},{"qid":234,"p":"2","t":"B4.1","also":["B4.2"],"title":"Biomas","blocks":[{"k":"p","v":"La tabla muestra datos climáticos de dos biomas."},{"k":"table","cap":"Valores medios","rows":[["","Bioma P","Bioma Q"],["Temperatura media anual / °C","27","25"],["Precipitación anual / mm","2800","150"]]}],"parts":[{"l":"a","m":2,"q":"Identifique los dos biomas.","pts":["P: *selva tropical* (bosque tropical lluvioso): temperatura alta y precipitación muy alta (2800 mm)","Q: *desierto cálido*: temperatura alta y precipitación muy baja (150 mm)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Describa adaptaciones de las plantas al bioma Q.","pts":["cutícula cerosa gruesa que reduce la evaporación a través de la epidermis","hojas reducidas / transformadas en *espinas*, con menos superficie para la transpiración (y protección frente a herbívoros)","tallos *suculentos* que almacenan agua / fotosíntesis en el tallo","estomas hundidos / pocos estomas / pelos que atrapan aire húmedo","estomas que se abren de noche, cuando hace más frío (metabolismo *CAM*)","raíces profundas que llegan al agua subterránea / raíces superficiales extensas que absorben la lluvia rápidamente"],"hl":false,"mod":"En el desierto cálido el agua es muy escasa, así que las plantas tienen adaptaciones para conservarla. Muchas tienen una cutícula cerosa gruesa y hojas reducidas a espina
