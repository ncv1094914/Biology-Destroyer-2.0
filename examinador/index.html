uando se obtienen con métodos estandarizados y repetidos durante mucho tiempo."},{"l":"c","m":7,"hl":false,"q":"Explique por qué se necesitan varias estrategias para conservar la biodiversidad, incluido el enfoque EDGE.","pts":["la conservación *in situ* protege a las especies en su hábitat natural (reservas, parques nacionales)","mantiene las interacciones entre especies y los procesos del ecosistema","la *renaturalización* restaura procesos naturales, por ejemplo reintroduciendo depredadores (lobos en Yellowstone)","la conservación *ex situ* es necesaria si la población es muy pequeña o el hábitat se ha destruido","zoológicos: cría en cautividad y reintroducción en la naturaleza","jardines botánicos / *bancos de semillas* guardan diversidad genética durante mucho tiempo","los recursos son limitados, así que hay que decidir prioridades","*EDGE* = especies evolutivamente distintas y globalmente amenazadas","tienen pocos parientes cercanos, así que su extinción supone perder mucha historia evolutiva / diversidad genética única","ejemplo: aye-aye / salamandra gigante china / equidna de hocico largo","otros criterios: proteger especies clave o especies bandera / ninguna estrategia sola basta"],"mod":"Ninguna estrategia de conservación basta por sí sola. La conservación in situ protege a las especies en su hábitat natural mediante reservas y parques nacionales, y tiene la ventaja de mantener las interacciones entre especies y los procesos del ecosistema; la renaturalización va más allá y restaura esos procesos, por ejemplo con la reintroducción de lobos en Yellowstone. Pero cuando una población es muy pequeña o su hábitat ha sido destruido, hace falta la conservación ex situ: los zoológicos crían en cautividad para reintroducir individuos, y los jardines botánicos y bancos de semillas guardan diversidad genética durante décadas. Como los recursos son limitados, hay que fijar prioridades. El enfoque EDGE prioriza las especies evolutivamente distintas y globalmente amenazadas, como el aye-aye: al tener pocos parientes cercanos, su extinción supondría perder mucha historia evolutiva y diversidad genética única. Otros criterios, como proteger especies clave, complementan este enfoque."}],"hl":false,"mk":16,"mkSL":16},{"qid":3003,"p":"2X","t":"A4.1","also":["A1.2"],"title":"Respuesta extensa: ADN y pruebas de la evolución","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Describa cómo la estructura del ADN le permite almacenar una cantidad casi ilimitada de información.","pts":["la información está en la *secuencia de bases* (A, T, C, G)","cualquier base puede seguir a cualquier otra a lo largo de la hebra / no hay restricciones en la secuencia","con 4 bases, una secuencia de n bases tiene *4ⁿ* combinaciones posibles","las moléculas de ADN son muy largas (millones de bases)","el esqueleto covalente de azúcar-fosfato es estable y protege la información","las bases quedan dentro de la doble hélice / el apareamiento complementario permite copiar la información"],"mod":"La información genética está codificada en la secuencia de bases A, T, C y G. Como cualquier base puede seguir a cualquier otra a lo largo de la hebra, una secuencia de n bases puede tener 4ⁿ combinaciones; dado que las moléculas de ADN tienen millones de bases, la cantidad de información posible es casi ilimitada. Además, el esqueleto covalente de azúcar-fosfato es estable, las bases quedan protegidas dentro de la doble hélice y el apareamiento complementario permite copiar la información con exactitud."},{"l":"b","m":5,"hl":false,"q":"Explique por qué la universalidad del código genético es una prueba de que todos los organismos comparten un ancestro común.","pts":["el *código genético* es la correspondencia entre codones (tripletes de bases) y aminoácidos","casi todos los organismos usan el mismo código (los mismos 64 codones con el mismo significado)","el código es arbitrario: no hay una razón química para que un codón corresponda a un aminoácido concreto","es muy improbable que el mismo código surgiera de forma independiente varias veces","por eso se explica mejor por *herencia* desde un ancestro común (LUCA)","cambiar el código sería perjudicial porque alteraría muchas proteínas a la vez, así que se ha conservado","las pequeñas variaciones (por ejemplo, en mitocondrias) son cambios menores posteriores","aplicación: un gen humano (insulina) se expresa correctamente en bacterias"],"mod":"El código genético es la correspondencia entre los codones y los aminoácidos, y casi todos los organismos usan el mismo: los 64 codones tienen el mismo significado en bacterias, plantas y animales. Este código es arbitrario, porque no hay ninguna razón química para que un codón concreto corresponda a un aminoácido concreto, de modo que sería muy improbable que el mismo código surgiera de forma independiente varias veces. La explicación más sencilla es que todos lo heredamos de un ancestro común. Se ha conservado porque cualquier cambio alteraría muchas proteínas a la vez y sería perjudicial; las pequeñas variaciones, como en las mitocondrias, son cambios menores posteriores. Una consecuencia práctica es que un gen humano, como el de la insulina, se traduce correctamente en bacterias."},{"l":"c","m":7,"hl":false,"q":"Discuta en qué medida la cría selectiva y las estructuras homólogas aportan pruebas de la evolución.","pts":["la *cría selectiva*: los humanos eligen los individuos con rasgos deseados para reproducirse durante muchas generaciones","produce grandes cambios heredables en poco tiempo / ejemplo: col, brócoli y coliflor a partir de la col silvestre / maíz a partir del teosinte","muestra que existe variación heredable y que la selección cambia las poblaciones","si la selección artificial causa tanto cambio en siglos, la *selección natural* puede causar evolución en millones de años","limitación: la selección es dirigida por humanos y no suele producir especies nuevas","las *estructuras homólogas* tienen la misma estructura básica pero distintas funciones","ejemplo: extremidad *pentadáctila* en el brazo humano, el ala del murciélago y la aleta de la ballena","se explica por un ancestro común y *evolución divergente* (adaptación a distintos modos de vida)","limitación: estructuras parecidas pueden ser análogas (evolución convergente), como las alas de aves e insectos","las pruebas de secuencias de ADN y proteínas confirman las relaciones / ninguna prueba sola basta, pero juntas son consistentes"],"mod":"La cría selectiva consiste en que los humanos eligen, durante muchas generaciones, los individuos con los rasgos deseados para reproducirse. Así se han producido grandes cambios heredables en poco tiempo: la col, el brócoli y la coliflor derivan de la col silvestre, y el maíz del teosinte. Esto demuestra que existe variación heredable y que la selección cambia las poblaciones, por lo que es razonable que la selección natural cause evolución a lo largo de millones de años. Su limitación es que la selección es dirigida por humanos y rara vez produce especies nuevas. Las estructuras homólogas, como la extremidad pentadáctila del brazo humano, el ala del murciélago y la aleta de la ballena, comparten la misma estructura básica a pesar de tener funciones distintas; esto se explica por un ancestro común seguido de evolución divergente. Sin embargo, estructuras parecidas pueden ser análogas, fruto de evolución convergente, como las alas de aves e insectos, así que hay que distinguirlas. En conjunto, ninguna de estas pruebas basta sola, pero coinciden con las pruebas de secuencias de ADN y proteínas y apoyan con fuerza la evolución."}],"hl":false,"mk":16,"mkSL":16},{"qid":3004,"p":"1B","t":"A1.1","also":[],"title":"Capilaridad en tubos de vidrio","blocks":[{"k":"p","v":"Un estudiante colocó en posición vertical tubos capilares de vidrio de distinto diámetro interno en un recipiente con agua a 20 °C y midió la altura que alcanzó el agua dentro de cada tubo. Repitió la medición tres veces con cada diámetro."},{"k":"table","cap":"Altura alcanzada por el agua en tubos de distinto diámetro","rows":[["Diámetro interno / mm","Ensayo 1 / mm","Ensayo 2 / mm","Ensayo 3 / mm","Media / mm"],["0,5","58","61","60","?"],["1,0","30","29","31","30,0"],["1,5","21","19","20","20,0"],["2,0","15","14","16","15,0"]]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Identifique la variable independiente de este experimento.","pts":["el *diámetro interno* del tubo"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calcule la altura media alcanzada por el agua en el tubo de 0,5 mm.","pts":["(58 + 61 + 60) ÷ 3","= 59,7 mm","respuesta con unidad / aceptar 59,67 mm"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Describa la relación entre el diámetro del tubo y la altura alcanzada por el agua.","pts":["a mayor diámetro, menor altura / relación inversa","la altura no disminuye de forma lineal: al duplicar el diámetro la altura se reduce a la mitad (de 1,0 a 2,0 mm: 30 → 15 mm)","la mayor diferencia se da entre 0,5 y 1,0 mm"],"mod":""},{"l":"d","m":3,"hl":false,"q":"Explique los resultados haciendo referencia a las propiedades del agua.","pts":["*adhesión*: el agua forma enlaces de hidrógeno con la superficie polar del vidrio y sube por la pared","*cohesión*: las moléculas de agua están unidas entre sí por *enlaces de hidrógeno*, así que arrastran al resto de la columna","en un tubo estrecho la superficie de vidrio es grande en relación con el volumen / peso del agua","por eso en tubos estrechos la adhesión sostiene una columna más alta frente a la gravedad","lo mismo ocurre en el suelo y en las paredes de celulosa de las células vegetales"],"mod":"El agua sube por el tubo por adhesión: sus moléculas, polares, forman enlaces de hidrógeno con la superficie del vidrio y ascienden por la pared. Por cohesión, como las moléculas de agua están unidas entre sí por enlaces de hidrógeno, arrastran al resto de la columna. En un tubo estrecho la superficie de vidrio es grande en relación con el volumen y el peso del agua que hay que sostener, así que la columna sube más alto antes de que la gravedad la equilibre; por eso la altura disminuye al aumentar el diámetro."}],"hl":false,"mk":8,"mkSL":8},{"qid":3005,"p":"1B","t":"A4.2","also":[],"title":"Un censo de mariposas con ciencia ciudadana","blocks":[{"k":"p","v":"Voluntarios recorrieron cada verano los mismos 30 transectos de 1 km en una región agrícola y contaron los individuos de una especie de mariposa. La tabla muestra el número medio por transecto y la desviación estándar (DE)."},{"k":"table","cap":"Mariposas contadas por transecto (n = 30 transectos)","rows":[["Año","Media por transecto","DE"],["2010","48","9"],["2013","44","10"],["2016","37","8"],["2019","30","9"],["2022","26","7"],["2024","24","6"]]},{"k":"chart","type":"line","title":"Número medio de mariposas por transecto","x":"Año","y":"Media por transecto","s":[{"n":"Media","pts":[[2010,48],[2013,44],[2016,37],[2019,30],[2022,26],[2024,24]]}]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Indique la tendencia que muestran los datos.","pts":["el número medio de mariposas *disminuye* de forma continua entre 2010 y 2024"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calcule el porcentaje de disminución del número medio entre 2010 y 2024.","pts":["(48 − 24) ÷ 48 × 100","= 50 %","respuesta con el signo % / se acepta «disminuyó a la mitad»"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Usando las desviaciones estándar, deduzca si la diferencia entre 2010 y 2013 y la diferencia entre 2010 y 2024 son probablemente significativas.","pts":["2010 (48 ± 9) y 2013 (44 ± 10): los intervalos se *solapan* mucho, así que probablemente la diferencia no es significativa","2010 (39–57) y 2024 (18–30): no se solapan, así que probablemente la diferencia es significativa","haría falta una prueba estadística (por ejemplo, prueba t) para confirmarlo"],"mod":""},{"l":"d","m":2,"hl":false,"q":"Sugiera una ventaja y una limitación de usar ciencia ciudadana en este estudio.","pts":["ventaja: muchos voluntarios cubren muchos transectos / zonas amplias / muchos años a bajo coste","ventaja: tamaño de muestra grande, lo que aumenta la fiabilidad","limitación: los voluntarios pueden identificar mal la especie / variar en experiencia","limitación: diferencias en el esfuerzo o las condiciones del recuento (hora, tiempo meteorológico)"],"mod":""},{"l":"e","m":2,"hl":false,"q":"Sugiera dos causas del descenso de esta población en una región agrícola.","pts":["*pérdida de hábitat* / eliminación de setos y prados con flores","uso de pesticidas / herbicidas que matan a las mariposas o a sus plantas nutricias","menos plantas con néctar por los monocultivos","cambio climático / contaminación por fertilizantes"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3006,"p":"1B","t":"A2.2","also":["D2.3"],"title":"Vacuolas contráctiles de Paramecium","blocks":[{"k":"p","v":"Se colocaron Paramecium en soluciones con distinta concentración de NaCl a 20 °C. Tras 10 minutos se contó al microscopio cuántas veces se vaciaba la vacuola contráctil en un minuto. Se observaron 5 individuos por solución y se calculó la media."},{"k":"chart","type":"line","title":"Frecuencia de vaciado de la vacuola contráctil","x":"Concentración de NaCl / mmol dm⁻³","y":"Vaciados por minuto","s":[{"n":"Media (n = 5)","pts":[[0,12.0],[25,9.4],[50,6.8],[75,4.1],[100,1.5]]}]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Identifique la variable dependiente.","pts":["el número de *vaciados de la vacuola contráctil* por minuto"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calcule el porcentaje de reducción de la frecuencia de vaciado entre 0 y 100 mmol dm⁻³ de NaCl.","pts":["(12,0 − 1,5) ÷ 12,0 × 100","= 87,5 %","aceptar 88 %"],"mod":""},{"l":"c","m":3,"hl":false,"q":"Explique los resultados.","pts":["en agua dulce / NaCl bajo el medio tiene mayor *potencial hídrico* que el citoplasma (es hipotónico)","el agua entra en la célula por *ósmosis*","la vacuola contráctil expulsa el exceso de agua / evita que la célula estalle (*homeostasis*)","al aumentar el NaCl la diferencia de potencial hídrico disminuye, entra menos agua y hace falta vaciar menos","el vaciado consume ATP, así que se ahorra energía cuando entra menos agua"],"mod":"En agua con poca sal el medio es hipotónico: tiene mayor potencial hídrico que el citoplasma, así que el agua entra en Paramecium por ósmosis. Como no tiene pared celular, debe expulsar ese exceso de agua para no estallar, y lo hace con la vacuola contráctil, un ejemplo de homeostasis. Al aumentar la concentración de NaCl, la diferencia de potencial hídrico entre el medio y el citoplasma se reduce, entra menos agua y la vacuola se vacía con menor frecuencia; a 100 mmol dm⁻³ apenas entra agua."},{"l":"d","m":2,"hl":false,"q":"Sugiera dos mejoras para aumentar la fiabilidad del experimento.","pts":["observar más individuos por concentración / repetir el experimento","mantener constante la temperatura (baño de agua) / mismo tiempo de aclimatación","usar Paramecium del mismo cultivo / edad similar","contar durante más tiempo (por ejemplo, 3 minutos) y calcular la media por minuto","añadir más concentraciones intermedias"],"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":3007,"p":"2X","t":"B1.1","also":["B2.1"],"title":"Respuesta extensa: glúcidos y lípidos","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma cómo se forman y se rompen los polisacáridos mediante reacciones de condensación e hidrólisis.","hl":false,"pts":["los monómeros de los polisacáridos son monosacáridos / p. ej., α-glucosa","*condensación*: dos monosacáridos se unen mediante un enlace glucosídico","se libera una molécula de agua por cada enlace que se forma / un polímero de n monómeros libera n − 1 moléculas de agua","la condensación necesita energía / ATP","*hidrólisis*: se usa una molécula de agua para romper cada enlace glucosídico","la hidrólisis libera monosacáridos / p. ej., digestión del almidón / movilización del glucógeno","ambas reacciones están catalizadas por enzimas (específicas)"],"mod":"Los polisacáridos como el almidón y el glucógeno son polímeros de un monosacárido, la α-glucosa. Se forman por condensación: una enzima une dos monosacáridos mediante un enlace glucosídico y se libera una molécula de agua por cada enlace, de modo que un polímero de n monómeros libera n − 1 moléculas de agua; el proceso necesita energía del ATP. La reacción inversa es la hidrólisis: se usa una molécula de agua para romper cada enlace glucosídico y se liberan de nuevo monosacáridos, como ocurre en la digestión del almidón o cuando el hígado moviliza glucógeno. Ambas reacciones están catalizadas por enzimas específicas."},{"l":"b","m":5,"q":"Describa la estructura de un fosfolípido y cómo esta estructura permite la formación de membranas.","hl":false,"pts":["glicerol unido a dos ácidos grasos y a un grupo fosfato","los ácidos grasos se unen al glicerol por enlaces éster (condensación)","la cabeza con el fosfato es *hidrófila* / polar","las dos colas de ácidos grasos son *hidrófobas* / apolares","la molécula es *anfipática*","en agua se organizan espontáneamente en una *bicapa*: cabezas hacia el agua y colas hacia el interior","el interior hidrófobo de la bicapa es una barrera para iones y moléculas polares","los dobles enlaces cis de las colas insaturadas producen dobleces que aumentan la fluidez de la membrana"],"mod":"Un fosfolípido está formado por una molécula de glicerol unida mediante enlaces éster a dos ácidos grasos y a un grupo fosfato. La región del fosfato forma una cabeza hidrófila, mientras que las dos colas de ácidos grasos son hidrófobas, por lo que la molécula es anfipática. Cuando los fosfolípidos están en agua se organizan espontáneamente en una bicapa: las cabezas quedan en contacto con el agua a ambos lados y las colas se agrupan en el interior, lejos del agua. Este núcleo hidrófobo actúa como barrera para los iones y las moléculas polares, por lo que la bicapa es la estructura básica de todas las membranas. Además, los dobles enlaces cis de las colas insaturadas producen dobleces que impiden un empaquetamiento compacto y dan fluidez a la membrana."},{"l":"c","m":7,"q":"Explique cómo las estructuras de los glúcidos y de los lípidos se relacionan con su función de almacenamiento de energía en plantas y animales.","hl":false,"pts":["las plantas almacenan *almidón* y los animales *glucógeno*, ambos polímeros de α-glucosa","la amilosa no está ramificada y se enrolla en hélice, lo que la hace compacta","la amilopectina y el glucógeno están ramificados: muchos extremos donde añadir o quitar glucosa con rapidez","son moléculas grandes e insolubles: no afectan a la ósmosis / no salen de la célula","la glucosa libre es soluble y alteraría el potencial hídrico si se almacenara en grandes cantidades","el glucógeno del hígado y del músculo permite liberar glucosa rápidamente cuando se necesita","los *triglicéridos* se forman por condensación de glicerol y tres ácidos grasos (enlaces éster)","los triglicéridos son hidrófobos, así que se almacenan sin agua asociada / en gotas en el tejido adiposo","los triglicéridos liberan aproximadamente el doble de energía por gramo que los glúcidos","por eso son la reserva a largo plazo más ligera, una ventaja para animales que se desplazan","las semillas almacenan aceites (triglicéridos con ácidos grasos insaturados, líquidos a temperatura ambiente)","los triglicéridos del tejido adiposo también aíslan del frío"],"mod":"Las plantas almacenan energía en forma de almidón y los animales como glucógeno; ambos son polímeros de α-glucosa. La amilosa del almidón no está ramificada y se enrolla en una hélice compacta, mientras que la amilopectina y, sobre todo, el glucógeno están muy ramificados, lo que ofrece muchos extremos en los que las enzimas pueden añadir o quitar glucosa con rapidez; así el glucógeno del hígado y de los músculos puede liberar glucosa en cuanto se necesita. Estos polisacáridos son grandes e insolubles, de modo que no afectan a la ósmosis ni salen de la célula, algo que sí ocurriría si se almacenara glucosa libre, que es soluble. Los lípidos de reserva son triglicéridos, formados por condensación de glicerol con tres ácidos grasos mediante enlaces éster. Al ser hidrófobos, se almacenan en gotas sin agua asociada en el tejido adiposo y liberan aproximadamente el doble de energía por gramo que los glúcidos, por lo que son la reserva a largo plazo más ligera, una ventaja para animales que se desplazan. Las semillas también almacenan aceites, y en los animales el tejido adiposo cumple además una función de aislamiento térmico."}],"hl":false,"mk":16,"mkSL":16},{"qid":3008,"p":"2X","t":"B3.2","also":["B3.1"],"title":"Respuesta extensa: transporte en animales y plantas","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa cómo están adaptados los capilares para el intercambio de sustancias con los tejidos.","hl":false,"pts":["pared formada por una sola capa de células endoteliales / pared muy fina","distancia de difusión corta","luz muy estrecha: los eritrocitos pasan en fila, muy cerca de la pared","red muy ramificada: gran superficie de intercambio","ninguna célula del cuerpo está lejos de un capilar","membrana basal permeable / poros entre las células endoteliales","capilares fenestrados con poros mayores donde el intercambio es muy rápido / p. ej., riñón, vellosidades intestinales","la sangre fluye lentamente, lo que da más tiempo para el intercambio"],"mod":"Los capilares tienen una pared formada por una sola capa de células endoteliales muy finas apoyadas sobre una membrana basal permeable, de modo que la distancia de difusión entre la sangre y los tejidos es muy corta. Su luz es tan estrecha que los eritrocitos pasan prácticamente en fila, pegados a la pared. Forman redes muy ramificadas, lo que proporciona una gran superficie de intercambio y garantiza que ninguna célula esté lejos de un capilar. En algunos órganos, como el riñón o las vellosidades intestinales, los capilares son fenestrados, con poros que facilitan un intercambio aún más rápido. Además, la sangre fluye lentamente por ellos, lo que da más tiempo para que se intercambien sustancias."},{"l":"b","m":5,"q":"Distinga entre la estructura de las arterias y la de las venas.","hl":false,"pts":["arterias: pared gruesa / venas: pared fina","arterias: capa gruesa de músculo liso / venas: capa muscular fina","arterias: muchas fibras elásticas / venas: pocas fibras elásticas","arterias: luz estrecha / venas: luz amplia","la relación entre el grosor de la pared y el diámetro de la luz es mayor en las arterias","venas: tienen válvulas / arterias: no tienen válvulas (salvo las semilunares a la salida del corazón)","en un corte, las arterias conservan una sección circular / las venas suelen aparecer aplastadas o irregulares"],"mod":"Las arterias tienen una pared mucho más gruesa que las venas, con una capa ancha de músculo liso y abundantes fibras elásticas, mientras que en las venas la capa muscular es fina y hay pocas fibras elásticas. La luz de las arterias es relativamente estrecha y la de las venas es amplia, por lo que la relación entre el grosor de la pared y el diámetro de la luz es mucho mayor en las arterias. Las venas tienen válvulas en forma de bolsillo a lo largo de su recorrido, que no existen en las arterias. Por último, en un corte microscópico las arterias mantienen una sección circular, mientras que las venas suelen aparecer aplastadas o irregulares."},{"l":"c","m":7,"q":"Explique cómo se transporta el agua desde las raíces hasta las hojas de una planta.","hl":false,"pts":["el agua entra en la raíz por ósmosis / los pelos radicales aumentan la superficie de absorción","el agua se evapora de las paredes de las células del mesófilo esponjoso","el vapor de agua sale por difusión a través de los estomas: *transpiración*","la transpiración es una consecuencia de que los estomas se abran para el intercambio de gases / para que entre CO₂","la evaporación tira del agua de las paredes celulares y genera *tensión* (presión negativa) en el xilema","*cohesión*: las moléculas de agua se mantienen unidas por enlaces de hidrógeno, formando una columna continua","*adhesión*: el agua es atraída por las paredes hidrófilas del xilema","la columna de agua sube como un todo; el transporte es pasivo, sin gasto de ATP","los vasos del xilema son tubos continuos de células muertas sin contenido ni paredes transversales","las paredes engrosadas con *lignina* resisten la tensión y evitan que los vasos colapsen","las punteaduras de las paredes permiten el paso lateral del agua entre vasos y hacia las células de la hoja","más viento, temperatura o luz aumentan la transpiración y, por tanto, el flujo de agua"],"mod":"El agua entra en la raíz desde el suelo por ósmosis, a través de los pelos radicales, que aumentan la superficie de absorción, y llega al xilema. En la hoja, el agua se evapora de las paredes de las células del mesófilo esponjoso y el vapor sale por difusión a través de los estomas; esta transpiración es una consecuencia inevitable de que los estomas se abran para que entre CO₂. La evaporación tira del agua de las paredes celulares y genera una tensión o presión negativa que se transmite al xilema. Gracias a la cohesión, las moléculas de agua están unidas por enlaces de hidrógeno y forman una columna continua, mientras que la adhesión a las paredes hidrófilas del xilema ayuda a mantenerla; así la columna entera sube de forma pasiva, sin gasto de ATP. Los vasos del xilema están adaptados a este mecanismo: son tubos continuos de células muertas sin contenido ni paredes transversales, por lo que ofrecen poca resistencia, y sus paredes están reforzadas con lignina, que impide que colapsen bajo la tensión; las punteaduras permiten el paso lateral del agua. Cuanto mayor es la transpiración, por ejemplo con viento o calor, más rápido es el flujo de agua."}],"hl":false,"mk":16,"mkSL":16},{"qid":3009,"p":"2X","t":"B4.2","also":["B4.1"],"title":"Respuesta extensa: nutrición y nichos ecológicos","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa cómo se clasifican los organismos según su relación con el oxígeno, indicando un hábitat típico de cada tipo.","hl":false,"pts":["*aeróbico obligado*: necesita oxígeno para la respiración celular aeróbica","p. ej., la mayoría de los animales / hábitats bien oxigenados como el aire o aguas superficiales","*anaeróbico obligado*: no puede usar oxígeno / el oxígeno es tóxico para él","p. ej., bacterias de sedimentos anóxicos / suelos encharcados / intestino","*anaeróbico facultativo*: hace respiración aeróbica si hay oxígeno y anaeróbica (fermentación) si no lo hay","p. ej., levadura / E. coli en ambientes con oxígeno variable","los anaerobios facultativos crecen más rápido con oxígeno porque obtienen más ATP","la necesidad de oxígeno es un factor que forma parte del nicho"],"mod":"Según su relación con el oxígeno, los organismos se clasifican en tres grupos. Los aerobios obligados necesitan oxígeno para la respiración celular aeróbica y viven en hábitats oxigenados, como la mayoría de los animales en el aire o en aguas superficiales. Los anaerobios obligados no pueden usar oxígeno y este incluso les resulta tóxico, por lo que solo viven en ambientes anóxicos, como los sedimentos del fondo de lagos, los suelos encharcados o el intestino. Los anaerobios facultativos, como la levadura o E. coli, realizan respiración aeróbica cuando hay oxígeno y anaeróbica cuando no lo hay, por lo que toleran ambientes con oxígeno variable, aunque crecen más rápido con oxígeno porque obtienen más ATP. La disponibilidad de oxígeno es, por tanto, una dimensión del nicho de cada especie."},{"l":"b","m":5,"q":"Explique cómo las distintas adaptaciones de las plantas para captar la luz les permiten ocupar nichos diferentes en un bosque.","hl":false,"pts":["la luz es un recurso limitado en un bosque y disminuye desde el dosel hasta el suelo","árboles: troncos altos y leñosos que elevan las hojas hasta el dosel, con luz plena","lianas: tallos trepadores que usan los árboles como soporte, sin invertir en un tronco propio","epífitas: crecen sobre las ramas de los árboles, obtienen luz sin raíces en el suelo / toman agua de la lluvia o la humedad","estranguladoras: empiezan como epífitas y sus raíces bajan al suelo y rodean al árbol hospedador","plantas del sotobosque tolerantes a la sombra: hojas grandes y finas / más clorofila para aprovechar poca luz","cada estrategia ocupa un estrato distinto: se reduce la competencia directa por la luz / distintos nichos"],"mod":"En un bosque la luz es un recurso limitado que disminuye mucho desde el dosel hasta el suelo, y las plantas presentan distintas adaptaciones para captarla. Los árboles invierten en troncos altos y leñosos que elevan sus hojas hasta el dosel, donde reciben luz plena. Las lianas trepan usando a los árboles como soporte, de modo que alcanzan la luz sin gastar recursos en un tronco propio. Las epífitas crecen sobre las ramas, obteniendo luz sin raíces en el suelo y tomando agua de la lluvia o de la humedad, y las estranguladoras empiezan como epífitas y luego envían raíces al suelo que rodean al árbol hospedador. En el sotobosque, las plantas tolerantes a la sombra tienen hojas grandes y finas con mucha clorofila para aprovechar la poca luz disponible. Como cada estrategia aprovecha la luz en un estrato distinto, las especies ocupan nichos diferentes y se reduce la competencia directa entre ellas."},{"l":"c","m":7,"q":"Discuta cómo la competencia entre especies puede hacer que el nicho realizado de una especie sea más pequeño que su nicho fundamental.","hl":false,"pts":["el nicho es el papel de una especie: hábitat, interacciones y condiciones bióticas y abióticas que necesita","*nicho fundamental*: todo el conjunto de condiciones en que la especie podría vivir y reproducirse","el nicho fundamental depende de los intervalos de tolerancia a factores abióticos","*nicho realizado*: la parte del nicho fundamental que la especie ocupa realmente en presencia de otras especies","si los nichos de dos especies se solapan, compiten por recursos limitados","*principio de exclusión competitiva*: dos especies no pueden ocupar indefinidamente el mismo nicho","la especie menos competitiva desaparece localmente o queda restringida a una parte de su nicho fundamental","evidencia: al retirar una especie, la otra amplía su distribución / ejemplo concreto (p. ej., percebes de una costa rocosa)","el reparto de recursos (distinto alimento, altura u horario) permite la coexistencia","otros factores además de la competencia también reducen el nicho: depredadores, enfermedades, falta de mutualistas","el nicho fundamental es difícil de medir en la naturaleza / se deduce de experimentos de eliminación o de laboratorio"],"mod":"El nicho de una especie es su papel en el ecosistema: el hábitat, las condiciones bióticas y abióticas que necesita y sus interacciones con otras especies. El nicho fundamental es el conjunto completo de condiciones en que la especie podría sobrevivir y reproducirse, y depende sobre todo de sus intervalos de tolerancia a factores abióticos como la temperatura o la salinidad. Sin embargo, en la naturaleza la especie solo ocupa una parte: su nicho realizado. Cuando los nichos de dos especies se solapan, ambas compiten por recursos limitados y, según el principio de exclusión competitiva, no pueden ocupar indefinidamente el mismo nicho; la menos competitiva desaparece localmente o queda restringida a la zona donde la otra no la supera. Esto se demuestra con experimentos de eliminación, como en los percebes de una costa rocosa: al retirar la especie dominante, la otra amplía su distribución hacia zonas que antes no ocupaba. A menudo las especies coexisten porque se reparten los recursos, por ejemplo comiendo a distintas alturas o en distintos momentos. No obstante, la competencia no es el único factor: la depredación, las enfermedades o la ausencia de mutualistas también pueden reducir el nicho realizado, y el nicho fundamental es difícil de medir directamente, por lo que suele deducirse de experimentos."}],"hl":false,"mk":16,"mkSL":16},{"qid":3010,"p":"2X","t":"B1.2","also":["C1.1"],"title":"Respuesta extensa: proteínas y desnaturalización","blocks":[],"parts":[{"l":"a","m":4,"q":"Dibuje un diagrama rotulado de un dipéptido que muestre el enlace formado entre los dos aminoácidos.","hl":false,"pts":["un carbono central en cada aminoácido unido a un átomo de H y a un grupo R","grupos R distintos rotulados (R₁ y R₂)","grupo amino (–NH₂) libre en un extremo","grupo carboxilo (–COOH) libre en el otro extremo","*enlace peptídico* –CO–NH– dibujado y rotulado entre el C del carboxilo de un aminoácido y el N del amino del otro","molécula de agua mostrada como producto de la condensación"],"mod":"El diagrama debe mostrar dos aminoácidos unidos en una cadena: cada uno con un átomo de carbono central unido a un átomo de hidrógeno y a un grupo R, rotulados como R₁ y R₂ para indicar que pueden ser distintos. En un extremo de la molécula queda un grupo amino libre (–NH₂) y en el otro un grupo carboxilo libre (–COOH). Entre ambos aminoácidos se dibuja y rotula el enlace peptídico (–CO–NH–), que une el carbono del grupo carboxilo del primer aminoácido con el nitrógeno del grupo amino del segundo, y se indica que en la reacción de condensación se libera una molécula de agua."},{"l":"b","m":5,"q":"Resuma por qué puede existir una variedad casi ilimitada de polipéptidos.","hl":false,"pts":["los ribosomas usan 20 aminoácidos distintos para fabricar polipéptidos","los aminoácidos se pueden unir en cualquier orden / secuencia","la longitud de la cadena varía mucho / desde unos pocos hasta miles de aminoácidos","el número de secuencias posibles es 20ⁿ (n = número de aminoácidos)","p. ej., hay 20³ = 8000 tripéptidos posibles / un polipéptido de 100 aminoácidos tiene 20¹⁰⁰ secuencias posibles","la secuencia está codificada por los genes, que la célula traduce","cada secuencia distinta puede plegarse en una forma y una función diferentes"],"mod":"Los ribosomas fabrican polipéptidos a partir de 20 aminoácidos distintos, que pueden unirse en cualquier orden. Además, la longitud de la cadena varía mucho, desde unos pocos aminoácidos hasta miles. El número de secuencias posibles para una cadena de n aminoácidos es 20ⁿ: ya hay 20³ = 8000 tripéptidos posibles, y para un polipéptido de 100 aminoácidos la cifra, 20¹⁰⁰, es astronómica. La secuencia concreta de cada polipéptido está codificada por un gen, y como cada secuencia puede plegarse de una forma diferente, esta variedad permite una enorme diversidad de funciones."},{"l":"c","m":7,"q":"Explique los efectos de las temperaturas altas y de los pH extremos sobre la estructura de las proteínas y sobre la actividad de las enzimas.","hl":false,"pts":["la función de una proteína depende de su forma tridimensional","esa forma se mantiene por enlaces relativamente débiles dentro de la molécula","las temperaturas altas aumentan la vibración de la molécula y rompen esos enlaces","los pH extremos cambian las cargas de la proteína y también rompen esos enlaces","la proteína se *desnaturaliza*: pierde su forma tridimensional, normalmente de forma permanente","los enlaces peptídicos no se rompen / la secuencia de aminoácidos se mantiene","las proteínas solubles pueden volverse insolubles / p. ej., la clara de huevo al cocinarse","en una enzima cambia la forma del *sitio activo*, así que el sustrato ya no encaja","se forman menos complejos enzima-sustrato y la velocidad de reacción disminuye","por debajo del óptimo, más temperatura aumenta las colisiones y la actividad / por encima, la desnaturalización hace caer la actividad","cada enzima tiene un pH óptimo / p. ej., la pepsina del estómago funciona a pH ácido","algunas proteínas de organismos termófilos son estables a temperaturas altas"],"mod":"La función de una proteína depende de su forma tridimensional, que se mantiene gracias a enlaces relativamente débiles dentro de la molécula. Las temperaturas altas aumentan la vibración de la molécula y rompen estos enlaces, y los pH extremos alteran las cargas de la proteína y también los rompen. En ambos casos la proteína se desnaturaliza: pierde su forma tridimensional, normalmente de manera permanente, aunque los enlaces peptídicos no se rompen y la secuencia de aminoácidos se mantiene. Las proteínas solubles pueden incluso volverse insolubles, como la clara de huevo al cocinarse. En una enzima, la desnaturalización cambia la forma del sitio activo, de modo que el sustrato ya no encaja, se forman menos complejos enzima-sustrato y la velocidad de reacción cae. Por eso, al subir la temperatura la actividad aumenta al principio porque hay más colisiones, pero por encima del óptimo la desnaturalización hace que caiga bruscamente. Del mismo modo, cada enzima tiene un pH óptimo: la pepsina del estómago funciona a pH ácido, mientras que otras enzimas se desnaturalizan en esas condiciones. Algunas proteínas de organismos termófilos son estables incluso a temperaturas muy altas."}],"hl":false,"mk":16,"mkSL":16},{"qid":3011,"p":"1B","t":"B2.3","also":["B2.1"],"title":"Tamaño de cubos de agar y difusión","blocks":[{"k":"p","v":"Se prepararon cubos de agar teñidos de rosa con un indicador que se vuelve incoloro en medio ácido. Los cubos se sumergieron en ácido clorhídrico y se midió el tiempo hasta que el cubo quedó completamente incoloro. Cada tamaño se repitió tres veces."},{"k":"table","cap":"Tiempo hasta la decoloración completa de los cubos de agar","rows":[["Lado del cubo / cm","Relación superficie/volumen / cm⁻¹","Ensayo 1 / s","Ensayo 2 / s","Ensayo 3 / s","Media / s"],["0,5","12","130","124","127","127"],["1,0","6","488","512","506","?"],["2,0","?","1950","2080","2010","2013"]]}],"parts":[{"l":"a","m":1,"q":"Calcule la relación superficie/volumen del cubo de 2,0 cm de lado.","hl":false,"pts":["24 cm² ÷ 8 cm³ = 3 cm⁻¹"],"mod":""},{"l":"b","m":2,"q":"Calcule el porcentaje de aumento del tiempo medio de decoloración del cubo de 0,5 cm al de 1,0 cm. Muestre su procedimiento.","hl":false,"pts":["media del cubo de 1,0 cm = (488 + 512 + 506) ÷ 3 = 502 s","(502 − 127) ÷ 127 × 100 = 295 % (aceptar 290–300 %)"],"mod":""},{"l":"c","m":1,"q":"Identifique la variable independiente de este experimento.","hl":false,"pts":["el tamaño del cubo / la longitud del lado / la relación superficie/volumen"],"mod":""},{"l":"d","m":2,"q":"Sugiera dos mejoras del método que aumentarían la fiabilidad de los resultados.","hl":false,"pts":["usar la misma concentración y el mismo volumen de ácido para todos los cubos / suficiente ácido para cubrir los cubos","mantener constante la temperatura / usar un baño de agua termostático","cortar los cubos con precisión / con un molde o una regla","usar un fondo blanco / el mismo observador para decidir el final del cambio de color","hacer más repeticiones (5 o más) / más tamaños de cubo"],"mod":""},{"l":"e","m":3,"q":"Explique cómo estos resultados ayudan a comprender por qué el tamaño de las células está limitado.","hl":false,"pts":["al aumentar el tamaño, la relación superficie/volumen disminuye","la velocidad de entrada de sustancias depende de la superficie / la difusión es lenta en distancias largas","el ácido tarda mucho más en llegar al centro de los cubos grandes / la distancia al centro aumenta","la demanda de sustancias de una célula depende de su volumen","en una célula grande, la superficie no permitiría intercambiar materiales (O₂, nutrientes, desechos) con suficiente rapidez","por eso las células se dividen al crecer / se mantienen pequeñas"],"mod":"Al aumentar el lado del cubo de 0,5 a 2,0 cm, la relación superficie/volumen disminuye de 12 a 3 cm⁻¹ y el tiempo de decoloración pasa de 127 s a unos 2013 s, porque el ácido debe difundir una distancia mucho mayor hasta el centro y la superficie por la que entra es pequeña en relación con el volumen. En una célula ocurre lo mismo: la velocidad de intercambio de sustancias depende de la superficie de la membrana, mientras que las necesidades de O₂ y nutrientes y la producción de desechos dependen del volumen. Si una célula creciera demasiado, su superficie no permitiría intercambiar materiales con la rapidez suficiente, por lo que las células se mantienen pequeñas o se dividen al crecer."}],"hl":false,"mk":9,"mkSL":9},{"qid":3012,"p":"1B","t":"B3.1","also":["C1.2"],"title":"Ventilación pulmonar durante el ejercicio","blocks":[{"k":"p","v":"Se midieron la frecuencia de ventilación y el volumen corriente de 12 estudiantes en reposo y pedaleando en una bicicleta estática a tres intensidades. Los valores son medias ± desviación estándar."},{"k":"table","cap":"Frecuencia de ventilación y volumen corriente a distintas intensidades de ejercicio","rows":[["Intensidad","Frecuencia de ventilación / respiraciones min⁻¹","Volumen corriente / dm³"],["Reposo","14 ± 2","0,5 ± 0,1"],["Ligera","20 ± 3","1,2 ± 0,2"],["Moderada","28 ± 4","1,9 ± 0,3"],["Intensa","40 ± 6","2,4 ± 0,4"]]}],"parts":[{"l":"a","m":2,"q":"Calcule el volumen de aire ventilado por minuto durante el ejercicio intenso. Muestre su procedimiento.","hl":false,"pts":["40 respiraciones min⁻¹ × 2,4 dm³","= 96 dm³ min⁻¹"],"mod":""},{"l":"b","m":2,"q":"Usando las desviaciones estándar, discuta si la diferencia en la frecuencia de ventilación entre el ejercicio ligero y el moderado es probablemente significativa.","hl":false,"pts":["ligero: 17–23; moderado: 24–32 respiraciones min⁻¹","los intervalos de media ± DE no se solapan","así que la diferencia probablemente es significativa / se necesitaría una prueba estadística (p. ej., prueba t) para confirmarlo"],"mod":""},{"l":"c","m":1,"q":"Identifique una variable que debería mantenerse constante entre los estudiantes.","hl":false,"pts":["tiempo de ejercicio antes de medir / resistencia de la bicicleta en cada intensidad / postura / temperatura de la sala / estado de salud o forma física similar / sin comer justo antes"],"mod":""},{"l":"d","m":3,"q":"Explique por qué aumentan la frecuencia de ventilación y el volumen corriente durante el ejercicio.","hl":false,"pts":["los músculos aumentan la respiración celular aeróbica para producir más ATP","se consume más oxígeno y se produce más CO₂","ventilar más mantiene altas las concentraciones de O₂ y bajas las de CO₂ en los alvéolos","así se mantienen pronunciados los gradientes de concentración para la difusión entre alvéolos y sangre","el aumento de CO₂ en la sangre es detectado y el centro respiratorio aumenta la frecuencia / los músculos intercostales y el diafragma se contraen con más fuerza"],"mod":"Durante el ejercicio, los músculos aumentan la respiración celular aeróbica para producir más ATP, por lo que consumen más oxígeno y producen más CO₂. Al aumentar la frecuencia de ventilación y el volumen corriente, se renueva más rápidamente el aire de los alvéolos, de modo que la concentración de O₂ se mantiene alta y la de CO₂ baja. Así se conservan pronunciados los gradientes de concentración, y el oxígeno difunde hacia la sangre y el CO₂ hacia los alvéolos con la rapidez necesaria. El aumento de CO₂ en la sangre es detectado y estimula al diafragma y a los músculos intercostales a contraerse con más frecuencia y más fuerza."}],"hl":false,"mk":8,"mkSL":8},{"qid":3013,"p":"1B","t":"B4.1","also":["D4.1"],"title":"Tolerancia a la sal en dos poblaciones de una planta","blocks":[{"k":"p","v":"Se recogieron semillas de una misma especie de planta en una población costera y en otra del interior. Se colocaron 50 semillas de cada población en placas con soluciones de NaCl de distinta concentración y se contó el porcentaje que germinó tras 10 días."},{"k":"chart","type":"line","title":"Germinación de semillas a distintas concentraciones de NaCl","x":"Concentración de NaCl / mmol dm⁻³","y":"Germinación / %","s":[{"n":"Población costera","pts":[[0,92],[100,90],[200,85],[300,70],[400,40],[500,10]]},{"n":"Población del interior","pts":[[0,94],[100,80],[200,45],[300,12],[400,0],[500,0]]}]}],"parts":[{"l":"a","m":1,"q":"Indique el porcentaje de germinación de la población del interior a 200 mmol dm⁻³ de NaCl.","hl":false,"pts":["45 %"],"mod":""},{"l":"b","m":2,"q":"Calcule el cambio porcentual en la germinación de la población costera entre 0 y 400 mmol dm⁻³ de NaCl.","hl":false,"pts":["(40 − 92) ÷ 92 × 100","= −56,5 % / disminución del 57 % (aceptar 56–57 %)"],"mod":""},{"l":"c","m":2,"q":"Compare los intervalos de tolerancia a la sal de las dos poblaciones.","hl":false,"pts":["ambas germinan mejor sin sal o con poca sal / germinación similar (≈ 92–94 %) a 0 mmol dm⁻³","la germinación disminuye al aumentar la sal en ambas","la población costera tiene un intervalo de tolerancia más amplio / germina hasta 500 mmol dm⁻³, la del interior no germina desde 400","la germinación de la población del interior cae antes / más bruscamente"],"mod":""},{"l":"d","m":2,"q":"Sugiera dos variables que deberían controlarse en este experimento.","hl":false,"pts":["temperatura","intensidad / duración de la luz","volumen de solución en cada placa / evitar la evaporación","edad / tamaño de las semillas / semillas recogidas al mismo tiempo","tipo de sustrato / papel de filtro en las placas"],"mod":""},{"l":"e","m":2,"q":"Sugiera cómo pudo surgir la mayor tolerancia a la sal de la población costera.","hl":false,"pts":["había variación en la tolerancia a la sal dentro de la población original","en la costa, las plantas más tolerantes sobrevivieron y se reprodujeron más / *selección natural*","transmitieron los alelos de la tolerancia a su descendencia, que aumentaron de frecuencia con el tiempo"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3014,"p":"2X","t":"C4.2","also":["C1.3","C1.2","D4.3"],"title":"Respuesta extensa: energía y carbono en los ecosistemas","blocks":[],"parts":[{"l":"a","m":4,"q":"Distinga entre fotoautótrofos, quimioautótrofos y heterótrofos.","hl":false,"pts":["los autótrofos sintetizan sus propios compuestos de carbono a partir de *CO₂* / fuentes inorgánicas","los fotoautótrofos usan la *energía luminosa* (fotosíntesis)","ejemplo de fotoautótrofo: plantas / algas / cianobacterias","los quimioautótrofos usan energía de *reacciones de oxidación* de sustancias inorgánicas","ejemplo de quimioautótrofo: bacterias oxidantes del hierro / del azufre / bacterias de fuentes hidrotermales","los heterótrofos obtienen los compuestos de carbono de *otros organismos* (vivos o muertos)","ejemplos de heterótrofos: consumidores / descomponedores / animales / hongos"],"mod":"Los autótrofos fabrican sus compuestos de carbono a partir de CO₂ y otras sustancias inorgánicas, mientras que los heterótrofos los obtienen de otros organismos, como hacen los consumidores al alimentarse o los descomponedores (por ejemplo, hongos) al digerir materia orgánica muerta. Los autótrofos se distinguen por su fuente de energía: los fotoautótrofos, como las plantas, las algas y las cianobacterias, usan la energía luminosa en la fotosíntesis; los quimioautótrofos, como las bacterias oxidantes del hierro, obtienen la energía de reacciones de oxidación de sustancias inorgánicas."},{"l":"b","m":5,"q":"Explique por qué las pirámides de energía tienen forma de pirámide y por qué esto limita la longitud de las cadenas tróficas.","hl":false,"pts":["cada barra representa la energía que pasa a un nivel trófico por unidad de área y tiempo (kJ m⁻² año⁻¹)","solo una pequeña parte (en torno al *10 %*) de la energía pasa al nivel siguiente","la mayor parte se pierde como *calor* de la respiración celular","parte no se consume / no se come (raíces, huesos) o no se absorbe y sale en las heces","esa energía de restos y heces pasa a los descomponedores","el calor no puede reconvertirse en energía química / la energía no se recicla","tras pocos niveles queda muy poca energía para mantener otra población","por eso rara vez hay más de 4–5 niveles tróficos"],"mod":"Una pirámide de energía muestra la energía que pasa a cada nivel trófico por unidad de área y de tiempo, por ejemplo en kJ m⁻² año⁻¹. Cada barra es más estrecha que la anterior porque solo pasa al nivel siguiente alrededor del 10 % de la energía. La mayor parte se pierde como calor producido en la respiración celular, que no puede volver a convertirse en energía química; otra parte no se come o no se absorbe y sale en las heces, y esa energía pasa a los descomponedores. Como en cada transferencia se pierde tanta energía, después de unos pocos niveles queda demasiado poca para mantener una población viable de otro depredador, por lo que las cadenas tróficas rara vez superan los cuatro o cinco niveles."},{"l":"c","m":7,"q":"Discuta cómo las actividades humanas han alterado el equilibrio entre las fuentes y los sumideros de carbono, usando la curva de Keeling como prueba.","hl":false,"pts":["un sumidero absorbe más carbono del que libera / una fuente libera más del que absorbe","la fotosíntesis retira CO₂ y la respiración celular lo devuelve; a escala global solían estar casi equilibradas","ejemplos de sumideros: bosques en crecimiento / océanos / turberas / sedimentos","la *combustión* de combustibles fósiles libera carbono almacenado durante millones de años","la deforestación / quema de biomasa libera CO₂ y reduce la fotosíntesis (sumidero)","drenar / quemar turberas convierte un sumidero en fuente","la *curva de Keeling* muestra un aumento continuo de la concentración de CO₂ desde 1958 (de unos 315 a más de 420 ppm)","la oscilación anual se debe a más fotosíntesis en el verano del hemisferio norte","la tendencia ascendente muestra que las emisiones superan la absorción de los sumideros","los océanos absorben parte del CO₂ extra, pero se acidifican","consecuencia: aumento del efecto invernadero / cambio climático","limitación: la curva muestra correlación con las emisiones, no la causa por sí sola / es un solo lugar (Mauna Loa)"],"mod":"En el ciclo del carbono, la fotosíntesis retira CO₂ de la atmósfera y la respiración celular lo devuelve; a escala global ambos procesos estaban casi equilibrados. Un sumidero, como un bosque en crecimiento, una turbera o el océano, absorbe más carbono del que libera, mientras que una fuente libera más del que absorbe. Las actividades humanas han roto este equilibrio. La combustión de carbón, petróleo y gas natural libera en pocos años carbono que estuvo almacenado durante millones de años. La deforestación y la quema de biomasa liberan CO₂ y, además, eliminan fotosíntesis, de modo que un sumidero se convierte en fuente; lo mismo ocurre al drenar y quemar turberas. La curva de Keeling, medida en Mauna Loa desde 1958, es la prueba: el CO₂ ha subido de forma continua de unos 315 ppm a más de 420 ppm. Su oscilación anual refleja la fotosíntesis del verano del hemisferio norte, pero la tendencia ascendente muestra que las emisiones superan lo que absorben los sumideros. Los océanos absorben parte del exceso, aunque a costa de acidificarse, y el resto refuerza el efecto invernadero y el cambio climático. Hay que reconocer que la curva, por sí sola, muestra una correlación con las emisiones y procede de un solo lugar, aunque otras estaciones dan el mismo patrón."}],"hl":false,"mk":16,"mkSL":16},{"qid":3015,"p":"2X","t":"C4.1","also":["B4.2","A4.2"],"title":"Respuesta extensa: poblaciones y comunidades","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma cómo puede estimarse el tamaño de la población de una especie vegetal en un campo usando cuadrantes.","hl":false,"pts":["se mide el área total del campo","los cuadrantes se colocan al *azar* (coordenadas con números aleatorios)","se cuentan los individuos de la especie en cada cuadrante","se usan muchos cuadrantes / se repite para tener una muestra representativa","se calcula la media por cuadrante y se divide por el área del cuadrante (densidad)","población estimada = densidad media × área total","adecuado para organismos sésiles / que no se mueven"],"mod":"Primero se mide el área total del campo. Después se colocan cuadrantes al azar, por ejemplo con coordenadas obtenidas de números aleatorios, para evitar el sesgo de elegir dónde muestrear. En cada cuadrante se cuentan los individuos de la especie y se repite con muchos cuadrantes para que la muestra sea representativa. Se calcula la media por cuadrante, se divide por el área del cuadrante para obtener la densidad por m² y se multiplica por el área total. El método sirve para organismos sésiles, como las plantas."},{"l":"b","m":4,"q":"Describa las fases de una curva de crecimiento sigmoide de una población.","hl":false,"pts":["fase de crecimiento exponencial: la población crece cada vez más rápido","recursos abundantes / pocos factores limitantes / natalidad muy superior a mortalidad","fase de transición: el crecimiento se frena","aumentan los factores *dependientes de la densidad* (competencia, depredación, enfermedad)","fase de meseta: natalidad + inmigración = mortalidad + emigración","la población fluctúa en torno a la *capacidad de carga*"],"mod":"Al principio hay una fase de crecimiento exponencial: los recursos abundan y hay pocos factores limitantes, así que la natalidad supera con mucho a la mortalidad y la población crece cada vez más rápido. Después viene una fase de transición en la que el crecimiento se frena, porque aumentan los factores dependientes de la densidad, como la competencia por alimento, la depredación y las enfermedades. Por último, en la fase de meseta, la natalidad más la inmigración igualan a la mortalidad más la emigración y la población fluctúa en torno a la capacidad de carga del ambiente."},{"l":"c","m":8,"q":"Explique cómo una especie invasora puede afectar a las especies endémicas y cómo podría comprobarse si compite con una de ellas.","hl":false,"pts":["una especie endémica solo vive en una región geográfica determinada","la especie invasora ha sido introducida (por los humanos) y se extiende rápidamente","no tiene depredadores / patógenos / competidores naturales en la nueva zona","*competencia interespecífica* por recursos (alimento, luz, espacio) con las endémicas","si los *nichos* se solapan, puede excluir a la endémica (exclusión competitiva)","puede depredar especies endémicas que no tienen defensas / adaptaciones frente a ella","puede traer enfermedades / hibridarse con especies endémicas","consecuencia: disminución / extinción de endémicas y pérdida de biodiversidad","prueba de laboratorio: cultivar cada especie sola y juntas en las mismas condiciones","prueba de campo: retirar la invasora de parcelas y comparar con parcelas control","si la endémica crece / aumenta más sin la invasora, hay competencia","usar repeticiones / parcelas al azar y una prueba estadística / chi cuadrado de asociación en cuadrantes","una asociación negativa sugiere competencia, pero no la demuestra por sí sola"],"mod":"Una especie endémica solo vive en una región concreta, mientras que una invasora ha sido introducida, normalmente por los humanos, y se extiende con rapidez porque en la nueva zona no tiene sus depredadores, patógenos ni competidores naturales. Puede afectar a las endémicas de varias formas. Si su nicho se solapa con el de una endémica, habrá competencia interespecífica por alimento, luz o espacio, y la invasora, más abundante, puede llegar a excluirla. También puede depredar especies endémicas que no han evolucionado defensas frente a ella, transmitirles enfermedades o hibridarse con ellas. El resultado puede ser el declive o la extinción de las endémicas y una pérdida de biodiversidad. Para comprobar si hay competencia se puede hacer un experimento de laboratorio, cultivando cada especie sola y las dos juntas en condiciones idénticas, o uno de campo, retirando la invasora de parcelas elegidas al azar y comparándolas con parcelas control. Si la endémica crece o se reproduce más sin la invasora, hay competencia. Hacen falta repeticiones y una prueba estadística; en un muestreo con cuadrantes, una prueba de chi cuadrado puede mostrar una asociación negativa, aunque esta sugiere competencia sin demostrarla por sí sola."}],"hl":false,"mk":16,"mkSL":16},{"qid":3016,"p":"2X","t":"C3.1","also":["C2.2","B3.1"],"title":"Respuesta extensa: integración y control del cuerpo","blocks":[],"parts":[{"l":"a","m":3,"q":"Resuma cómo controlan el hipotálamo y la hipófisis el sistema endocrino.","hl":false,"pts":["el hipotálamo recibe información / vigila la sangre y une el sistema nervioso con el endocrino","células neurosecretoras del hipotálamo liberan hormonas / factores liberadores","estas estimulan a la *hipófisis* anterior a secretar hormonas","la hipófisis posterior libera hormonas fabricadas en el hipotálamo (ADH / oxitocina)","las hormonas de la hipófisis actúan sobre otras glándulas endocrinas (p. ej. TSH sobre el tiroides, FSH/LH sobre las gónadas)"],"mod":"El hipotálamo vigila la sangre, recibe información de otras partes del encéfalo y conecta el sistema nervioso con el endocrino. Sus células neurosecretoras liberan hormonas que estimulan a la hipófisis anterior a secretar sus propias hormonas, como la TSH o la FSH y la LH, que a su vez actúan sobre otras glándulas como el tiroides o las gónadas. Además, la hipófisis posterior almacena y libera hormonas fabricadas en el hipotálamo, como la ADH y la oxitocina."},{"l":"b","m":5,"q":"Explique cómo se ajusta la frecuencia de ventilación durante el ejercicio.","hl":false,"pts":["la respiración celular aumenta en los músculos y produce más *CO₂*","el CO₂ forma ácido carbónico y baja el *pH* de la sangre","*quimiorreceptores* de la aorta / carótidas / bulbo raquídeo detectan la bajada de pH","envían impulsos al centro respiratorio del *bulbo raquídeo*","el bulbo envía impulsos por nervios al diafragma y a los músculos intercostales","contracciones más frecuentes / más intensas aumentan la frecuencia y la profundidad de la ventilación","se elimina más CO₂ y entra más O₂; el pH vuelve a la normalidad (retroalimentación negativa)","los receptores de estiramiento de los pulmones evitan la sobreinflación"],"mod":"Durante el ejercicio aumenta la respiración celular en los músculos, que producen más CO₂. Este forma ácido carbónico en la sangre y hace bajar el pH. Los quimiorreceptores de la aorta, de las arterias carótidas y del propio bulbo raquídeo detectan la bajada de pH y envían impulsos al centro respiratorio del bulbo. Desde allí salen impulsos nerviosos hacia el diafragma y los músculos intercostales, que se contraen con más frecuencia y más fuerza, así que aumentan la frecuencia y la profundidad de la ventilación. Así se elimina más CO₂, entra más O₂ y el pH vuelve a su valor normal, un ejemplo de retroalimentación negativa; los receptores de estiramiento de los pulmones impiden que se inflen en exceso."},{"l":"c","m":8,"q":"Compare y contraste el control nervioso y el control hormonal en la integración de los sistemas corporales, con un ejemplo de cada uno.","hl":false,"pts":["ambos coordinan / integran sistemas corporales y responden a estímulos","ambos usan *señales químicas* que se unen a receptores específicos (neurotransmisores / hormonas)","ambos están coordinados por el encéfalo / hipotálamo y pueden usar retroalimentación negativa","nervioso: impulsos eléctricos por neuronas / hormonal: hormonas transportadas por la sangre","nervioso: respuesta muy rápida (milisegundos) / hormonal: más lenta","nervioso: efecto breve / hormonal: efecto más duradero","nervioso: dirigido a células concretas (músculos / glándulas) / hormonal: afecta a todas las células con receptores, a menudo en varios órganos","nervioso: efectores son músculos y glándulas / hormonal: puede cambiar el metabolismo / crecimiento / desarrollo","ejemplo nervioso: arco reflejo de dolor / control de la frecuencia cardíaca por el bulbo","ejemplo hormonal: epinefrina prepara para la actividad / melatonina y el sueño / insulina y glucosa","trabajan juntos: p. ej. el sistema nervioso simpático estimula la liberación de epinefrina por las suprarrenales","el hipotálamo une ambos sistemas"],"mod":"Los sistemas nervioso y endocrino tienen la misma función general: integrar la actividad de los sistemas corporales y responder a los estímulos. Ambos usan señales químicas que se unen a receptores específicos de las células diana, neurotransmisores en las sinapsis y hormonas en el endocrino, y ambos están coordinados por el encéfalo, sobre todo el hipotálamo, y a menudo funcionan por retroalimentación negativa. Las diferencias son claras. El sistema nervioso transmite impulsos eléctricos a lo largo de neuronas, de modo que la respuesta es muy rápida, de milisegundos, breve y dirigida a células concretas, como un músculo o una glándula; un ejemplo es el arco reflejo que retira la mano de un objeto caliente. Las hormonas viajan por la sangre, así que la respuesta es más lenta pero más duradera y afecta a todas las células que tengan el receptor, a menudo en varios órganos; por ejemplo, la epinefrina aumenta a la vez la frecuencia cardíaca, la ventilación y la liberación de glucosa para preparar el cuerpo para la actividad. Los dos sistemas no son independientes: el sistema nervioso simpático estimula a las glándulas suprarrenales para que liberen epinefrina, y el hipotálamo conecta ambos."}],"hl":false,"mk":16,"mkSL":16},{"qid":3017,"p":"2X","t":"C2.2","also":["B2.1","C1.2"],"title":"Respuesta extensa: neuronas y membranas","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma la estructura de una neurona motora mielinizada y la función de sus partes.","hl":false,"pts":["*dendritas*: reciben señales de otras neuronas","cuerpo celular con núcleo: contiene la mayoría de los orgánulos / sintetiza proteínas","*axón*: prolongación larga que conduce el impulso lejos del cuerpo celular","vaina de *mielina* (células de Schwann): aísla el axón / aumenta la velocidad","nódulos de Ranvier: huecos en la mielina","terminaciones del axón / botones sinápticos: liberan neurotransmisor hacia el músculo"],"mod":"Una neurona motora tiene dendritas que reciben señales de otras neuronas y un cuerpo celular con el núcleo y la mayoría de los orgánulos, donde se sintetizan proteínas. De él sale un axón largo que conduce el impulso lejos del cuerpo celular, hasta el músculo. El axón está rodeado por una vaina de mielina formada por células de Schwann, que lo aísla y aumenta la velocidad del impulso, interrumpida por los nódulos de Ranvier. Al final, las terminaciones del axón liberan neurotransmisor en la sinapsis con la fibra muscular."},{"l":"b","m":4,"q":"Explique por qué los impulsos nerviosos viajan más rápido en unos axones que en otros.","hl":false,"pts":["los axones mielinizados conducen más rápido que los no mielinizados","la mielina aísla la membrana: los iones solo atraviesan en los *nódulos de Ranvier*","el impulso salta de un nódulo al siguiente en lugar de despolarizar toda la membrana","los axones de mayor *diámetro* conducen más rápido","menor resistencia al flujo de iones dentro del axón","ej.: axones mielinizados de mamífero unos 100 m s⁻¹ frente a ≈1 m s⁻¹ en axones finos sin mielina / axón gigante del calamar"],"mod":"La velocidad depende sobre todo de la mielinización y del diámetro del axón. En un axón mielinizado la vaina de mielina aísla la membrana, de modo que los iones solo pueden atravesarla en los nódulos de Ranvier; el impulso salta de un nódulo al siguiente en vez de despolarizar cada punto de la membrana, y por eso es mucho más rápido: unos 100 m s⁻¹ en axones mielinizados de mamífero, frente a cerca de 1 m s⁻¹ en axones finos sin mielina. Además, cuanto mayor es el diámetro del axón, menor es la resistencia al flujo de iones en su interior y más rápido viaja el impulso, como en el axón gigante del calamar, que compensa así la falta de mielina."},{"l":"c","m":8,"q":"Explique cómo la señalización neural depende de proteínas de membrana y del transporte a través de la membrana.","hl":false,"pts":["la *bomba de sodio-potasio* hace transporte activo: 3 Na⁺ fuera y 2 K⁺ dentro","usa *ATP* de la respiración celular","crea gradientes de concentración y el potencial de reposo (unos –70 mV)","canales de sodio *dependientes de voltaje* se abren y el Na⁺ entra por difusión facilitada: despolarización","canales de potasio dependientes de voltaje se abren y el K⁺ sale: repolarización","los canales son específicos de un ion","en la terminación presináptica se abren canales de *calcio* y entra Ca²⁺","las vesículas se fusionan con la membrana y liberan el neurotransmisor por *exocitosis* (fluidez de la membrana)","el neurotransmisor difunde y se une a *receptores* proteicos específicos de la membrana postsináptica","los receptores son canales controlados por ligando: entra Na⁺ y se produce un potencial postsináptico excitador","una enzima (acetilcolinesterasa) degrada el neurotransmisor / proteínas transportadoras lo recaptan","la bicapa de fosfolípidos es impermeable a los iones, por eso hacen falta proteínas"],"mod":"La bicapa de fosfolípidos es impermeable a los iones, así que toda la señalización neural depende de proteínas de membrana. La bomba de sodio-potasio hace transporte activo: con la energía de una molécula de ATP, producida en la respiración celular, saca tres iones Na⁺ y mete dos K⁺. Así crea gradientes de concentración y, junto con la mayor permeabilidad al K⁺, el potencial de reposo de unos –70 mV. Durante un potencial de acción se abren canales de sodio dependientes de voltaje, específicos para el Na⁺, que entra por difusión facilitada y despolariza la membrana; después se abren canales de potasio dependientes de voltaje y la salida de K⁺ repolariza. Cuando el impulso llega a la terminación presináptica, se abren canales de calcio y la entrada de Ca²⁺ hace que las vesículas se fusionen con la membrana, gracias a su fluidez, y liberen el neurotransmisor por exocitosis. El neurotransmisor difunde y se une a receptores proteicos específicos de la membrana postsináptica, que son canales controlados por ligando: al abrirse entra Na⁺ y se genera un potencial postsináptico excitador. Por último, una enzima como la acetilcolinesterasa degrada el neurotransmisor, o proteínas transportadoras lo recaptan, para que la señal termine."}],"hl":false,"mk":16,"mkSL":16},{"qid":3018,"p":"1B","t":"C1.3","also":["C1.1"],"title":"Discos de hoja que flotan","blocks":[{"k":"p","v":"Se cortaron discos de hojas de espinaca, se les extrajo el aire con una jeringa y se colocaron en una solución de hidrogenocarbonato de sodio (fuente de CO₂), donde se hundieron. Se iluminaron con una lámpara a distintas distancias y se midió el tiempo que tardaba cada disco en flotar. Se usaron 10 discos por distancia."},{"k":"table","cap":"Tiempo hasta que flotan los discos","rows":[["Distancia a la lámpara / cm","Tiempo medio / s","Desviación estándar / s"],["10","180","25"],["20","250","30"],["30","400","70"],["40","640","160"]]},{"k":"chart","type":"bar","title":"Tiempo medio hasta que flotan los discos","x":"Distancia a la lámpara / cm","y":"Tiempo medio / s","s":[{"n":"Tiempo medio","pts":[["10",180],["20",250],["30",400],["40",640]]}]}],"parts":[{"l":"a","m":1,"q":"Indique la variable independiente de este experimento.","hl":false,"pts":["la distancia a la lámpara / la *intensidad de la luz*"],"mod":""},{"l":"b","m":2,"q":"Calcule la velocidad de fotosíntesis a 20 cm, usando velocidad = 1/tiempo.","hl":false,"pts":["1 ÷ 250","= 0,004 s⁻¹ / 4,0 × 10⁻³ s⁻¹ (unidades necesarias)"],"mod":""},{"l":"c","m":2,"q":"Explique por qué los discos acaban flotando.","hl":false,"pts":["la fotosíntesis produce *oxígeno*","el oxígeno se acumula en los espacios aéreos del mesófilo esponjoso","la densidad del disco disminuye / se hace menor que la de la solución","cuanto más rápida la fotosíntesis, antes flota el disco"],"mod":""},{"l":"d","m":2,"q":"Deduzca, usando las desviaciones estándar, si la diferencia entre 10 cm y 20 cm es probablemente significativa.","hl":false,"pts":["10 cm: 155–205 s; 20 cm: 220–280 s (media ± DE)","los intervalos no se solapan","así que la diferencia probablemente es significativa / habría que confirmarlo con una prueba estadística (prueba t)"],"mod":""},{"l":"e","m":2,"q":"Sugiera dos mejoras del método para que los resultados sean más fiables.","hl":false,"pts":["usar un filtro de calor / un recipiente con agua entre la lámpara y los discos, porque la lámpara cercana calienta","controlar la temperatura con un baño de agua / termómetro","medir la intensidad luminosa con un luxómetro en lugar de la distancia","hacer el experimento a oscuras / sin otra luz de la sala","usar discos de la misma hoja / de hojas de la misma edad y la misma concentración de hidrogenocarbonato","más discos o más repeticiones a 40 cm, donde la variabilidad es muy grande"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3019,"p":"1B","t":"C4.1","also":["C1.2"],"title":"Crecimiento de una población de levaduras","blocks":[{"k":"p","v":"Se inoculó levadura en un matraz cerrado con 100 cm³ de solución de glucosa a 25 °C. Cada día se agitó el matraz, se tomó una muestra y se contaron las células con un hemocitómetro."},{"k":"chart","type":"line","title":"Población de levaduras en el matraz","x":"Tiempo / días","y":"Densidad de células / 10⁶ células cm⁻³","s":[{"n":"Levaduras","pts":[[0,0.5],[1,1.2],[2,3.0],[3,7.5],[4,14.0],[5,19.0],[6,21.5],[7,22.0],[8,22.0]]}]}],"parts":[{"l":"a","m":1,"q":"Estime la capacidad de carga de este matraz.","hl":false,"pts":["22 × 10⁶ células cm⁻³ (aceptar 21,5–22)"],"mod":""},{"l":"b","m":2,"q":"Calcule la velocidad media de crecimiento de la población entre el día 2 y el día 4.","hl":false,"pts":["(14,0 − 3,0) ÷ 2","= 5,5 × 10⁶ células cm⁻³ día⁻¹"],"mod":""},{"l":"c","m":3,"q":"Explique la forma de la curva entre el día 4 y el día 8.","hl":false,"pts":["el crecimiento se frena y la población llega a una meseta","actúan factores *dependientes de la densidad*","se agota la glucosa / competencia intraespecífica por la glucosa","se acumula etanol / productos tóxicos de la respiración celular anaeróbica","la tasa de natalidad (división) iguala a la tasa de mortalidad"],"mod":"Hasta el día 4 la población crece rápidamente, pero entre los días 4 y 8 el crecimiento se frena y se alcanza una meseta de unos 22 × 10⁶ células cm⁻³. Al aumentar la densidad actúan factores dependientes de la densidad: las levaduras compiten por una cantidad limitada de glucosa y, como el matraz está cerrado, se acumula etanol de la respiración celular anaeróbica, que es tóxico. Por eso la tasa de división baja y la de mortalidad sube hasta igualarse, y la población se mantiene en la capacidad de carga."},{"l":"d","m":2,"q":"Sugiera cómo podría mejorarse la fiabilidad de los recuentos con el hemocitómetro.","hl":false,"pts":["contar varios cuadrados y calcular la media","tomar varias muestras / repetir con varios matraces","agitar bien antes de tomar la muestra para que las células estén repartidas","diluir las muestras muy densas para poder contar las células","teñir con azul de metileno para distinguir células vivas y muertas"],"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":3020,"p":"1B","t":"C3.2","also":["D4.1"],"title":"Discos de antibiótico y zonas de inhibición","blocks":[{"k":"p","v":"Se extendió una bacteria sobre placas de agar y en cada placa se colocaron cuatro discos de papel de 6 mm de diámetro, cada uno empapado en un antibiótico distinto (P, Q, R y S) a la misma concentración. Tras 48 horas a 30 °C se midió el diámetro de la zona clara alrededor de cada disco en cinco placas."},{"k":"table","cap":"Diámetro de la zona clara / mm","rows":[["Antibiótico","Placa 1","Placa 2","Placa 3","Placa 4","Placa 5","Media","Desviación estándar"],["P","24","26","23","25","27","25,0","1,6"],["Q","12","15","10","14","14","13,0","2,0"],["R","18","20","17","21","19","?","1,6"],["S","6","6","6","6","6","6,0","0,0"]]}],"parts":[{"l":"a","m":1,"q":"Identifique la variable dependiente.","hl":false,"pts":["el diámetro de la zona clara / zona de inhibición"],"mod":""},{"l":"b","m":1,"q":"Calcule la media del diámetro para el antibiótico R.","hl":false,"pts":["95 ÷ 5 = 19,0 mm"],"mod":""},{"l":"c","m":2,"q":"Evalúe la conclusión de que P es más eficaz que R contra esta bacteria.","hl":false,"pts":["media ± DE: P 23,4–26,6 mm, R 17,4–20,6 mm; no se solapan, así que la diferencia probablemente es significativa","apoya la conclusión: zona mayor = más bacterias inhibidas / muertas","pero el tamaño de la zona también depende de lo rápido que difunda cada antibiótico en el agar (tamaño molecular)","solo se probó una concentración / una cepa / in vitro, no en un paciente"],"mod":""},{"l":"d","m":2,"q":"Sugiera dos razones por las que no hay zona clara alrededor del disco S.","hl":false,"pts":["la bacteria es *resistente* a S (p. ej. tiene un gen / enzima que lo inactiva)","S actúa sobre una estructura / ruta que esta bacteria no tiene","S no difunde por el agar / el disco no absorbió el antibiótico","S se degradó / estaba caducado a 30 °C durante 48 h"],"mod":""},{"l":"e","m":2,"q":"Describa un control adecuado y una variable que deba mantenerse constante.","hl":false,"pts":["control: disco empapado en agua estéril / en el disolvente sin antibiótico","muestra que el disco o el disolvente por sí solos no inhiben a la bacteria","variable constante: concentración del antibiótico / tamaño del disco / volumen absorbido","o: temperatura y tiempo de incubación / densidad del cultivo extendido / grosor del agar"],"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":3021,"p":"2X","t":"D3.2","also":["D4.1"],"title":"Respuesta extensa: alelos, genes y ambiente","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Resuma la herencia de los grupos sanguíneos ABO.","pts":["el gen tiene *alelos múltiples*: Iᴬ, Iᴮ e i","Iᴬ e Iᴮ son *codominantes*: en el heterocigoto IᴬIᴮ se expresan ambos (grupo AB)","i es recesivo frente a Iᴬ e Iᴮ","grupo A = IᴬIᴬ o Iᴬi; grupo B = IᴮIᴮ o Iᴮi; grupo O = ii","los alelos determinan los antígenos de la superficie de los glóbulos rojos","ejemplo: Iᴬi × Iᴮi puede dar hijos de los cuatro grupos (A, B, AB y O) en proporción 1:1:1:1"],"mod":"El grupo sanguíneo ABO está controlado por un gen con alelos múltiples: Iᴬ, Iᴮ e i, que determinan los antígenos de la superficie de los glóbulos rojos. Iᴬ e Iᴮ son codominantes, de modo que el heterocigoto IᴬIᴮ expresa ambos antígenos y es del grupo AB, mientras que i es recesivo. Así, el grupo A puede ser IᴬIᴬ o Iᴬi, el B IᴮIᴮ o Iᴮi, y el O solo ii. Por ejemplo, unos padres Iᴬi e Iᴮi pueden tener hijos de los cuatro grupos en proporción 1:1:1:1."},{"l":"b","m":5,"hl":false,"q":"Explique cómo un alelo recesivo causa la fenilcetonuria (PKU) y cómo se trata esta enfermedad.","pts":["la PKU es una enfermedad *autosómica recesiva*","se debe a un alelo mutado del gen de la enzima que convierte la fenilalanina (en tirosina)","los homocigotos recesivos no producen enzima funcional","la *fenilalanina* se acumula en la sangre y los tejidos","daña el desarrollo del cerebro / causa discapacidad intelectual","los heterocigotos son *portadores* sanos: un alelo funcional produce suficiente enzima","se detecta en recién nacidos con una prueba de sangre del talón","se trata con una *dieta* baja en fenilalanina (el ambiente modifica el fenotipo)"],"mod":"La fenilcetonuria es una enfermedad autosómica recesiva causada por un alelo mutado del gen de la enzima que transforma la fenilalanina en tirosina. Los homocigotos recesivos no producen enzima funcional, así que la fenilalanina se acumula en la sangre y daña el desarrollo del cerebro, causando discapacidad intelectual. Los heterocigotos son portadores sanos porque su alelo funcional produce suficiente enzima. La enfermedad se detecta en recién nacidos con una prueba de sangre del talón y se trata con una dieta baja en fenilalanina, lo que evita los síntomas: un ejemplo de cómo el ambiente modifica el fenotipo."},{"l":"c","m":7,"hl":false,"q":"Discuta la influencia relativa de los genes y del ambiente en el fenotipo.","pts":["el *fenotipo* resulta de la interacción del genotipo con el ambiente","algunos rasgos dependen casi solo del genotipo, como el grupo sanguíneo ABO","otros, aunque sean de origen genético, se modifican con el ambiente: la PKU se evita con la dieta","la *variación continua* (estatura, color de piel) es *poligénica*: muchos genes con efectos aditivos","y además depende del ambiente: la estatura de la nutrición, el color de la piel de la exposición a la radiación UV","*plasticidad fenotípica*: un mismo genotipo produce fenotipos distintos en ambientes distintos","los cambios por plasticidad no se heredan porque no cambian los alelos","los gemelos idénticos tienen el mismo genotipo, así que sus diferencias se deben al ambiente","la selección natural actúa sobre el fenotipo, pero solo la variación genética se hereda y permite la evolución","conclusión: la importancia relativa varía según el rasgo"],"mod":"El fenotipo es el resultado de la interacción entre el genotipo y el ambiente, pero el peso de cada uno varía según el rasgo. Algunos, como el grupo sanguíneo ABO, dependen casi por completo del genotipo. Otros tienen origen genético pero el ambiente puede modificarlos: la fenilcetonuria se debe a dos alelos recesivos, pero una dieta baja en fenilalanina evita sus síntomas. Los rasgos de variación continua, como la estatura o el color de la piel, son poligénicos, porque muchos genes suman sus efectos, y además dependen del ambiente: la estatura de la nutrición y el color de la piel de la exposición a la radiación UV. La plasticidad fenotípica muestra que un mismo genotipo puede producir fenotipos distintos según el ambiente, y los gemelos idénticos, con el mismo genotipo, difieren por factores ambientales. Estos cambios no se heredan porque no alteran los alelos; por eso, aunque la selección natural actúa sobre el fenotipo, solo la variación genética contribuye a la evolución."}],"hl":false,"mk":16,"mkSL":16},{"qid":3022,"p":"2X","t":"D3.1","also":["C3.1"],"title":"Respuesta extensa: reproducción humana","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Distinga entre la reproducción sexual y la asexual.","pts":["asexual: un solo progenitor; sexual: normalmente dos progenitores","sexual: produce *gametos* por meiosis que se unen en la *fecundación*; asexual: sin gametos, por mitosis","asexual: descendencia genéticamente idéntica (*clones*); sexual: descendencia genéticamente variada","asexual: más rápida / necesita menos energía / no hace falta encontrar pareja","sexual: la variación favorece la adaptación a ambientes cambiantes","asexual: ventajosa en ambientes estables"],"mod":"En la reproducción asexual hay un solo progenitor y la descendencia se produce por mitosis, sin gametos, de modo que es genéticamente idéntica: son clones. En la reproducción sexual suele haber dos progenitores que producen gametos por meiosis, y estos se unen en la fecundación, generando descendencia genéticamente variada. La reproducción asexual es más rápida y no requiere encontrar pareja, lo que es ventajoso en ambientes estables, mientras que la variación de la reproducción sexual favorece la adaptación a ambientes cambiantes."},{"l":"b","m":5,"hl":false,"q":"Describa los acontecimientos de la fecundación en los seres humanos.","pts":["los espermatozoides nadan por el útero hasta el *oviducto*, donde suele estar el ovocito","un espermatozoide llega a la capa que rodea al ovocito / *zona pelúcida*","*reacción acrosómica*: enzimas del acrosoma digieren la zona pelúcida","el espermatozoide se une a receptores de la membrana del ovocito","las *membranas* del espermatozoide y del ovocito se fusionan y el núcleo del espermatozoide entra","se combinan los cromosomas de ambos gametos / se forma un *cigoto* diploide"],"mod":"Tras la eyaculación, los espermatozoides nadan por el útero hasta el oviducto, donde suele encontrarse el ovocito. Cuando un espermatozoide llega a la zona pelúcida que rodea al ovocito, se produce la reacción acrosómica: el acrosoma libera enzimas que digieren esa capa y abren paso. El espermatozoide se une a receptores de la membrana del ovocito, ambas membrana
