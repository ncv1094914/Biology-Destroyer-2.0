<style>
:root{--bg:#EEF4F1;--surface:#fff;--surface2:#F6FAF8;--ink:#11211C;--muted:#56685F;--line:#D5E2DB;--brand:#0B7A63;--brand-ink:#fff;--pop:#FFC21A;--pop-ink:#3A2A00;--good:#12A150;--bad:#E5383B;--warn:#C98A00;--tA:#2E63F0;--tB:#14A04F;--tC:#EE7F00;--tD:#E0315C;

:root[data-theme=dark]{--bg:#0B1513;--surface:#13221E;--surface2:#182A25;--ink:#E7F2EC;--muted:#99B0A6;--line:#263B34;--brand:#23B48F;--brand-ink:#04140F;--pop:#FFCB3D;--good:#33C873;--bad:#FF5C5F;--warn:#F2B53A}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo b{display:block;font-size:18px;font-weight:900;letter-spacing:-.01em}.logo small{display:block;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button,.seg button{border:2px solid transparent;background:none;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--muted)}
nav button[aria-current=page]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:2px;background:var(--surface2)}
.seg button{padding:4px 10px;font-size:14px}.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
main{padding:18px 0 60px}
h1{font-size:30px;line-height:1.15;margin:4px 0 8px;letter-spacing:-.02em}h2{font-size:22px;margin:22px 0 10px}h3{margin:0 0 6px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.tip{font-size:14px;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:900}
.btn.pop{background:var(--pop);color:var(--pop-ink);border-color:var(--pop)}.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{border-color:var(--line)}.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}@media(max-width:760px){.hero{grid-template-columns:1fr}}
.steps{margin:8px 0 0;padding-left:20px}.steps li{margin:4px 0;font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],input[type=text],input[type=number],select,textarea{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.5;font-weight:600}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-left-width:8px;border-radius:14px;padding:10px 12px}
.item:hover{border-color:var(--brand)}
.item .sw{font:900 13px var(--mono);border-radius:8px;padding:4px 7px;background:var(--surface2)}
.item .tt{font-weight:800}.item .sub{font-size:13px;color:var(--muted);font-weight:600}
.item .sc{font:800 14px var(--mono);color:var(--muted)}
.tA{border-left-color:var(--tA)}.tB{border-left-color:var(--tB)}.tC{border-left-color:var(--tC)}.tD{border-left-color:var(--tD)}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.intro{font-weight:600}

.dcap{font-weight:800;font-size:14px;margin-top:8px}.tscroll{overflow-x:auto}

.counter{font:800 13px var(--mono);color:var(--muted);margin-top:4px}.counter.ok{color:var(--good)}.counter.low{color:var(--warn)}
.planner{margin:8px 0;border:2px dashed var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.planner summary{cursor:pointer;font-weight:800}
.idea{display:flex;gap:6px;margin:6px 0}.idea select{width:auto;flex:none}.idea input{flex:1}
.res{margin:12px 0;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.res .rh{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface2);font-weight:800}
.res .rb{padding:10px 12px}
.est{font:900 16px var(--mono)}
.pt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:10px;margin:2px 0;cursor:pointer}
.pt input{margin-top:5px;width:18px;height:18px;flex:none}
.pt .tag{flex:none;font:800 11px var(--mono);border-radius:6px;padding:2px 6px;margin-top:2px}
.pt.g .tag{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pt.p .tag{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.pt.n .tag{background:var(--surface2);color:var(--muted)}
.pt.on{background:color-mix(in srgb,var(--good) 10%,transparent)}
u.kw{text-decoration:none;background:color-mix(in srgb,var(--pop) 38%,transparent);border-radius:4px;padding:0 3px;font-weight:800}
.flag{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;margin:6px 0;font-weight:700;font-size:14px}
.flag.w{background:color-mix(in srgb,var(--warn) 14%,transparent)}.flag.o{background:color-mix(in srgb,var(--good) 12%,transparent)}
.yours{white-space:pre-wrap;border-left:4px solid var(--brand);padding:6px 10px;margin:6px 0 10px;background:var(--surface2);border-radius:8px;font-weight:600}
mark.hit{background:color-mix(in srgb,var(--good) 25%,transparent);color:inherit;border-radius:3px}
details.mod{margin-top:8px;border:2px dashed var(--line);border-radius:10px;padding:8px 10px}details.mod summary{cursor:pointer;font-weight:800}
.scorebar{position:sticky;bottom:10px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;margin-top:14px;flex-wrap:wrap;z-index:3}
.scorebar b{font:900 22px var(--mono)}
.ai{border:2px solid var(--brand);border-radius:16px;padding:14px;margin-top:16px;background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.ai textarea{font:500 12.5px/1.45 var(--mono);height:140px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:20;box-shadow:var(--sh)}
.bars .r{margin:8px 0}.bars .bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:3px}.bars .bar i{display:block;height:100%;background:var(--brand)}
.timer{font:900 18px var(--mono);background:var(--ink);color:var(--bg);border-radius:10px;padding:4px 10px}.timer.low{background:var(--bad)}
footer{font-size:12.5px;color:var(--muted);text-align:center;padding:24px 16px 40px;font-weight:600}
.sr{position:absolute;left:-9999px}
@media(max-width:640px){header{position:static}.hdr{gap:8px}nav{margin-left:0}h1{font-size:25px}}
@media print{header,nav,.scorebar,.ai,footer,.btn{display:none!important}}

 change","hl":false}],"ct":[["Define","Write the exact meaning of a term, in one or two sentences.",1],["Draw","Make a neat, accurate, labelled diagram or graph in pencil, with ruled straight lines.",1],["Label","Write the names of parts on a diagram you are given.",1],["List","Write several short answers, one after another, with no explanation.",1],["Measure","Find a value using a ruler, scale or instrument.",1],["State","Give a short answer, such as a name or a number, with no explanation.",1],["Annotate","Add short notes to a diagram or graph to explain parts of it.",2],["Calculate","Work out a number and show the steps of your working.",2],["Describe","Give a detailed account of what something is like or what happens.",2],["Distinguish","Point out the differences between two or more things.",2],["Estimate","Work out an approximate value.",2],["Identify","Pick out the right answer from several possibilities.",2],["Outline","Give a short summary of the main points.",2],["Analyse","Break information down to show its key parts or patterns.",3],["Comment","Give your judgement on a statement or on the result of a calculation.",3],["Compare","Show how two or more things are similar, mentioning each of them in every point.",3],["Compare and contrast","Show both similarities and differences, mentioning each item in every point.",3],["Construct","Present information as a diagram, table or logical sequence.",3],["Deduce","Reach a conclusion using the information you are given.",3],["Design","Plan an experiment, model or procedure.",3],["Determine","Find the one possible answer.",3],["Discuss","Give a balanced review of several arguments or factors, then a supported conclusion.",3],["Evaluate","Judge something by weighing its strengths against its weaknesses.",3],["Explain","Give a detailed account that includes reasons or causes (\"because…\").",3],["Justify","Give reasons or evidence that support your answer.",3],["Predict","Say what result you expect.",3],["Sketch","Draw a rough diagram or graph that shows the general shape and key features.",3],["Suggest","Propose a possible answer, hypothesis or solution, even if there could be others.",3]],"wr":[{"qid":205,"p":"1B","t":"A2.2","also":["B2.2"],"title":"Measuring organelles","blocks":[{"k":"p","v":"A student examined an electron micrograph of a liver cell. The scale bar on the micrograph is 25 mm long and represents 1 µm. A mitochondrion in the micrograph measures 50 mm long."},{"k":"table","cap":"Number of mitochondria per cell in three human cell types","rows":[["Cell type","Mean number of mitochondria per cell"],["Liver cell","1800"],["Skin (epidermis) cell","300"],["Heart muscle cell","5000"]]}],"parts":[{"l":"a","m":2,"q":"Calculate the actual length of the mitochondrion, showing your working.","pts":["working: actual length = measured length ÷ magnification / 50 mm ÷ 25 mm = 2 scale bars / 50 000 µm ÷ 25 000","actual length = 2 *µm* (unit required; accept 2.0 µm / 0.002 mm / 2 × 10⁻⁶ m)"],"mod":"","hl":false},{"l":"b","m":1,"q":"Calculate the magnification of the micrograph.","pts":["magnification = length of scale bar ÷ length it represents = 25 mm ÷ 1 µm = 25 000 µm ÷ 1 µm = ×25 000 (accept 2.5 × 10⁴; no units)"],"mod":"","hl":false},{"l":"c","m":2,"q":"Suggest reasons for the difference in the number of mitochondria between heart muscle cells and skin cells.","pts":["heart muscle cell has 5000 mitochondria compared with 300 in the skin cell / about 17 times more (use of data from the table)","heart muscle contracts continuously / throughout life, so it has a very high demand for energy / *ATP*","mitochondria produce ATP by *aerobic cell respiration*, so more mitochondria allow more ATP to be produced","skin cells have lower metabolic activity / do not contract / need less ATP, so fewer mitochondria are sufficient"],"mod":"","hl":false},{"l":"d","m":3,"q":"Outline evidence that mitochondria evolved from free-living prokaryotes.","pts":["they have their own *DNA*, which is circular and naked / without histones, as in prokaryotes","they have *70S* ribosomes, the same size as those of prokaryotes (not 80S as in eukaryotic cytoplasm)","they have a *double membrane*, consistent with a prokaryote being engulfed by endocytosis by a larger cell","they are only formed by division of pre-existing mitochondria, by a process similar to *binary fission*","they are similar in size / shape to bacteria","they transcribe their DNA and synthesise some of their own proteins / are sensitive to antibiotics that affect bacteria"],"mod":"Mitochondria have their own DNA, which is circular and naked like that of prokaryotes, and 70S ribosomes, the same size as bacterial ribosomes and different from the 80S ribosomes of the cytoplasm. They are surrounded by a double membrane, which is consistent with an aerobic prokaryote having been engulfed by endocytosis by a larger cell. In addition, they only arise by division of other mitochondria, by a process similar to binary fission, and they are similar in size to bacteria. All of this supports the endosymbiotic theory.","hl":true}],"hl":false,"mk":8,"mkSL":5},{"qid":206,"p":"1B","t":"B2.1","also":["D2.3"],"title":"Beetroot membranes and temperature","blocks":[{"k":"p","v":"Discs of beetroot were placed in water at different temperatures for 30 minutes. The red pigment leaks out when membranes are damaged. The absorbance of the water was measured with a colorimeter (higher absorbance = more pigment)."},{"k":"chart","type":"line","title":"Pigment released at different temperatures","x":"Temperature / °C","y":"Absorbance / AU","s":[{"n":"Mean absorbance","pts":[["10",0.05],["20",0.06],["30",0.08],["40",0.15],["50",0.42],["60",0.81],["70",0.95]]}]}],"parts":[{"l":"a","m":1,"q":"State the 10 °C temperature interval over which absorbance increased most.","pts":["from *50 to 60 °C* (increase of 0.39 AU) / accept \"40 to 60 °C\" only if both absorbance values are quoted"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain the trend shown above 40 °C.","pts":["absorbance rises steeply, from 0.15 AU at 40 °C to 0.95 AU at 70 °C, because more pigment leaks out","at higher temperature phospholipids have more kinetic energy / the bilayer becomes more *fluid* and more permeable","membrane *proteins* are *denatured* / lose their three-dimensional shape","gaps form in the membrane / the membrane loses its integrity / is no longer selectively permeable","pigment *diffuses* out of the vacuole and the cell into the water (crossing the tonoplast and the plasma membrane)","the increase levels off between 60 and 70 °C because nearly all membranes are already damaged / little pigment is left to leak"],"hl":false,"mod":"Above 40 °C absorbance rises steeply, from 0.15 AU to 0.95 AU at 70 °C, showing that more and more pigment is leaking out. As temperature rises the phospholipids gain kinetic energy, so the bilayer becomes more fluid and permeable. Membrane proteins are also denatured and gaps appear, so the membrane is no longer selectively permeable. The pigment then diffuses from the vacuole into the water. Between 60 and 70 °C the increase is smaller because nearly all membranes are already damaged."},{"l":"c","m":2,"q":"Identify two variables that should be kept constant in this investigation.","pts":["size / surface area / mass / number of discs","volume of water in each tube","time of immersion (30 minutes)","same beetroot / same part and age of the root","rinsing of the discs beforehand to remove pigment from cut cells","same wavelength / same filter in the colorimeter"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Suggest how the reliability of the results could be improved.","pts":["*repeat* each temperature several times (at least three replicates) and calculate the *mean*","identify and discard anomalous results / calculate the standard deviation to assess variation","use a thermostatically controlled water bath to keep each temperature constant","zero the colorimeter with distilled water before each reading","stir or mix the water before sampling so that the pigment is evenly distributed"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":207,"p":"1B","t":"B3.1","also":["B3.2"],"title":"Stomatal density in sun and shade leaves","blocks":[{"k":"p","v":"Nail-varnish impressions were taken of the lower surface of leaves from the same tree. Stomata were counted in fields of view with an area of 0.2 mm²."},{"k":"table","cap":"Stomata counted per field of view","rows":[["Leaf","Count 1","Count 2","Count 3","Count 4","Mean"],["Sun leaf","46","52","49","53","50"],["Shade leaf","31","27","30","28","?"]]}],"parts":[{"l":"a","m":1,"q":"Calculate the mean count for the shade leaf.","pts":["(31 + 27 + 30 + 28) ÷ 4 = *29* (stomata per field of view)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calculate the stomatal density of the sun leaf in stomata per mm². Show your working.","pts":["density = mean count ÷ area of field of view = 50 ÷ 0.2","= *250* stomata mm⁻² (unit required)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Suggest one advantage and one disadvantage of a high stomatal density for sun leaves.","pts":["advantage: more *CO₂* enters by diffusion / faster gas exchange","advantage: allows a higher rate of *photosynthesis* when light intensity is high / CO₂ is not the limiting factor","advantage: more transpiration, which cools the leaf exposed to the sun","disadvantage: more water (vapour) is lost by *transpiration*","disadvantage: greater risk of wilting / dehydration if the soil is dry (max 1 for advantage and max 1 for disadvantage)"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Explain how transpiration helps to move water up the stem.","pts":["water *evaporates* from the moist walls of mesophyll cells and the vapour diffuses out through the stomata","the water lost is replaced from the xylem in the leaf, which draws water by capillary action in the cell walls","*tension* / negative pressure is generated in the xylem vessels","*cohesion* between water molecules, due to hydrogen bonds, maintains a continuous column","the column of water is pulled upwards from the root (transpiration stream), without energy expenditure by the plant","adhesion of water to the xylem walls helps to prevent the column from breaking","xylem walls are thickened with lignin, so they withstand the tension without collapsing"],"hl":false,"mod":"Water evaporates from the moist walls of mesophyll cells and the vapour diffuses out through the stomata. This water is replaced from the xylem in the leaf, which generates tension (negative pressure) in the xylem vessels. Because water molecules are held together by cohesion, due to hydrogen bonds, they form a continuous column that is pulled upwards from the root without the plant using energy. Adhesion to the walls and lignin, which stops the vessel collapsing, maintain the column."}],"hl":false,"mk":8,"mkSL":8},{"qid":208,"p":"1B","t":"C1.1","also":["B1.2"],"title":"Catalase and pH","blocks":[{"k":"p","v":"Catalase extracted from potato was added to hydrogen peroxide at different pH values. The volume of oxygen collected in 2 minutes was recorded."},{"k":"chart","type":"bar","title":"Oxygen produced by catalase at different pH","x":"pH","y":"Volume of oxygen / cm³","s":[{"n":"Mean volume","pts":[["4",3.1],["5",7.8],["6",13.5],["7",16.2],["8",12.0],["9",4.4]]}]}],"parts":[{"l":"a","m":1,"q":"State the optimum pH of this catalase.","pts":["pH *7*"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calculate the mean rate of oxygen production at pH 6, in cm³ per minute.","pts":["working: 13.5 cm³ ÷ 2 min","= 6.75 cm³ min⁻¹ (accept 6.8; unit required)"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain why the volume of oxygen is lower at pH 4 than at pH 7.","pts":["pH 7 is the *optimum* pH of catalase / 3.1 cm³ is produced at pH 4 compared with 16.2 cm³ at pH 7","at pH 4 the higher concentration of H⁺ ions disrupts the ionic / hydrogen bonds that maintain the structure of the enzyme","the shape / chemical properties of the *active site* change","the enzyme is (partly or fully) *denatured*","the substrate / hydrogen peroxide no longer binds well to the active site, so fewer enzyme–substrate complexes form","the rate of reaction falls, so less hydrogen peroxide is broken down / less oxygen is released in the 2 minutes"],"hl":false,"mod":"pH 7 is the optimum for this catalase (16.2 cm³ of oxygen compared with only 3.1 cm³ at pH 4). At pH 4 the concentration of H⁺ ions is much higher and these disrupt the ionic and hydrogen bonds that hold the tertiary structure of the enzyme. As a result the shape of the active site changes, so the enzyme is partly denatured. Hydrogen peroxide no longer fits the active site well, fewer enzyme–substrate complexes form per unit time and the rate of reaction falls, so less oxygen is released in 2 minutes."},{"l":"d","m":2,"q":"Suggest limitations of measuring oxygen by counting bubbles instead of collecting the gas.","pts":["bubbles differ in size / volume, so the number of bubbles is not proportional to the volume of gas","it is difficult to count accurately when bubbles are released quickly / bubbles may be missed (human error)","no volume in cm³ is obtained / the measurement is less precise than with a gas syringe or inverted measuring cylinder","some bubbles may merge or stay attached to the tissue / the container"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":209,"p":"1B","t":"C1.2","also":["C1.3"],"title":"Respirometer with germinating seeds","blocks":[{"k":"p","v":"A respirometer contained germinating peas and potassium hydroxide (which absorbs CO₂). A drop of coloured liquid in a capillary tube moved towards the peas as oxygen was used."},{"k":"table","cap":"Distance moved by the drop in 10 minutes","rows":[["Temperature / °C","Distance / mm (trial 1)","Distance / mm (trial 2)","Distance / mm (trial 3)"],["15","12","14","13"],["25","26","25","27"],["35","41","43","39"]]}],"parts":[{"l":"a","m":1,"q":"Calculate the mean distance moved by the drop at 25 °C.","pts":["(26 + 25 + 27) ÷ 3 = *26 mm* (unit required)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Explain why the drop moves towards the peas.","pts":["the peas use *oxygen* in aerobic cell respiration","the carbon dioxide they produce is absorbed by the potassium hydroxide / does not replace the oxygen used","the volume / pressure of gas inside the respirometer decreases","the now higher atmospheric pressure outside pushes the drop towards the peas"],"hl":false,"mod":""},{"l":"c","m":2,"q":"The capillary tube has a cross-sectional area of 0.8 mm². Calculate the volume of oxygen used per minute at 35 °C.","pts":["mean distance = (41 + 43 + 39) ÷ 3 = 41 mm; volume = 41 mm × 0.8 mm² = 32.8 mm³","32.8 ÷ 10 min = 3.28 mm³ min⁻¹ (accept 3.3; unit required)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Describe a suitable control for this experiment.","pts":["the same set-up without living organisms: with dead (boiled) seeds / with glass beads instead of peas","with the same mass / volume of material and the same amount of potassium hydroxide, at the same temperatures and for 10 minutes","shows any movement of the drop caused by changes in temperature / pressure rather than by respiration","the control distance is subtracted from / used to correct the distance measured with the germinating peas"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Predict, with a reason, the effect of using pea seeds that are not germinating.","pts":["the drop would move a (much) smaller distance / would hardly move","dry / dormant seeds have a very low rate of respiration / metabolism, so they use little oxygen","germination needs much ATP for growth / cell division, which explains the higher oxygen use of germinating seeds","without absorbed water the enzymes in the seed are inactive"],"hl":false,"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":210,"p":"1B","t":"C4.1","also":["B4.2"],"title":"Two species on a rocky shore","blocks":[{"k":"p","v":"Ecologists placed 100 random quadrats on a rocky shore and recorded whether two species of seaweed were present."},{"k":"table","cap":"Number of quadrats","rows":[["","Species B present","Species B absent","Total"],["Species A present","12","38","50"],["Species A absent","28","22","50"],["Total","40","60","100"]]}],"parts":[{"l":"a","m":2,"q":"Calculate the expected number of quadrats with both species if there were no association.","pts":["(row total × column total) ÷ grand total = (50 × 40) ÷ 100","= 20 (quadrats)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"State the null hypothesis for a chi-squared test on these data.","pts":["there is no *association* between species A and species B / the two species are distributed *independently* of each other"],"hl":false,"mod":""},{"l":"c","m":2,"q":"The calculated χ² value is 10.7. The critical value at p = 0.05 with 1 degree of freedom is 3.84. Deduce what the result shows.","pts":["the calculated value (10.7) is greater than the critical value (3.84), so the null hypothesis is *rejected*","there is a *significant* association between the two species at the 5% level / the probability that the difference is due to chance is less than 0.05","the association is *negative*: 12 quadrats with both species were observed compared with 20 expected / the species tend not to occur together"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Suggest reasons for the association between the two species.","pts":["interspecific *competition* for a resource such as attachment space on the rock / light","one species excludes the other from areas where both could live (competitive exclusion)","they have different tolerances of abiotic factors such as desiccation / wave action / temperature, so they occupy different zones of the shore","a herbivore feeding on one species is more abundant where the other grows / one species releases substances that inhibit the other"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Explain why the quadrats must be placed at random.","pts":["to avoid investigator *bias* in choosing areas, so that the sample is representative of the whole shore","every point in the area has an equal chance of being sampled, which is required for the chi-squared test to be valid"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":211,"p":"1B","t":"C2.2","also":["C3.1"],"title":"Recording an action potential","blocks":[{"k":"p","v":"An electrode inside a giant axon recorded the membrane potential after a stimulus."},{"k":"chart","type":"line","title":"Membrane potential after a stimulus","x":"Time / ms","y":"Membrane potential / mV","s":[{"n":"Potential","pts":[["0",-70.0],["0.5",-70.0],["1",-55.0],["1.5",30.0],["2",10.0],["2.5",-60.0],["3",-80.0],["3.5",-75.0],["4",-70.0],["5",-70.0]]}]}],"parts":[{"l":"a","m":1,"q":"State the resting potential of the axon.","pts":["*–70 mV* (sign and unit required)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain the change in potential between 1 ms and 1.5 ms.","pts":["the membrane potential rises from –55 mV to +30 mV / the polarity of the membrane is reversed","at 1 ms the *threshold* potential (about –55 mV) is reached","*voltage-gated* sodium channels open","Na⁺ ions *diffuse* into the axon down their concentration gradient","the entry of positive charge makes the inside positive relative to the outside: *depolarisation*","the entry of Na⁺ causes more sodium channels to open (positive feedback)"],"hl":false,"mod":"Between 1 ms and 1.5 ms the membrane potential changes from –55 mV to +30 mV: this is depolarisation. At 1 ms the stimulus has brought the membrane to the threshold potential (about –55 mV), which opens voltage-gated sodium channels. Because Na⁺ is more concentrated outside the axon, the ions diffuse rapidly inwards down their concentration gradient. This entry of positive charge opens still more sodium channels (positive feedback) and reverses the polarity of the membrane, so the inside becomes positive relative to the outside."},{"l":"c","m":2,"q":"Explain why the potential falls below –70 mV at 3 ms.","pts":["during repolarisation K⁺ ions diffuse out of the axon through voltage-gated potassium channels","the potassium channels close slowly / remain open after –70 mV has been reached","more K⁺ leaves than is needed, so the inside becomes more negative (–80 mV) than at rest: *hyperpolarisation*","afterwards the sodium–potassium pump / closure of the channels restores the resting potential of –70 mV"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Calculate the time from when the threshold potential (–55 mV) is reached until the resting potential is restored.","pts":["threshold at 1 ms and return to –70 mV at 4 ms: 4 – 1","= 3 ms (unit required)"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":212,"p":"1B","t":"C3.2","also":["C4.1"],"title":"Vaccination and measles cases","blocks":[{"k":"p","v":"The data show vaccination coverage and the number of measles cases in a country over ten years."},{"k":"chart","type":"line","title":"Measles vaccination and cases","x":"Year","y":"Vaccination coverage / %","s":[{"n":"Coverage / %","pts":[["2014",93.0],["2015",94.0],["2016",92.0],["2017",89.0],["2018",86.0],["2019",84.0],["2020",85.0],["2021",88.0],["2022",91.0],["2023",94.0]]}]},{"k":"table","cap":"Reported measles cases","rows":[["Year","2014","2016","2018","2019","2021","2023"],["Cases","120","150","1900","4200","2100","180"]]}],"parts":[{"l":"a","m":1,"q":"State the year with the lowest vaccination coverage.","pts":["*2019* (84%)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calculate the percentage increase in cases from 2016 to 2019.","pts":["(4200 – 150) ÷ 150 × 100","= 2700%"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain the relationship between vaccination coverage and the number of cases.","pts":["*negative* correlation: cases rise as coverage falls and fall as coverage recovers","data quoted with units, e.g. coverage falls from 92% (2016) to 84% (2019) and cases rise from 150 to 4200","with high coverage there is *herd immunity*: immune people prevent the virus reaching susceptible people","when coverage falls there are more susceptible people / people without memory cells or antibodies against the virus","each infected person infects more people, so the virus spreads / outbreaks occur","measles is highly contagious, so very high coverage (about 95%) is needed to interrupt transmission"],"hl":false,"mod":"There is a negative correlation: as coverage falls from 92% in 2016 to 84% in 2019, cases rise from 150 to 4200, and when coverage returns to 94% in 2023 cases fall to 180. With high coverage there is herd immunity, because most people have memory cells and antibodies and the virus finds no susceptible hosts to pass to. When coverage falls, the proportion of susceptible people rises, each infected person infects more people and the virus spreads in outbreaks. Because measles is highly contagious, a fall of only a few percentage points is enough for herd immunity to be lost."},{"l":"d","m":2,"q":"Describe how a vaccine leads to long-term immunity.","pts":["the vaccine contains *antigens* of the pathogen (or nucleic acids coding for antigens) that do not cause the disease","the antigens activate specific lymphocytes / trigger a primary immune response","activated B-lymphocytes divide to form plasma cells and *memory cells*","memory cells persist for years and, on real infection, produce antibodies faster and in larger amounts (secondary response)"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":213,"p":"1B","t":"D3.2","also":["D4.1"],"title":"A dihybrid cross in fruit flies","blocks":[{"k":"p","v":"Flies heterozygous for body colour (G grey, g ebony) and wing shape (N normal, n vestigial) were crossed together. The genes are on different chromosomes."},{"k":"table","cap":"Offspring of the cross GgNn × GgNn","rows":[["Phenotype","Observed","Expected"],["Grey, normal","290","288"],["Grey, vestigial","104","96"],["Ebony, normal","90","96"],["Ebony, vestigial","28","32"]]}],"parts":[{"l":"a","m":1,"q":"State the expected ratio of phenotypes in the offspring of this cross.","pts":["9 : 3 : 3 : 1 (grey, normal : grey, vestigial : ebony, normal : ebony, vestigial)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calculate the expected number of grey flies with normal wings, showing your working.","pts":["total offspring = 290 + 104 + 90 + 28 = 512","expected fraction of grey, normal flies is 9/16","9/16 × 512 = 288 (flies)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Deduce, with a reason, the conclusion of the chi-squared test, given that the χ² value is 1.56 and the critical value for 3 degrees of freedom at p = 0.05 is 7.81.","pts":["the calculated value (1.56) is *lower* than the critical value (7.81)","the *null hypothesis* is not rejected / is accepted","there is no significant difference between observed and expected / the results fit the 9 : 3 : 3 : 1 ratio","the differences are due to chance / the data support independent assortment of the two genes"],"hl":false,"mod":""},{"l":"d","m":3,"q":"Explain why the results would be different if the two genes were linked.","pts":["*linked* genes are located on the same chromosome / their loci are close together on the same chromosome","alleles on the same chromosome tend to be inherited together / pass into the same gamete","there is no *independent assortment* of the two genes in meiosis","recombinants are only formed by *crossing over* between the two loci (in prophase I)","there would be more offspring with parental combinations and fewer recombinants than expected","the ratio would not be 9 : 3 : 3 : 1 / the χ² value would exceed the critical value"],"hl":false,"mod":"If the genes were linked, their loci would be on the same chromosome, so there would be no independent assortment in meiosis: alleles that are together on one chromosome would pass together into the same gamete. Recombinant gametes would only form when crossing over occurred between the two loci in prophase I, which is infrequent. There would therefore be more offspring with the parental combinations and fewer recombinants, so the observed ratio would differ from 9 : 3 : 3 : 1."}],"hl":true,"mk":8,"mkSL":8},{"qid":214,"p":"1B","t":"D4.2","also":["C4.2"],"title":"A polluted river","blocks":[{"k":"p","v":"Measurements were taken at different distances downstream from a farm where fertiliser drains into a river."},{"k":"table","cap":"River measurements","rows":[["Distance / m","Nitrate / mg dm⁻³","Dissolved O₂ / mg dm⁻³","Number of mayfly larvae"],["0","2","9.5","42"],["100","18","3.1","3"],["500","11","5.6","12"],["1000","5","8.4","35"]]}],"parts":[{"l":"a","m":1,"q":"State the distance at which the nitrate concentration is highest.","pts":["100 m (unit required)"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain the low dissolved oxygen concentration at 100 m.","pts":["nitrate is highest at 100 m (18 mg dm⁻³) and oxygen lowest (3.1 mg dm⁻³)","nitrates are nutrients that cause rapid growth of algae / an algal bloom (*eutrophication*)","algae block light, so submerged plants cannot photosynthesise / algae and plants die","bacteria / saprotrophs decompose the dead organic matter and their population increases","the decomposers use oxygen in *aerobic* cell respiration","*biochemical oxygen demand* (BOD) increases / oxygen is used faster than it is replaced"],"hl":false,"mod":"At 100 m the nitrate concentration is highest (18 mg dm⁻³) because this is where the fertiliser enters. The nitrates cause eutrophication: algae grow rapidly, block the light and, when they and the submerged plants die, provide a large amount of dead organic matter. The saprotrophic bacteria that decompose it multiply and use oxygen in aerobic cell respiration, so the biochemical oxygen demand is high and dissolved oxygen falls to 3.1 mg dm⁻³."},{"l":"c","m":2,"q":"Suggest why mayfly larvae can be used as an indicator species.","pts":["they only survive in water with a high dissolved oxygen concentration / are sensitive to pollution / have a narrow range of tolerance","their numbers are low where oxygen is low: 3 larvae at 3.1 mg dm⁻³ compared with 42 larvae at 9.5 mg dm⁻³","their presence / abundance indicates unpolluted water and their absence indicates polluted water","they are easy to catch, identify and count"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Suggest two ways in which farmers could reduce this pollution.","pts":["apply less fertiliser / only the amount the crop can absorb","avoid applying fertiliser before heavy rain / apply it when the crop is growing","leave unfertilised strips of vegetation beside the river to absorb nitrates","use organic / slow-release fertilisers","keep the soil covered with crops to reduce run-off and leaching"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":215,"p":"1B","t":"B3.1","also":["B3.2"],"title":"Oxygen dissociation curves","blocks":[{"k":"p","v":"The graph shows the percentage saturation of haemoglobin at different partial pressures of oxygen, at two concentrations of CO₂."},{"k":"chart","type":"line","title":"Haemoglobin saturation","x":"Partial pressure of oxygen / kPa","y":"Saturation / %","s":[{"n":"Low CO₂","pts":[["0",0.0],["2",20.0],["4",56.0],["6",80.0],["8",92.0],["10",96.0],["12",98.0]]},{"n":"High CO₂","pts":[["0",0.0],["2",10.0],["4",38.0],["6",66.0],["8",82.0],["10",91.0],["12",95.0]]}]}],"parts":[{"l":"a","m":1,"q":"State the percentage saturation of haemoglobin at 4 kPa with low CO₂.","pts":["*56 %*"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Calculate the difference in saturation between low and high CO₂ at 4 kPa and state what this represents.","pts":["56 − 38 = *18 %* (accept 18 percentage points)","the additional oxygen that haemoglobin releases / unloads in the tissues when CO₂ concentration is high","it is the *Bohr shift* / the shift of the curve to the right"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain the advantage of this effect to actively respiring muscle.","pts":["active muscle has a high rate of cell respiration and produces more *CO₂*","CO₂ lowers the pH of the blood / binds to haemoglobin at an allosteric site","the *affinity* of haemoglobin for oxygen decreases / the curve shifts to the right","at the same partial pressure of oxygen haemoglobin dissociates more / releases more oxygen (e.g. 18 % more at 4 kPa)","the muscle receives more oxygen exactly where demand is greatest, for aerobic cell respiration / ATP production"],"hl":false,"mod":"Active muscle respires more and produces more CO₂. The CO₂ lowers blood pH and binds to haemoglobin at an allosteric site, which reduces its affinity for oxygen and shifts the curve to the right (Bohr shift). So, at the same partial pressure of oxygen, haemoglobin releases more oxygen: at 4 kPa saturation falls from 56 % to 38 %. The muscle therefore receives more oxygen exactly where it is most needed for aerobic cell respiration and ATP production."},{"l":"d","m":2,"q":"Explain the sigmoid (S) shape of the curves.","pts":["haemoglobin has four subunits / four haem groups, each able to bind one O₂ molecule","binding of the first O₂ causes a *conformational* change in haemoglobin","this change increases the affinity of the other haem groups for oxygen: *cooperative* binding","so the curve rises slowly at low partial pressures and then becomes very steep / flattens as saturation is approached"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":216,"p":"1B","t":"D2.1","also":["D2.2"],"title":"Mitotic index in tumour tissue","blocks":[{"k":"p","v":"Samples were taken from normal tissue and two tumours. Cells in each phase were counted under a microscope."},{"k":"table","cap":"Cells counted in each sample","rows":[["Sample","Interphase","Prophase","Metaphase","Anaphase","Telophase"],["Normal tissue","470","14","8","4","4"],["Tumour X","380","52","34","18","16"],["Tumour Y","440","26","18","8","8"]]}],"parts":[{"l":"a","m":2,"q":"Calculate the mitotic index of tumour X.","pts":["cells in mitosis = 52 + 34 + 18 + 16 = 120","total number of cells = 380 + 120 = 500","mitotic index = 120 ÷ 500 = 0.24 / 24%"],"hl":false,"mod":""},{"l":"b","m":1,"q":"State which sample has the lowest mitotic index.","pts":["normal tissue (30 ÷ 500 = 0.06)"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain how mutations can lead to a high mitotic index.","pts":["mutations in *proto-oncogenes* convert them into *oncogenes*","oncogenes overstimulate the cell cycle / cell division","mutations in *tumour suppressor genes* stop them slowing the cell cycle / checkpoints fail","progression through the cycle, controlled by cyclins, is no longer regulated","cells divide by mitosis without control and form a tumour","a greater proportion of cells is in mitosis at any one time, so the mitotic index is high"],"hl":true,"mod":"Mutations can convert proto-oncogenes into oncogenes, which overstimulate the cell cycle, or inactivate tumour suppressor genes, which normally halt the cycle at checkpoints. With the regulation of the cycle by cyclins lost, cells divide by mitosis without control and form a tumour. A greater proportion of cells is in mitosis at any one time, so the mitotic index is high."},{"l":"d","m":2,"q":"Suggest why tumour X might be more dangerous than tumour Y.","pts":["tumour X has a higher mitotic index (0.24 compared with 0.12) / double that of tumour Y","its cells divide faster, so the tumour grows more quickly","it is more likely to be *malignant* / to invade neighbouring tissues / to *metastasise* (form secondary tumours)","there is less time for treatment / a poorer prognosis"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":3},{"qid":217,"p":"2","t":"A1.1","also":[],"title":"Water as a habitat","blocks":[{"k":"p","v":"Many animals live in or on water, and life is thought to have begun in water."}],"parts":[{"l":"a","m":2,"q":"Draw two water molecules, showing the polarity of each molecule and a hydrogen bond between them.","pts":["each molecule drawn with one O atom joined to two H atoms by covalent bonds (solid lines), in a V / bent shape","polarity labelled on both molecules: *δ–* on O and *δ+* on each H","*hydrogen bond* drawn as a dashed / dotted line and labelled, between an H (δ+) of one molecule and the O (δ–) of the other"],"mod":"","hl":false},{"l":"b","m":2,"q":"Explain why aquatic animals experience less temperature change than land animals.","pts":["water has a high *specific heat capacity* (much higher than that of air)","because many hydrogen bonds must be broken for the kinetic energy / temperature of the molecules to increase","a large amount of energy must be gained or lost for the temperature of water to change, so it warms and cools slowly","so aquatic habitats are thermally stable, whereas air temperature changes rapidly and widely"],"mod":"","hl":false},{"l":"c","m":2,"q":"Outline how the buoyancy and viscosity of water affect aquatic animals.","pts":["water exerts a large *buoyancy* force (upthrust) because its density is similar to that of living tissues","so water supports body weight and animals float / stay at a depth with little energy expenditure / need less skeletal support / can be very large","water has a high *viscosity* (higher than air), so it resists movement / causes friction (drag)","so fast swimmers have streamlined shapes that reduce drag (e.g. ringed seal, black-throated loon when diving) / moving through water requires more energy than moving through air"],"mod":"","hl":false}],"hl":false,"mk":6,"mkSL":6},{"qid":218,"p":"2","t":"A1.2","also":["D1.1"],"title":"The structure of DNA","blocks":[],"parts":[{"l":"a","m":3,"q":"Distinguish between DNA and RNA.","pts":["the (pentose) sugar in DNA is *deoxyribose*, whereas in RNA it is *ribose*","DNA has the base *thymine*, whereas RNA has *uracil* instead (both have adenine, cytosine and guanine)","DNA usually has two polynucleotide strands, whereas RNA usually has one","DNA forms a double helix with base pairing between the strands, whereas RNA does not form a double helix","DNA molecules are much longer / DNA stores information long term, whereas RNA molecules are shorter / short-lived"],"mod":"DNA contains the sugar deoxyribose, whereas RNA contains ribose. DNA has the base thymine, but in RNA thymine is replaced by uracil; the other three bases (adenine, cytosine and guanine) occur in both. DNA is made of two polynucleotide strands linked by complementary base pairing in a double helix, whereas RNA is usually single-stranded and is a shorter molecule.","hl":false},{"l":"b","m":2,"q":"Explain how complementary base pairing allows DNA to be copied accurately.","pts":["the two strands of DNA separate and each acts as a *template* for a new strand","*adenine* pairs only with *thymine* and *cytosine* only with *guanine* (by hydrogen bonds)","so the base sequence of the template determines which nucleotide is added at each position in the new strand","so the two daughter molecules have the same base sequence as the original molecule / replication is semi-conservative"],"mod":"","hl":false},{"l":"c","m":2,"q":"Describe what is meant by the two strands of DNA being antiparallel.","pts":["the two strands are parallel to each other but run in *opposite directions*","in one strand the deoxyribose sugars / nucleotides point one way and in the other strand the opposite way / one is upside down relative to the other","one strand runs 5'→3' and the complementary strand 3'→5' (not required at SL)","the strands are held together by hydrogen bonds between complementary bases"],"mod":"","hl":false}],"hl":false,"mk":7,"mkSL":7},{"qid":219,"p":"2","t":"A2.1","also":[],"title":"Origins of life","blocks":[],"parts":[{"l":"a","m":2,"q":"Outline the conditions thought to have existed on the early Earth.","pts":["no / very little free *oxygen* in the atmosphere (reducing atmosphere) and therefore no ozone layer","high concentrations of *methane* / carbon dioxide / ammonia / hydrogen / water vapour in the atmosphere","higher temperatures than today (due to the greenhouse effect of these gases) / intense volcanic activity / meteorite impacts","intense ultraviolet radiation reaching the surface / frequent electrical storms (lightning)","these conditions allowed the spontaneous formation of carbon compounds that would not form today"],"mod":"","hl":false},{"l":"b","m":3,"q":"Describe an experiment that tested whether carbon compounds could form without living organisms.","pts":["*Miller and Urey* experiment: closed, sterile apparatus simulating the conditions on the early Earth","mixture of gases: methane, ammonia, hydrogen and water vapour, with no oxygen (reducing atmosphere)","water was boiled and the vapour then condensed, simulating the ocean and the water cycle (evaporation and rain)","*electrical discharges* / sparks were passed through the gas mixture to simulate lightning as an energy source","after several days the liquid was analysed and *amino acids* / other simple carbon compounds were found","conclusion: carbon compounds could have formed abiotically / spontaneously on the early Earth"],"mod":"The Miller and Urey experiment used a closed apparatus that simulated the early Earth. It contained a mixture of methane, ammonia, hydrogen and water vapour, with no oxygen. Water was boiled so that vapour circulated and was then condensed, imitating the ocean and rain. Electrical sparks were passed through the gases to simulate lightning and supply energy. After a few days the water was analysed and found to contain amino acids and other carbon compounds, showing that these could have formed spontaneously without living organisms.","hl":false},{"l":"c","m":2,"q":"Explain why the formation of vesicles was a key step towards the first cells.","pts":["fatty acids / phospholipids are amphipathic and in water spontaneously form *bilayers* that close up into spherical vesicles","the vesicle separates an internal environment from the surroundings / creates a membrane-bound compartment","so the internal chemistry can differ from the outside / molecules such as RNA and catalysts are kept concentrated inside","which allows metabolism and replication to occur inside the vesicle, which acts as a protocell"],"mod":"","hl":false}],"hl":true,"mk":7,"mkSL":7},{"qid":220,"p":"2","t":"A2.2","also":["B2.2"],"title":"Comparing cells","blocks":[],"parts":[{"l":"a","m":3,"q":"Distinguish between the structure of prokaryotic cells and that of eukaryotic cells.","pts":["prokaryotic cells have no *nucleus* / their DNA is in the nucleoid, in the cytoplasm, whereas eukaryotic cells have a nucleus surrounded by a double membrane","prokaryotic DNA is circular and naked / without histones, whereas eukaryotic DNA is linear and associated with *histones*","prokaryotic cells have *70S* ribosomes, whereas eukaryotic cells have (larger) *80S* ribosomes in the cytoplasm","prokaryotic cells have no membrane-bound organelles / cytoplasm not compartmentalised, whereas eukaryotic cells have mitochondria / endoplasmic reticulum / Golgi apparatus","prokaryotic cells may have plasmids, which are not usually present in eukaryotic cells","prokaryotic cells are smaller (about 1–10 µm) than eukaryotic cells (about 10–100 µm)"],"mod":"Prokaryotic cells have no nucleus: their DNA is in a region of the cytoplasm called the nucleoid, whereas in eukaryotic cells the DNA is inside a nucleus surrounded by a double membrane. Prokaryotic DNA is circular and naked, whereas eukaryotic DNA is linear and associated with histones. Prokaryotic ribosomes are 70S and eukaryotic ribosomes are 80S. In addition, prokaryotic cells lack membrane-bound organelles such as mitochondria, which are present in eukaryotic cells.","hl":false},{"l":"b","m":2,"q":"State two differences between plant cells and animal cells.","pts":["plant cells have a (cellulose) *cell wall*, whereas animal cells do not","plant cells have *chloroplasts* / plastids, whereas animal cells do not","plant cells have a large, central, permanent vacuole, whereas animal cells only have small / temporary vacuoles","animal cells have centrioles, whereas (flowering) plant cells do not","plant cells store starch, whereas animal cells store glycogen"],"mod":"","hl":false},{"l":"c","m":2,"q":"Explain one advantage of compartmentalisation in eukaryotic cells.","pts":["the enzymes and substrates for a process are concentrated in a small space, so reactions are faster / more efficient","optimum conditions for its enzymes can be maintained in each organelle (e.g. acidic pH in lysosomes)","substances / enzymes that could damage the cell are isolated from the rest of it (e.g. digestive enzymes in lysosomes)","incompatible processes are kept apart / the nucleus separates transcription from translation, allowing mRNA to be modified before it is translated"],"mod":"","hl":false}],"hl":false,"mk":7,"mkSL":7},{"qid":221,"p":"2","t":"A2.3","also":["C3.2"],"title":"Viruses","blocks":[],"parts":[{"l":"a","m":2,"q":"State two structural features that all viruses share.","pts":["genetic material made of a *nucleic acid* (DNA or RNA)","*capsid* / coat made of protein enclosing the genetic material","very small, fixed size (most between 20 and 300 nm) / do not grow","no cytoplasm / ribosomes / cellular structure, and few or no enzymes"],"mod":"","hl":false},{"l":"b","m":4,"q":"Describe the lytic cycle of a bacteriophage.","pts":["the phage attaches / binds to specific molecules (receptors) on the surface of the host bacterium","the phage *injects its DNA* into the bacterium, and the capsid stays outside","the viral DNA is replicated many times using nucleotides / enzymes of the host cell","viral genes are transcribed and the bacterium's *ribosomes* synthesise the viral (capsid) proteins","DNA and proteins are *assembled* into many new virus particles","an enzyme (lysozyme) digests the cell wall and the bacterium undergoes *lysis* / bursts, releasing the phages","the released phages infect other bacteria / the host cell dies"],"mod":"The bacteriophage binds to specific molecules on the surface of the host bacterium and injects its DNA into the cytoplasm, while the capsid stays outside. The viral DNA is replicated many times using the nucleotides and enzymes of the bacterium. The phage genes are transcribed and the bacterial ribosomes synthesise the capsid proteins. The DNA and proteins are then assembled into many new phages. Finally, a viral enzyme digests the cell wall, the bacterium undergoes lysis and releases the phages, which can infect other bacteria.","hl":false},{"l":"c","m":2,"q":"Explain why viruses such as HIV evolve rapidly.","pts":["they have a very high *mutation rate*, because reverse transcriptase / RNA replication does not proofread errors","generation time is very short / huge numbers of virus particles are produced in each cycle, so much genetic variation arises","there is strong *natural selection* by the host's immune system / antiviral drugs","variants with altered antigens / resistance survive and reproduce, so their alleles increase in frequency","in viruses such as influenza, recombination / exchange of RNA segments between strains generates new variants"],"mod":"","hl":false}],"hl":true,"mk":8,"mkSL":8},{"qid":222,"p":"2","t":"A3.1","also":[],"title":"Species and genomes","blocks":[],"parts":[{"l":"a","m":2,"q":"State the biological species concept.","pts":["a species is a group of organisms / populations that can (actually or potentially) *interbreed*","and produce *fertile* offspring","and that are reproductively isolated from other groups / do not produce fertile offspring with members of other species"],"mod":"","hl":false},{"l":"b","m":2,"q":"Explain why the biological species concept is difficult to apply to bacteria.","pts":["bacteria reproduce *asexually* (by binary fission), so there is no interbreeding between individuals","so the criterion of interbreeding to produce fertile offspring cannot be applied","there is *horizontal gene transfer* (e.g. by plasmids) even between distantly related bacteria","so the boundaries between bacterial species are blurred / bacteria are classified by similarity of base sequence or morphology"],"mod":"","hl":true},{"l":"c","m":2,"q":"Outline how a karyogram is produced and used.","pts":["chromosomes of a cell in *mitosis* / metaphase (when they are condensed and visible) are stained and photographed under a microscope","the images of the chromosomes are arranged in *homologous pairs*","according to their length (longest to shortest), centromere position and banding pattern","used to determine sex (XX or XY) / the chromosome number of the individual or species","used to detect chromosome abnormalities, e.g. trisomy 21 (Down syndrome)"],"mod":"","hl":false}],"hl":false,"mk":6,"mkSL":4},{"qid":223,"p":"2","t":"A3.2","also":[],"title":"Cladograms","blocks":[{"k":"p","v":"The table shows the number of base differences in a gene between four species of primate."},{"k":"table","cap":"Base differences","rows":[["","Human","Chimpanzee","Gorilla"],["Chimpanzee","12","–","–"],["Gorilla","16","15","–"],["Orangutan","30","29","28"]]}],"parts":[{"l":"a","m":1,"q":"Identify the species most closely related to humans.","pts":["chimpanzee (because it has the fewest base differences from the human: 12)"],"mod":"","hl":false},{"l":"b","m":3,"q":"Draw a cladogram for the four species based on these data.","pts":["branching diagram with a single root / base line and all four species labelled at the ends of the branches","orangutan is the first branch to split off / the outgroup (because it has the most differences from the others: 28–30)","gorilla is the second branch to split off (15–16 differences from human and chimpanzee)","human and chimpanzee share the most recent *node* / are sister groups (only 12 differences)","all branch points are two-way splits / three nodes in total, each representing a common ancestor"],"mod":"The cladogram is drawn as a branching tree starting from a single root, with the names of the four species at the ends of the branches. The first branch to split off leads to the orangutan, because it is the species with the most differences from the others (28 to 30). At the next node the gorilla splits off (15–16 differences). The last and most recent node joins the human and the chimpanzee, which differ by only 12 bases and are therefore sister groups. Each of the three nodes represents a common ancestor.","hl":false},{"l":"c","m":2,"q":"Explain why base sequence differences can be used to estimate when species diverged.","pts":["differences in base sequence are due to *mutations* that accumulate after two lineages split","mutations accumulate at a roughly constant rate / act as a *molecular clock*","so the greater the number of differences, the longer the time since the common ancestor","the rate can be calibrated using fossils of known age to convert the number of differences into time","it is only an estimate, because mutation rate varies (with generation time / population size / selection pressure)"],"mod":"","hl":false}],"hl":true,"mk":6,"mkSL":6},{"qid":224,"p":"2","t":"A4.1","also":[],"title":"Evidence for evolution","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinguish between homologous structures and analogous structures.","pts":["homologous structures have the same basic structure / arrangement of parts although their function differs, whereas analogous structures have the same function but a different structure","homologous structures are inherited from a *common ancestor*, whereas analogous structures have different evolutionary origins","homologous structures result from *divergent* evolution / adaptive radiation, whereas analogous structures result from *convergent* evolution","example of each: pentadactyl limb of vertebrates (homologous) versus insect wing and bird wing / octopus eye and human eye (analogous)"],"mod":"","hl":false},{"l":"b","m":3,"q":"Explain how selective breeding of crop plants provides evidence for evolution.","pts":["humans choose individuals with desired traits as parents (*artificial selection*) and repeat this over many generations","the selected traits are *heritable*, so they increase in frequency in the population","modern crops are very different from their wild ancestors (e.g. maize and teosinte / the varieties of Brassica oleracea)","this shows that selection can cause large changes in the heritable characteristics of a species in a relatively short time","so it is plausible that natural selection causes similar or greater changes over much longer periods","single wild species give rise to many varieties, showing the genetic variation on which selection acts"],"mod":"In selective breeding, humans choose plants with desired traits, such as larger grains, as parents and repeat this artificial selection over many generations. Because these traits are heritable, their frequency increases in the population. As a result, modern crops such as maize are very different from their wild ancestors, such as teosinte. This shows that selection can considerably change the heritable characteristics of a species in a short time, which makes it plausible that natural selection produces even greater changes over millions of years.","hl":false},{"l":"c","m":2,"q":"Outline the role of reproductive isolation in speciation.","pts":["reproductive isolation prevents interbreeding / *gene flow* between two populations of a species","it can be due to a geographical barrier (e.g. a river or mountain range) separating the populations","each population is subject to different selection pressures (differential selection), so their gene pools / traits *diverge*","eventually the differences are so great that they can no longer interbreed to produce fertile offspring, so they are separate species (e.g. bonobos and chimpanzees separated by the Congo River)"],"mod":"","hl":false}],"hl":false,"mk":7,"mkSL":7},{"qid":225,"p":"2","t":"A4.2","also":[],"title":"Conserving biodiversity","blocks":[],"parts":[{"l":"a","m":2,"q":"Outline two causes of the current loss of biodiversity.","pts":["*habitat destruction / loss*, e.g. by deforestation, expansion of agriculture or urbanisation, leaving species without food or breeding sites","*overexploitation*: hunting / fishing / logging removes individuals faster than the population can replace them","introduced *invasive species*, which outcompete native species, prey on them or transmit diseases to them","pollution (e.g. pesticides, plastics, eutrophication), which kills organisms or degrades ecosystems","global climate change, which alters habitats faster than species can adapt or migrate","underlying cause: human population growth, which increases the demand for resources"],"mod":"","hl":false},{"l":"b","m":2,"q":"Compare and contrast in situ conservation and ex situ conservation.","pts":["similarity: both aim to prevent the extinction of species / conserve biodiversity / they complement each other and can be used together","in situ conservation protects species *in their natural habitat* (e.g. national parks, nature reserves), whereas ex situ conserves them *outside their natural habitat* (e.g. zoos, botanic gardens, seed banks)","in situ conserves the whole ecosystem / interactions between species and adaptation to the environment continues, whereas ex situ only conserves the chosen species","ex situ gives more control and protection (from hunting / disease) and allows captive breeding when the habitat is no longer safe, but populations are small, with low genetic diversity and difficulties with reintroduction"],"mod":"","hl":false},{"l":"c","m":2,"q":"Explain why it is important to conserve genetic diversity within a species.","pts":["genetic diversity means *variation* between individuals / many different alleles in the gene pool","if the environment changes (new disease / climate change), it is more likely that some individuals have alleles that allow them to survive and reproduce","so the population can adapt / evolve by *natural selection* and the risk of extinction is lower","with low diversity there is inbreeding, and the frequency of homozygotes for harmful recessive alleles increases","small populations lose alleles by chance, further reducing their capacity to adapt"],"mod":"","hl":false}],"hl":false,"mk":6,"mkSL":6},{"qid":226,"p":"2","t":"B1.1","also":[],"title":"Carbohydrates and lipids","blocks":[],"parts":[{"l":"a","m":3,"q":"Compare and contrast the structure of starch and cellulose.","pts":["similarity: both are *polysaccharides* / polymers of glucose linked by glycosidic bonds formed by condensation","starch is made of *α-glucose* whereas cellulose is made of *β-glucose*","in starch all monomers have the same orientation, whereas in cellulose alternate monomers are inverted (rotated through 180°)","starch chains coil into a helix, whereas cellulose chains are straight","starch may be branched (amylopectin, with 1→6 bonds) or unbranched (amylose), whereas cellulose is never branched (1→4 bonds only)","cellulose chains are linked to each other by hydrogen bonds forming *microfibrils*, whereas starch chains are not"],"hl":false,"mod":"Both starch and cellulose are polysaccharides made of glucose monomers linked by glycosidic bonds through condensation. However, starch is made of α-glucose and its chains coil into a helix; it may be unbranched (amylose) or branched (amylopectin). Cellulose, in contrast, is made of β-glucose with alternate monomers inverted, so its chains are straight and unbranched, and they are linked to each other by hydrogen bonds to form microfibrils."},{"l":"b","m":2,"q":"Explain why triglycerides are more suitable than glycogen for long-term energy storage.","pts":["they release about twice as much *energy per gram* in cell respiration","they are *hydrophobic* / insoluble, so they are stored without associated water and do not affect osmosis","so the same amount of energy is stored with less body mass, which is an advantage for movement","they are chemically stable, so energy is not lost over time; glycogen is mobilised faster and serves short-term needs","adipose tissue also has secondary functions such as thermal insulation"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Describe how phospholipids form a bilayer in water.","pts":["phospholipids are *amphipathic*: they have a hydrophilic part and a hydrophobic part","the *hydrophilic* phosphate heads are attracted to water and face it, on both sides of the bilayer","the *hydrophobic* hydrocarbon (fatty acid) tails are repelled by water and face inwards, towards each other","the bilayer forms spontaneously / is held together by hydrophobic interactions between the tails"],"hl":false,"mod":""}],"hl":false,"mk":7,"mkSL":7},{"qid":227,"p":"2","t":"B1.2","also":["C1.1"],"title":"Protein structure","blocks":[],"parts":[{"l":"a","m":2,"q":"Draw the generalised structure of an amino acid.","pts":["central carbon (alpha carbon) with four bonds, one of them to an *H* atom","*amine* group drawn as NH₂ (or H₂N) bonded to the central carbon","*carboxyl* group drawn as COOH (accept C=O and O–H) bonded to the central carbon","*R* group (variable side chain) bonded to the central carbon (max 1 if groups are unlabelled or bonding is incorrect)"],"hl":false,"mod":""},{"l":"b","m":4,"q":"Explain how the primary structure of a protein determines its function.","pts":["the primary structure is the *sequence* of amino acids in the polypeptide, determined by the gene","the sequence fixes the position of each *R* group and therefore where the chain folds","secondary structure (α helices and β-pleated sheets) forms by hydrogen bonding between groups of the polypeptide backbone","*tertiary* structure is due to interactions between R groups: hydrogen bonds, ionic bonds, disulfide bridges and hydrophobic interactions","the result is a specific and precise three-dimensional conformation","the shape determines the function, e.g. the active site of an enzyme is complementary to its substrate / the binding site of a receptor","a change in a single amino acid can alter shape and function, e.g. haemoglobin in sickle cell anaemia"],"hl":true,"mod":"The primary structure is the sequence of amino acids in the polypeptide. This sequence fixes the position of every R group and therefore how the chain folds: first into α helices and β-pleated sheets by hydrogen bonding, and then into the tertiary structure through interactions between R groups (hydrogen bonds, ionic bonds, disulfide bridges and hydrophobic interactions). This gives a specific three-dimensional shape on which function depends; for example, the active site of an enzyme is complementary to its substrate. Changing a single amino acid can therefore alter shape and function, as happens with haemoglobin in sickle cell anaemia."},{"l":"c","m":2,"q":"Distinguish between fibrous and globular proteins, with one example of each.","pts":["fibrous proteins are long and narrow (polypeptides not folded into a tertiary structure), whereas globular proteins are compact and rounded","fibrous proteins are *insoluble* in water, whereas globular proteins are usually *soluble* (hydrophilic R groups on the outside)","fibrous proteins have a structural role, whereas globular proteins have metabolic / transport / regulatory roles","fibrous example: *collagen* (accept keratin); globular example: *insulin* (accept haemoglobin or a named enzyme) (both examples required)"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":2},{"qid":228,"p":"2","t":"B2.1","also":[],"title":"Membrane transport","blocks":[],"parts":[{"l":"a","m":2,"q":"Distinguish between facilitated diffusion and active transport.","pts":["facilitated diffusion is down the *concentration gradient* (from higher to lower concentration), whereas active transport is against it","facilitated diffusion is passive / needs no energy from the cell, whereas active transport uses *ATP*","facilitated diffusion uses *channel* proteins, whereas active transport uses *pump* proteins","facilitated diffusion tends to equalise concentrations, whereas active transport can accumulate a substance / build up a gradient"],"hl":false,"mod":""},{"l":"b","m":3,"q":"Explain how the sodium–potassium pump works.","pts":["it is an integral protein that carries out active transport against the concentration gradients of both ions","*three Na⁺* from the cytoplasm bind to the pump","*ATP* transfers a phosphate group to the pump (phosphorylation), causing a *conformational* change","the pump opens to the outside and releases the Na⁺ out of the cell","*two K⁺* from outside bind to the pump and the phosphate group is released","the pump returns to its original shape and releases the K⁺ into the cytoplasm","it acts as an exchanger / generates a charge difference (membrane potential) by moving three positive charges out for every two moved in"],"hl":true,"mod":"The sodium–potassium pump is an integral protein that carries out active transport. Three Na⁺ from the cytoplasm bind to the pump and ATP transfers a phosphate group to it; this phosphorylation changes the conformation of the protein, which opens to the outside and releases the Na⁺. Two K⁺ from outside then bind, the phosphate is released and the pump returns to its original shape, so the K⁺ are released into the cytoplasm. As three positive charges leave and two enter, both ions move against their gradients and a membrane potential is generated."},{"l":"c","m":2,"q":"Outline how cholesterol affects membrane fluidity.","pts":["cholesterol lies between the phospholipids of the bilayer (in animal cell membranes) and acts as a *modulator* of fluidity","at high temperatures it *reduces* fluidity because it restricts the movement of phospholipids / stabilises the membrane","at low temperatures it *prevents* the membrane from becoming rigid because it stops the hydrocarbon tails packing closely together","it reduces the permeability of the membrane to hydrophilic particles / to ions such as Na⁺ and H⁺"],"hl":true,"mod":""}],"hl":false,"mk":7,"mkSL":2},{"qid":229,"p":"2","t":"B2.2","also":[],"title":"Organelles","blocks":[],"parts":[{"l":"a","m":3,"q":"Describe how the structure of the chloroplast is adapted for photosynthesis.","pts":["*thylakoid* membranes provide a large surface area for photosystems / chlorophyll, so more light is absorbed","thylakoids are stacked into grana, concentrating many photosystems in a small volume","the space inside the thylakoid has a small volume, so the *proton* gradient builds up quickly","thylakoid membranes contain electron transport chains and ATP synthase for photophosphorylation","the *stroma* contains the enzymes of the Calvin cycle (e.g. rubisco) concentrated in one compartment","the double membrane encloses the organelle and maintains suitable conditions / it has DNA and 70S ribosomes to synthesise some of its proteins"],"hl":false,"mod":"The chloroplast has many thylakoids stacked into grana, whose membranes provide a large surface area for photosystems containing chlorophyll, so a lot of light is absorbed. These membranes also hold the electron transport chains and ATP synthase. The space inside the thylakoid is very small, so the proton gradient builds up quickly. The stroma around the thylakoids concentrates the enzymes of the Calvin cycle, such as rubisco, and the double membrane keeps these conditions separate from the cytoplasm."},{"l":"b","m":3,"q":"Outline the route of a secreted protein from its synthesis to its release from the cell.","pts":["the polypeptide is synthesised on *ribosomes* attached to the rough endoplasmic reticulum (RER)","it enters the lumen / cisternae of the RER as it is synthesised","it is transported in *vesicles* that bud off the RER and fuse with the cis face of the Golgi apparatus","in the *Golgi apparatus* it is processed / modified (e.g. carbohydrate is added to form a glycoprotein)","secretory vesicles bud off the trans face of the Golgi and move to the plasma membrane","the vesicle fuses with the plasma membrane and releases its contents by *exocytosis*"],"hl":false,"mod":"The protein is synthesised on ribosomes attached to the rough endoplasmic reticulum and enters its lumen. From there it travels in vesicles that bud off the RER and fuse with the cis face of the Golgi apparatus, where it is processed and modified, for example by adding carbohydrate. Secretory vesicles then bud off the trans face of the Golgi, move to the plasma membrane, fuse with it and release the protein to the outside by exocytosis."}],"hl":true,"mk":6,"mkSL":6},{"qid":230,"p":"2","t":"B2.3","also":[],"title":"Cell specialisation","blocks":[],"parts":[{"l":"a","m":2,"q":"Outline the properties of stem cells.","pts":["they can *divide* repeatedly / indefinitely by mitosis (self-renewal)","they are unspecialised / undifferentiated","they can *differentiate* along different pathways to give specialised cell types","their potency varies: totipotent, pluripotent or multipotent, depending on how many cell types they can produce"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Distinguish between totipotent and multipotent stem cells.","pts":["*totipotent* cells can give rise to every cell type of the organism, including extra-embryonic tissues (placenta), whereas *multipotent* cells give rise only to a limited number of related cell types","totipotent cells are found in the very early embryo (zygote and first divisions), whereas multipotent cells are found in adult tissues","example of multipotent cells: stem cells in bone marrow only give rise to the different types of blood cell","a totipotent cell can give rise to a complete organism, whereas a multipotent cell only serves to renew / repair a tissue"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explain why cells are small, with reference to surface area-to-volume ratio.","pts":["as cell size increases, *volume* increases faster than surface area (volume with the cube and surface area with the square of the linear dimension)","so the *surface area-to-volume ratio* decreases as the cell grows","volume determines the metabolic rate / the demand for materials and the production of waste and heat","the surface area (of the membrane) determines the rate of exchange of materials with the surroundings","in a large cell exchange would be too slow to meet its needs / remove waste, and diffusion distances to the centre would be too long","a small cell keeps a high ratio, so exchange is sufficient; this is why cells divide rather than continue to grow"],"hl":false,"mod":"When a cell grows, its volume increases faster than its surface area, so the surface area-to-volume ratio decreases. Volume determines the metabolic rate, that is, how much material is needed and how much waste is produced, whereas the surface area of the membrane determines the rate of exchange with the surroundings. In a large cell exchange would be too slow to meet its needs and diffusion to the centre would take too long. Cells therefore stay small and divide instead of continuing to grow."},{"l":"d","m":1,"q":"State one adaptation that increases the surface area-to-volume ratio of a cell.","pts":["*microvilli* (e.g. proximal convoluted tubule cells) / flattened shape (e.g. type I pneumocytes) / biconcave shape (erythrocytes) / infoldings of the membrane"],"hl":true,"mod":""}],"hl":false,"mk":8,"mkSL":7},{"qid":231,"p":"2","t":"B3.1","also":[],"title":"Gas exchange in mammals","blocks":[],"parts":[{"l":"a","m":3,"q":"Describe the features of alveoli that make them efficient for gas exchange.","pts":["there is a very large number of alveoli, giving a *large* total *surface area* for diffusion","the wall is a single layer of very thin cells (type I pneumocytes), so the *diffusion distance* is short","each alveolus is surrounded by a dense network of closely adjacent *capillaries*, which also have thin walls","blood flow and ventilation maintain steep concentration gradients of O₂ and CO₂","the inner surface is moist, allowing gases to dissolve before diffusing","type II pneumocytes secrete *surfactant*, which reduces surface tension and prevents the walls sticking together / the alveolus collapsing"],"hl":false,"mod":"The lungs contain a huge number of alveoli, providing a large surface area for diffusion. The wall of each alveolus is a single layer of very thin type I pneumocytes and is surrounded by a dense network of capillaries, so the diffusion distance is very short. Ventilation and blood flow maintain steep concentration gradients of O₂ and CO₂. In addition, the surface is moist so that gases dissolve, and type II pneumocytes secrete surfactant, which reduces surface tension and prevents the alveolus collapsing."},{"l":"b","m":3,"q":"Explain the mechanism of inspiration.","pts":["the *diaphragm* contracts and flattens / moves down","the *external intercostal* muscles contract, moving the ribcage up and out","the antagonistic muscles relax: the internal intercostals and the abdominal muscles","the *volume* of the thorax / lungs increases","so the *pressure* inside the lungs falls below atmospheric pressure","air flows into the lungs down the pressure gradient, until the pressures are equal"],"hl":false,"mod":"During inspiration the diaphragm contracts and flattens, and the external intercostal muscles contract, moving the ribcage up and out, while the internal intercostals and the abdominal muscles relax. This increases the volume of the thorax and lungs, so the pressure inside them falls below atmospheric pressure. As a result, air flows into the lungs down the pressure gradient until the pressures are equal."}],"hl":false,"mk":6,"mkSL":6},{"qid":232,"p":"2","t":"B3.2","also":[],"title":"The heart","blocks":[],"parts":[{"l":"a","m":3,"q":"Explain how the structure of the left ventricle is related to its function.","pts":["its wall of *cardiac muscle* is very thick, thicker than that of the right ventricle","when it contracts it generates a high *pressure*","needed to pump blood through the aorta to the whole body (*systemic* circulation), which offers more resistance / is a longer circuit than the pulmonary circulation","the atrioventricular valve closes during contraction so that blood does not return to the atrium, and the semilunar (aortic) valve prevents backflow from the aorta","cardiac muscle has many mitochondria and a rich coronary blood supply, allowing continuous contraction without fatigue","the branched cells joined by intercalated discs propagate the impulse so that the whole wall contracts in a coordinated way"],"hl":true,"mod":"The left ventricle has a very thick wall of cardiac muscle, much thicker than that of the right ventricle. When it contracts it generates a high pressure, which is needed to pump blood through the aorta to the whole body, because the systemic circulation is longer and offers more resistance than the pulmonary circulation. During contraction the atrioventricular valve closes to prevent backflow into the atrium and, afterwards, the semilunar valve stops blood returning from the aorta. In addition, the many mitochondria in cardiac muscle allow it to contract continuously without fatigue."},{"l":"b","m":2,"q":"Outline the role of the valves in the heart.","pts":["they prevent *backflow* of blood / keep blood flowing in one direction","the *atrioventricular* valves (between atria and ventricles) close when the ventricles contract, preventing blood returning to the atria","the *semilunar* valves (at the exits to the aorta and pulmonary artery) close when the ventricles relax, preventing blood returning to the ventricles","they open and close passively because of differences in blood pressure on either side"],"hl":true,"mod":""},{"l":"c","m":2,"q":"Outline the causes and consequences of occlusion of the coronary arteries.","pts":["cause: fatty / cholesterol deposits (*atheroma* / plaque) in the artery wall, narrowing its lumen","correlated risk factors: diet high in saturated fat, hypertension, smoking, obesity, lack of exercise or genetic factors","the plaque
