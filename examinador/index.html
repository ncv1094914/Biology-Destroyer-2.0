 by a glycosidic bond","one molecule of water is released for each bond formed / a polymer of n monomers releases n − 1 water molecules","condensation requires energy / ATP","*hydrolysis*: a water molecule is used to break each glycosidic bond","hydrolysis releases monosaccharides / e.g. digestion of starch / mobilization of glycogen","both reactions are catalysed by (specific) enzymes"],"mod":"Polysaccharides such as starch and glycogen are polymers of a monosaccharide, α-glucose. They are formed by condensation: an enzyme joins two monosaccharides by a glycosidic bond and one molecule of water is released for each bond, so a polymer of n monomers releases n − 1 water molecules; the process requires energy from ATP. The reverse reaction is hydrolysis: a water molecule is used to break each glycosidic bond and monosaccharides are released again, as happens in the digestion of starch or when the liver mobilizes glycogen. Both reactions are catalysed by specific enzymes."},{"l":"b","m":5,"q":"Describe the structure of a phospholipid and how this structure allows membranes to form.","hl":false,"pts":["glycerol linked to two fatty acids and a phosphate group","the fatty acids are joined to glycerol by ester bonds (condensation)","the head containing the phosphate is *hydrophilic* / polar","the two fatty acid tails are *hydrophobic* / non-polar","the molecule is *amphipathic*","in water they spontaneously arrange into a *bilayer*: heads facing the water and tails facing inwards","the hydrophobic core of the bilayer is a barrier to ions and polar molecules","cis double bonds in unsaturated tails produce kinks that increase membrane fluidity"],"mod":"A phospholipid consists of a glycerol molecule linked by ester bonds to two fatty acids and to a phosphate group. The phosphate region forms a hydrophilic head, while the two fatty acid tails are hydrophobic, so the molecule is amphipathic. When phospholipids are in water they spontaneously arrange themselves into a bilayer: the heads are in contact with the water on both sides and the tails cluster in the interior, away from water. This hydrophobic core acts as a barrier to ions and polar molecules, so the bilayer is the basic structure of all membranes. In addition, the cis double bonds in unsaturated tails produce kinks that prevent tight packing and make the membrane fluid."},{"l":"c","m":7,"q":"Explain how the structures of carbohydrates and lipids are related to their function in energy storage in plants and animals.","hl":false,"pts":["plants store *starch* and animals store *glycogen*, both polymers of α-glucose","amylose is unbranched and coils into a helix, making it compact","amylopectin and glycogen are branched: many ends where glucose can be added or removed quickly","they are large, insoluble molecules: they do not affect osmosis / do not leave the cell","free glucose is soluble and would alter water potential if stored in large amounts","glycogen in liver and muscle allows glucose to be released rapidly when needed","*triglycerides* are formed by condensation of glycerol and three fatty acids (ester bonds)","triglycerides are hydrophobic, so they are stored without associated water / as droplets in adipose tissue","triglycerides release about twice as much energy per gram as carbohydrates","so they are the lightest long-term store, an advantage for animals that move","seeds store oils (triglycerides with unsaturated fatty acids, liquid at room temperature)","triglycerides in adipose tissue also provide thermal insulation"],"mod":"Plants store energy as starch and animals as glycogen; both are polymers of α-glucose. The amylose in starch is unbranched and coils into a compact helix, while amylopectin and especially glycogen are highly branched, giving many ends at which enzymes can add or remove glucose quickly; so glycogen in the liver and muscles can release glucose as soon as it is needed. These polysaccharides are large and insoluble, so they do not affect osmosis or leave the cell, which would happen if soluble free glucose were stored. Lipid stores are triglycerides, formed by condensation of glycerol with three fatty acids through ester bonds. Being hydrophobic, they are stored as droplets without associated water in adipose tissue and release about twice as much energy per gram as carbohydrates, so they are the lightest long-term store, an advantage for animals that move. Seeds also store oils, and in animals adipose tissue also provides thermal insulation."}],"hl":false,"mk":16,"mkSL":16},{"qid":3008,"p":"2X","t":"B3.2","also":["B3.1"],"title":"Extended response: transport in animals and plants","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe how capillaries are adapted for the exchange of substances with tissues.","hl":false,"pts":["wall made of a single layer of endothelial cells / very thin wall","short diffusion distance","very narrow lumen: red blood cells pass in single file, very close to the wall","highly branched network: large surface area for exchange","no body cell is far from a capillary","permeable basement membrane / gaps between endothelial cells","fenestrated capillaries with larger pores where exchange is very rapid / e.g. kidney, intestinal villi","blood flows slowly, giving more time for exchange"],"mod":"Capillaries have a wall made of a single layer of very thin endothelial cells resting on a permeable basement membrane, so the diffusion distance between blood and tissues is very short. Their lumen is so narrow that red blood cells pass almost in single file, pressed against the wall. They form highly branched networks, giving a large surface area for exchange and ensuring that no cell is far from a capillary. In some organs, such as the kidney or intestinal villi, capillaries are fenestrated, with pores that allow even faster exchange. In addition, blood flows slowly through them, giving more time for substances to be exchanged."},{"l":"b","m":5,"q":"Distinguish between the structure of arteries and veins.","hl":false,"pts":["arteries: thick wall / veins: thin wall","arteries: thick layer of smooth muscle / veins: thin muscle layer","arteries: many elastic fibres / veins: few elastic fibres","arteries: narrow lumen / veins: wide lumen","the ratio of wall thickness to lumen diameter is greater in arteries","veins: have valves / arteries: no valves (except the semilunar valves where they leave the heart)","in section, arteries keep a circular shape / veins often appear flattened or irregular"],"mod":"Arteries have a much thicker wall than veins, with a wide layer of smooth muscle and abundant elastic fibres, whereas in veins the muscle layer is thin and there are few elastic fibres. The lumen of arteries is relatively narrow and that of veins is wide, so the ratio of wall thickness to lumen diameter is much greater in arteries. Veins have pocket valves along their length, which arteries lack. Finally, in a microscope section arteries keep a circular cross-section, whereas veins often appear flattened or irregular."},{"l":"c","m":7,"q":"Explain how water is transported from the roots to the leaves of a plant.","hl":false,"pts":["water enters the root by osmosis / root hairs increase the surface area for absorption","water evaporates from the walls of spongy mesophyll cells","water vapour diffuses out through the stomata: *transpiration*","transpiration is a consequence of stomata opening for gas exchange / to let CO₂ in","evaporation pulls water from the cell walls and creates *tension* (negative pressure) in the xylem","*cohesion*: water molecules are held together by hydrogen bonds, forming a continuous column","*adhesion*: water is attracted to the hydrophilic xylem walls","the water column moves up as a whole; transport is passive, with no use of ATP","xylem vessels are continuous tubes of dead cells with no contents or end walls","walls thickened with *lignin* resist tension and stop the vessels collapsing","pits in the walls allow lateral movement of water between vessels and into leaf cells","more wind, temperature or light increases transpiration and so the flow of water"],"mod":"Water enters the root from the soil by osmosis, through root hairs that increase the surface area for absorption, and reaches the xylem. In the leaf, water evaporates from the walls of spongy mesophyll cells and the vapour diffuses out through the stomata; this transpiration is an unavoidable consequence of the stomata opening to let CO₂ in. Evaporation pulls water from the cell walls and creates a tension, or negative pressure, that is transmitted to the xylem. Because of cohesion, water molecules are held together by hydrogen bonds and form a continuous column, while adhesion to the hydrophilic xylem walls helps to maintain it; so the whole column moves up passively, with no use of ATP. Xylem vessels are adapted to this mechanism: they are continuous tubes of dead cells with no contents or end walls, so they offer little resistance, and their walls are reinforced with lignin, which prevents them collapsing under tension; pits allow lateral movement of water. The greater the transpiration, for example in wind or heat, the faster the flow of water."}],"hl":false,"mk":16,"mkSL":16},{"qid":3009,"p":"2X","t":"B4.2","also":["B4.1"],"title":"Extended response: nutrition and ecological niches","blocks":[],"parts":[{"l":"a","m":4,"q":"Describe how organisms are classified according to their relationship with oxygen, stating a typical habitat for each type.","hl":false,"pts":["*obligate aerobe*: needs oxygen for aerobic cell respiration","e.g. most animals / well-oxygenated habitats such as air or surface waters","*obligate anaerobe*: cannot use oxygen / oxygen is toxic to it","e.g. bacteria in anoxic sediments / waterlogged soils / the intestine","*facultative anaerobe*: carries out aerobic respiration if oxygen is present and anaerobic respiration (fermentation) if not","e.g. yeast / E. coli in environments with variable oxygen","facultative anaerobes grow faster with oxygen because they obtain more ATP","oxygen requirement is a factor that forms part of the niche"],"mod":"According to their relationship with oxygen, organisms are classified into three groups. Obligate aerobes need oxygen for aerobic cell respiration and live in oxygenated habitats, like most animals in air or surface waters. Obligate anaerobes cannot use oxygen and it is even toxic to them, so they live only in anoxic environments, such as lake-bottom sediments, waterlogged soils or the intestine. Facultative anaerobes, such as yeast or E. coli, carry out aerobic respiration when oxygen is present and anaerobic respiration when it is not, so they tolerate environments with variable oxygen, although they grow faster with oxygen because they obtain more ATP. Oxygen availability is therefore one dimension of each species' niche."},{"l":"b","m":5,"q":"Explain how the different adaptations of plants for harvesting light allow them to occupy different niches in a forest.","hl":false,"pts":["light is a limited resource in a forest and decreases from the canopy to the ground","trees: tall woody trunks that raise the leaves to the canopy, in full light","lianas: climbing stems that use trees for support, without investing in their own trunk","epiphytes: grow on tree branches, obtain light without roots in the soil / take water from rain or humidity","stranglers: start as epiphytes and their roots grow down to the soil and surround the host tree","shade-tolerant understorey plants: large thin leaves / more chlorophyll to use little light","each strategy occupies a different layer: direct competition for light is reduced / different niches"],"mod":"In a forest, light is a limited resource that decreases sharply from the canopy to the ground, and plants show different adaptations for harvesting it. Trees invest in tall woody trunks that raise their leaves to the canopy, where they receive full light. Lianas climb using trees for support, so they reach the light without spending resources on a trunk of their own. Epiphytes grow on branches, obtaining light without roots in the soil and taking water from rain or humidity, and stranglers start as epiphytes and then send roots down to the soil that surround the host tree. In the understorey, shade-tolerant plants have large, thin leaves with plenty of chlorophyll to make use of the little light available. Because each strategy uses light in a different layer, the species occupy different niches and direct competition between them is reduced."},{"l":"c","m":7,"q":"Discuss how competition between species can make the realized niche of a species smaller than its fundamental niche.","hl":false,"pts":["the niche is the role of a species: habitat, interactions and the biotic and abiotic conditions it needs","*fundamental niche*: the full set of conditions in which the species could live and reproduce","the fundamental niche depends on the ranges of tolerance for abiotic factors","*realized niche*: the part of the fundamental niche the species actually occupies in the presence of other species","if the niches of two species overlap, they compete for limited resources","*competitive exclusion principle*: two species cannot occupy the same niche indefinitely","the less competitive species is eliminated locally or restricted to part of its fundamental niche","evidence: when one species is removed, the other extends its distribution / specific example (e.g. barnacles on a rocky shore)","resource partitioning (different food, height or time of activity) allows coexistence","factors other than competition also reduce the niche: predators, disease, lack of mutualists","the fundamental niche is hard to measure in nature / it is inferred from removal or laboratory experiments"],"mod":"The niche of a species is its role in the ecosystem: the habitat, the biotic and abiotic conditions it needs and its interactions with other species. The fundamental niche is the full set of conditions in which the species could survive and reproduce, and it depends mainly on its ranges of tolerance for abiotic factors such as temperature or salinity. In nature, however, the species occupies only part of this: its realized niche. When the niches of two species overlap, both compete for limited resources and, according to the competitive exclusion principle, they cannot occupy the same niche indefinitely; the less competitive species is eliminated locally or restricted to the zone where the other does not outcompete it. This is shown by removal experiments, such as with barnacles on a rocky shore: when the dominant species is removed, the other extends its distribution into zones it did not previously occupy. Species often coexist because they partition resources, for example feeding at different heights or at different times. However, competition is not the only factor: predation, disease or the absence of mutualists can also reduce the realized niche, and the fundamental niche is hard to measure directly, so it is usually inferred from experiments."}],"hl":false,"mk":16,"mkSL":16},{"qid":3010,"p":"2X","t":"B1.2","also":["C1.1"],"title":"Extended response: proteins and denaturation","blocks":[],"parts":[{"l":"a","m":4,"q":"Draw a labelled diagram of a dipeptide showing the bond formed between the two amino acids.","hl":false,"pts":["a central carbon in each amino acid bonded to an H atom and an R group","different R groups labelled (R₁ and R₂)","free amine group (–NH₂) at one end","free carboxyl group (–COOH) at the other end","*peptide bond* –CO–NH– drawn and labelled between the C of the carboxyl of one amino acid and the N of the amine of the other","water molecule shown as a product of condensation"],"mod":"The diagram should show two amino acids linked in a chain: each with a central carbon atom bonded to a hydrogen atom and an R group, labelled R₁ and R₂ to indicate that they can differ. At one end of the molecule there is a free amine group (–NH₂) and at the other a free carboxyl group (–COOH). Between the two amino acids the peptide bond (–CO–NH–) is drawn and labelled, joining the carbon of the carboxyl group of the first amino acid to the nitrogen of the amine group of the second, and it is shown that a molecule of water is released in the condensation reaction."},{"l":"b","m":5,"q":"Outline why an almost unlimited variety of polypeptides is possible.","hl":false,"pts":["ribosomes use 20 different amino acids to make polypeptides","amino acids can be linked in any order / sequence","chain length varies greatly / from a few to thousands of amino acids","the number of possible sequences is 20ⁿ (n = number of amino acids)","e.g. there are 20³ = 8000 possible tripeptides / a polypeptide of 100 amino acids has 20¹⁰⁰ possible sequences","the sequence is coded by genes, which the cell translates","each different sequence can fold into a different shape and function"],"mod":"Ribosomes make polypeptides from 20 different amino acids, which can be linked in any order. In addition, chain length varies greatly, from a few amino acids to thousands. The number of possible sequences for a chain of n amino acids is 20ⁿ: there are already 20³ = 8000 possible tripeptides, and for a polypeptide of 100 amino acids the figure, 20¹⁰⁰, is astronomical. The particular sequence of each polypeptide is coded by a gene, and since each sequence can fold into a different shape, this variety allows an enormous diversity of functions."},{"l":"c","m":7,"q":"Explain the effects of high temperatures and extremes of pH on the structure of proteins and on the activity of enzymes.","hl":false,"pts":["the function of a protein depends on its three-dimensional shape","this shape is held by relatively weak bonds within the molecule","high temperatures increase vibration of the molecule and break these bonds","extremes of pH change the charges on the protein and also break these bonds","the protein is *denatured*: it loses its three-dimensional shape, usually permanently","peptide bonds are not broken / the amino acid sequence is unchanged","soluble proteins may become insoluble / e.g. egg white when cooked","in an enzyme the shape of the *active site* changes, so the substrate no longer fits","fewer enzyme–substrate complexes form and the rate of reaction falls","below the optimum, higher temperature increases collisions and activity / above it, denaturation makes activity fall","each enzyme has an optimum pH / e.g. pepsin in the stomach works at acidic pH","some proteins from thermophilic organisms are stable at high temperatures"],"mod":"The function of a protein depends on its three-dimensional shape, which is held by relatively weak bonds within the molecule. High temperatures increase the vibration of the molecule and break these bonds, and extremes of pH alter the charges on the protein and also break them. In both cases the protein is denatured: it loses its three-dimensional shape, usually permanently, although peptide bonds are not broken and the amino acid sequence is unchanged. Soluble proteins may even become insoluble, like egg white when it is cooked. In an enzyme, denaturation changes the shape of the active site, so the substrate no longer fits, fewer enzyme–substrate complexes form and the rate of reaction falls. So as temperature rises, activity at first increases because there are more collisions, but above the optimum denaturation makes it fall sharply. Similarly, each enzyme has an optimum pH: pepsin in the stomach works at acidic pH, whereas other enzymes are denatured in those conditions. Some proteins from thermophilic organisms are stable even at very high temperatures."}],"hl":false,"mk":16,"mkSL":16},{"qid":3011,"p":"1B","t":"B2.3","also":["B2.1"],"title":"Agar cube size and diffusion","blocks":[{"k":"p","v":"Agar cubes were stained pink with an indicator that becomes colourless in acid. The cubes were immersed in hydrochloric acid and the time taken for each cube to become completely colourless was measured. Each size was repeated three times."},{"k":"table","cap":"Time for complete decolourization of agar cubes","rows":[["Side of cube / cm","Surface area-to-volume ratio / cm⁻¹","Trial 1 / s","Trial 2 / s","Trial 3 / s","Mean / s"],["0.5","12","130","124","127","127"],["1.0","6","488","512","506","?"],["2.0","?","1950","2080","2010","2013"]]}],"parts":[{"l":"a","m":1,"q":"Calculate the surface area-to-volume ratio of the cube with 2.0 cm sides.","hl":false,"pts":["24 cm² ÷ 8 cm³ = 3 cm⁻¹"],"mod":""},{"l":"b","m":2,"q":"Calculate the percentage increase in mean decolourization time from the 0.5 cm cube to the 1.0 cm cube. Show your working.","hl":false,"pts":["mean for the 1.0 cm cube = (488 + 512 + 506) ÷ 3 = 502 s","(502 − 127) ÷ 127 × 100 = 295% (accept 290–300%)"],"mod":""},{"l":"c","m":1,"q":"Identify the independent variable in this experiment.","hl":false,"pts":["cube size / side length / surface area-to-volume ratio"],"mod":""},{"l":"d","m":2,"q":"Suggest two improvements to the method that would increase the reliability of the results.","hl":false,"pts":["use the same concentration and volume of acid for all cubes / enough acid to cover the cubes","keep temperature constant / use a thermostatically controlled water bath","cut cubes precisely / with a mould or ruler","use a white background / the same observer to judge the end point of the colour change","carry out more repeats (5 or more) / more cube sizes"],"mod":""},{"l":"e","m":3,"q":"Explain how these results help us understand why cell size is limited.","hl":false,"pts":["as size increases, the surface area-to-volume ratio decreases","the rate at which substances enter depends on surface area / diffusion is slow over long distances","acid takes much longer to reach the centre of large cubes / distance to the centre increases","a cell's demand for substances depends on its volume","in a large cell, the surface would not allow materials (O₂, nutrients, waste) to be exchanged fast enough","so cells divide as they grow / remain small"],"mod":"As the side of the cube increases from 0.5 to 2.0 cm, the surface area-to-volume ratio decreases from 12 to 3 cm⁻¹ and the decolourization time rises from 127 s to about 2013 s, because the acid must diffuse a much greater distance to the centre and the surface through which it enters is small relative to the volume. The same happens in a cell: the rate of exchange of substances depends on the surface area of the membrane, while the need for O₂ and nutrients and the production of waste depend on volume. If a cell grew too large, its surface would not allow materials to be exchanged quickly enough, so cells remain small or divide as they grow."}],"hl":false,"mk":9,"mkSL":9},{"qid":3012,"p":"1B","t":"B3.1","also":["C1.2"],"title":"Lung ventilation during exercise","blocks":[{"k":"p","v":"Ventilation rate and tidal volume were measured in 12 students at rest and while pedalling an exercise bike at three intensities. Values are means ± standard deviation."},{"k":"table","cap":"Ventilation rate and tidal volume at different exercise intensities","rows":[["Intensity","Ventilation rate / breaths min⁻¹","Tidal volume / dm³"],["Rest","14 ± 2","0.5 ± 0.1"],["Light","20 ± 3","1.2 ± 0.2"],["Moderate","28 ± 4","1.9 ± 0.3"],["Intense","40 ± 6","2.4 ± 0.4"]]}],"parts":[{"l":"a","m":2,"q":"Calculate the volume of air ventilated per minute during intense exercise. Show your working.","hl":false,"pts":["40 breaths min⁻¹ × 2.4 dm³","= 96 dm³ min⁻¹"],"mod":""},{"l":"b","m":2,"q":"Using the standard deviations, discuss whether the difference in ventilation rate between light and moderate exercise is likely to be significant.","hl":false,"pts":["light: 17–23; moderate: 24–32 breaths min⁻¹","the ranges of mean ± SD do not overlap","so the difference is probably significant / a statistical test (e.g. t-test) would be needed to confirm it"],"mod":""},{"l":"c","m":1,"q":"Identify one variable that should be kept constant between the students.","hl":false,"pts":["time exercising before measuring / bike resistance at each intensity / posture / room temperature / similar health or fitness / no eating just before"],"mod":""},{"l":"d","m":3,"q":"Explain why ventilation rate and tidal volume increase during exercise.","hl":false,"pts":["muscles increase aerobic cell respiration to produce more ATP","more oxygen is used and more CO₂ is produced","greater ventilation keeps O₂ concentration high and CO₂ concentration low in the alveoli","so steep concentration gradients are maintained for diffusion between alveoli and blood","the rise in blood CO₂ is detected and the respiratory centre increases the rate / intercostal muscles and diaphragm contract more strongly"],"mod":"During exercise, muscles increase aerobic cell respiration to produce more ATP, so they use more oxygen and produce more CO₂. Increasing the ventilation rate and tidal volume renews the air in the alveoli more quickly, so the O₂ concentration stays high and the CO₂ concentration stays low. This keeps the concentration gradients steep, so oxygen diffuses into the blood and CO₂ into the alveoli as fast as needed. The rise in blood CO₂ is detected and stimulates the diaphragm and intercostal muscles to contract more often and more strongly."}],"hl":false,"mk":8,"mkSL":8},{"qid":3013,"p":"1B","t":"B4.1","also":["D4.1"],"title":"Salt tolerance in two populations of a plant","blocks":[{"k":"p","v":"Seeds of one plant species were collected from a coastal population and from an inland population. 50 seeds from each population were placed on dishes with NaCl solutions of different concentrations and the percentage that germinated after 10 days was counted."},{"k":"chart","type":"line","title":"Seed germination at different NaCl concentrations","x":"NaCl concentration / mmol dm⁻³","y":"Germination / %","s":[{"n":"Coastal population","pts":[[0,92],[100,90],[200,85],[300,70],[400,40],[500,10]]},{"n":"Inland population","pts":[[0,94],[100,80],[200,45],[300,12],[400,0],[500,0]]}]}],"parts":[{"l":"a","m":1,"q":"State the percentage germination of the inland population at 200 mmol dm⁻³ NaCl.","hl":false,"pts":["45%"],"mod":""},{"l":"b","m":2,"q":"Calculate the percentage change in germination of the coastal population between 0 and 400 mmol dm⁻³ NaCl.","hl":false,"pts":["(40 − 92) ÷ 92 × 100","= −56.5% / a decrease of 57% (accept 56–57%)"],"mod":""},{"l":"c","m":2,"q":"Compare the ranges of salt tolerance of the two populations.","hl":false,"pts":["both germinate best with no or little salt / similar germination (≈ 92–94%) at 0 mmol dm⁻³","germination decreases as salt increases in both","the coastal population has a wider range of tolerance / germinates up to 500 mmol dm⁻³, the inland one does not germinate from 400","germination of the inland population falls sooner / more steeply"],"mod":""},{"l":"d","m":2,"q":"Suggest two variables that should be controlled in this experiment.","hl":false,"pts":["temperature","light intensity / duration","volume of solution in each dish / prevent evaporation","age / size of seeds / seeds collected at the same time","type of substrate / filter paper in the dishes"],"mod":""},{"l":"e","m":2,"q":"Suggest how the greater salt tolerance of the coastal population could have arisen.","hl":false,"pts":["there was variation in salt tolerance within the original population","on the coast, the more tolerant plants survived and reproduced more / *natural selection*","they passed on alleles for tolerance to their offspring, which increased in frequency over time"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3014,"p":"2X","t":"C4.2","also":["C1.3","C1.2","D4.3"],"title":"Extended response: energy and carbon in ecosystems","blocks":[],"parts":[{"l":"a","m":4,"q":"Distinguish between photoautotrophs, chemoautotrophs and heterotrophs.","hl":false,"pts":["autotrophs synthesize their own carbon compounds from *CO₂* / inorganic sources","photoautotrophs use *light energy* (photosynthesis)","example of photoautotroph: plants / algae / cyanobacteria","chemoautotrophs use energy from *oxidation reactions* of inorganic substances","example of chemoautotroph: iron-oxidizing / sulfur-oxidizing bacteria / bacteria at hydrothermal vents","heterotrophs obtain carbon compounds from *other organisms* (living or dead)","examples of heterotrophs: consumers / decomposers / animals / fungi"],"mod":"Autotrophs make their carbon compounds from CO₂ and other inorganic substances, whereas heterotrophs obtain them from other organisms, as consumers do by feeding or decomposers (for example, fungi) do by digesting dead organic matter. Autotrophs differ in their energy source: photoautotrophs, such as plants, algae and cyanobacteria, use light energy in photosynthesis; chemoautotrophs, such as iron-oxidizing bacteria, obtain energy from oxidation reactions of inorganic substances."},{"l":"b","m":5,"q":"Explain why energy pyramids are pyramid-shaped and why this limits the length of food chains.","hl":false,"pts":["each bar represents energy passing to a trophic level per unit area per unit time (kJ m⁻² year⁻¹)","only a small proportion (around *10 %*) of energy passes to the next level","most is lost as *heat* from cell respiration","some is not consumed / not eaten (roots, bones) or not absorbed and lost in faeces","energy in remains and faeces passes to decomposers","heat cannot be converted back to chemical energy / energy is not recycled","after a few levels too little energy remains to support another population","so there are rarely more than 4–5 trophic levels"],"mod":"An energy pyramid shows the energy passing to each trophic level per unit area per unit time, for example in kJ m⁻² year⁻¹. Each bar is narrower than the one below because only about 10 % of the energy passes to the next level. Most is lost as heat from cell respiration, which cannot be converted back into chemical energy; some is not eaten or not absorbed and is lost in faeces, and that energy passes to decomposers. Because so much energy is lost at each transfer, after a few levels too little remains to support a viable population of another predator, so food chains rarely exceed four or five levels."},{"l":"c","m":7,"q":"Discuss how human activities have altered the balance between carbon sources and sinks, using the Keeling curve as evidence.","hl":false,"pts":["a sink absorbs more carbon than it releases / a source releases more than it absorbs","photosynthesis removes CO₂ and cell respiration returns it; globally they were roughly balanced","examples of sinks: growing forests / oceans / peat / sediments","*combustion* of fossil fuels releases carbon stored for millions of years","deforestation / burning biomass releases CO₂ and reduces photosynthesis (sink)","draining / burning peat turns a sink into a source","the *Keeling curve* shows a continuous rise in CO₂ concentration since 1958 (from about 315 to over 420 ppm)","the annual oscillation is due to more photosynthesis in the northern hemisphere summer","the upward trend shows emissions exceed uptake by sinks","oceans absorb some of the extra CO₂ but become acidified","consequence: enhanced greenhouse effect / climate change","limitation: the curve shows correlation with emissions, not cause on its own / it is a single site (Mauna Loa)"],"mod":"In the carbon cycle, photosynthesis removes CO₂ from the atmosphere and cell respiration returns it; globally the two processes were roughly balanced. A sink, such as a growing forest, peat or the ocean, absorbs more carbon than it releases, whereas a source releases more than it absorbs. Human activities have broken this balance. Combustion of coal, oil and natural gas releases in a few years carbon that was stored for millions of years. Deforestation and burning biomass release CO₂ and also remove photosynthesis, so a sink becomes a source; the same happens when peat is drained and burned. The Keeling curve, measured at Mauna Loa since 1958, is the evidence: CO₂ has risen continuously from about 315 ppm to over 420 ppm. Its annual oscillation reflects northern hemisphere summer photosynthesis, but the upward trend shows that emissions exceed what sinks absorb. Oceans absorb some of the excess, although they become acidified, and the rest enhances the greenhouse effect and climate change. It must be acknowledged that the curve on its own shows a correlation with emissions and comes from a single site, although other stations show the same pattern."}],"hl":false,"mk":16,"mkSL":16},{"qid":3015,"p":"2X","t":"C4.1","also":["B4.2","A4.2"],"title":"Extended response: populations and communities","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline how the population size of a plant species in a field can be estimated using quadrats.","hl":false,"pts":["the total area of the field is measured","quadrats are placed *randomly* (coordinates from random numbers)","individuals of the species are counted in each quadrat","many quadrats are used / repeated for a representative sample","mean per quadrat is calculated and divided by quadrat area (density)","estimated population = mean density × total area","suitable for sessile / non-moving organisms"],"mod":"First, the total area of the field is measured. Quadrats are then placed randomly, for example using coordinates from random numbers, to avoid bias in choosing where to sample. Individuals of the species are counted in each quadrat, and many quadrats are used so that the sample is representative. The mean per quadrat is calculated, divided by quadrat area to give density per m², and multiplied by the total area. The method suits sessile organisms such as plants."},{"l":"b","m":4,"q":"Describe the phases of a sigmoid population growth curve.","hl":false,"pts":["exponential phase: population grows increasingly fast","plentiful resources / few limiting factors / birth rate far exceeds death rate","transitional phase: growth slows","*density-dependent* factors increase (competition, predation, disease)","plateau phase: birth + immigration = death + emigration","population fluctuates around the *carrying capacity*"],"mod":"At first there is an exponential phase: resources are plentiful and there are few limiting factors, so the birth rate far exceeds the death rate and the population grows increasingly fast. Then comes a transitional phase in which growth slows, because density-dependent factors increase, such as competition for food, predation and disease. Finally, in the plateau phase, births plus immigration equal deaths plus emigration and the population fluctuates around the carrying capacity of the environment."},{"l":"c","m":8,"q":"Explain how an invasive species can affect endemic species and how it could be tested whether it competes with one of them.","hl":false,"pts":["an endemic species is found only in a particular geographical area","the invasive species has been introduced (by humans) and spreads rapidly","it lacks natural predators / pathogens / competitors in the new area","*interspecific competition* for resources (food, light, space) with endemic species","if *niches* overlap it may exclude the endemic species (competitive exclusion)","it may prey on endemic species that have no defences / adaptations against it","it may bring diseases / hybridize with endemic species","consequence: decline / extinction of endemics and loss of biodiversity","laboratory test: grow each species alone and together under the same conditions","field test: remove the invasive species from plots and compare with control plots","if the endemic grows / increases more without the invasive species, there is competition","use replicates / random plots and a statistical test / chi-squared association in quadrats","a negative association suggests competition but does not prove it alone"],"mod":"An endemic species is found only in a particular area, whereas an invasive species has been introduced, usually by humans, and spreads rapidly because in the new area it lacks its natural predators, pathogens and competitors. It can affect endemic species in several ways. If its niche overlaps with that of an endemic species, there will be interspecific competition for food, light or space, and the more abundant invader may exclude it. It may also prey on endemic species that have not evolved defences against it, transmit diseases to them or hybridize with them. The result can be decline or extinction of endemic species and loss of biodiversity. To test for competition, a laboratory experiment can grow each species alone and both together under identical conditions, or a field experiment can remove the invader from randomly chosen plots and compare them with control plots. If the endemic species grows or reproduces more without the invader, there is competition. Replicates and a statistical test are needed; in quadrat sampling a chi-squared test can show a negative association, although this suggests competition without proving it on its own."}],"hl":false,"mk":16,"mkSL":16},{"qid":3016,"p":"2X","t":"C3.1","also":["C2.2","B3.1"],"title":"Extended response: integration and control of the body","blocks":[],"parts":[{"l":"a","m":3,"q":"Outline how the hypothalamus and pituitary gland control the endocrine system.","hl":false,"pts":["hypothalamus receives information / monitors the blood and links the nervous and endocrine systems","neurosecretory cells of the hypothalamus release hormones / releasing factors","these stimulate the anterior *pituitary* to secrete hormones","posterior pituitary releases hormones made in the hypothalamus (ADH / oxytocin)","pituitary hormones act on other endocrine glands (e.g. TSH on thyroid, FSH/LH on gonads)"],"mod":"The hypothalamus monitors the blood, receives information from other parts of the brain and links the nervous and endocrine systems. Its neurosecretory cells release hormones that stimulate the anterior pituitary to secrete its own hormones, such as TSH or FSH and LH, which in turn act on other glands such as the thyroid or gonads. The posterior pituitary also stores and releases hormones made in the hypothalamus, such as ADH and oxytocin."},{"l":"b","m":5,"q":"Explain how the ventilation rate is adjusted during exercise.","hl":false,"pts":["cell respiration increases in muscles and produces more *CO₂*","CO₂ forms carbonic acid and lowers blood *pH*","*chemoreceptors* in aorta / carotid arteries / medulla detect the fall in pH","impulses sent to the respiratory centre in the *medulla*","medulla sends impulses along nerves to the diaphragm and intercostal muscles","more frequent / stronger contractions increase ventilation rate and depth","more CO₂ removed and more O₂ taken in; pH returns to normal (negative feedback)","stretch receptors in the lungs prevent over-inflation"],"mod":"During exercise, cell respiration increases in the muscles, which produce more CO₂. This forms carbonic acid in the blood and lowers the pH. Chemoreceptors in the aorta, carotid arteries and the medulla itself detect the fall in pH and send impulses to the respiratory centre in the medulla. From there nerve impulses travel to the diaphragm and intercostal muscles, which contract more often and more strongly, so ventilation rate and depth increase. More CO₂ is removed, more O₂ enters and the pH returns to normal, an example of negative feedback; stretch receptors in the lungs prevent over-inflation."},{"l":"c","m":8,"q":"Compare and contrast nervous and hormonal control in the integration of body systems, with an example of each.","hl":false,"pts":["both coordinate / integrate body systems and respond to stimuli","both use *chemical signals* that bind to specific receptors (neurotransmitters / hormones)","both are coordinated by the brain / hypothalamus and can use negative feedback","nervous: electrical impulses along neurons / hormonal: hormones carried in the blood","nervous: very rapid response (milliseconds) / hormonal: slower","nervous: short-lived effect / hormonal: longer-lasting effect","nervous: targeted at specific cells (muscles / glands) / hormonal: affects all cells with receptors, often in several organs","nervous: effectors are muscles and glands / hormonal: can change metabolism / growth / development","nervous example: pain reflex arc / control of heart rate by the medulla","hormonal example: epinephrine prepares for activity / melatonin and sleep / insulin and glucose","they work together: e.g. sympathetic nervous system stimulates adrenal release of epinephrine","the hypothalamus links both systems"],"mod":"The nervous and endocrine systems share the same overall role: integrating the activity of body systems and responding to stimuli. Both use chemical signals that bind to specific receptors on target cells, neurotransmitters at synapses and hormones in the endocrine system, and both are coordinated by the brain, especially the hypothalamus, and often work by negative feedback. The differences are clear. The nervous system transmits electrical impulses along neurons, so the response is very rapid, in milliseconds, short-lived and targeted at specific cells such as a muscle or gland; an example is the reflex arc that withdraws the hand from a hot object. Hormones travel in the blood, so the response is slower but longer-lasting and affects all cells with the receptor, often in several organs; for example, epinephrine simultaneously increases heart rate, ventilation and glucose release to prepare the body for activity. The two systems are not independent: the sympathetic nervous system stimulates the adrenal glands to release epinephrine, and the hypothalamus links both."}],"hl":false,"mk":16,"mkSL":16},{"qid":3017,"p":"2X","t":"C2.2","also":["B2.1","C1.2"],"title":"Extended response: neurons and membranes","blocks":[],"parts":[{"l":"a","m":4,"q":"Outline the structure of a myelinated motor neuron and the function of its parts.","hl":false,"pts":["*dendrites*: receive signals from other neurons","cell body with nucleus: contains most organelles / synthesizes proteins","*axon*: long extension that carries the impulse away from the cell body","*myelin* sheath (Schwann cells): insulates the axon / increases speed","nodes of Ranvier: gaps in the myelin","axon terminals / synaptic knobs: release neurotransmitter to the muscle"],"mod":"A motor neuron has dendrites that receive signals from other neurons and a cell body containing the nucleus and most organelles, where proteins are synthesized. From it a long axon carries the impulse away from the cell body to the muscle. The axon is surrounded by a myelin sheath formed by Schwann cells, which insulates it and increases impulse speed, interrupted by nodes of Ranvier. At the end, axon terminals release neurotransmitter at the synapse with the muscle fibre."},{"l":"b","m":4,"q":"Explain why nerve impulses travel faster in some axons than in others.","hl":false,"pts":["myelinated axons conduct faster than unmyelinated axons","myelin insulates the membrane: ions only cross at *nodes of Ranvier*","the impulse jumps from node to node instead of depolarizing the whole membrane","axons of larger *diameter* conduct faster","less resistance to ion flow inside the axon","e.g. mammalian myelinated axons about 100 m s⁻¹ against ≈1 m s⁻¹ in thin unmyelinated axons / squid giant axon"],"mod":"Speed depends mainly on myelination and axon diameter. In a myelinated axon the myelin sheath insulates the membrane, so ions can only cross it at the nodes of Ranvier; the impulse jumps from one node to the next instead of depolarizing every point of the membrane, which makes it much faster: about 100 m s⁻¹ in mammalian myelinated axons, against about 1 m s⁻¹ in thin unmyelinated axons. Also, the larger the axon diameter, the lower the resistance to ion flow inside it and the faster the impulse travels, as in the squid giant axon, which compensates in this way for its lack of myelin."},{"l":"c","m":8,"q":"Explain how neural signalling depends on membrane proteins and on transport across membranes.","hl":false,"pts":["the *sodium–potassium pump* carries out active transport: 3 Na⁺ out and 2 K⁺ in","uses *ATP* from cell respiration","creates concentration gradients and the resting potential (about –70 mV)","*voltage-gated* sodium channels open and Na⁺ enters by facilitated diffusion: depolarization","voltage-gated potassium channels open and K⁺ leaves: repolarization","channels are specific to one ion","at the presynaptic terminal *calcium* channels open and Ca²⁺ enters","vesicles fuse with the membrane and release neurotransmitter by *exocytosis* (membrane fluidity)","neurotransmitter diffuses and binds to specific protein *receptors* on the postsynaptic membrane","receptors are ligand-gated channels: Na⁺ enters giving an excitatory postsynaptic potential","an enzyme (acetylcholinesterase) breaks down the neurotransmitter / transporter proteins reabsorb it","the phospholipid bilayer is impermeable to ions, so proteins are needed"],"mod":"The phospholipid bilayer is impermeable to ions, so all neural signalling depends on membrane proteins. The sodium–potassium pump carries out active transport: using the energy of one ATP molecule, produced in cell respiration, it pumps three Na⁺ out and two K⁺ in. This creates concentration gradients and, together with the greater permeability to K⁺, the resting potential of about –70 mV. During an action potential, voltage-gated sodium channels, specific to Na⁺, open and Na⁺ enters by facilitated diffusion, depolarizing the membrane; then voltage-gated potassium channels open and the exit of K⁺ repolarizes it. When the impulse reaches the presynaptic terminal, calcium channels open and the entry of Ca²⁺ causes vesicles to fuse with the membrane, thanks to its fluidity, releasing neurotransmitter by exocytosis. The neurotransmitter diffuses and binds to specific protein receptors on the postsynaptic membrane, which are ligand-gated channels: when they open Na⁺ enters and an excitatory postsynaptic potential is produced. Finally, an enzyme such as acetylcholinesterase breaks down the neurotransmitter, or transporter proteins reabsorb it, so that the signal ends."}],"hl":false,"mk":16,"mkSL":16},{"qid":3018,"p":"1B","t":"C1.3","also":["C1.1"],"title":"Floating leaf discs","blocks":[{"k":"p","v":"Discs were cut from spinach leaves, the air was removed from them with a syringe and they were placed in sodium hydrogen carbonate solution (a source of CO₂), where they sank. They were lit by a lamp at different distances and the time taken for each disc to float was measured. Ten discs were used per distance."},{"k":"table","cap":"Time taken for discs to float","rows":[["Distance from lamp / cm","Mean time / s","Standard deviation / s"],["10","180","25"],["20","250","30"],["30","400","70"],["40","640","160"]]},{"k":"chart","type":"bar","title":"Mean time taken for discs to float","x":"Distance from lamp / cm","y":"Mean time / s","s":[{"n":"Mean time","pts":[["10",180],["20",250],["30",400],["40",640]]}]}],"parts":[{"l":"a","m":1,"q":"State the independent variable in this experiment.","hl":false,"pts":["distance from the lamp / *light intensity*"],"mod":""},{"l":"b","m":2,"q":"Calculate the rate of photosynthesis at 20 cm, using rate = 1/time.","hl":false,"pts":["1 ÷ 250","= 0.004 s⁻¹ / 4.0 × 10⁻³ s⁻¹ (units required)"],"mod":""},{"l":"c","m":2,"q":"Explain why the discs eventually float.","hl":false,"pts":["photosynthesis produces *oxygen*","oxygen accumulates in the air spaces of the spongy mesophyll","disc density decreases / becomes lower than that of the solution","the faster the photosynthesis, the sooner the disc floats"],"mod":""},{"l":"d","m":2,"q":"Deduce, using the standard deviations, whether the difference between 10 cm and 20 cm is likely to be significant.","hl":false,"pts":["10 cm: 155–205 s; 20 cm: 220–280 s (mean ± SD)","the ranges do not overlap","so the difference is probably significant / would need confirming with a statistical test (t-test)"],"mod":""},{"l":"e","m":2,"q":"Suggest two improvements to the method to make the results more reliable.","hl":false,"pts":["use a heat filter / a water screen between lamp and discs, because a close lamp heats them","control temperature with a water bath / thermometer","measure light intensity with a light meter instead of distance","carry out the experiment in a dark room / with no other light","use discs from the same leaf / leaves of the same age and the same hydrogen carbonate concentration","more discs or repeats at 40 cm, where variability is very large"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3019,"p":"1B","t":"C4.1","also":["C1.2"],"title":"Growth of a yeast population","blocks":[{"k":"p","v":"Yeast was inoculated into a closed flask containing 100 cm³ of glucose solution at 25 °C. Each day the flask was shaken, a sample was taken and the cells were counted with a haemocytometer."},{"k":"chart","type":"line","title":"Yeast population in the flask","x":"Time / days","y":"Cell density / 10⁶ cells cm⁻³","s":[{"n":"Yeast","pts":[[0,0.5],[1,1.2],[2,3.0],[3,7.5],[4,14.0],[5,19.0],[6,21.5],[7,22.0],[8,22.0]]}]}],"parts":[{"l":"a","m":1,"q":"Estimate the carrying capacity of this flask.","hl":false,"pts":["22 × 10⁶ cells cm⁻³ (accept 21.5–22)"],"mod":""},{"l":"b","m":2,"q":"Calculate the mean rate of population growth between day 2 and day 4.","hl":false,"pts":["(14.0 − 3.0) ÷ 2","= 5.5 × 10⁶ cells cm⁻³ day⁻¹"],"mod":""},{"l":"c","m":3,"q":"Explain the shape of the curve between day 4 and day 8.","hl":false,"pts":["growth slows and the population reaches a plateau","*density-dependent* factors act","glucose runs out / intraspecific competition for glucose","ethanol / toxic products of anaerobic cell respiration accumulate","birth (division) rate equals death rate"],"mod":"Until day 4 the population grows rapidly, but between days 4 and 8 growth slows and a plateau of about 22 × 10⁶ cells cm⁻³ is reached. As density increases, density-dependent factors act: the yeast cells compete for a limited amount of glucose and, as the flask is closed, ethanol from anaerobic cell respiration accumulates, which is toxic. The division rate therefore falls and the death rate rises until they are equal, and the population stays at the carrying capacity."},{"l":"d","m":2,"q":"Suggest how the reliability of the haemocytometer counts could be improved.","hl":false,"pts":["count several squares and calculate the mean","take several samples / repeat with several flasks","mix well before sampling so cells are evenly distributed","dilute very dense samples so cells can be counted","stain with methylene blue to distinguish live and dead cells"],"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":3020,"p":"1B","t":"C3.2","also":["D4.1"],"title":"Antibiotic discs and zones of inhibition","blocks":[{"k":"p","v":"A bacterium was spread on agar plates and four paper discs 6 mm in diameter were placed on each plate, each soaked in a different antibiotic (P, Q, R and S) at the same concentration. After 48 hours at 30 °C the diameter of the clear zone around each disc was measured on five plates."},{"k":"table","cap":"Diameter of clear zone / mm","rows":[["Antibiotic","Plate 1","Plate 2","Plate 3","Plate 4","Plate 5","Mean","Standard deviation"],["P","24","26","23","25","27","25.0","1.6"],["Q","12","15","10","14","14","13.0","2.0"],["R","18","20","17","21","19","?","1.6"],["S","6","6","6","6","6","6.0","0.0"]]}],"parts":[{"l":"a","m":1,"q":"Identify the dependent variable.","hl":false,"pts":["the diameter of the clear zone / zone of inhibition"],"mod":""},{"l":"b","m":1,"q":"Calculate the mean diameter for antibiotic R.","hl":false,"pts":["95 ÷ 5 = 19.0 mm"],"mod":""},{"l":"c","m":2,"q":"Evaluate the conclusion that P is more effective than R against this bacterium.","hl":false,"pts":["mean ± SD: P 23.4–26.6 mm, R 17.4–20.6 mm; no overlap, so the difference is probably significant","supports the conclusion: larger zone = more bacteria inhibited / killed","but zone size also depends on how fast each antibiotic diffuses through the agar (molecular size)","only one concentration / one strain was tested / in vitro, not in a patient"],"mod":""},{"l":"d","m":2,"q":"Suggest two reasons why there is no clear zone around disc S.","hl":false,"pts":["the bacterium is *resistant* to S (e.g. has a gene / enzyme that inactivates it)","S acts on a structure / pathway this bacterium does not have","S does not diffuse through the agar / the disc did not absorb the antibiotic","S was degraded / out of date at 30 °C over 48 h"],"mod":""},{"l":"e","m":2,"q":"Describe a suitable control and one variable that should be kept constant.","hl":false,"pts":["control: disc soaked in sterile water / in the solvent without antibiotic","shows that the disc or solvent alone does not inhibit the bacterium","constant variable: antibiotic concentration / disc size / volume absorbed","or: incubation temperature and time / density of the bacterial lawn / depth of agar"],"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":3021,"p":"2X","t":"D3.2","also":["D4.1"],"title":"Extended response: alleles, genes and environment","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Outline the inheritance of ABO blood groups.","pts":["the gene has *multiple alleles*: Iᴬ, Iᴮ and i","Iᴬ and Iᴮ are *codominant*: in the heterozygote IᴬIᴮ both are expressed (group AB)","i is recessive to Iᴬ and Iᴮ","group A = IᴬIᴬ or Iᴬi; group B = IᴮIᴮ or Iᴮi; group O = ii","the alleles determine antigens on the surface of red blood cells","example: Iᴬi × Iᴮi can give children of all four groups (A, B, AB and O) in a 1:1:1:1 ratio"],"mod":"The ABO blood group is controlled by a gene with multiple alleles: Iᴬ, Iᴮ and i, which determine the antigens on the surface of red blood cells. Iᴬ and Iᴮ are codominant, so the heterozygote IᴬIᴮ expresses both antigens and is group AB, while i is recessive. So group A can be IᴬIᴬ or Iᴬi, group B IᴮIᴮ or Iᴮi, and group O only ii. For example, Iᴬi and Iᴮi parents can have children of all four groups in a 1:1:1:1 ratio."},{"l":"b","m":5,"hl":false,"q":"Explain how a recessive allele causes phenylketonuria (PKU) and how the condition is treated.","pts":["PKU is an *autosomal recessive* condition","caused by a mutated allele of the gene for the enzyme that converts phenylalanine (into tyrosine)","homozygous recessive individuals produce no functional enzyme","*phenylalanine* builds up in the blood and tissues","damages brain development / causes intellectual disability","heterozygotes are healthy *carriers*: one functional allele produces enough enzyme","detected in newborns by a heel-prick blood test","treated with a *diet* low in phenylalanine (environment modifies the phenotype)"],"mod":"Phenylketonuria is an autosomal recessive condition caused by a mutated allele of the gene for the enzyme that converts phenylalanine into tyrosine. Homozygous recessive individuals produce no functional enzyme, so phenylalanine builds up in the blood and damages brain development, causing intellectual disability. Heterozygotes are healthy carriers because their functional allele produces enough enzyme. The condition is detected in newborns by a heel-prick blood test and treated with a diet low in phenylalanine, which prevents the symptoms: an example of the environment modifying the phenotype."},{"l":"c","m":7,"hl":false,"q":"Discuss the relative influence of genes and the environment on phenotype.","pts":["*phenotype* results from the interaction of genotype with the environment","some traits depend almost entirely on genotype, such as ABO blood group","others, although genetic in origin, are modified by the environment: PKU is prevented by diet","*continuous variation* (height, skin colour) is *polygenic*: many genes with additive effects","and also depends on the environment: height on nutrition, skin colour on exposure to UV radiation","*phenotypic plasticity*: one genotype produces different phenotypes in different environments","changes due to plasticity are not inherited because the alleles do not change","identical twins have the same genotype, so their differences are due to the environment","natural selection acts on phenotype, but only genetic variation is inherited and allows evolution","conclusion: the relative importance varies with the trait"],"mod":"Phenotype results from the interaction between genotype and environment, but the weight of each varies with the trait. Some, such as ABO blood group, depend almost entirely on genotype. Others are genetic in origin but can be modified by the environment: phenylketonuria is due to two recessive alleles, but a diet low in phenylalanine prevents its symptoms. Traits showing continuous variation, such as height or skin colour, are polygenic, because many genes add their effects, and they also depend on the environment: height on nutrition and skin colour on exposure to UV radiation. Phenotypic plasticity shows that one genotype can produce different phenotypes depending on the environment, and identical twins, with the same genotype, differ because of environmental factors. These changes are not inherited because they do not alter the alleles; so although natural selection acts on phenotype, only genetic variation contributes to evolution."}],"hl":false,"mk":16,"mkSL":16},{"qid":3022,"p":"2X","t":"D3.1","also":["C3.1"],"title":"Extended response: human reproduction","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Distinguish between sexual and asexual reproduction.","pts":["asexual: one parent; sexual: usually two parents","sexual: *gametes* produced by meiosis fuse at *fertilization*; asexual: no gametes, by mitosis","asexual: genetically identical offspring (*clones*); sexual: genetically varied offspring","asexual: faster / needs less energy / no need to find a mate","sexual: variation favours adaptation to changing environments","asexual: advantageous in stable environments"],"mod":"In asexual reproduction there is a single parent and offspring are produced by mitosis, without gametes, so they are genetically identical: they are clones. In sexual reproduction there are usually two parents that produce gametes by meiosis, and these fuse at fertilization, producing genetically varied offspring. Asexual reproduction is faster and does not require finding a mate, which is advantageous in stable environments, whereas the variation from sexual reproduction favours adaptation to changing environments."},{"l":"b","m":5,"hl":false,"q":"Describe the events of fertilization in humans.","pts":["sperm swim through the uterus to the *oviduct*, where the oocyte usually is","a sperm reaches the layer around the oocyte / *zona pellucida*","*acrosome reaction*: enzymes from the acrosome digest the zona pellucida","the sperm binds to receptors on the oocyte membrane","the sperm and oocyte *membranes* fuse and the sperm nucleus enters","the chromosomes of both gametes combine / a diploid *zygote* is formed"],"mod":"After ejaculation, sperm swim through the uterus to the oviduct, where the oocyte is usually found. When a sperm reaches the zona pellucida around the oocyte, the acrosome reaction occurs: the acrosome releases enzymes that digest this layer and make a path. The sperm binds to receptors on the oocyte membrane, the two membranes fuse and the sperm nucleus enters. Then changes in the zona pellucida prevent more sperm from entering, and the chromosomes of both gametes combine to form a diploid zygote."},{"l":"c","m":7,"hl":false,"q":"Explain the use of hormones in in vitro fertilization (IVF), comparing it with the hormonal control of the natural menstrual cycle.","pts":["in the natural cycle, *FSH* from the pituitary stimulates follicle development, usually one matures","oestradiol from follicles triggers the *LH* surge, which causes ovulation","*progesterone* from the corpus luteum maintains the endometrium","in IVF a drug is first given to stop pituitary secretion of FSH and LH","so the timing of the cycle is controlled / spontaneous ovulation is prevented","then high doses of FSH are injected so that *many follicles* develop (superovulation)","an injection of *hCG* (acts like LH) completes oocyte maturation about 36 h before collection","oocytes are collected and fertilized with sperm in the laboratory","one or two embryos are transferred to the uterus","progesterone is given to maintain the endometrium and help implantation"],"mod":"In the natural menstrual cycle, FSH from the pituitary stimulates the development of follicles, of which usually one matures; the oestradiol it produces triggers an LH surge that causes ovulation, and afterwards progesterone from the corpus luteum maintains the endometrium. In IVF this system is taken under control. First a drug is given that stops the pituitary secreting FSH and LH, to control the timing of the cycle and prevent spontaneous ovulation. Then FSH is injected at much higher doses than natural, so many follicles develop at once. An injection of hCG, which acts like the LH surge, completes oocyte maturation about 36 hours before collection. The oocytes are fertilized in the laboratory, one or two embryos are transferred to the uterus and progesterone is given to maintain the endometrium, as the corpus luteum does in the natural cycle."}],"hl":false,"mk":16,"mkSL":16},{"qid":3023,"p":"2X","t":"D3.3","also":["C1.2"],"title":"Extended response: control of the internal environment","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Outline the role of negative feedback in homeostasis.","pts":["*homeostasis* = keeping the internal environment within narrow limits","each variable has a *set point* (for example, 37 °C)","*receptors* detect a change from the set point","a control centre (hypothalamus, pancreas) sends nervous or hormonal signals","*effectors* produce a response that reverses the change","the variable fluctuates slightly around the set point","unlike positive feedback, which amplifies the change"],"mod":"Homeostasis is keeping the internal environment within narrow limits around a set point, such as 37 °C for temperature. It is based on negative feedback: receptors detect a deviation from the set point, a control centre such as the hypothalamus or pancreas sends nervous or hormonal signals, and effectors produce a response that reverses the change. So the variable fluctuates slightly around the set point, unlike positive feedback, which amplifies the change."},{"l":"b","m":4,"hl":false,"q":"Compare and contrast the roles of insulin and glucagon.","pts":["both are hormones secreted by the islets of the *pancreas*","both act on the liver / regulate *blood glucose* by negative feedback","insulin is secreted by β cells; glucagon by α cells","insulin is secreted when blood glucose is high; glucagon when it is low","insulin stimulates glucose uptake by cells (muscle, adipose tissue)","insulin stimulates *glycogen* synthesis; glucagon stimulates its breakdown to glucose","insulin lowers blood glucose; glucagon raises it (antagonistic effects)"],"mod":"Insulin and glucagon are hormones secreted by the islets of the pancreas that regulate blood glucose by negative feedback, and both act on the liver. However, insulin is produced by β cells when blood glucose is high, whereas glucagon is produced by α cells when it is low. Insulin stimulates glucose uptake by cells and glycogen synthesis in the liver and muscles, lowering blood glucose; glucagon stimulates the breakdown of glycogen to glucose and raises it. They therefore have antagonistic effects."},{"l":"c","m":8,"hl":false,"q":"Explain how a mammal generates and conserves heat when the external temperature is low.","pts":["*thermoreceptors* in the skin (and hypothalamus) detect the fall in temperature","the *hypothalamus* acts as the control centre for thermoregulation","*vasoconstriction* of skin arterioles: less blood reaches the surface","less heat is lost by radiation / conduction from the skin","*hair erection*: traps an insulating layer of air","*shivering*: rapid muscle contractions that increase cell respiration","cell respiration releases some of the energy as heat","*brown adipose tissue* has many mitochondria and carries out uncoupled respiration","the energy is released as heat instead of being used to produce ATP","*thyroxine* increases metabolic rate / heat production","the layer of subcutaneous fat acts as insulation","all of this is negative feedback: as temperature returns to the set point, the responses decrease"],"mod":"When the external temperature falls, thermoreceptors in the skin detect the drop and send impulses to the hypothalamus, which acts as the control centre. To conserve heat, skin arterioles constrict (vasoconstriction), so less blood reaches the surface and less heat is lost by radiation; in addition, hair erection traps an insulating layer of air and subcutaneous fat reduces heat loss. To generate heat, shivering occurs: rapid muscle contractions that increase cell respiration, which releases some of the energy as heat. Brown adipose tissue, with many mitochondria, carries out uncoupled respiration, in which energy is released as heat instead of producing ATP. Thyroxine increases metabolic rate and therefore heat production. This is an example of negative feedback: when temperature returns to the set point, these responses decrease."}],"hl":false,"mk":16,"mkSL":16},{"qid":3024,"p":"2X","t":"D4.3","also":["D4.2","C4.2"],"title":"Extended response: ecosystems, carbon and climate","blocks":[],"parts":[{"l":"a","m":4,"hl":false,"q":"Describe how mesocosms can be used to investigate the stability of ecosystems.","pts":["*mesocosm* = small enclosed ecosystem set up for experiments (for example, a sealed jar or aquarium)","contains producers, consumers and *decomposers* with soil or water","receives light as an energy supply, but matter is recycled inside","a single variable is changed (for example, light, temperature, presence of decomposers)","other variables are kept constant / replicates and a control are used","monitored over weeks to see whether populations / O₂ remain stable","ethical consideration: avoid suffering of any animals included"],"mod":"A mesocosm is a small enclosed ecosystem set up for experiments, such as a sealed jar or an aquarium with soil or water, producers, consumers and decomposers. It receives light as an energy supply, but matter must be recycled inside. To investigate stability, a single variable is changed, for example light or the presence of decomposers, keeping the others constant and using replicates and a control, and it is monitored over weeks to see whether populations or O₂ concentration remain stable. Suffering of any animals included must be avoided."},{"l":"b","m":5,"hl":false,"q":"Explain how positive feedback cycles can accelerate global warming.","pts":["*positive feedback* amplifies a change instead of reversing it","warming melts ice and snow, reducing *albedo*","the dark surface (water, soil) absorbs more radiation and warms more, which melts more ice","thawing of *permafrost* allows decomposition of previously frozen organic matter","*methane* and CO₂ are released, greenhouse gases that increase warming","droughts cause more forest *fires*, which release CO₂","boreal forests may switch from carbon sinks to carbon sources","a *tipping point* may be reached beyond which the change is hard to reverse"],"mod":"Positive feedback amplifies a change instead of reversing it. Warming melts ice and snow and reduces albedo, so dark water and soil absorb more radiation, warm more and melt even more ice. Thawing of permafrost allows organic matter that was frozen to decompose, releasing methane and CO₂, greenhouse gases that intensify warming. In addition, droughts increase forest fires, which release CO₂, and boreal forests may switch from carbon sinks to sources. A tipping point may be reached beyond which the change is hard to reverse."},{"l":"c","m":7,"hl":false,"q":"Discuss afforestation and peatland restoration as methods of carbon sequestration.","pts":["*photosynthesis* fixes atmospheric CO₂ into carbon compounds in biomass","*afforestation* = planting forests on land without them; trees store carbon in wood and soil for decades","if native species are used, it also creates habitat and increases biodiversity","in *peatlands* the waterlogged soil is anaerobic / acidic, so decomposition is very slow","so organic matter accumulates and stores carbon for thousands of years","draining peatlands releases CO₂ as peat oxidizes; rewetting them stops these emissions","limitation: forests can burn or die from drought and pests and return the carbon","plantation monocultures have low biodiversity","sequestration is slow (decades) and competes with land use for agriculture","rewetted peatlands may emit some methane at first","they do not replace reducing fossil fuel emissions"],"mod":"Both strategies make use of the carbon cycle. In afforestation, forests are planted on land that did not have them; by photosynthesis, trees fix atmospheric CO₂ and store the carbon in wood and soil for decades, and if native species are used they also create habitat. In peatlands, waterlogged soil is anaerobic and acidic, so decomposition is very slow and organic matter accumulates, storing carbon for thousands of years; when they are drained, the peat oxidizes and releases CO₂, so rewetting them stops these emissions. However, there are limitations: forests can burn or die from droughts and pests and return the carbon to the atmosphere; monoculture plantations have low biodiversity; sequestration is slow and competes with agricultural land; and rewetted peatlands may emit some methane at first. They are useful measures, but they do not replace reducing fossil fuel emissions."}],"hl":false,"mk":16,"mkSL":16},{"qid":3025,"p":"1B","t":"D3.3","also":[],"title":"A glucose tolerance test","blocks":[{"k":"p","v":"Two adults, X and Y, fasted for 10 hours and then drank a solution containing 75 g of glucose. Their blood glucose concentration was measured every 30 minutes. One of the two people has type 2 diabetes."},{"k":"chart","type":"line","title":"Blood glucose after drinking 75 g of glucose","x":"Time / min","y":"Blood glucose / mmol dm⁻³","s":[{"n":"Person X","pts":[[0,5.0],[30,8.2],[60,7.0],[90,5.8],[120,5.2],[150,5.0]]},{"n":"Person Y","pts":[[0,7.2],[30,12.4],[60,14.0],[90,13.1],[120,11.6],[150,10.2]]}]}],"parts":[{"l":"a","m":1,"hl":false,"q":"State the fasting blood glucose concentration of person Y.","pts":["7.2 mmol dm⁻³"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calculate the percentage increase in blood glucose of person Y between 0 min and its maximum value.","pts":["(14.0 − 7.2) ÷ 7.2 × 100","= 94.4 %","accept 94 %"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Suggest why both people were asked to fast and to drink the same amount of glucose.","pts":["so that starting blood glucose does not depend on a recent meal","so that the only factor changing blood glucose is the glucose drunk / *controlled variable*","so the curves of the two people can be compared"],"mod":""},{"l":"d","m":3,"hl":false,"q":"Explain the difference between the curves of X and Y, identifying which person has type 2 diabetes.","pts":["Y has type 2 diabetes: higher fasting glucose / higher and later peak / does not return to starting value","in X, the rise in glucose stimulates β cells to secrete *insulin*","insulin makes cells take up glucose and the liver form glycogen, so X returns to 5.0 mmol dm⁻³ in about 120–150 min","in type 2 diabetes cells are *insulin resistant* / respond less to insulin","so glucose is removed slowly from the blood in Y"],"mod":"Person Y has type 2 diabetes: their fasting blood glucose is already high (7.2 mmol dm⁻³), it reaches a higher and later peak (14.0 at 60 min) and at 150 min it is still well above the starting value. In X, the rise in glucose stimulates the β cells of the pancreas to secrete insulin, which makes body cells take up glucose and the liver store it as glycogen, so blood glucose returns to 5.0 mmol dm⁻³. In type 2 diabetes the cells are insulin resistant, so glucose is removed from the blood very slowly."}],"hl":false,"mk":8,"mkSL":8},{"qid":3026,"p":"1B","t":"D3.1","also":["C1.1"],"title":"Temperature and seed germination","blocks":[{"k":"p","v":"A student placed 20 radish seeds on damp filter paper in each of three Petri dishes per temperature, in incubators at different temperatures. After 5 days the germinated seeds in each dish were counted."},{"k":"table","cap":"Seeds germinated out of 20 per dish after 5 days","rows":[["Temperature / °C","Dish 1","Dish 2","Dish 3"],["5","2","1","3"],["10","8","10","9"],["15","15","16","14"],["20","18","19","17"],["25","19","18","20"],["30","14","12","13"],["35","4","5","3"]]}],"parts":[{"l":"a","m":1,"hl":false,"q":"Identify the independent variable.","pts":["*temperature*"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calculate the mean percentage germination at 20 °C.","pts":["mean = (18 + 19 + 17) ÷ 3 = 18 seeds","18 ÷ 20 × 100","= 90 %"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Deduce the optimum temperature for germination of these seeds, justifying your answer using the data.","pts":["25 °C (accept 20–25 °C)","at 25 °C the mean is highest: 19 out of 20 = 95 %","germination decreases below (5–15 °C) and above (30–35 °C) this temperature"],"mod":""},{"l":"d","m":2,"hl":false,"q":"Explain the low germination at 5 °C.","pts":["germination depends on *enzymes* that mobilize the seed's food reserves","at low temperature molecules have less kinetic energy / fewer enzyme–substrate collisions","cell respiration is slow and little ATP is available for growth of the embryo"],"mod":""},{"l":"e","m":2,"hl":false,"q":"Suggest two variables that the student should control and how to do so.","pts":["volume of *water* added to each dish (same volume, measured with a measuring cylinder / pipette)","species / batch / age of seeds (same packet)","exposure to light (all incubators dark / same lighting)","type of filter paper / number of seeds per dish / incubation time"],"mod":""}],"hl":false,"mk":9,"mkSL":9},{"qid":3027,"p":"1B","t":"D4.3","also":[],"title":"An alpine plant moving up the mountain","blocks":[{"k":"p","v":"In a mountain range, the mean altitude of the lower limit of distribution of an alpine plant species was recorded every 10 years on 12 slopes. The mean July temperature at a nearby weather station was also recorded."},{"k":"table","cap":"Lower limit of the plant and mean July temperature","rows":[["Year","Mean altitude of lower limit / m","Mean July temperature / °C"],["1990","2150","9.8"],["2000","2185","10.1"],["2010","2230","10.6"],["2020","2270","11.0"]]}],"parts":[{"l":"a","m":1,"hl":false,"q":"State the total change in altitude of the lower limit between 1990 and 2020.","pts":["increased by 120 m (from 2150 to 2270 m)"],"mod":""},{"l":"b","m":2,"hl":false,"q":"Calculate the mean rate of shift of the lower limit in metres per decade.","pts":["120 m ÷ 3 decades","= 40 m per decade","correct unit (m per decade)"],"mod":""},{"l":"c","m":2,"hl":false,"q":"Evaluate whether these data show that the rise in temperature caused the shift.","pts":["there is a positive *correlation*: as temperature rises (1.2 °C), the limit rises","but correlation does not imply *causation*","other factors could be involved (grazing, competition, land-use change) / only 4 data points / only one weather station"],"mod":""},{"l":"d","m":3,"hl":false,"q":"Explain why mountain species shift to higher altitudes with global warming and why this may threaten them.","pts":["each species has a range of thermal *tolerance*","as it warms, lower areas exceed their tolerance / species from lower, warmer zones move up and displace them by *competition*","higher areas become suitable, so the range shifts upslope","available area decreases with altitude / the habitat shrinks","on reaching the summit they cannot move higher: risk of local *extinction*"],"mod":"Each species lives within a range of thermal tolerance. With global warming, the lower parts of its range exceed this tolerance and, in addition, species from lower, warmer altitudes move up and compete with it, while higher areas, previously too cold, become suitable. So the range shifts upslope. This threatens it because the available area decreases with altitude, so its habitat shrinks, and when it reaches the summit it cannot move any higher, with a risk of local extinction."}],"hl":false,"mk":8,"mkSL":8}]},"es":{"topics":[{"c":"A1.1","n":"Agua","hl":false},{"c":"A1.2","n":"Ácidos nucleicos","hl":false},{"c":"A2.1","n":"Origen de las células","hl":true},{"c":"A2.2","n":"Estructura celular","hl":false},{"c":"A2.3","n":"Virus","hl":true},{"c":"A3.1","n":"Diversidad de los organismos","hl":false},{"c":"A3.2","n":"Clasificación y cladística","hl":true},{"c":"A4.1","n":"Evolución y especiación","hl":false},{"c":"A4.2","n":"Conservación de la biodiversidad","hl":false},{"c":"B1.1","n":"Glúcidos y lípidos","hl":false},{"c":"B1.2","n":"Proteínas","hl":false},{"c":"B2.1","n":"Membranas y transporte de membrana","hl":false},{"c":"B2.2","n":"Orgánulos y compartimentación","hl":false},{"c":"B2.3","n":"Especialización celular","hl":false},{"c":"B3.1","n":"Intercambio de gases","hl":false},{"c":"B3.2","n":"Transporte","hl":false},{"c":"B3.3","n":"Músculos y motilidad","hl":true},{"c":"B4.1","n":"Adaptación al ambiente","hl":false},{"c":"B4.2","n":"Nichos ecológicos","hl":false},{"c":"C1.1","n":"Enzimas y metabolismo","hl":false},{"c":"C1.2","n":"Respiración celular","hl":false},{"c":"C1.3","n":"Fotosíntesis","hl":false},{"c":"C2.1","n":"Señalización química","hl":true},{"c":"C2.2","n":"Señalización neural","hl":false},{"c":"C3.1","n":"Integración de los sistemas corporales","hl":false},{"c":"C3.2","n":"Defensa contra las enfermedades","hl":false},{"c":"C4.1","n":"Poblaciones y comunidades","hl":false},{"c":"C4.2","n":"Transferencias de energía y materia","hl":false},{"c":"D1.1","n":"Replicación del ADN","hl":false},{"c":"D1.2","n":"Síntesis de proteínas","hl":false},{"c":"D1.3","n":"Mutación y edición génica","hl":false},{"c":"D2.1","n":"División celular y nuclear","hl":false},{"c":"D2.2","n":"Expresión génica","hl":true},{"c":"D2.3","n":"Potencial hídrico","hl":false},{"c":"D3.1","n":"Reproducción","hl":false},{"c":"D3.2","n":"Herencia","hl":false},{"c":"D3.3","n":"Homeostasis","hl":false},{"c":"D4.1","n":"Selección natural","hl":false},{"c":"D4.2","n":"Estabilidad y cambio","hl":false},{"c":"D4.3","n":"Cambio climático","hl":false}],"ct":[["Defina","Escribe el significado exacto de un término, en una o dos oraciones.",1],["Dibuje","Haz un diagrama o gráfico limpio, exacto y rotulado, a lápiz y con líneas rectas trazadas con regla.",1],["Rotule","Escribe los nombres de las partes en un diagrama que se te da.",1],["Enumere","Escribe varias respuestas cortas, una tras otra, sin explicación.",1],["Mida","Obtén un valor usando una regla, una escala o un instrumento.",1],["Indique","Da una respuesta corta, como un nombre o un número, sin explicación.",1],["Anote","Agrega notas breves a un diagrama o gráfico para explicar sus partes.",2],["Calcule","Obtén un número y muestra los pasos de tu procedimiento.",2],["Describa","Da una explicación detallada de cómo es algo o de lo que ocurre.",2],["Distinga","Señala las diferencias entre dos o más cosas.",2],["Estime","Obtén un valor aproximado.",2],["Identifique","Elige la respuesta correcta entre varias posibilidades.",2],["Resuma","Da un resumen breve de los puntos principales.",2],["Analice","Descompón la información para mostrar sus partes o patrones clave.",3],["Comente","Da tu juicio sobre una afirmación o sobre el resultado de un cálculo.",3],["Compare","Muestra en qué se parecen dos o más cosas, mencionando cada una en cada punto.",3],["Compare y contraste","Muestra semejanzas y diferencias, mencionando cada elemento en cada punto.",3],["Construya","Presenta inf
