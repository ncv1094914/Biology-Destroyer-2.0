 un solo sentido. Las arterias tienen paredes gruesas con fibras elásticas que se retraen entre latidos y mantienen la presión, y su músculo liso puede dirigir más sangre a los tejidos activos. En los tejidos, los capilares tienen paredes de una sola capa de células y forman redes muy ramificadas cerca de cada célula, lo que da una gran superficie y una distancia de difusión corta para que el oxígeno pase a las células. El oxígeno se transporta unido a la hemoglobina de los glóbulos rojos, que no tienen núcleo y son bicóncavos, así que llevan más hemoglobina y el gas difunde rápidamente. Las venas, con luz amplia y válvulas, devuelven la sangre al corazón, y durante el ejercicio la frecuencia cardíaca aumenta para entregar aún más oxígeno a los músculos."}],"hl":true,"mk":16,"mkSL":16},{"qid":261,"p":"2X","t":"B4.1","also":["B4.2","D4.2"],"title":"Respuesta extensa: adaptación y ecología","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma cómo afectan los factores abióticos a la distribución de las especies.","pts":["cada especie tiene un *rango de tolerancia* para cada factor abiótico, con un óptimo y unos límites","factores abióticos: temperatura, disponibilidad de agua, intensidad de luz, pH, salinidad, nutrientes del suelo","una especie solo se encuentra donde todos los factores están dentro de su rango de tolerancia","fuera del rango, la supervivencia / el crecimiento / la reproducción disminuyen o son imposibles","el factor más alejado del óptimo actúa como *factor limitante* que restringe la distribución","ejemplo: los corales formadores de arrecifes necesitan agua cálida, clara (luz para las zooxantelas) y poco profunda / la temperatura limita la altitud de las especies de montaña","los transectos y el muestreo con cuadrantes permiten relacionar la distribución con los gradientes de factores abióticos"],"hl":false,"mod":"Cada especie tiene un rango de tolerancia para cada factor abiótico, como la temperatura, el agua, la luz, el pH o la salinidad. Solo puede sobrevivir y reproducirse donde todos estos factores están dentro de ese rango, así que su distribución queda limitada por el factor más alejado de su óptimo, que actúa como factor limitante. Por ejemplo, los corales formadores de arrecifes solo se encuentran en aguas cálidas, claras y poco profundas, porque sus algas simbiontes necesitan luz y no toleran temperaturas bajas."},{"l":"b","m":4,"q":"Describa adaptaciones de depredadores y presas.","pts":["depredadores: velocidad / agilidad para perseguir a la presa (p. ej., guepardo)","depredadores: dientes / garras / picos afilados para capturar y matar","depredadores: sentidos agudos (ojos frontales para visión binocular, ecolocalización, olfato) para localizar presas","depredadores: camuflaje para acechar / veneno / caza en grupo","presas: *camuflaje* / mimetismo para no ser detectadas","presas: ojos laterales para un campo visual amplio / velocidad para huir","presas: *coloración de advertencia* asociada a toxinas / sabor desagradable, espinas o caparazones","presas: vida en grupo (más ojos vigilantes, efecto de dilución)"],"hl":false,"mod":"Los depredadores tienen adaptaciones para localizar y capturar presas: sentidos agudos, como los ojos frontales que dan visión binocular para calcular distancias, velocidad para perseguir, como el guepardo, y dientes o garras afilados para matar; algunos usan camuflaje para acechar o veneno. Las presas, en cambio, tienen adaptaciones para evitar ser detectadas o capturadas: camuflaje, ojos laterales que dan un campo visual amplio y velocidad para huir. Otras tienen toxinas y coloración de advertencia que los depredadores aprenden a evitar, o viven en grupos, donde más individuos vigilan y el riesgo de cada uno disminuye."},{"l":"c","m":8,"q":"Evalúe los métodos usados para restaurar y conservar los ecosistemas.","pts":["*renaturalización* (rewilding): reintroducción de superdepredadores / especies clave, p. ej., lobos en Yellowstone","ventaja: restaura las *cascadas tróficas* (menos ciervos, recuperación de la vegetación de ribera) / procesos naturales sin intervención continua","limitación: conflictos con ganaderos y agricultores / resultados impredecibles / requiere grandes áreas y mucho tiempo","conservación *in situ*: las reservas naturales protegen el hábitat y todas las especies con sus interacciones","limitación de las reservas: pueden ser pequeñas / aisladas, y necesitan gestión y vigilancia frente a la caza furtiva","los *corredores* conectan hábitats fragmentados y permiten el flujo génico","la eliminación de *especies invasoras* permite recuperar especies autóctonas, aunque es cara y a veces imposible de completar","conservación *ex situ*: bancos de semillas, zoológicos y jardines botánicos conservan material genético y permiten la cría para reintroducción","limitación de ex situ: poblaciones pequeñas con poca *diversidad genética* / pérdida del comportamiento natural / no conserva el ecosistema","cuotas de pesca / caza sostenibles y control de la contaminación (p. ej., reducir los fertilizantes para evitar la eutrofización)","el éxito depende del seguimiento a largo plazo, la financiación y el apoyo / la participación de la población local","conclusión justificada: ningún método basta por sí solo; combinar in situ (prioritario) con ex situ como respaldo es lo más eficaz"],"hl":false,"mod":"La renaturalización, como la reintroducción de lobos en Yellowstone, puede restaurar cascadas tróficas: al reducirse la población de ciervos se recuperó la vegetación de ribera, y el ecosistema pasó a funcionar sin intervención continua. Sin embargo, genera conflictos con los ganaderos, necesita grandes áreas y sus resultados son lentos e impredecibles. La conservación in situ en reservas protege el hábitat completo y las interacciones entre especies, y los corredores reducen la fragmentación y permiten el flujo génico, aunque muchas reservas son pequeñas y necesitan vigilancia. La eliminación de especies invasoras permite que las autóctonas se recuperen, pero es cara y difícil de completar. La conservación ex situ, en bancos de semillas y zoológicos, conserva material genético y permite la cría para reintroducción, pero las poblaciones son pequeñas, con poca diversidad genética, pueden perder su comportamiento natural y no se conserva el ecosistema. Las cuotas de explotación sostenible y el control de la contaminación abordan las causas del declive. En conclusión, el éxito de todos los métodos depende del seguimiento y del apoyo local, y lo más eficaz es combinar la conservación in situ como prioridad con la ex situ como respaldo."}],"hl":false,"mk":16,"mkSL":16},{"qid":262,"p":"2X","t":"C1.1","also":["C1.2"],"title":"Respuesta extensa: enzimas y metabolismo","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa el modelo de encaje inducido de la acción enzimática.","pts":["el sustrato choca con la enzima (movimiento molecular aleatorio) y se une al *sitio activo*","al principio la forma del sitio activo no es exactamente complementaria a la del sustrato","al unirse el sustrato, el sitio activo / la enzima cambia ligeramente de forma y se ajusta más al sustrato (*encaje inducido*)","se forma un complejo enzima–sustrato","el cambio de forma tensiona / debilita enlaces del sustrato","esto reduce la *energía de activación*, así que la reacción ocurre más rápido","los productos se liberan y el sitio activo recupera su forma original","la enzima no cambia y puede reutilizarse / el modelo explica que algunas enzimas actúen sobre varios sustratos parecidos"],"hl":false,"mod":"El sustrato choca con la enzima por el movimiento aleatorio de las moléculas y se une al sitio activo, cuya forma al principio no es exactamente complementaria. Al unirse, el sitio activo cambia ligeramente de forma y se ajusta más estrechamente al sustrato: esto es el encaje inducido, y se forma un complejo enzima–sustrato. Este cambio de forma tensiona y debilita enlaces del sustrato, lo que reduce la energía de activación y acelera la reacción. Finalmente los productos se liberan, el sitio activo recupera su forma original y la enzima, sin cambios, puede volver a usarse."},{"l":"b","m":4,"q":"Explique cómo pueden controlarse las rutas metabólicas.","pts":["las rutas metabólicas son cadenas / ciclos de reacciones y cada paso lo cataliza una *enzima específica*","la velocidad de la ruta depende de la cantidad / actividad de sus enzimas (por ejemplo, regulando la expresión de sus genes)","*inhibición por producto final* / retroalimentación: el producto final inhibe la primera enzima de la ruta","el producto final se une a un *sitio alostérico* de la enzima, no al sitio activo","esto cambia la forma del sitio activo y el sustrato ya no puede unirse (inhibición no competitiva)","la inhibición es reversible: cuando baja la concentración del producto final, este se separa y la ruta se reactiva","así la ruta se apaga cuando abunda el producto y no se malgastan energía / sustratos ni se acumulan intermediarios","ejemplo: la isoleucina inhibe la treonina desaminasa, primera enzima de la ruta de treonina a isoleucina"],"hl":false,"mod":"Una ruta metabólica es una cadena de reacciones en la que cada paso lo cataliza una enzima específica, de modo que la ruta puede controlarse regulando sus enzimas. El mecanismo principal es la inhibición por producto final: el producto final de la ruta se une a un sitio alostérico de la primera enzima, no al sitio activo. Esto cambia la forma del sitio activo y el sustrato ya no puede unirse, es decir, es una inhibición no competitiva. Como la unión es reversible, cuando hay mucho producto final la ruta se detiene y no se malgastan energía ni sustratos, y cuando el producto se consume y su concentración baja, se separa de la enzima y la ruta se reactiva. Un ejemplo es la isoleucina, que inhibe la treonina desaminasa."},{"l":"c","m":8,"q":"Explique las etapas de la respiración celular aeróbica que ocurren en la mitocondria.","pts":["en presencia de oxígeno, el piruvato de la glicólisis se transporta a la *matriz* mitocondrial","reacción de enlace: el piruvato se *descarboxila* (se libera CO₂) y se oxida (se elimina hidrógeno y se reduce NAD)","el grupo acetilo se une a la coenzima A y se forma *acetil-CoA*","ciclo de Krebs (en la matriz): el grupo acetilo (2C) se une a un compuesto de 4C (oxalacetato) y forma uno de 6C (citrato)","el compuesto de 6C se descarboxila dos veces, liberando 2 CO₂, y se regenera el compuesto de 4C","las oxidaciones del ciclo transfieren hidrógeno / electrones al NAD y al FAD: se forman *NAD reducido* y FAD reducido","en cada vuelta del ciclo se forma una pequeña cantidad de ATP (1 ATP) por fosforilación a nivel de sustrato","el NAD y el FAD reducidos ceden electrones a la *cadena de transporte de electrones* de la membrana interna / crestas","al pasar los electrones de un transportador a otro se libera energía que se usa para bombear protones de la matriz al espacio intermembrana","se crea un gradiente de concentración de protones (el espacio intermembrana es pequeño, así que el gradiente se forma rápido)","los protones vuelven a la matriz por difusión a través de la *ATP sintasa* (*quimiosmosis*), que fosforila ADP a ATP (fosforilación oxidativa)","el *oxígeno* es el aceptor final de electrones: se combina con electrones y protones y forma agua","al retirar los electrones, el oxígeno permite que la cadena siga funcionando; sin oxígeno la cadena se detiene","la fosforilación oxidativa produce la mayor parte del ATP de la respiración; las crestas aumentan la superficie para la cadena y la ATP sintasa"],"hl":false,"mod":"Si hay oxígeno, el piruvato producido en la glicólisis se transporta a la matriz mitocondrial. En la reacción de enlace el piruvato se descarboxila, liberando CO₂, y se oxida, reduciendo NAD; el grupo acetilo restante se une a la coenzima A y forma acetil-CoA. En el ciclo de Krebs, que ocurre en la matriz, el grupo acetilo de 2C se une a un compuesto de 4C y forma uno de 6C. Este se descarboxila dos veces, liberando 2 CO₂, hasta regenerar el compuesto de 4C. Las oxidaciones del ciclo producen NAD reducido y FAD reducido, y en cada vuelta se forma 1 ATP por fosforilación a nivel de sustrato.\nEl NAD y el FAD reducidos ceden sus electrones a la cadena de transporte de electrones de la membrana interna. Al pasar los electrones de un transportador a otro se libera energía, que se usa para bombear protones de la matriz al espacio intermembrana. Como este espacio es pequeño, se forma rápidamente un gradiente de protones. Los protones vuelven a la matriz por difusión a través de la ATP sintasa, y esta quimiosmosis aporta la energía para fosforilar ADP a ATP. El oxígeno es el aceptor final de electrones: se combina con electrones y protones y forma agua, lo que mantiene la cadena en funcionamiento. Esta fosforilación oxidativa produce la mayor parte del ATP, y las crestas aumentan la superficie disponible para ella."}],"hl":true,"mk":16,"mkSL":16},{"qid":263,"p":"2X","t":"C1.3","also":["C4.2"],"title":"Respuesta extensa: fotosíntesis","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma cómo puede medirse experimentalmente la velocidad de la fotosíntesis.","pts":["la velocidad se mide como producción de O₂ / consumo de CO₂ / aumento de biomasa por unidad de tiempo","por ejemplo, con una planta acuática (*Elodea* / *Cabomba*): contar burbujas o recoger el O₂ en una probeta invertida / jeringa de gases / tubo capilar por minuto","el consumo de CO₂ puede medirse por el cambio de pH (indicador de hidrogenocarbonato / sonda de pH) / con sensores de O₂ o CO₂ y registradores de datos","se varía la variable independiente, por ejemplo la intensidad de luz cambiando la distancia a la lámpara / la concentración de CO₂ con hidrogenocarbonato de sodio","se controlan las demás variables: temperatura (baño de agua / pantalla de calor), concentración de CO₂, misma planta / masa de planta","se deja que la planta se aclimate a cada condición antes de medir","se repiten las mediciones y se calcula la media"],"hl":false,"mod":"La velocidad de la fotosíntesis se mide como la cantidad de O₂ producido, de CO₂ consumido o el aumento de biomasa por unidad de tiempo. Un método habitual es colocar una planta acuática como Elodea en agua con hidrogenocarbonato de sodio y contar las burbujas por minuto o recoger el O₂ en una jeringa de gases. Para estudiar el efecto de la luz se cambia la distancia entre la lámpara y la planta, mientras se controlan la temperatura con un baño de agua y la concentración de CO₂. Antes de cada medición se deja que la planta se aclimate, y las mediciones se repiten para calcular la media."},{"l":"b","m":4,"q":"Explique las reacciones independientes de la luz (ciclo de Calvin).","pts":["ocurren en el *estroma* del cloroplasto","el CO₂ es fijado por la enzima *Rubisco*","el CO₂ se une a la ribulosa bifosfato (RuBP, 5C) y se forman dos moléculas de *glicerato-3-fosfato* (3C)","el glicerato-3-fosfato se reduce a *triosa fosfato* con NADP reducido (aporta hidrógeno) y ATP (aporta energía) de las reacciones dependientes de la luz","una parte de la triosa fosfato (1 de cada 6) se usa para fabricar glucosa / almidón / sacarosa / otros compuestos de carbono","la mayor parte (5 de cada 6) se usa para *regenerar la RuBP*, con gasto de ATP","la regeneración de la RuBP permite que siga fijándose CO₂ / el ciclo se detiene en la oscuridad cuando se agotan el ATP y el NADP reducido"],"hl":false,"mod":"Las reacciones independientes de la luz ocurren en el estroma. La enzima Rubisco fija el CO₂ uniéndolo a la ribulosa bifosfato (RuBP), un compuesto de 5C, y se forman dos moléculas de glicerato-3-fosfato. Este se reduce a triosa fosfato usando el NADP reducido, que aporta hidrógeno, y el ATP, que aporta energía, ambos procedentes de las reacciones dependientes de la luz. Una pequeña parte de la triosa fosfato se usa para fabricar glucosa, almidón y otros compuestos de carbono, pero la mayor parte se usa, con más ATP, para regenerar la RuBP. Así el ciclo puede seguir fijando CO₂, mientras haya ATP y NADP reducido de las reacciones dependientes de la luz."},{"l":"c","m":8,"q":"Explique cómo fluye la energía y cómo se recicla el carbono en los ecosistemas.","pts":["la luz solar es la principal fuente de energía de la mayoría de los ecosistemas","los productores / autótrofos convierten la energía luminosa en *energía química* de compuestos de carbono mediante la fotosíntesis","la energía química pasa por las cadenas tróficas cuando los consumidores se alimentan","en cada nivel trófico la energía liberada en la respiración celular se pierde como *calor*","el calor no puede convertirse de nuevo en energía química, así que la energía *fluye* y no se recicla / los ecosistemas necesitan un aporte continuo de energía","solo alrededor del 10 % de la energía pasa de un nivel trófico al siguiente, lo que limita el número de niveles tróficos","el carbono, en cambio, se *recicla*: los autótrofos fijan el CO₂ en compuestos de carbono mediante la fotosíntesis","los compuestos de carbono pasan por las cadenas tróficas al alimentarse los consumidores","todos los organismos devuelven CO₂ a la atmósfera / al agua mediante la respiración celular","los saprótrofos / descomponedores digieren la materia orgánica muerta y liberan CO₂","en suelos anegados / sin oxígeno la descomposición es incompleta y se forma turba; a lo largo de millones de años se forman combustibles fósiles","la combustión de biomasa / combustibles fósiles libera CO₂","los sumideros de carbono (bosques, océanos, turberas) almacenan carbono y las fuentes lo liberan","la actividad humana (deforestación, combustión) desequilibra el ciclo y aumenta la concentración de CO₂ atmosférico"],"hl":false,"mod":"La principal fuente de energía de los ecosistemas es la luz solar. Los productores la convierten en energía química almacenada en compuestos de carbono mediante la fotosíntesis, y esta energía pasa por las cadenas tróficas cuando los consumidores se alimentan. En cada nivel trófico gran parte de la energía liberada en la respiración celular se pierde como calor, que no puede convertirse de nuevo en energía química, por lo que solo pasa alrededor del 10 % al nivel siguiente. Por eso la energía fluye a través del ecosistema y no se recicla: hace falta un aporte continuo de luz.\nEl carbono, en cambio, se recicla. Los autótrofos fijan el CO₂ en compuestos de carbono durante la fotosíntesis y estos pasan a los consumidores al alimentarse. Todos los organismos devuelven CO₂ al aire o al agua mediante la respiración celular, y los descomponedores liberan CO₂ al digerir la materia orgánica muerta. Cuando el suelo está anegado, la descomposición es incompleta y se forma turba, que a lo largo de millones de años puede formar combustibles fósiles. Los bosques, los océanos y las turberas actúan como sumideros de carbono, mientras que la combustión de biomasa y combustibles fósiles es una fuente de CO₂. La deforestación y la quema de combustibles fósiles desequilibran el ciclo y aumentan la concentración de CO₂ en la atmósfera."}],"hl":true,"mk":16,"mkSL":16},{"qid":264,"p":"2X","t":"C2.2","also":["C3.1"],"title":"Respuesta extensa: nervios y coordinación","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa cómo se mantiene el potencial de reposo.","pts":["las *bombas de Na⁺/K⁺* transportan activamente 3 Na⁺ hacia fuera y 2 K⁺ hacia dentro en cada ciclo","las bombas usan energía de la hidrólisis del *ATP* (transporte activo)","se crean gradientes de concentración: más Na⁺ fuera y más K⁺ dentro","la membrana es más permeable al K⁺ que al Na⁺ (canales de fuga de K⁺), así que el K⁺ difunde hacia fuera","se acumula más carga positiva fuera que dentro","dentro hay proteínas / iones orgánicos con carga negativa que no pueden salir","el interior queda negativo respecto al exterior: potencial de reposo de unos *–70 mV*"],"hl":false,"mod":"El potencial de reposo se mantiene sobre todo gracias a las bombas de sodio-potasio, que usan la energía del ATP para sacar 3 Na⁺ e introducir 2 K⁺ en cada ciclo. Esto crea gradientes de concentración, con más Na⁺ fuera y más K⁺ dentro, y saca más carga positiva de la que entra. Además, la membrana es mucho más permeable al K⁺ que al Na⁺, así que el K⁺ difunde hacia fuera por canales de fuga. Dentro de la neurona quedan proteínas e iones orgánicos con carga negativa que no pueden salir. Como resultado, el interior es negativo respecto al exterior, con un potencial de reposo de unos –70 mV."},{"l":"b","m":4,"q":"Resuma las funciones del encéfalo y la médula espinal en un reflejo de dolor.","pts":["un receptor de dolor (terminaciones nerviosas libres de la piel) detecta el estímulo y genera un impulso","una *neurona sensitiva* lleva el impulso a la médula espinal (por la raíz dorsal)","en la sustancia gris de la médula espinal hace sinapsis con una *interneurona* / neurona de relevo","la interneurona hace sinapsis con una *neurona motora*, que lleva el impulso a un músculo, que se contrae y retira la parte del cuerpo","la médula espinal coordina la respuesta sin intervención del encéfalo, por lo que es *involuntaria* y rápida (pocas sinapsis)","otras neuronas llevan impulsos por la sustancia blanca de la médula espinal hasta el encéfalo","el encéfalo (corteza cerebral) produce la percepción *consciente* del dolor, después de que ocurra el reflejo","el encéfalo puede inhibir / modificar el reflejo de forma voluntaria o iniciar después acciones voluntarias"],"hl":false,"mod":"Un receptor de dolor de la piel detecta el estímulo y genera un impulso que una neurona sensitiva lleva hasta la médula espinal. En la sustancia gris, la neurona sensitiva hace sinapsis con una interneurona, que a su vez hace sinapsis con una neurona motora. Esta lleva el impulso al músculo, que se contrae y retira la mano. La médula espinal coordina esta respuesta sin intervención del encéfalo, por eso es involuntaria y muy rápida. Al mismo tiempo, otras neuronas llevan impulsos por la médula espinal hasta el encéfalo, que genera la percepción consciente del dolor después del reflejo y puede iniciar luego acciones voluntarias."},{"l":"c","m":8,"q":"Explique cómo viaja un impulso nervioso a lo largo de un axón y a través de una sinapsis.","pts":["si la despolarización alcanza el *umbral* (unos –50 mV), se abren canales de Na⁺ regulados por voltaje","el Na⁺ entra por difusión y el interior se vuelve positivo (despolarización, unos +30 mV)","se cierran los canales de Na⁺ y se abren canales de K⁺ regulados por voltaje; el K⁺ sale por difusión (*repolarización*)","las bombas de Na⁺/K⁺ restablecen después el potencial de reposo","*corrientes locales*: el Na⁺ difunde por el interior del axón hacia la zona contigua y la despolariza hasta el umbral, propagando el potencial de acción","la zona que acaba de despolarizarse está en *periodo refractario*, así que el impulso viaja en un solo sentido","la vaina de *mielina* aísla el axón y el impulso salta de un nódulo de Ranvier a otro (conducción saltatoria), lo que lo hace más rápido","cuando el impulso llega al terminal presináptico, se abren canales de Ca²⁺ regulados por voltaje y entra *Ca²⁺*","el Ca²⁺ hace que las vesículas se fusionen con la membrana presináptica y liberen el *neurotransmisor* (por ejemplo, acetilcolina) por exocitosis","el neurotransmisor difunde a través de la hendidura sináptica","se une a *receptores* de la membrana postsináptica y abre canales iónicos; entra Na⁺ y la membrana se despolariza (potencial postsináptico excitador)","si se alcanza el umbral, se genera un potencial de acción en la neurona postsináptica","el neurotransmisor se elimina de la hendidura (por ejemplo, la acetilcolinesterasa degrada la acetilcolina / se reabsorbe) para que el estímulo termine","las señales excitadoras e inhibidoras de varias neuronas presinápticas se *suman* y determinan si se alcanza el umbral"],"hl":false,"mod":"Cuando una zona del axón se despolariza hasta el umbral, unos –50 mV, se abren canales de Na⁺ regulados por voltaje. El Na⁺ entra por difusión y el interior se vuelve positivo. Después se cierran esos canales y se abren los de K⁺, de modo que el K⁺ sale y la membrana se repolariza; las bombas de Na⁺/K⁺ restablecen luego el potencial de reposo. El Na⁺ que ha entrado difunde por el interior hacia la zona contigua y la despolariza hasta el umbral mediante corrientes locales, de modo que el potencial de acción se propaga. La zona anterior está en periodo refractario, así que el impulso solo avanza en un sentido. En los axones mielinizados el impulso salta de un nódulo de Ranvier a otro (conducción saltatoria) y viaja más rápido.\nAl llegar al terminal presináptico, el impulso abre canales de Ca²⁺ y el Ca²⁺ entra. Esto hace que las vesículas se fusionen con la membrana y liberen el neurotransmisor, por ejemplo acetilcolina, por exocitosis. El neurotransmisor difunde por la hendidura sináptica y se une a receptores de la membrana postsináptica, abriendo canales que dejan entrar Na⁺ y despolarizan la membrana. Si se alcanza el umbral, se genera un potencial de acción en la neurona postsináptica. Las señales excitadoras e inhibidoras que llegan se suman. Finalmente, el neurotransmisor se elimina de la hendidura, por ejemplo la acetilcolinesterasa degrada la acetilcolina, para que la señal no se prolongue."}],"hl":true,"mk":16,"mkSL":16},{"qid":265,"p":"2X","t":"C3.2","also":["D4.1"],"title":"Respuesta extensa: defensa contra las enfermedades","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma las defensas primarias del cuerpo contra los patógenos.","pts":["la *piel* es una barrera física: su capa externa de células muertas queratinizadas es dura y difícil de atravesar","las secreciones de la piel (sebo, sudor) son ácidas / contienen sustancias antimicrobianas que inhiben el crecimiento de patógenos","las *mucosas* de las vías respiratorias, el tubo digestivo y las vías urogenitales secretan moco pegajoso que atrapa patógenos","los *cilios* de las vías respiratorias barren el moco con los patógenos atrapados hacia fuera","la lisozima de las lágrimas / la saliva / el moco rompe las paredes celulares bacterianas","el ácido clorhídrico del estómago mata los patógenos ingeridos con los alimentos","la *coagulación* de la sangre (plaquetas, fibrina) sella los cortes en la piel e impide la entrada de patógenos","son defensas inespecíficas / innatas: actúan igual frente a cualquier patógeno"],"hl":false,"mod":"La primera línea de defensa es la piel, cuya capa externa de células muertas queratinizadas es dura y forma una barrera física; además, sus secreciones son ácidas e inhiben el crecimiento de patógenos. Las mucosas de las vías respiratorias, digestivas y urogenitales secretan moco pegajoso que atrapa patógenos, y en las vías respiratorias los cilios barren ese moco hacia fuera. La lisozima de las lágrimas y la saliva rompe las paredes bacterianas, y el ácido del estómago mata los patógenos de los alimentos. Si la piel se corta, la coagulación sella la herida e impide que entren patógenos. Todas estas defensas son inespecíficas."},{"l":"b","m":4,"q":"Explique cómo la vacunación lleva a la inmunidad de grupo.","pts":["la vacuna contiene *antígenos* (patógeno atenuado / inactivado, fragmentos) o ARNm que codifica un antígeno, sin causar la enfermedad","desencadena una respuesta inmunitaria primaria: se activan linfocitos B específicos, que forman clones y producen anticuerpos","se forman *células de memoria* que dan inmunidad a largo plazo","si la persona se infecta, una respuesta secundaria rápida destruye el patógeno antes de que se multiplique / de que la persona pueda contagiar","las personas vacunadas no se infectan / no transmiten el patógeno","cuando una proporción suficientemente alta de la población es inmune, es poco probable que un infectado contacte con personas susceptibles, así que se rompen las *cadenas de transmisión*","el patógeno no se propaga y se protege a quienes no pueden vacunarse (bebés, personas inmunodeprimidas): *inmunidad de grupo*","la proporción necesaria es mayor cuanto más contagioso es el patógeno"],"hl":false,"mod":"Una vacuna contiene antígenos de un patógeno, por ejemplo el patógeno inactivado o ARNm que codifica un antígeno, sin causar la enfermedad. Estos antígenos desencadenan una respuesta primaria en la que se activan linfocitos B específicos que forman clones y producen anticuerpos, y se forman células de memoria de larga vida. Si la persona vacunada se expone después al patógeno, una respuesta secundaria rápida lo destruye antes de que se multiplique, de modo que no enferma ni lo transmite. Cuando una proporción suficientemente alta de la población es inmune, es poco probable que un infectado encuentre personas susceptibles, así que se rompen las cadenas de transmisión. Así el patógeno no se propaga y también quedan protegidas las personas no vacunadas, como los bebés o los inmunodeprimidos: esto es la inmunidad de grupo."},{"l":"c","m":8,"q":"Explique cómo evoluciona la resistencia a antibióticos y cómo puede reducirse su propagación.","pts":["los antibióticos bloquean procesos de las células procariotas (síntesis de la pared celular, ribosomas 70S) que no existen en las eucariotas","en una población bacteriana hay variación: *mutaciones* al azar dan resistencia a algunas bacterias","el antibiótico actúa como *presión de selección*","mueren las bacterias sensibles","las bacterias resistentes sobreviven y se reproducen rápidamente por fisión binaria, transmitiendo el gen de resistencia","aumenta la frecuencia de los alelos / genes de resistencia en la población (*selección natural* / evolución)","los genes de resistencia pueden transferirse entre bacterias, incluso de distinta especie, en *plásmidos* (transferencia horizontal)","la exposición a varios antibióticos genera cepas multirresistentes, por ejemplo SARM (MRSA)","la evolución es rápida porque las bacterias tienen tiempos de generación cortos / poblaciones enormes","reducir: recetar antibióticos solo cuando sean necesarios / no para infecciones víricas","reducir: que los pacientes completen el tratamiento para que no sobrevivan bacterias parcialmente resistentes","reducir: limitar el uso de antibióticos en la ganadería (por ejemplo, como promotores del crecimiento)","reducir: higiene y control de infecciones en hospitales (lavado de manos, aislamiento de pacientes infectados)","reducir: desarrollar nuevos antibióticos / usar combinaciones de antibióticos / vacunar para reducir el número de infecciones"],"hl":false,"mod":"Los antibióticos actúan bloqueando procesos propios de las bacterias, como la síntesis de la pared celular o la función de los ribosomas 70S. En una población bacteriana hay variación, porque mutaciones al azar hacen que algunas bacterias sean resistentes. Cuando se usa un antibiótico, este actúa como presión de selección: las bacterias sensibles mueren, mientras que las resistentes sobreviven y se reproducen por fisión binaria, transmitiendo el gen de resistencia. Así aumenta la frecuencia de los genes de resistencia en la población, es decir, se produce evolución por selección natural, y es rápida porque las bacterias tienen tiempos de generación muy cortos. Además, los genes de resistencia pueden pasar a otras bacterias, incluso de otras especies, en plásmidos, y la exposición a varios antibióticos ha producido cepas multirresistentes como el SARM.\nPara reducir su propagación, los médicos deben recetar antibióticos solo cuando sean necesarios y nunca para infecciones víricas, y los pacientes deben completar el tratamiento. También debe limitarse el uso de antibióticos en la ganadería. En los hospitales, la higiene, el lavado de manos y el aislamiento de pacientes infectados evitan que las cepas resistentes se transmitan. Por último, desarrollar nuevos antibióticos y vacunar para reducir el número de infecciones disminuye la presión de selección."}],"hl":false,"mk":16,"mkSL":16},{"qid":266,"p":"2X","t":"D2.1","also":["D3.1"],"title":"Respuesta extensa: división celular y reproducción","blocks":[],"parts":[{"l":"a","m":4,"q":"Describa los acontecimientos de la mitosis.","pts":["el ADN se ha replicado antes, en la interfase, así que cada cromosoma tiene dos *cromátidas hermanas* unidas por el centrómero","profase: los cromosomas se *condensan* por superenrollamiento y se hacen visibles","profase: se forman los microtúbulos del *huso* y la envoltura nuclear se desintegra","metafase: los microtúbulos se unen a los centrómeros y los cromosomas se alinean en el *plano ecuatorial*","anafase: los centrómeros se separan y los microtúbulos arrastran las cromátidas hermanas hacia polos opuestos","telofase: los cromosomas llegan a los polos y se descondensan; se forma una nueva envoltura nuclear alrededor de cada grupo","la *citocinesis* divide el citoplasma en dos células hijas genéticamente idénticas"],"hl":false,"mod":"Antes de la mitosis, el ADN se replica en la interfase, así que cada cromosoma está formado por dos cromátidas hermanas unidas por el centrómero. En la profase, los cromosomas se condensan por superenrollamiento, se forman los microtúbulos del huso y la envoltura nuclear se desintegra. En la metafase, los microtúbulos se unen a los centrómeros y los cromosomas se alinean en el plano ecuatorial. En la anafase, los centrómeros se separan y los microtúbulos arrastran las cromátidas hermanas hacia polos opuestos. En la telofase, los cromosomas se descondensan en los polos y se forma una envoltura nuclear alrededor de cada grupo. Finalmente, la citocinesis divide el citoplasma y se obtienen dos células hijas genéticamente idénticas."},{"l":"b","m":4,"q":"Compare y contraste la espermatogénesis y la ovogénesis.","pts":["en ambas, las células germinales se dividen por *mitosis*, crecen y después entran en *meiosis*","ambas producen gametos *haploides*","espermatogénesis: cada célula que entra en meiosis da cuatro espermatozoides; ovogénesis: da un solo óvulo y cuerpos polares","en la ovogénesis la *citocinesis es desigual*, así que el ovocito conserva casi todo el citoplasma / en la espermatogénesis es igual","espermatogénesis: millones al día, de forma continua desde la pubertad; ovogénesis: normalmente un ovocito por ciclo menstrual","la ovogénesis empieza antes del nacimiento y se detiene en la profase I / la meiosis II solo se completa tras la fecundación","la espermatogénesis ocurre en los túbulos seminíferos de los testículos; la ovogénesis, en los folículos de los ovarios","la ovogénesis termina en la menopausia; la espermatogénesis continúa durante toda la vida adulta"],"hl":false,"mod":"Ambos procesos empiezan con divisiones por mitosis de células germinales, seguidas de crecimiento y meiosis, y ambos producen gametos haploides. Sin embargo, en la espermatogénesis cada célula que entra en meiosis da cuatro espermatozoides, mientras que en la ovogénesis la citocinesis es desigual y se obtiene un solo óvulo, que conserva casi todo el citoplasma, y cuerpos polares que degeneran. La espermatogénesis ocurre en los túbulos seminíferos de forma continua desde la pubertad y produce millones de gametos al día; la ovogénesis comienza antes del nacimiento, se detiene en la profase I, libera normalmente un ovocito por ciclo y termina en la menopausia."},{"l":"c","m":8,"q":"Explique cómo favorece la reproducción sexual la variación genética.","pts":["la *meiosis* reduce a la mitad el número de cromosomas / cada gameto haploide recibe un cromosoma de cada par homólogo","en la profase I los cromosomas homólogos se emparejan (bivalentes)","*entrecruzamiento*: intercambio de segmentos entre cromátidas no hermanas en los quiasmas","el entrecruzamiento forma cromátidas recombinantes con *nuevas combinaciones de alelos* de genes ligados","*orientación aleatoria* de los bivalentes en la metafase I / distribución independiente de los cromosomas maternos y paternos","número de combinaciones = 2ⁿ: en humanos 2²³ ≈ 8 millones de gametos distintos (sin contar el entrecruzamiento)","la orientación aleatoria en la metafase II también aporta variación, porque las cromátidas ya no son idénticas tras el entrecruzamiento","*fecundación aleatoria*: cualquier gameto masculino puede fusionarse con cualquier gameto femenino","la fecundación combina alelos de dos progenitores distintos, así que cada cigoto tiene una combinación única","en plantas, la *polinización cruzada* entre individuos distintos aumenta la variación","mecanismos que impiden la autopolinización: autoincompatibilidad / maduración de anteras y estigmas en distinto momento / plantas con sexos separados","la mutación origina alelos nuevos que la reproducción sexual recombina","la variación genética permite la adaptación por selección natural / la evolución"],"hl":false,"mod":"La reproducción sexual genera variación en varias etapas. La meiosis reduce a la mitad el número de cromosomas, de modo que cada gameto haploide recibe un cromosoma de cada par homólogo. En la profase I los homólogos se emparejan y se produce el entrecruzamiento: las cromátidas no hermanas intercambian segmentos en los quiasmas, lo que forma cromátidas recombinantes con nuevas combinaciones de alelos de genes ligados. En la metafase I, la orientación aleatoria de los bivalentes hace que los cromosomas maternos y paternos se distribuyan de forma independiente; en humanos esto da 2²³, unos 8 millones, de combinaciones posibles, y la orientación aleatoria en la metafase II añade más variación porque las cromátidas ya no son idénticas. Después, la fecundación aleatoria permite que cualquier gameto masculino se fusione con cualquier femenino, combinando alelos de dos progenitores distintos, así que cada cigoto es único. En las plantas, la polinización cruzada y mecanismos como la autoincompatibilidad o la maduración de anteras y estigmas en distinto momento evitan la autopolinización y aumentan la mezcla de alelos. La mutación aporta alelos nuevos, y la reproducción sexual los recombina, generando la variación sobre la que actúa la selección natural."}],"hl":true,"mk":16,"mkSL":16},{"qid":267,"p":"2X","t":"D3.2","also":["D2.1"],"title":"Respuesta extensa: herencia","blocks":[],"parts":[{"l":"a","m":4,"q":"Explique cómo se determina el sexo en humanos y por qué las enfermedades ligadas al sexo son más frecuentes en los hombres.","pts":["las mujeres tienen dos cromosomas X (XX) y los hombres un X y un Y (XY)","todos los óvulos llevan un X; la mitad de los espermatozoides lleva X y la otra mitad Y, así que la probabilidad de cada sexo es del 50 %","el cromosoma Y lleva el gen *SRY*, que inicia el desarrollo de los testículos / del sexo masculino","el cromosoma Y es pequeño y no tiene loci para la mayoría de los genes del X","los hombres tienen un solo alelo de cada gen ligado al X, así que un alelo *recesivo* siempre se expresa","las mujeres necesitan dos copias del alelo recesivo para estar afectadas; con una son *portadoras*","como el alelo recesivo es poco frecuente, es poco probable heredar dos copias / ejemplos: hemofilia, daltonismo rojo-verde","los hijos varones heredan su X de la madre; el padre transmite su X a todas sus hijas y el Y a sus hijos"],"hl":false,"mod":"El sexo lo determinan los cromosomas sexuales: las mujeres son XX y los hombres XY. Todos los óvulos llevan un X, mientras que la mitad de los espermatozoides lleva X y la otra mitad Y, de modo que cada sexo tiene una probabilidad del 50 %; el gen SRY del cromosoma Y inicia el desarrollo masculino. El cromosoma Y es pequeño y carece de loci para la mayoría de los genes del X, así que los hombres tienen un solo alelo de cada gen ligado al X y un alelo recesivo, como el de la hemofilia, siempre se expresa. Las mujeres necesitan dos copias del alelo recesivo para estar afectadas; con una sola son portadoras, y como el alelo es poco frecuente, heredar dos copias es poco probable."},{"l":"b","m":4,"q":"Resuma cómo se usan los árboles genealógicos para deducir patrones de herencia.","pts":["convenciones: cuadrados = hombres, círculos = mujeres, símbolos rellenos = afectados; líneas horizontales = parejas, verticales = descendencia","dos progenitores no afectados con un hijo afectado: el alelo es *recesivo* y ambos progenitores son portadores","dos progenitores afectados con un hijo no afectado: el alelo es *dominante* y ambos progenitores son heterocigotos","si todo afectado tiene al menos un progenitor afectado / el rasgo aparece en todas las generaciones, probablemente es dominante","si afecta sobre todo a hombres y pasa a través de madres portadoras no afectadas, es *ligado al X* recesivo","si un padre afectado tiene un hijo varón afectado por él, el gen no está ligado al X (un padre no transmite su X a sus hijos varones)","se deducen los genotipos de los individuos y se predice la probabilidad de que la descendencia esté afectada"],"hl":false,"mod":"Un árbol genealógico muestra los hombres como cuadrados y las mujeres como círculos, con los afectados rellenos, las parejas unidas por líneas horizontales y la descendencia por líneas verticales. Si dos progenitores no afectados tienen un hijo afectado, el alelo es recesivo y ambos son portadores; si dos progenitores afectados tienen un hijo no afectado, el alelo es dominante y ambos son heterocigotos. Si el rasgo afecta sobre todo a hombres y se transmite a través de madres portadoras no afectadas, es recesivo ligado al X. Con el patrón identificado se deducen los genotipos de cada individuo y se predicen las probabilidades para la descendencia."},{"l":"c","m":8,"q":"Explique la herencia de dos genes, incluido el efecto del ligamiento.","pts":["cada gen ocupa un *locus* en un cromosoma y puede tener distintos alelos","los genes no ligados están en cromosomas distintos","se reparten por *distribución independiente* en la meiosis, debido a la orientación aleatoria de los bivalentes en la metafase I","un dihíbrido AaBb produce cuatro tipos de gametos (AB, Ab, aB, ab) en igual proporción","el cruzamiento de dos dihíbridos heterocigotos da una proporción fenotípica 9 : 3 : 3 : 1","el cruzamiento de prueba con el homocigoto recesivo (aabb) da 1 : 1 : 1 : 1","los genes *ligados* tienen sus loci en el mismo cromosoma","tienden a heredarse juntos, así que no se distribuyen de forma independiente y aparecen más descendientes con combinaciones parentales","los *recombinantes* solo se forman por *entrecruzamiento* entre los dos loci en la profase I","cuanto más próximos están los loci, menos entrecruzamiento hay entre ellos y menos recombinantes","la prueba de *chi-cuadrado* compara las frecuencias observadas con las esperadas (grados de libertad = número de clases – 1)","si χ² supera el valor crítico (p = 0,05), se rechaza la hipótesis nula: la diferencia es significativa, p. ej., por ligamiento"],"hl":false,"mod":"Cada gen ocupa un locus en un cromosoma y puede tener distintos alelos. Si dos genes no están ligados, están en cromosomas distintos y se reparten por distribución independiente en la meiosis, porque la orientación de cada bivalente en la metafase I es aleatoria. Así, un dihíbrido AaBb produce cuatro tipos de gametos, AB, Ab, aB y ab, en igual proporción; el cruzamiento de dos dihíbridos da una proporción fenotípica 9 : 3 : 3 : 1 y el cruzamiento de prueba con aabb da 1 : 1 : 1 : 1. En cambio, los genes ligados tienen sus loci en el mismo cromosoma, de modo que tienden a heredarse juntos y no se distribuyen de forma independiente: aparecen más descendientes con las combinaciones parentales. Los recombinantes solo se forman cuando hay entrecruzamiento entre los dos loci en la profase I, y son menos frecuentes cuanto más próximos están los loci. Para saber si unos resultados se desvían de la proporción esperada se usa la prueba de chi-cuadrado: si χ² supera el valor crítico con p = 0,05, se rechaza la hipótesis nula y la diferencia es significativa, lo que puede indicar ligamiento."}],"hl":true,"mk":16,"mkSL":16},{"qid":268,"p":"2X","t":"D3.3","also":["C2.1"],"title":"Respuesta extensa: homeostasis","blocks":[],"parts":[{"l":"a","m":4,"q":"Resuma el papel del riñón en la osmorregulación y la excreción.","pts":["*ultrafiltración* en el glomérulo: la alta presión hace pasar el plasma (agua, glucosa, urea, iones) a la cápsula de Bowman; las proteínas y las células quedan en la sangre","*reabsorción selectiva* en el túbulo contorneado proximal: se reabsorben toda la glucosa, los aminoácidos y gran parte del agua y los iones","el asa de Henle crea un gradiente de concentración / una médula hipertónica","la *ADH* aumenta la permeabilidad al agua del conducto colector al insertar acuaporinas, así que se reabsorbe más agua","si la sangre está demasiado concentrada se secreta más ADH y la orina es escasa y concentrada; si está diluida, menos ADH y orina abundante y diluida","la osmorregulación mantiene constante la concentración de solutos / el equilibrio hídrico de la sangre","excreción: la *urea* (producida en el hígado a partir de aminoácidos) no se reabsorbe del todo y se elimina en la orina"],"hl":false,"mod":"El riñón filtra la sangre en las nefronas. En el glomérulo hay ultrafiltración: la alta presión hace pasar el plasma, con agua, glucosa, urea e iones, a la cápsula de Bowman, mientras que las proteínas y las células quedan en la sangre. En el túbulo contorneado proximal se reabsorben selectivamente toda la glucosa, los aminoácidos y gran parte del agua y los iones. El asa de Henle crea una médula hipertónica, y la ADH regula cuánta agua se reabsorbe en el conducto colector al insertar acuaporinas: si la sangre está concentrada, se secreta más ADH y la orina es escasa y concentrada. Así se lleva a cabo la osmorregulación, y la urea, que no se reabsorbe del todo, se excreta en la orina."},{"l":"b","m":4,"q":"Explique la termorregulación en humanos.","pts":["el *hipotálamo* detecta la temperatura de la sangre y recibe información de los termorreceptores de la piel","el hipotálamo compara la temperatura con el punto de ajuste (unos 37 °C) y activa respuestas por *retroalimentación negativa*","demasiado calor: *vasodilatación* de las arteriolas de la piel, así que llega más sangre a la superficie y se pierde más calor","demasiado calor: sudoración; la evaporación del sudor elimina calor","demasiado frío: *vasoconstricción* de las arteriolas de la piel, así que se pierde menos calor","demasiado frío: escalofríos; la contracción rápida de los músculos libera calor por respiración celular","tejido adiposo pardo: *respiración desacoplada* que produce calor en lugar de ATP","erección del pelo, que retiene una capa de aire aislante / la tiroxina aumenta la tasa metabólica"],"hl":false,"mod":"La temperatura corporal se regula por retroalimentación negativa. El hipotálamo detecta la temperatura de la sangre y recibe información de los termorreceptores de la piel, y la compara con el punto de ajuste de unos 37 °C. Si la temperatura sube, provoca vasodilatación de las arteriolas de la piel, de modo que llega más sangre a la superficie y se pierde más calor, y sudoración, cuya evaporación elimina calor. Si baja, provoca vasoconstricción de las arteriolas de la piel para reducir la pérdida de calor, escalofríos, en los que la contracción muscular libera calor, y respiración desacoplada en el tejido adiposo pardo, que produce calor en lugar de ATP. Así la temperatura vuelve al punto de ajuste."},{"l":"c","m":8,"q":"Discuta las causas y el tratamiento de la diabetes tipo 1 y tipo 2.","pts":["tipo 1: el sistema inmunitario destruye las *células β* del páncreas (enfermedad *autoinmune*)","tipo 1: se produce poca o ninguna insulina","tipo 1: suele aparecer en la infancia o la juventud; tiene predisposición genética y no se debe al estilo de vida","tipo 1: se trata con inyecciones de insulina / bomba de insulina y controles frecuentes de la glucemia","tipo 2: se produce insulina, pero las células diana responden menos / *resistencia a la insulina*","tipo 2: factores de riesgo: obesidad, dieta rica en azúcares y grasas, sedentarismo y antecedentes familiares / genética","tipo 2: suele aparecer en adultos, pero cada vez más en jóvenes por el aumento de la obesidad","tipo 2: se trata con dieta con pocos azúcares, ejercicio y pérdida de peso, y fármacos (insulina en casos avanzados)","en ambas la glucosa en sangre se mantiene alta / aparece glucosa en la orina","complicaciones a largo plazo en ambas: daños en ojos, riñones, nervios y vasos sanguíneos / enfermedad cardiovascular","la tipo 2 es mucho más frecuente y se puede prevenir o retrasar con el estilo de vida; la tipo 1 no","conclusión equilibrada: los genes influyen en ambas, pero el estilo de vida pesa mucho más en la tipo 2 / la tipo 1 exige sustituir la hormona, la tipo 2 mejorar la respuesta a ella"],"hl":false,"mod":"La diabetes tipo 1 es una enfermedad autoinmune: el sistema inmunitario destruye las células β del páncreas, así que se produce poca o ninguna insulina. Suele aparecer en la infancia, tiene predisposición genética y no se debe al estilo de vida, por lo que no se puede prevenir; se trata con inyecciones de insulina y controles frecuentes de la glucemia. En la diabetes tipo 2 sí se produce insulina, pero las células diana responden menos a ella, es decir, hay resistencia a la insulina. Sus factores de riesgo son la obesidad, una dieta rica en azúcares y grasas, el sedentarismo y los antecedentes familiares; suele aparecer en adultos, aunque cada vez más en jóvenes. Se trata con dieta, ejercicio, pérdida de peso y fármacos, y en casos avanzados con insulina. En ambos tipos la glucosa en sangre se mantiene alta, lo que a largo plazo daña ojos, riñones, nervios y vasos sanguíneos. En conclusión, los genes influyen en ambas, pero la tipo 2, mucho más frecuente, depende sobre todo del estilo de vida y puede prevenirse, mientras que la tipo 1 exige sustituir la hormona durante toda la vida."}],"hl":true,"mk":16,"mkSL":16},{"qid":2000,"p":"1B","t":"A2.2","also":["B4.1","C4.1"],"title":"Medir un tallo al microscopio","blocks":[{"k":"p","v":"Un estudiante observó al microscopio óptico un corte transversal de un tallo joven de girasol. En una fotomicrografía tomada con un aumento de ×40, el diámetro del tallo mide 96 mm."},{"k":"table","cap":"Características de las hojas de tres especies vegetales de hábitats distintos","rows":[["Especie","Hábitat","Área foliar / cm²","Grosor de la cutícula / µm","Estomas por mm² (cara inferior)"],["P","selva tropical","210","2","310"],["Q","pradera templada","45","5","180"],["R","desierto cálido","0,8","18","60"]]}],"parts":[{"l":"a","m":2,"q":"Calcule el diámetro real del tallo en mm, mostrando el procedimiento.","pts":["procedimiento: tamaño real = tamaño de la imagen ÷ aumento = 96 mm ÷ 40","= *2,4 mm* (se requiere la unidad)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Resuma cómo se puede usar un retículo ocular para medir el tamaño real de una estructura.","pts":["se *calibra* el retículo ocular con un micrómetro de platina, alineando las dos escalas","la calibración se hace con el mismo objetivo / aumento que se usará para medir (hay que recalibrar si se cambia de objetivo)","se calcula el valor de una división del retículo (p. ej., 10 divisiones del retículo = 0,1 mm del micrómetro → 1 división = 10 µm)","se retira el micrómetro, se cuentan las divisiones del retículo que ocupa la estructura y se multiplica por el valor de una división"],"hl":false,"mod":""},{"l":"c","m":1,"q":"Indique una forma en que las plantas se protegen de los herbívoros.","pts":["defensa física: espinas / pelos (tricomas) / hojas duras o con sílice / látex pegajoso","defensa química: sustancias tóxicas o de sabor amargo (p. ej., alcaloides, taninos)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Explique dos adaptaciones de las hojas de la especie R a un desierto cálido, usando los datos de la tabla.","pts":["área foliar muy pequeña, *0,8 cm²* (frente a 210 cm² en P): menos superficie a través de la cual se pierde agua / se absorbe menos calor","cutícula gruesa, *18 µm* (frente a 2 µm en P): la cera impermeable reduce la evaporación a través de la epidermis","pocos estomas, *60 por mm²* (frente a 310 en P): menos poros por los que se difunde el vapor de agua, así que menos *transpiración*","cada adaptación conserva agua en un hábitat con muy poca disponibilidad de agua y altas temperaturas"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Calcule cuántas veces más gruesa es la cutícula de R que la de P.","pts":["18 µm ÷ 2 µm = *9* veces (aceptar ×9)"],"hl":false,"mod":""}],"hl":false,"mk":8,"mkSL":8},{"qid":2001,"p":"1B","t":"C1.1","also":["C3.2"],"title":"Extractos vegetales que inhiben la amilasa","blocks":[{"k":"p","v":"A las personas con diabetes tipo 2 les beneficia que la digestión del almidón sea más lenta. Unos investigadores probaron tres extractos vegetales (E1, E2 y E3) como inhibidores de la α-amilasa. Se midió la actividad de la enzima con distintas concentraciones de extracto, manteniendo iguales las demás condiciones."},{"k":"chart","type":"line","title":"Efecto de los extractos vegetales sobre la actividad de la α-amilasa","x":"Concentración de extracto / µg ml⁻¹","y":"Actividad de la amilasa / %","s":[{"n":"E1","pts":[["0",100.0],["50",72.0],["100",51.0],["150",38.0],["200",30.0],["250",26.0]]},{"n":"E2","pts":[["0",100.0],["50",91.0],["100",80.0],["150",69.0],["200",58.0],["250",47.0]]},{"n":"E3","pts":[["0",100.0],["50",98.0],["100",97.0],["150",95.0],["200",94.0],["250",93.0]]}]}],"parts":[{"l":"a","m":1,"q":"Identifique la variable independiente de esta investigación.","pts":["la *concentración* de extracto vegetal (µg ml⁻¹)","acepte: el tipo de extracto (E1, E2 o E3)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Indique una variable que deba controlarse.","pts":["temperatura / pH","concentración de almidón (sustrato) / concentración o volumen de amilasa / tiempo de reacción"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Compare y contraste los efectos de E1 y E2 sobre la actividad de la amilasa.","pts":["semejanza: ambos extractos *reducen* la actividad de la amilasa al aumentar su concentración","semejanza: con ambos la actividad es del 100 % sin extracto (0 µg ml⁻¹)","diferencia: E1 reduce más la actividad que E2 en todas las concentraciones mayores que 0 / E1 es un inhibidor más potente","diferencia: con E1 la actividad cae con rapidez a concentraciones bajas y luego se estabiliza (curva), mientras que con E2 baja a un ritmo casi constante (casi lineal, unos 10 % cada 50 µg ml⁻¹)","a 100 µg ml⁻¹: E1 51 % frente a E2 80 % / E1 reduce la actividad a la mitad con unos 100 µg ml⁻¹ y E2 necesita unos 230–250 µg ml⁻¹","a 250 µg ml⁻¹: E1 *26 %* frente a E2 *47 %*"],"hl":false,"mod":"Ambos extractos reducen la actividad de la amilasa a medida que aumenta su concentración, partiendo del 100 % sin extracto. Sin embargo, E1 es más potente: reduce más la actividad en todas las concentraciones mayores que 0; por ejemplo, a 100 µg ml⁻¹ la actividad es del 51 % con E1 y del 80 % con E2, y a 250 µg ml⁻¹ es del 26 % frente al 47 %. Además, el patrón es diferente: con E1 la actividad cae con rapidez a concentraciones bajas y luego se estabiliza, mientras que con E2 disminuye a un ritmo casi constante, unos 10 % cada 50 µg ml⁻¹."},{"l":"d","m":1,"q":"Resuma cómo podría medirse la velocidad de la reacción de la amilasa.","pts":["medir la desaparición del *almidón* por unidad de tiempo (prueba del yodo: tiempo hasta que deja de aparecer color azul-negro / colorímetro)","o medir la aparición de *maltosa* (azúcar reductor) por unidad de tiempo (por ejemplo, con reactivo de Benedict)"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Distinga entre inhibición competitiva e inhibición no competitiva.","pts":["el inhibidor competitivo se une al *sitio activo*; el no competitivo se une a un *sitio alostérico* (otro lugar de la enzima)","el inhibidor competitivo tiene una forma / estructura química parecida a la del sustrato; el no competitivo no se parece al sustrato","el competitivo compite con el sustrato y bloquea el sitio activo; el no competitivo cambia la forma del sitio activo","la inhibición competitiva se supera aumentando la concentración de sustrato (se alcanza la misma velocidad máxima); la no competitiva no se supera y reduce la velocidad máxima"],"hl":true,"mod":""},{"l":"f","m":2,"q":"Describa la función de una enzima en un proceso concreto que protege al cuerpo de las infecciones.","pts":["proceso nombrado: la *trombina* en la coagulación de la sangre / la *lisozima* de las lágrimas, la saliva o el moco","coagulación: tras un corte, las plaquetas liberan factores de coagulación que, en cascada, activan la trombina (a partir de protrombina)","la trombina convierte el *fibrinógeno* soluble en *fibrina* insoluble","las fibras de fibrina forman una red que atrapa células sanguíneas y forma un coágulo que sella la herida e impide la entrada de patógenos","O BIEN: la lisozima hidroliza enlaces del peptidoglucano de la pared celular bacteriana, así que las bacterias estallan (lisis)"],"hl":false,"mod":""}],"hl":false,"mk":10,"mkSL":8},{"qid":2002,"p":"1B","t":"D4.1","also":["D3.2"],"title":"El tamaño del pico tras una sequía","blocks":[{"k":"p","v":"En una isla se midió la profundidad del pico de una población de pinzones granívoros antes y después de una sequía intensa. Durante la sequía solo había semillas grandes y duras. La tabla resume los datos."},{"k":"table","cap":"Profundidad del pico de los pinzones / mm","rows":[["Año","Mínimo","Cuartil inferior","Mediana","Cuartil superior","Máximo","Número medido"],["Antes de la sequía","7,3","8,6","9,2","9,8","11,0","640"],["Después de la sequía","8,1","9,3","9,9","10,5","11,4","98"]]}],"parts":[{"l":"a","m":1,"q":"Indique la mediana de la profundidad del pico después de la sequía.","pts":["9,9 mm"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Calcule el rango intercuartílico antes de la sequía.","pts":["cuartil superior – cuartil inferior = 9,8 – 8,6 = 1,2 mm"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Explique el cambio en la profundidad del pico entre los dos años.","pts":["la profundidad del pico aumentó: la mediana pasó de 9,2 mm a 9,9 mm / todos los valores (mínimo, cuartiles, máximo) son mayores después","durante la sequía solo había semillas grandes y duras, que los pinzones de pico profundo podían romper","los pinzones de pico poco profundo no podían alimentarse y murieron (el número bajó de 640 a 98)","la profundidad del pico es *heredable*: los supervivientes se reprodujeron y transmitieron los alelos de pico profundo","es *selección natural*: aumentó la frecuencia de los alelos de pico profundo en la población"],"hl":false,"mod":"La profundidad del pico aumentó: la mediana pasó de 9,2 mm a 9,9 mm y el mínimo de 7,3 mm a 8,1 mm. Durante la sequía solo había semillas grandes y duras, que solo los pinzones de pico profundo podían romper, así que los de pico poco profundo no pudieron alimentarse y murieron, como indica la caída de 640 a 98 individuos. Como la profundidad del pico es heredable, los supervivientes transmitieron los alelos de pico profundo a su descendencia, de modo que su frecuencia aumentó en la población por selección natural."},{"l":"d","m":2,"q":"Sugiera, usando los datos, por qué la profundidad del pico probablemente es poligénica.","pts":["muestra *variación continua*: los valores van de 7,3 mm a 11,0 mm","no hay categorías definidas, sino muchos valores intermedios","los valores se concentran alrededor de la mediana (cuartiles a ±0,6 mm), lo que sugiere una distribución normal / en campana","este patrón se debe a muchos genes con pequeños efectos aditivos"],"hl":false,"mod":""},{"l":"e","m":2,"q":"Identifique el tipo de selección que se muestra y distíngalo de la selección disruptiva.","pts":["selección *direccional*","la direccional favorece un extremo del rango (picos profundos), así que la media / mediana se desplaza","la disruptiva favorece los dos extremos y actúa contra los fenotipos intermedios","la disruptiva puede producir una distribución bimodal / aumenta la variación sin desplazar necesariamente la media"],"hl":true,"mod":""},{"l":"f","m":2,"q":"Resuma cómo puede usarse la ecuación de Hardy-Weinberg en estudios de poblaciones.","pts":["relaciona frecuencias alélicas y genotípicas: p + q = 1 y p² + 2pq + q² = 1","a partir de la frecuencia del fenotipo recesivo (q²) se calculan q, p y la frecuencia de portadores (2pq)","predice las frecuencias esperadas si la población no evoluciona (población grande, apareamiento aleatorio, sin selección, migración ni mutación)","si las frecuencias observadas difieren de las esperadas, se incumple alguna condición: hay evolución (selección / apareamiento no aleatorio / migración)"],"hl":true,"mod":""}],"hl":false,"mk":11,"mkSL":7},{"qid":2003,"p":"1B","t":"B3.1","also":["B3.2"],"title":"La hemoglobina y el oxígeno","blocks":[{"k":"p","v":"El gráfico muestra cómo cambia el porcentaje de saturación de la hemoglobina adulta con oxígeno según la presión parcial de oxígeno (pO₂)."},{"k":"chart","type":"line","title":"Curva de disociación del oxígeno de la hemoglobina adulta","x":"pO₂ / kPa","y":"Saturación / %","s":[{"n":"Hemoglobina adulta","pts":[["0",0.0],["1",8.0],["2",23.0],["3",45.0],["4",62.0],["5",75.0],["6",84.0],["8",93.0],["10",97.0],["12",98.0],["14",99.0]]}]}],"parts":[{"l":"a","m":1,"q":"Identifique el porcentaje de saturación de la hemoglobina a una pO₂ de 4 kPa.","pts":["*62 %* (aceptar 61–63 %)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Describa la relación entre la pO₂ y el porcentaje de saturación de la hemoglobina.","pts":["relación positiva: la saturación aumenta al aumentar la pO₂","la relación no es lineal: la curva es *sigmoidea* (en forma de S)","aumento lento a pO₂ baja (0–1 kPa) y muy pronunciado entre 2 y 6 kPa (de 23 % a 84 %)","se estabiliza por encima de unos 8 kPa, acercándose al 100 % (99 % a 14 kPa)"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique por qué la curva de la hemoglobina fetal está a la izquierda de esta curva.","pts":["la hemoglobina fetal tiene mayor *afinidad* por el oxígeno que la adulta / está más saturada a la misma pO₂","en la *placenta*, la pO₂ es baja y la hemoglobina materna libera O₂","la hemoglobina fetal puede captar ese O₂ y cargarse, así que el oxígeno pasa de la sangre materna a la fetal"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Explique el efecto de un aumento de la concentración de CO₂ sobre esta curva.","pts":["la curva se desplaza hacia la *derecha* (efecto Bohr)","el CO₂ forma ácido carbónico / H⁺, que baja el *pH* de la sangre","el pH bajo reduce la afinidad de la hemoglobina por el O₂, así que a la misma pO₂ la saturación es menor","se libera más O₂ en los tejidos que respiran activamente, que son los que producen más CO₂"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Describa una adaptación de la hemoglobina para transportar oxígeno.","pts":["tiene cuatro subunidades con un grupo *hemo* (con Fe²⁺) cada una, así que cada molécula transporta hasta cuatro O₂","*unión cooperativa*: la unión de un O₂ cambia la forma (estructura cuaternaria) y facilita la unión de los siguientes / la liberación de uno facilita la de los demás"],"hl":false,"mod":""}],"hl":true,"mk":8,"mkSL":8},{"qid":2004,"p":"1B","t":"D4.2","also":["C4.2","C4.1"],"title":"Mercurio en la red trófica de un embalse","blocks":[{"k":"p","v":"Se midió la concentración de metilmercurio, un contaminante tóxico, en la grasa y el músculo de organismos de un embalse. Las bacterias del lodo liberan metilmercurio al agua."},{"k":"table","cap":"Concentración media de metilmercurio / partes por mil millones (ppb)","rows":[["Organismo","Alimento principal","Concentración / ppb"],["Fitoplancton","– (productor)","6"],["Pulgas de agua","fitoplancton","25"],["Perca","pulgas de agua y larvas de insectos","180"],["Lucio","percas y otros peces","950"],["Nutria","lucios y percas","2100"],["Carpa","plantas y detritos","70"]]}],"parts":[{"l":"a","m":2,"q":"Explique por qué la nutria tiene una concentración de metilmercurio mayor que la perca.","pts":["el metilmercurio no se degrada / no se excreta, así que se acumula en los tejidos (grasa y músculo)","la nutria está en un nivel trófico superior: come lucios y percas","cada depredador come muchas presas y acumula el metilmercurio de todas ellas: *biomagnificación*","nutria 2100 ppb frente a perca 180 ppb (unas 12 veces más)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Identifique, con una razón, qué pez sería el más seguro para el consumo humano.","pts":["la carpa","tiene la menor concentración de los peces: 70 ppb (frente a 180 ppb la perca y 950 ppb el lucio)","se alimenta de plantas y detritos, en un nivel trófico bajo, así que sufre menos biomagnificación"],"hl":false,"mod":""},{"l":"c","m":3,"q":"Resuma cómo podría estimarse el tamaño de la población de percas del embalse.","pts":["capturar una primera muestra de percas (p. ej., con redes) y contarlas (M)","*marcarlas* de forma que no se dañen ni sean más visibles para los depredadores (p. ej., corte en la aleta / etiqueta)","liberarlas y dejar tiempo para que se mezclen al azar con la población","capturar una segunda muestra con el mismo método; contar el total (N) y los marcados recapturados (R)","*índice de Lincoln*: tamaño de la población = (M × N) ÷ R","supuestos: no hay migración, nacimientos ni muertes entre muestreos / las marcas no se pierden"],"hl":false,"mod":"Se usaría el método de captura, marcado, liberación y recaptura. Se captura una primera muestra de percas con redes, se cuentan (M) y se marcan con un corte en la aleta o una etiqueta que no las dañe. Después se liberan y se deja tiempo para que se mezclen al azar con la población. Más tarde se captura una segunda muestra con el mismo método y se cuentan el total (N) y los individuos marcados (R). El tamaño de la población se estima con el índice de Lincoln: (M × N) ÷ R, suponiendo que no hay migración, nacimientos ni muertes entre los muestreos."},{"l":"d","m":3,"q":"Discuta cómo la sobrepesca podría afectar al embalse y cómo se puede evaluar si la pesca es sostenible.","pts":["eliminar depredadores (lucios) puede hacer que aumenten sus presas (percas) / se altera la red trófica","pescar percas reduce el alimento de lucios y nutrias, cuyas poblaciones pueden disminuir","si se capturan peces antes de que se reproduzcan, se reduce el *stock reproductor* y la población no se recupera","evaluar: estimar el tamaño de la población cada año (p. ej., captura-recaptura) / vigilar la captura por unidad de esfuerzo","evaluar: analizar la estructura de edades o tamaños de las capturas; pocos adultos grandes indica sobrepesca","la pesca es *sostenible* si la captura no supera la tasa de reposición de la población / cuotas, tamaño mínimo de malla, vedas en la época de cría"],"hl":false,"mod":"La sobrepesca puede alterar la red trófica: si se eliminan depredadores como el lucio, sus presas, como la perca, pueden aumentar, y si se pescan percas, lucios y nutrias se quedan sin alimento. Además, si se capturan peces antes de que se reproduzcan, el stock reproductor disminuye y la población no puede recuperarse. Para evaluar si la pesca es sostenible, se estima el tamaño de la población cada año, por ejemplo por captura-recaptura, y se analiza la estructura de edades de las capturas: si quedan pocos adultos grandes, hay sobrepesca. La pesca es sostenible si la captura no supera la tasa de reposición, lo que se consigue con cuotas, un tamaño mínimo de malla y vedas en la época de cría."}],"hl":false,"mk":10,"mkSL":10},{"qid":2005,"p":"1B","t":"A1.2","also":["D1.1"],"title":"¿Qué molécula lleva la información genética?","blocks":[{"k":"p","v":"Se cultivaron bacteriófagos con fósforo radiactivo (³²P) o con azufre radiactivo (³⁵S). Cada grupo de fagos se mezcló con bacterias durante 10 minutos, luego se agitó en una licuadora para separar las cubiertas de los fagos y se centrifugó. Las bacterias forman un sedimento en el fondo del tubo; las cubiertas libres de los fagos quedan en el líquido de arriba (sobrenadante)."},{"k":"chart","type":"bar","title":"Localización de la radiactividad tras la centrifugación","x":"Fracción","y":"Radiactividad / % del total","s":[{"n":"Fagos marcados con ³²P","pts":[["Sedimento (bacterias)",78.0],["Sobrenadante",22.0]]},{"n":"Fagos marcados con ³⁵S","pts":[["Sedimento (bacterias)",19.0],["Sobrenadante",81.0]]}]}],"parts":[{"l":"a","m":1,"q":"Indique qué molécula marca cada isótopo.","pts":["el ³²P marca el *ADN* (fósforo de los grupos fosfato) y el ³⁵S marca las *proteínas* (azufre de los aminoácidos; el ADN no contiene azufre) (se necesitan ambos)"],"hl":true,"mod":""},{"l":"b","m":3,"q":"Explique cómo estos resultados aportan pruebas de que el ADN es el material genético.","pts":["con los fagos marcados con ³²P, el *78 %* de la radiactividad está en el sedimento, así que el ADN entró en las bacterias","con los fagos marcados con ³⁵S, el *81 %* de la radiactividad está en el sobrenadante, así que la proteína (cápside) quedó fuera de las bacterias","dentro de las bacterias se producen nuevos fagos, así que lo que entró en ellas lleva las instrucciones para fabricar fagos","como entra el ADN y no la proteína, el *material genético* es el ADN","las cubiertas se separaron con la licuadora / centrifugación, de modo que la radiactividad del sedimento refleja lo que había entrado en las bacterias"],"hl":true,"mod":"Con los fagos marcados con ³²P, el 78 % de la radiactividad terminó en el sedimento, que contiene las bacterias, por lo que el ADN de los fagos entró en ellas. Con los fagos marcados con ³⁵S, el 81 % quedó en el sobrenadante con las cubiertas separadas por la licuadora, así que la proteína de la cápside se quedó fuera. Como dentro de las bacterias se forman nuevos fagos completos, la molécula que entró debe contener las instrucciones para fabricarlos; esa molécula es el ADN y no la proteína, por lo que el ADN es el material genético."},{"l":"c","m":1,"q":"Sugiera por qué apareció algo de ³⁵S en el sedimento.","pts":["algunas cubiertas de fago seguían unidas a la superficie de las bacterias / la licuadora no separó todas las cubiertas","algunos fagos no se separaron y se sedimentaron con las bacterias / quedó algo de sobrenadante atrapado en el sedimento"],"hl":true,"mod":""},{"l":"d","m":3,"q":"Dibuje un diagrama rotulado de un nucleótido de ADN.","pts":["fosfato dibujado como un círculo y rotulado *fosfato*","azúcar dibujado como un pentágono y rotulado *desoxirribosa* (no solo 'azúcar' ni 'ribosa')","base dibujada como un rectángulo y rotulada base nitrogenada / A, T, C o G","el fosfato unido al C5 de la desoxirribosa (carbono fuera del anillo)","la base unida al C1 de la desoxirribosa (lado opuesto al fosfato), con enlaces covalentes dibujados como líneas"],"hl":false,"mod":"El dibujo muestra un pentágono rotulado desoxirribosa. Al carbono 5, que queda fuera del anillo, se une con una línea (enlace covalente) un círculo rotulado fosfato. Al carbono 1, en el lado opuesto, se une un rectángulo rotulado base nitrogenada (por ejemplo, adenina)."},{"l":"e","m":1,"q":"Enumere las purinas y las pirimidinas del ADN.","pts":["purinas: *adenina* y *guanina*; pirimidinas: citosina y timina (se necesitan ambos grupos correctos)"],"hl":true,"mod":""}],"hl":false,"mk":9,"mkSL":3},{"qid":2006,"p":"1B","t":"B2.1","also":["D2.3","D3.3"],"title":"Canales de agua en óvulos de rana","blocks":[{"k":"p","v":"Los óvulos de rana normalmente tienen muy pocos canales de agua. En un experimento, a 12 óvulos se les inyectó ARNm que codifica una acuaporina y a 12 óvulos control se les inyectó agua. Luego todos se colocaron en una solución hipotónica y se midió su volumen cada minuto. El volumen se da en relación con el volumen inicial."},{"k":"chart","type":"line","title":"Hinchamiento de óvulos de rana en una solución hipotónica","x":"Tiempo / min","y":"Volumen relativo medio","s":[{"n":"ARNm de acuaporina","pts":[["0",1.0],["1",1.08],["2",1.17],["3",1.27],["4",1.38]]},{"n":"Control","pts":[["0",1.0],["1",1.01],["2",1.02],["3",1.03],["4",1.04]]}]},{"k":"p","v":"Todos los óvulos inyectados con ARNm de acuaporina estallaron entre los 4 y 5 minutos."}],"parts":[{"l":"a","m":1,"q":"Indique la dirección del movimiento neto del agua en ambos grupos de óvulos.","pts":["*hacia dentro* de los óvulos, desde la solución hipotónica (por ósmosis)"],"hl":false,"mod":""},{"l":"b","m":2,"q":"Explique la diferencia entre los dos grupos.","pts":["los óvulos con ARNm de acuaporina aumentaron de volumen mucho más rápido: 1,38 frente a 1,04 a los 4 minutos","los óvulos *tradujeron* el ARNm inyectado y insertaron *acuaporinas* en su membrana plasmática","las acuaporinas aumentan la permeabilidad al agua, así que el agua entró por ósmosis mucho más deprisa","los óvulos control casi no tienen canales de agua, así que el agua solo entra lentamente a través de la bicapa / los óvulos con acuaporinas se hincharon hasta estallar"],"hl":false,"mod":""},{"l":"c","m":1,"q":"Resuma por qué los resultados se dan como volumen relativo y no como volumen real.","pts":["los óvulos tienen *tamaños iniciales* distintos, así que el volumen relativo (volumen ÷ volumen inicial) permite comparar el cambio de forma justa entre óvulos / grupos"],"hl":false,"mod":""},{"l":"d","m":1,"q":"Comente la fiabilidad de los resultados.","pts":["a favor: 12 óvulos por grupo y uso de medias / grupo control / diferencia grande y constante entre grupos","en contra: no se muestran barras de error / desviación típica, así que no se conoce la variabilidad / solo se hizo un experimento"],"hl":false,"mod":""},{"l":"e","m":3,"q":"Discuta la función de las acuaporinas en los conductos colectores del riñón cuando la sangre está demasiado concentrada.","pts":["los osmorreceptores del *hipotálamo* detectan la alta concentración de solutos de la sangre","la neurohipófisis secreta *ADH*, que llega por la sangre al riñón","la ADH hace que se inserten más *acuaporinas* (desde vesículas) en las membranas de las células del conducto colector","aumenta la permeabilidad al agua y se reabsorbe más agua por ósmosis hacia la médula *hipertónica* y luego a la sangre","se produce un volumen pequeño de orina concentrada y la concentración de la sangre vuelve al punto de ajuste","valoración: las acuaporinas permiten ajustar rápidamente la reabsorción de agua sin fabricar proteínas nuevas, pero la orina no puede ser más concentrada que la médula"],"hl":true,"mod":"Cuando la sangre está demasiado concentrada, los osmorreceptores del hipotálamo lo detectan y la neurohipófisis secreta ADH, que llega por la sangre a los riñones. La ADH hace que vesículas con acuaporinas se fusionen con la membrana de las células del conducto colector, de modo que aumenta su permeabilidad al agua. Así se reabsorbe más agua por ósmosis hacia la médula hipertónica y de allí a la sangre, se produce un volumen pequeño de orina concentrada y la concentración de la sangre vuelve al punto de ajuste. Una ventaja de este mecanismo es que es rápido, porque las acuaporinas ya fabricadas solo se insertan o se retiran de la membrana."},{"l":"f","m":2,"q":"Explique por qué suele haber un retraso entre inyectar el ARNm y observar su efecto.","pts":["el ARNm debe ser *traducido* por los ribosomas, lo que lleva tiempo","el polipéptido debe plegarse / modificarse en el RE rugoso y el aparato de Golgi","la proteína se transporta en *vesículas* y se inserta en la membrana plasmática","se necesitan suficientes acuaporinas en la membrana para que el efecto sea medible"],"hl":false,"mod":""}],"hl":false,"mk":10,"mkSL":7},{"qid":2007,"p":"1B","t":"C1.2","also":["B2.2"],"title":"Antibióticos que bloquean la ATP sintasa","blocks":[{"k":"p","v":"Se probaron dos fármacos, X e Y, como inhibidores de la ATP sintasa extraída de una bacteria. Se midió la actividad relativa con distintas concentraciones de fármaco. Un valor de 1,0 es la actividad sin fármaco."},{"k":"chart","type":"logline","title":"Efecto de dos inhibidores sobre la ATP sintasa","x":"Concentración de fármaco / µM (escala logarítmica)","y":"Actividad relativa","s":[{"n":"Fármaco X","pts":[["0.001",1.0],["0.01",0.98],["0.1",0.85],["1",0.45],["10",0.12],["100",0.05]]},{"n":"Fármaco Y","pts":[["0.001",1.0],["0.01",1.0],["0.1",0.99],["1",0.95],["10",0.7],["100",0.3]]}]}],"parts":[{"l":"a","m":1,"q":"Identifique las dos variables independientes de esta investigación.","pts":["el tipo de fármaco (X o Y) *y* la concentración de fármaco (µM) (se requieren ambas)"],"hl":false,"mod":""},{"l":"b","m":1,"q":"Resuma cómo se podría mantener constante la temperatura.","pts":["realizar los ensayos en un *baño de agua con termostato* / una incubadora a temperatura fija","controlar la temperatura con un termómetro durante el ensayo y ajustarla si cambia / equilibrar antes las soluciones a esa temperatura"],"hl":false,"mod":""},{"l":"c","m":2,"q":"Explique la ventaja de usar una escala logarítmica para la concentración de fármaco.","pts":["las concentraciones abarcan cinco *órdenes de magnitud* (de 0,001 a 100 µM)","en una escala lineal, los valores bajos (0,001–1 µM) quedarían amontonados junto al cero y no podrían distinguirse","en la escala logarítmica cada aumento de diez veces ocupa el mismo espacio, así que se ven claramente todos los puntos y la tendencia","facilita comparar las concentraciones a las que X e Y reducen la actividad (por ejemplo, a la mitad)"],"hl":false,"mod":""},{"l":"d","m":2,"q":"Compare la eficacia de los fármacos X e Y.","pts":["X es más eficaz: inhibe la ATP sintasa a concentraciones mucho menores que Y","cita de datos: a 1 µM, X reduce la actividad a *0,45* y Y solo a *0,95* / a 10 µM, X 0,12 frente a Y 0,70","ambos tienen poco efecto a concentraciones muy bajas (≤ 0,01 µM, actividad ≥ 0,98)","ambos reducen la actividad a concentraciones altas, pero incluso a 100 µM X (0,05) inhibe más que Y (0,30)","X reduce la actividad a la mitad con aproximadamente 1 µM, mientras que Y necesita unos 30 µM (entre 10 y 100 µM)"],"hl":false,"mod":""},{"l":"e","m":1,"q":"Indique la localización precisa de la ATP sintasa en una mitocondria.","pts":["en la *membrana mitocondrial interna* / en las crestas"],"hl":true,"mod":""},{"l":"f","m":3,"q":"Explique cómo produce ATP la ATP sintasa.","pts":["la cadena de transporte de electrones usa la energía de los electrones para bombear protones de la matriz al espacio intermembrana","se crea un *gradiente de protones* (concentración alta en el espacio intermembrana)","la membrana interna es impermeable a los protones, que solo pueden volver a la matriz a través de la ATP sintasa","los protones difunden a favor de su gradiente a través de la ATP sintasa: *quimiosmosis*","el flujo de protones hace girar parte de la ATP sintasa","la energía se usa para fosforilar ADP + Pi y formar ATP (fosforilación oxidativa)"],"hl":true,"mod":"La cadena de transporte de electrones de la membrana mitocondrial interna usa la energía de los electrones para bombear protones desde la matriz al espacio intermembrana, creando un gradiente de protones. Como la membrana interna es impermeable a los protones, estos solo pueden volver a la matriz difundiendo a través del canal de la ATP sintasa; esto es la quimiosmosis. El flujo de protones hace girar parte de la ATP sintasa, y la energía liberada se usa para fosforilar ADP con fosfato inorgánico y formar ATP."}],"hl":false,"mk":10,"mkSL":6},{"qid":2008,"p":"1B","t":"B3.3","also":["C3.1"],"title":"Flexibilidad y edad","blocks":[{"k":"p","v":"Una clínica de fisioterapia midió el ángulo máximo de flexión de la rodilla (cuánto puede doblarse) en voluntarios sanos. La tabla muestra las medias, con intervalos de confianza del 95 % entre paréntesis."},{"k":"table","cap":"Flexión máxima media de la rodilla / grados","rows":[["Grupo de edad / años","Mujeres","Hombres"],["5–12","150,4 (148,9–151,9)","146,2 (144,8–147,6)"],["13–25","143,0 (141,6–144,4)","141,5 (139,9–143,1)"],["26–50","140,1 (139,0–141,2)","136,8 (135,6–138,0)"],["51–75","135,2 (133,9–136,5)","130,0 (128,7–131,3)"]]}],"parts":[{"l":"a","m":1,"q":"Indiq
